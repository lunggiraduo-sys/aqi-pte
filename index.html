 'clam gardens' constructed in the intertidal zone. These rock walls were built at the low-tide line to trap sediment and flatten the slope of the beach. By expanding the habitat suitable for butter clams and littleneck clams, these structures significantly increased shellfish productivity. Furthermore, the act of tending these gardens—tilling the sediment to aerate it and removing predators—ensured sustainable yields over generations. These findings challenge the traditional binary classification of agriculturalists versus foragers, suggesting that marine management was as sophisticated as terrestrial farming. The existence of such systems indicates that the coastal ecosystem was not merely exploited opportunistically but was actively engineered to ensure long-term food security."], "What is the author's primary argument regarding the discovery of clam gardens?", ["It proves that indigenous populations relied more heavily on seafood than on land-based hunting.", "It demonstrates that indigenous peoples practiced a form of environmental engineering rather than simple foraging.", "It suggests that archaeological methods have historically failed to identify coastal structures.", "It explains why the Pacific Northwest was able to support higher population densities than other regions."], 1], [" pristine 谜团 Pristine Myth", ["For generations, a prevailing historical narrative suggested that the North American continent was a primeval wilderness, lightly trodden by indigenous inhabitants who lived in harmony with an untouched environment. This perception, however, largely stems from the specific timing of European observation. Early sixteenth-century explorers often reported densely settled regions and extensive agricultural clearance. Yet, when colonization intensified over a century later, settlers encountered vast, unbroken forests. This discrepancy is largely attributed to a silent biological invasion that preceded the settlers: Old World pathogens. These diseases swept through native populations with devastating speed, often arriving well in advance of direct European contact. As communities collapsed, the open fields and managed landscapes they had maintained for centuries were abandoned. The dense woodlands that later observers described were, in fact, rapidly regenerating secondary forests masking the footprint of complex societies. Therefore, the landscape perceived as a wild frontier was not an enduring state of nature, but rather a 'widowed land' recovering from sudden anthropogenic withdrawal."], "According to the passage, why did later European settlers encounter vast forests instead of the populated landscapes reported by earlier explorers?", ["Indigenous populations had deliberately reforested their agricultural lands to avoid detection.", "Earlier explorers had exaggerated the extent of indigenous settlement and agriculture.", "The reduction in human activity due to disease allowed previously cleared land to regrow.", "European settlers arrived in different regions than those visited by the initial sixteenth-century explorers."], 2], ["氧化亚氮 Nitrous Oxide", ["While carbon dioxide dominates global warming discussions, nitrous oxide—a byproduct primarily of agricultural activities—poses a unique and formidable challenge. Often overlooked, this gas is roughly 300 times more effective at trapping heat than carbon dioxide. Its primary source is not a centralized industrial chimney that can be capped or filtered, but rather the vast expanses of fertilized farmland worldwide. When nitrogen fertilizers are applied to boost crop yields, soil bacteria convert the excess nitrogen into nitrous oxide, which then seeps into the air. This diffuse nature makes emission control extremely difficult compared to point-source pollution. Moreover, the gas persists in the atmosphere for over a century, meaning today's emissions will influence the climate for generations to come. Researchers suggest that without significant changes in global farming practices and fertilizer efficiency, climate targets will remain out of reach, regardless of the progress made in the renewable energy sector."], "What point does the author make about nitrous oxide emissions?", ["They are easier to monitor than carbon dioxide because they come from specific industrial sites.", "They constitute a significant climate hurdle because they stem from widespread farming and are long-lasting.", "They have recently surpassed carbon dioxide as the leading contributor to the greenhouse effect.", "They can be swiftly neutralized if synthetic nitrogen fertilizers are banned immediately."], 1], ["亚马逊黑土 Terra Preta", ["For centuries, archaeologists operated under the assumption that the Amazon basin was an inhospitable environment for large-scale civilization. The prevailing theory suggested that the region's acidic, nutrient-poor soils were incapable of supporting the intensive agriculture required to feed populous settlements. Consequently, the rainforest was viewed as a pristine, sparsely inhabited wilderness where only small, nomadic tribes could survive. However, recent findings have fundamentally challenged this perspective. Researchers have identified vast expanses of terra preta, or 'dark earth'—a highly fertile, anthropogenic soil found throughout the basin. Unlike the surrounding natural soils, terra preta is rich in charcoal, pottery shards, and organic matter, indicating deliberate engineering by indigenous populations over thousands of years. The existence of these modified soil tracts suggests that pre-Columbian Amazonia was not a virgin wilderness, but a managed landscape capable of sustaining millions of people in complex, sedentary societies. This revelation forces a reconsideration of the historical demography of South America and the sophistication of its early inhabitants' environmental stewardship."], "What is the main significance of the discovery of terra preta described in the passage?", ["It confirms that the natural soil of the Amazon was actually rich in nutrients.", "It disproves the idea that the Amazon could not support large, settled populations.", "It indicates that indigenous tribes preferred nomadic lifestyles to avoid soil depletion.", "It shows that European settlers introduced advanced soil management techniques."], 1], ["野牛与草原 Bison & Plains", ["For millennia, the American bison acted as the primary architect of the Great Plains, shaping the grassland ecosystem through specific grazing behaviors that modern livestock management struggles to replicate. Unlike cattle, which tend to linger near water sources and graze specific areas intensively, bison are highly mobile. They traverse vast distances, grazing an area briefly before moving on, a pattern that prevents the depletion of vegetation and allows for rapid recovery. This distinct behavior creates a heterogeneous landscape often described as a shifting mosaic, characterized by patches of short, grazed grass interspersed with taller, undisturbed vegetation. This structural variety is vital for the survival of the prairie ecosystem, particularly for grassland birds that require specific grass heights for nesting and foraging. Additionally, the bison's unique habit of wallowing—rolling in the dirt to remove molting fur and deter insects—creates compacted depressions. These depressions fill with rainwater to form ephemeral wetlands, supporting amphibians and providing drinking water for other wildlife. Thus, the decimation of bison herds in the 19th century fundamentally simplified the ecological complexity of the North American prairies."], "According to the text, what is a significant ecological consequence of the bison's migratory grazing habits?", ["The creation of a varied landscape structure that supports diverse bird populations", "The formation of compacted soil depressions that collect rainwater for amphibians", "The elimination of tall vegetation to ensure a uniformly grazed environment", "The concentration of grazing activity near water sources to protect open grasslands"], 0], ["默读与理解 Subvocalization", ["Subvocalization, often described as the internal speech made when reading words silently, allows the reader to imagine the sound of the word as it is processed. This natural mechanism helps the mind access meanings, thereby facilitating understanding and information recall. For decades, speed-reading advocates have categorized subvocalization as a detrimental habit, arguing that it creates a bottleneck by limiting reading speed to the pace of speaking—roughly 150 to 200 words per minute. Consequently, many training programs focus on techniques to suppress this inner voice to boost velocity. However, contemporary psycholinguistic research challenges the view that subvocalization should be completely eliminated. Studies indicate that while suppressing inner speech may indeed increase the raw number of words scanned per minute, it frequently leads to a significant drop in the grasp of the material, particularly when dealing with complex or nuanced arguments. The inner voice functions as a critical component of the phonological loop, holding data in working memory long enough for the brain to integrate concepts. Thus, rather than viewing subvocalization as a flaw to be eradicated, it is better understood as a regulatory tool. Proficient readers unconsciously adjust their reliance on this internal narration, minimizing it for simple texts while fully engaging it to navigate dense content."], "Which of the following best summarizes the author's perspective on subvocalization?", ["It is an inefficient habit that must be overcome to master rapid reading.", "It serves a valuable function in processing difficult texts and should not be entirely discarded.", "It causes the brain to overload by retaining too much information in working memory.", "It is essential for all types of reading, regardless of the simplicity of the content."], 1], ["查科峡谷 Chaco Canyon", ["The Chaco Canyon civilization in the American Southwest is celebrated for its complex social structure and monumental great houses. For years, the prevailing theory attributed the sudden abandonment of these settlements in the 12th century primarily to a severe, decades-long drought. However, recent bioarchaeological and geological studies have begun to paint a more nuanced picture involving human agency. Analysis of ancient packrat middens—rodent nests that preserve plant materials over millennia—demonstrates that the canyon was once surrounded by dense pinyon and juniper woodlands. Over centuries, the Chacoans harvested this timber extensively for construction and firewood. The removal of this critical ground cover likely triggered a cycle of soil erosion and arroyo cutting, which lowered the water table and decimated the maize crops upon which the society depended. Thus, while climate variability was undeniably a factor, the society's collapse was likely compounded by their unsustainable exploitation of the local environment, challenging the view that pre-colonial populations always lived in perfect equilibrium with their surroundings."], "Which of the following best summarizes the writer's argument regarding the decline of the Chaco Canyon civilization?", ["It was primarily caused by a failure to transport timber from distant mountain ranges.", "It was driven significantly by environmental degradation resulting from their own resource use.", "It occurred solely because of a catastrophic natural drought that struck the region.", "It resulted from the destruction of their maize crops by invasive rodent populations."], 1], ["阅读战争 Reading Wars", ["For decades, a fierce pedagogical debate known as the 'reading wars' has divided educators and policymakers regarding the most effective method for teaching children to read. On one side, proponents of phonics argue that explicit instruction in the relationships between letters and sounds is the essential building block of literacy. They maintain that before children can comprehend text, they must first be able to decode words systematically. Conversely, advocates of the whole-language approach emphasize the importance of immersion in meaningful texts, suggesting that reading is a natural process acquired through exposure, much like spoken language. Recent cognitive research has increasingly tipped the scales in favor of structured phonics instruction for early learners, demonstrating that specific neural pathways must be rewired to connect visual symbols with spoken language centers. While exposure to rich literature remains vital for vocabulary and motivation, the evidence suggests it cannot replace the foundational skills of decoding. Consequently, many educational systems are now pivoting away from pure whole-language methodologies toward structured literacy programs, although the practical implementation of these changes in classrooms remains uneven and often contentious."], "According to the passage, what has recent research indicated about learning to read?", ["Reading is an innate biological process that develops naturally through exposure to books.", "Systematic instruction in decoding is necessary to establish connections in the brain.", "The whole-language approach is superior because it prioritizes vocabulary and motivation.", "The debate over reading methods has been fully resolved with the universal adoption of phonics."], 1], ["新英格兰森林 New England Forests", ["When English settlers described the dense, impenetrable woodlands of New England in the early seventeenth century, they believed they were observing a primordial wilderness that had existed unchanged for millennia. However, modern environmental historians suggest that what these settlers encountered was not an ancient, untouched ecosystem, but rather a landscape in the midst of a dramatic ecological rebound. Prior to European contact, large Indigenous populations had cleared extensive tracts of land for maize agriculture and village sites. Tragically, the introduction of Old World pathogens in the sixteenth century resulted in a catastrophic demographic collapse among Native American communities. As populations dwindled, vast areas of cultivated land were abandoned. Consequently, the forests rapidly reclaimed these open fields through the process of secondary succession. Thus, the 'virgin' forest described in colonial chronicles was, in reality, a relatively young, dense overgrowth masking the footprint of a once-thriving agricultural society."], "What is the central argument regarding the New England forests described in the text?", ["They were ancient ecosystems that had remained biologically stable for thousands of years before European arrival.", "They were actively maintained by Indigenous populations using fire to prevent overgrowth.", "They were largely the product of recent regeneration after agricultural lands were left untended due to population decline.", "They appeared impenetrable primarily because English settlers lacked the skills to navigate the terrain effectively."], 2], ["有声书局限 Audiobook Limits", ["The debate concerning the legitimacy of audiobooks often centers on whether listening yields the same intellectual benefits as visual reading. Research indicates that for proficient readers, the cognitive processes used to construct meaning—such as inferring motives and visualizing scenes—are largely identical across both formats. The brain networks responsible for language comprehension are activated similarly, suggesting that the core experience of consuming a narrative is preserved regardless of the medium. Nevertheless, a critical structural difference exists regarding the control of attention. Visual reading inherently accommodates regression, allowing the reader's eyes to flit back to previous lines to clarify ambiguity or reinforce complex concepts before moving forward. In contrast, audio playback imposes a linear, continuous momentum that discourages pausing or rewinding for minor clarifications. While this unyielding pace rarely hinders the enjoyment of fiction, it can be detrimental when engaging with dense, informational texts where the ability to self-regulate speed and review specific details is essential for deep analysis."], "According to the passage, what is a significant limitation of the audiobook format?", ["It fails to stimulate the brain networks required for visualizing narrative scenes.", "It restricts the audience's ability to easily revisit and review earlier sections of the text.", "It is generally considered by researchers to be an invalid form of literacy.", "It reduces the emotional impact of the story compared to visual reading."], 1], ["图式理论 Schema Theory", ["Reading is frequently misconceived as a passive mechanism wherein a reader simply receives and records information transmitted by a writer. However, contemporary research in educational psychology depicts reading as an intensely active and constructive endeavor. Central to this understanding is the theory of 'schema'—the complex, organized clusters of knowledge stored in an individual's long-term memory. According to this view, comprehension is not merely about extracting meaning from printed symbols but rather about bringing meaning to them. A reader's capacity to interpret a text is fundamentally constrained by their pre-existing knowledge base. To illustrate, a technically grammatically correct passage analyzing the nuances of a cricket match might be entirely opaque to a reader unfamiliar with the sport's rules, despite their fluency in the language. Therefore, a deficit in reading comprehension is often not a failure of linguistic processing or vocabulary, but a lack of the specific background knowledge required to fill in the gaps left by the author. This insight has led educators to emphasize the accumulation of broad cultural literacy as a prerequisite for advanced reading proficiency, moving beyond simple phonics and decoding strategies."], "According to the text, why might a fluent reader struggle to understand a specific passage?", ["They lack the necessary decoding skills to recognize the vocabulary used.", "They are treating the reading process as an active rather than a passive task.", "They do not possess the relevant background concepts to interpret the subject matter.", "They are focusing too heavily on the grammatical structure of the sentences."], 2], ["碳捕集 CCS", ["Carbon capture and storage (CCS) has increasingly been positioned as a critical tool in the global effort to limit atmospheric warming. The process entails separating carbon dioxide from emissions streams at major industrial facilities, such as coal-fired power stations and cement plants. Following capture, the gas is compressed and injected deep into geological formations, such as saline aquifers, intended to sequester it indefinitely. While the theoretical benefits of CCS are clear, its practical application remains a subject of intense debate. Advocates emphasize that CCS provides a necessary pathway to decarbonize heavy industries that cannot easily switch to renewable electricity. Without such technology, they argue, achieving net-zero targets is virtually impossible. Conversely, skeptics highlight the significant energy penalty incurred during the capture phase, which paradoxically requires burning more fuel to generate the same amount of net power. Additionally, the integrity of geological storage poses a long-term risk; even minor leakages over centuries could undermine the climate benefits. Consequently, CCS occupies a complex position: it is viewed by many as an indispensable bridge technology, yet it is burdened by economic and environmental uncertainties that hinder its widespread adoption."], "According to the passage, which factor contributes to the controversy surrounding carbon capture and storage?", ["The technology completely eliminates the need for renewable energy sources.", "It involves operational trade-offs between energy efficiency and emission reduction.", "There are no suitable geological formations available for storing the gas.", "The process is currently restricted to small-scale residential applications."], 1], ["黑碳 Black Carbon", ["Black carbon, a primary component of soot, has emerged as a significant driver of global climate change, ranking second only to carbon dioxide in its warming influence. Unlike well-known greenhouse gases that can persist in the atmosphere for centuries, black carbon is a short-lived climate pollutant with a lifespan of merely days to weeks. Originating from the incomplete combustion of fossil fuels and biomass, these fine particles absorb solar energy and warm the atmosphere directly. Their impact is particularly severe in polar regions; when black carbon settles on snow and ice, it darkens the surface, reducing its ability to reflect sunlight—a phenomenon known as the albedo effect. This absorption of heat accelerates melting, exposing darker land or water beneath, which further intensifies warming. Consequently, researchers suggest that targeting black carbon emissions presents a unique opportunity for near-term climate relief. Since these particles are removed from the atmosphere relatively quickly by rain and gravity, cutting emissions could result in immediate cooling benefits, slowing the rate of Arctic ice loss more swiftly than carbon dioxide reductions alone."], "According to the passage, what is a key advantage of reducing black carbon emissions compared to reducing carbon dioxide?", ["It permanently eliminates the need to address fossil fuel consumption.", "It could produce faster climate cooling results due to the pollutant's short lifespan.", "It prevents the albedo effect from occurring in non-polar regions.", "It addresses a pollutant that stays in the atmosphere for hundreds of years."], 1], ["永冻土反馈 Permafrost Loop", ["Permafrost, the permanently frozen ground covering vast stretches of the Northern Hemisphere, serves as one of the Earth's largest terrestrial carbon sinks. For thousands of years, this frozen soil has locked away the remains of ancient plants and animals, effectively halting the decomposition process. However, as global temperatures rise, this permafrost is beginning to thaw at an unprecedented rate. When the ice melts, the organic matter within the soil becomes accessible to microbes, which break it down and release the by-products into the atmosphere. Depending on oxygen availability, this process emits either carbon dioxide or methane. The release of methane is particularly concerning because it is significantly more efficient at trapping heat than carbon dioxide over shorter timeframes. This creates a dangerous feedback loop: as the planet warms, more permafrost thaws, releasing more greenhouse gases, which in turn causes further warming. Consequently, what was once a stable storage system for carbon is threatening to become a major contributor to global climate instability."], "What is the main conclusion drawn by the writer regarding permafrost?", ["It acts as a permanent barrier that prevents microbes from accessing organic matter regardless of temperature.", "The release of gases from thawing soil creates a cycle that further accelerates global warming.", "Carbon dioxide is the primary concern because it traps heat more efficiently than methane.", "Recent studies show that permafrost is expanding due to shifts in the Earth's climate stability."], 1], ["巨型动物灭绝 Megafauna", ["For decades, paleontologists have debated the sudden disappearance of North America's megafauna—giant creatures such as mammoths, mastodons, and saber-toothed cats—at the end of the Pleistocene epoch. The 'overkill hypothesis,' first popularized in the 1960s, posits that the arrival of humans across the Bering Land Bridge directly precipitated these extinctions through aggressive hunting practices. Proponents argue that the timing of human arrival coincides too perfectly with the collapse of megafaunal populations to be coincidental. However, recent radiocarbon dating and climatic reconstructions suggest a more nuanced reality. Evidence indicates that significant climate fluctuations, leading to habitat loss and vegetation changes, were already stressing these populations prior to human entry. Consequently, many researchers now advocate for a synergistic model, suggesting that while human predation may have delivered the final blow to weakened populations, it was likely the rapid environmental restructuring that made these species vulnerable in the first place."], "Which view regarding the extinction of North American megafauna does the writer support?", ["The extinction was caused exclusively by the sophisticated hunting methods of early humans.", "Climate change theories have been largely dismissed in favor of the overkill hypothesis.", "A combination of ecological changes and human activity likely led to the species' demise.", "Megafaunal populations had already vanished before humans migrated across the Bering Land Bridge."], 2], ["默读革命 Silent Reading", ["For much of human history, reading was fundamentally a social and auditory act. In classical antiquity, written texts were generally viewed as scripts for performance, intended to be declaimed to an audience or muttered aloud to oneself. The concept of reading silently, processing information directly from eye to brain without the mediation of the voice, was widely regarded as an anomaly. St. Augustine, in his Confessions, famously expressed astonishment upon witnessing Ambrose, the Bishop of Milan, reading without moving his lips—a behavior so unusual in the fourth century that it warranted specific documentation. The gradual transition to silent reading, which became more prevalent during the Middle Ages with the introduction of word separation in manuscripts, revolutionized the intellectual landscape. It transformed reading from a communal performance into a private, interior experience. This shift fostered a new form of individual autonomy, allowing readers to traverse texts at their own pace and engage in critical introspection without the constraints of a gathering. Consequently, the written word became a vehicle for private reflection, fundamentally altering the relationship between the reader and the text."], "According to the passage, what was a significant consequence of the historical shift towards silent reading?", ["It reduced the speed at which readers could process written information.", "It changed reading from a public activity into an independent, reflective practice.", "It led to a decrease in the production of manuscripts intended for performance.", "It caused religious authorities to ban the practice of reading aloud in groups."], 1], ["Cahokia 卡霍基亚城市", ["For centuries, historical narratives often depicted pre-Columbian North America as a land sparsely populated by small, nomadic bands that left the landscape largely unaltered. However, the archaeological site of Cahokia, located near modern-day St. Louis, offers a striking counter-narrative to this view of simplicity. At its zenith around AD 1100, Cahokia was a sprawling urban center with a population that likely exceeded that of London at the time. The city was anchored by Monks Mound, a massive earthen structure covering fourteen acres and rising one hundred feet into the air. Constructing such a monument required the movement of millions of cubic feet of soil, a feat accomplished without the wheel or beasts of burden. This level of construction implies a highly stratified society with a centralized political and religious authority capable of organizing and sustaining a massive labor force. The existence of Cahokia demonstrates that indigenous North American societies were not limited to small-scale hunter-gatherer groups but were capable of developing complex, high-density metropolitan areas comparable to those in other parts of the world."], "What is the main point the author makes by discussing Cahokia?", ["It serves as evidence that pre-Columbian societies were capable of sophisticated urban organization.", "It proves that indigenous populations relied heavily on animal labor for construction.", "It illustrates that North American settlements were generally smaller than European cities of the same era.", "It supports the idea that indigenous people preferred a nomadic lifestyle with minimal environmental impact."], 0], ["Clam Gardens 贝类园圃", ["For decades, anthropologists characterized the indigenous peoples of the Pacific Northwest primarily as hunter-gatherers who passively harvested the region's natural bounty. However, recent archaeological investigations along the coastline have revealed extensive stone terrace structures known as 'clam gardens' constructed in the intertidal zone. These rock walls were built at the low-tide line to trap sediment and flatten the slope of the beach. By expanding the habitat suitable for butter clams and littleneck clams, these structures significantly increased shellfish productivity. Furthermore, the act of tending these gardens—tilling the sediment to aerate it and removing predators—ensured sustainable yields over generations. These findings challenge the traditional binary classification of agriculturalists versus foragers, suggesting that marine management was as sophisticated as terrestrial farming. The existence of such systems indicates that the coastal ecosystem was not merely exploited opportunistically but was actively engineered to ensure long-term food security."], "What is the author's primary argument regarding the discovery of clam gardens?", ["It proves that indigenous populations relied more heavily on seafood than on land-based hunting.", "It demonstrates that indigenous peoples practiced a form of environmental engineering rather than simple foraging.", "It suggests that archaeological methods have historically failed to identify coastal structures.", "It explains why the Pacific Northwest was able to support higher population densities than other regions."], 1], ["Three Sisters 三姐妹农法", ["Early European observers often mistook Indigenous agricultural plots in North America for chaotic tangles of vegetation, failing to recognize the sophisticated agronomy at play. The widespread 'Three Sisters' method—intercropping maize, climbing beans, and squash—exemplifies a deep understanding of plant ecology. The maize stalks provided necessary structural support for the beans, eliminating the need for artificial poles, while the beans, through their root systems, fixed atmospheric nitrogen to replenish the soil nutrients consumed by the corn. Meanwhile, the broad leaves of the squash plant acted as a living mulch, shading the ground to retain moisture and suppress weeds. Far from being a primitive lack of organization, this polyculture system maintained soil fertility over long periods without the need for the fallow rotation typically required by European monocultures. This evidence challenges historical narratives that characterize indigenous farming as rudimentary, revealing instead an advanced approach to sustainable food production."], "What point does the author primarily make about the 'Three Sisters' agricultural method?", ["It was less efficient than European farming because it required artificial structural support.", "It demonstrated a complex understanding of how different plant species support one another.", "It was eventually abandoned in favor of European monocultures due to soil depletion.", "It was designed primarily to create a chaotic appearance to deter wildlife."], 1], ["Audiobooks 有声书局限", ["The debate concerning the legitimacy of audiobooks often centers on whether listening yields the same intellectual benefits as visual reading. Research indicates that for proficient readers, the cognitive processes used to construct meaning—such as inferring motives and visualizing scenes—are largely identical across both formats. The brain networks responsible for language comprehension are activated similarly, suggesting that the core experience of consuming a narrative is preserved regardless of the medium. Nevertheless, a critical structural difference exists regarding the control of attention. Visual reading inherently accommodates regression, allowing the reader's eyes to flit back to previous lines to clarify ambiguity or reinforce complex concepts before moving forward. In contrast, audio playback imposes a linear, continuous momentum that discourages pausing or rewinding for minor clarifications. While this unyielding pace rarely hinders the enjoyment of fiction, it can be detrimental when engaging with dense, informational texts where the ability to self-regulate speed and review specific details is essential for deep analysis."], "According to the passage, what is a significant limitation of the audiobook format?", ["It fails to stimulate the brain networks required for visualizing narrative scenes.", "It restricts the audience's ability to easily revisit and review earlier sections of the text.", "It is generally considered by researchers to be an invalid form of literacy.", "It reduces the emotional impact of the story compared to visual reading."], 1], ["Silent Reading 默读演变", ["For much of human history, the act of reading was fundamentally a social and auditory performance rather than a private, silent activity. In classical antiquity, texts were often written in scriptio continua, a continuous stream of letters without spaces or punctuation. This format effectively necessitated reading aloud to decipher the meaning, as the rhythm and cadence of the spoken word helped separate varied syntactic units. Consequently, libraries in the ancient world were not the quiet sanctuaries we recognize today but were instead filled with the constant murmur of scholars vocalizing manuscripts. The gradual transition to silent reading, accelerated by the introduction of word separation in the Middle Ages, marked a significant cultural and intellectual shift. It internalized the voice of the text, allowing for a faster, more personal engagement with information. This evolution did not merely increase the speed at which information could be consumed; it fundamentally altered the relationship between the reader and the author. No longer bound by the temporal pace of speech or the immediate presence of an audience, the silent reader could pause, reflect, and question the material in privacy. This fostered a new kind of individual intellectual autonomy that was less susceptible to communal regulation or social performance."], "According to the passage, how did the development of silent reading influence the reader's experience?", ["It reduced the reader's ability to understand complex syntax without auditory cues.", "It promoted a more independent and reflective mode of engaging with texts.", "It forced libraries to enforce strict silence to accommodate the new reading style.", "It caused a decline in the social aspect of learning by isolating scholars."], 1], ["Garden Cities 花园城市", ["In the late Victorian era, the rapid and chaotic expansion of industrial hubs led to a deterioration in living standards, prompting a re-evaluation of urban design. Ebenezer Howard emerged as a pivotal figure, advocating for the creation of 'Garden Cities' designed to amalgamate the advantages of urban opportunity with the rural idyll. Howard's blueprint envisioned self-sufficient communities encircled by protective 'green belts'—swathes of agricultural land meant to contain sprawl and provide residents with proximity to nature. This model was distinct from simple suburbanization; it sought to create balanced, autonomous municipalities rather than mere dormitory towns for major cities. Although the movement laid the groundwork for modern town planning and successfully established settlements like Letchworth, the ideal of complete economic independence was rarely fully realized. Consequently, while the aesthetic and zoning principles of the Garden City endured, the functional autonomy Howard originally proposed often gave way to commuter dependence on larger metropolitan centers."], "Which of the following best summarizes the writer's assessment of the Garden City movement?", ["It was entirely unsuccessful because it failed to limit the sprawl of industrial cities.", "It achieved its visual and structural goals but often failed to maintain economic self-sufficiency.", "It prioritized the needs of major metropolitan centers over the health of local residents.", "It successfully replaced all Victorian industrial slums with autonomous agricultural towns."], 1], ["Widowed Land 寡居之地", ["For generations, a prevailing historical narrative suggested that the North American continent was a primeval wilderness, lightly trodden by indigenous inhabitants who lived in harmony with an untouched environment. This perception, however, largely stems from the specific timing of European observation. Early sixteenth-century explorers often reported densely settled regions and extensive agricultural clearance. Yet, when colonization intensified over a century later, settlers encountered vast, unbroken forests. This discrepancy is largely attributed to a silent biological invasion that preceded the settlers: Old World pathogens. These diseases swept through native populations with devastating speed, often arriving well in advance of direct European contact. As communities collapsed, the open fields and managed landscapes they had maintained for centuries were abandoned. The dense woodlands that later observers described were, in fact, rapidly regenerating secondary forests masking the footprint of complex societies. Therefore, the landscape perceived as a wild frontier was not an enduring state of nature, but rather a 'widowed land' recovering from sudden anthropogenic withdrawal."], "According to the passage, why did later European settlers encounter vast forests instead of the populated landscapes reported by earlier explorers?", ["Indigenous populations had deliberately reforested their agricultural lands to avoid detection.", "Earlier explorers had exaggerated the extent of indigenous settlement and agriculture.", "The reduction in human activity due to disease allowed previously cleared land to regrow.", "European settlers arrived in different regions than those visited by the initial sixteenth-century explorers."], 2], ["Nitrous Oxide 氧化亚氮", ["While carbon dioxide dominates global warming discussions, nitrous oxide—a byproduct primarily of agricultural activities—poses a unique and formidable challenge. Often overlooked, this gas is roughly 300 times more effective at trapping heat than carbon dioxide. Its primary source is not a centralized industrial chimney that can be capped or filtered, but rather the vast expanses of fertilized farmland worldwide. When nitrogen fertilizers are applied to boost crop yields, soil bacteria convert the excess nitrogen into nitrous oxide, which then seeps into the air. This diffuse nature makes emission control extremely difficult compared to point-source pollution. Moreover, the gas persists in the atmosphere for over a century, meaning today's emissions will influence the climate for generations to come. Researchers suggest that without significant changes in global farming practices and fertilizer efficiency, climate targets will remain out of reach, regardless of the progress made in the renewable energy sector."], "What point does the author make about nitrous oxide emissions?", ["They are easier to monitor than carbon dioxide because they come from specific industrial sites.", "They constitute a significant climate hurdle because they stem from widespread farming and are long-lasting.", "They have recently surpassed carbon dioxide as the leading contributor to the greenhouse effect.", "They can be swiftly neutralized if synthetic nitrogen fertilizers are banned immediately."], 1], ["Megafauna Extinction 巨型动物灭绝", ["For decades, paleontologists have debated the primary driver behind the sudden disappearance of North America's megafauna—giant creatures such as mammoths, mastodons, and saber-toothed cats—at the end of the Pleistocene epoch. The 'overkill hypothesis,' first popularized in the 1960s, posits that the arrival of humans across the Bering Land Bridge directly precipitated these extinctions through aggressive hunting practices. Proponents argue that the timing of human arrival coincides too perfectly with the collapse of megafaunal populations to be coincidental. However, recent radiocarbon dating and climatic reconstructions suggest a more nuanced reality. Evidence indicates that significant climate fluctuations, leading to habitat loss and vegetation changes, were already stressing these populations prior to human entry. Consequently, many researchers now advocate for a synergistic model, suggesting that while human predation may have delivered the final blow to weakened populations, it was likely the rapid environmental restructuring that made these species vulnerable in the first place."], "Which view regarding the extinction of North American megafauna does the writer support?", ["The extinction was caused exclusively by the sophisticated hunting methods of early humans.", "Climate change theories have been largely dismissed in favor of the overkill hypothesis.", "A combination of ecological changes and human activity likely led to the species' demise.", "Megafaunal populations had already vanished before humans migrated across the Bering Land Bridge."], 2], ["Black Carbon 黑碳", ["Black carbon, a primary component of soot, has emerged as a significant driver of global climate change, ranking second only to carbon dioxide in its warming influence. Unlike well-known greenhouse gases that can persist in the atmosphere for centuries, black carbon is a short-lived climate pollutant with a lifespan of merely days to weeks. Originating from the incomplete combustion of fossil fuels and biomass, these fine particles absorb solar energy and warm the atmosphere directly. Their impact is particularly severe in polar regions; when black carbon settles on snow and ice, it darkens the surface, reducing its ability to reflect sunlight—a phenomenon known as the albedo effect. This absorption of heat accelerates melting, exposing darker land or water beneath, which further intensifies warming. Consequently, researchers suggest that targeting black carbon emissions presents a unique opportunity for near-term climate relief. Since these particles are removed from the atmosphere relatively quickly by rain and gravity, cutting emissions could result in immediate cooling benefits, slowing the rate of Arctic ice loss more swiftly than carbon dioxide reductions alone."], "According to the passage, what is a key advantage of reducing black carbon emissions compared to reducing carbon dioxide?", ["It permanently eliminates the need to address fossil fuel consumption.", "It could produce faster climate cooling results due to the pollutant's short lifespan.", "It prevents the albedo effect from occurring in non-polar regions.", "It addresses a pollutant that stays in the atmosphere for hundreds of years."], 1], ["Terra Preta 亚马逊黑土", ["For centuries, archaeologists operated under the assumption that the Amazon basin was an inhospitable environment for large-scale civilization. The prevailing theory suggested that the region's acidic, nutrient-poor soils were incapable of supporting the intensive agriculture required to feed populous settlements. Consequently, the rainforest was viewed as a pristine, sparsely inhabited wilderness where only small, nomadic tribes could survive. However, recent findings have fundamentally challenged this perspective. Researchers have identified vast expanses of terra preta, or 'dark earth'—a highly fertile, anthropogenic soil found throughout the basin. Unlike the surrounding natural soils, terra preta is rich in charcoal, pottery shards, and organic matter, indicating deliberate engineering by indigenous populations over thousands of years. The existence of these modified soil tracts suggests that pre-Columbian Amazonia was not a virgin wilderness, but a managed landscape capable of sustaining millions of people in complex, sedentary societies. This revelation forces a reconsideration of the historical demography of South America and the sophistication of its early inhabitants' environmental stewardship."], "What is the main significance of the discovery of terra preta described in the passage?", ["It confirms that the natural soil of the Amazon was actually rich in nutrients.", "It disproves the idea that the Amazon could not support large, settled populations.", "It indicates that indigenous tribes preferred nomadic lifestyles to avoid soil depletion.", "It shows that European settlers introduced advanced soil management techniques."], 1], ["Permafrost 永冻土", ["Permafrost, the permanently frozen ground covering vast stretches of the Northern Hemisphere, serves as one of the Earth's largest terrestrial carbon sinks. For thousands of years, this frozen soil has locked away the remains of ancient plants and animals, effectively halting the decomposition process. However, as global temperatures rise, this permafrost is beginning to thaw at an unprecedented rate. When the ice melts, the organic matter within the soil becomes accessible to microbes, which break it down and release the by-products into the atmosphere. Depending on oxygen availability, this process emits either carbon dioxide or methane. The release of methane is particularly concerning because it is significantly more efficient at trapping heat than carbon dioxide over shorter timeframes. This creates a dangerous feedback loop: as the planet warms, more permafrost thaws, releasing more greenhouse gases, which in turn causes further warming. Consequently, what was once a stable storage system for carbon is threatening to become a major contributor to global climate instability."], "What is the main conclusion drawn by the writer regarding permafrost?", ["It acts as a permanent barrier that prevents microbes from accessing organic matter regardless of temperature.", "The release of gases from thawing soil creates a cycle that further accelerates global warming.", "Carbon dioxide is the primary concern because it traps heat more efficiently than methane.", "Recent studies show that permafrost is expanding due to shifts in the Earth's climate stability."], 1], ["Bison Grazing 野牛放牧", ["For millennia, the American bison acted as the primary architect of the Great Plains, shaping the grassland ecosystem through specific grazing behaviors that modern livestock management struggles to replicate. Unlike cattle, which tend to linger near water sources and graze specific areas intensively, bison are highly mobile. They traverse vast distances, grazing an area briefly before moving on, a pattern that prevents the depletion of vegetation and allows for rapid recovery. This distinct behavior creates a heterogeneous landscape often described as a shifting mosaic, characterized by patches of short, grazed grass interspersed with taller, undisturbed vegetation. This structural variety is vital for the survival of the prairie ecosystem, particularly for grassland birds that require specific grass heights for nesting and foraging. Additionally, the bison's unique habit of wallowing—rolling in the dirt to remove molting fur and deter insects—creates compacted depressions. These depressions fill with rainwater to form ephemeral wetlands, supporting amphibians and providing drinking water for other wildlife. Thus, the decimation of bison herds in the 19th century fundamentally simplified the ecological complexity of the North American prairies."], "According to the text, what is a significant ecological consequence of the bison's migratory grazing habits?", ["The creation of a varied landscape structure that supports diverse bird populations.", "The formation of compacted soil depressions that collect rainwater for amphibians.", "The elimination of tall vegetation to ensure a uniformly grazed environment.", "The concentration of grazing activity near water sources to protect open grasslands."], 0], ["Subvocalization 默读发声", ["Subvocalization, often described as the internal speech made when reading words silently, allows the reader to imagine the sound of the word as it is processed. This natural mechanism helps the mind access meanings, thereby facilitating understanding and information recall. For decades, speed-reading advocates have categorized subvocalization as a detrimental habit, arguing that it creates a bottleneck by limiting reading speed to the pace of speaking—roughly 150 to 200 words per minute. Consequently, many training programs focus on techniques to suppress this inner voice to boost velocity. However, contemporary psycholinguistic research challenges the view that subvocalization should be completely eliminated. Studies indicate that while suppressing inner speech may indeed increase the raw number of words scanned per minute, it frequently leads to a significant drop in the grasp of the material, particularly when dealing with complex or nuanced arguments. The inner voice functions as a critical component of the phonological loop, holding data in working memory long enough for the brain to integrate concepts. Thus, rather than viewing subvocalization as a flaw to be eradicated, it is better understood as a regulatory tool. Proficient readers unconsciously adjust their reliance on this internal narration, minimizing it for simple texts while fully engaging it to navigate dense content."], "Which of the following best summarizes the author's perspective on subvocalization?", ["It is an inefficient habit that must be overcome to master rapid reading.", "It serves a valuable function in processing difficult texts and should not be entirely discarded.", "It causes the brain to overload by retaining too much information in working memory.", "It is essential for all types of reading, regardless of the simplicity of the content."], 1], ["Chaco Canyon 查科峡谷", ["The Chaco Canyon civilization in the American Southwest is celebrated for its complex social structure and monumental great houses. For years, the prevailing theory attributed the sudden abandonment of these settlements in the 12th century primarily to a severe, decades-long drought. However, recent bioarchaeological and geological studies have begun to paint a more nuanced picture involving human agency. Analysis of ancient packrat middens—rodent nests that preserve plant materials over millennia—demonstrates that the canyon was once surrounded by dense pinyon and juniper woodlands. Over centuries, the Chacoans harvested this timber extensively for construction and firewood. The removal of this critical ground cover likely triggered a cycle of soil erosion and arroyo cutting, which lowered the water table and decimated the maize crops upon which the society depended. Thus, while climate variability was undeniably a factor, the society's collapse was likely compounded by their unsustainable exploitation of the local environment, challenging the view that pre-colonial populations always lived in perfect equilibrium with their surroundings."], "Which of the following best summarizes the writer's argument regarding the decline of the Chaco Canyon civilization?", ["It was primarily caused by a failure to transport timber from distant mountain ranges.", "It was driven significantly by environmental degradation resulting from their own resource use.", "It occurred solely because of a catastrophic natural drought that struck the region.", "It resulted from the destruction of their maize crops by invasive rodent populations."], 1], ["New England Forests 新英格兰森林", ["When English settlers described the dense, impenetrable woodlands of New England in the early seventeenth century, they believed they were observing a primordial wilderness that had existed unchanged for millennia. However, modern environmental historians suggest that what these settlers encountered was not an ancient, untouched ecosystem, but rather a landscape in the midst of a dramatic ecological rebound. Prior to European contact, large Indigenous populations had cleared extensive tracts of land for maize agriculture and village sites. Tragically, the introduction of Old World pathogens in the sixteenth century resulted in a catastrophic demographic collapse among Native American communities. As populations dwindled, vast areas of cultivated land were abandoned. Consequently, the forests rapidly reclaimed these open fields through the process of secondary succession. Thus, the 'virgin' forest described in colonial chronicles was, in reality, a relatively young, dense overgrowth masking the footprint of a once-thriving agricultural society."], "What is the central argument regarding the New England forests described in the text?", ["They were ancient ecosystems that had remained biologically stable for thousands of years before European arrival.", "They were actively maintained by Indigenous populations using fire to prevent overgrowth.", "They were largely the product of recent regeneration after agricultural lands were left untended due to population decline.", "They appeared impenetrable primarily because English settlers lacked the skills to navigate the terrain effectively."], 2], ["Chatbots 客服聊天机器人", ["Many companies now use chatbots to handle customer service requests. While they respond quickly, chatbots often struggle to solve complex issues that require human judgment."], "What is the main limitation of chatbots mentioned in the text?", ["They respond too slowly.", "They cannot handle complicated problems well.", "They are too expensive to operate.", "They replace human workers completely."], 1], ["Online News 网络新闻", ["A recent survey found that most young adults prefer reading news online rather than in newspapers. This shift is largely due to easy access to smartphones and the internet."], "What is the main reason for the change in news-reading habits?", ["Newspapers are becoming more popular.", "Online news is easier to access.", "Young adults have stopped reading news.", "Internet access is becoming limited."], 1], ["Plant Signals 植物化学信号", ["Scientists are studying how plants communicate using chemical signals. These signals allow plants to warn each other about dangers like insects or disease."], "According to the passage, what can plants do using chemical signals?", ["Grow faster.", "Move to safer areas.", "Warn other plants.", "Change their color immediately."], 2], ["Work Breaks 工作间歇", ["New research indicates that people who take short breaks during work are more productive than those who work continuously without stopping."], "According to the passage, who is more productive?", ["People who skip breaks.", "People who work continuously.", "People who take short breaks.", "People who work longer hours."], 2], ["Gut Bacteria 肠道菌群", ["Medical researchers are exploring how gut bacteria influence human emotions. Early findings suggest that certain bacteria may affect mood and stress levels."], "What are researchers investigating?", ["How bacteria cause physical injuries.", "Connections between gut bacteria and emotions.", "How emotions change eating habits.", "Ways to eliminate all gut bacteria."], 1], ["Second Language 第二语言", ["Several studies show that learning a second language can delay the onset of age-related cognitive decline by strengthening brain networks."], "What is one benefit of learning a second language?", ["It speeds up cognitive decline.", "It strengthens brain networks.", "It reduces brain activity.", "It eliminates the need for memory skills."], 1], ["Robot Waiters 机器人服务员", ["Some restaurants are introducing robot waiters to improve efficiency. However, customers still prefer human waiters for personalized service."], "Why do customers still prefer human waiters?", ["Robots provide better service.", "Human waiters offer personalization.", "Robots never make mistakes.", "Robots are cheaper to maintain."], 1], ["Music and Memory 音乐与记忆", ["Recent experiments show that music can influence memory. Participants who listened to calm music during study sessions performed better on memory tests."], "What does calm music help improve?", ["Physical strength.", "Memory performance.", "Reaction time.", "Speaking speed."], 1]], "mcma": [["深海甲壳类 Deep-Ocean Crustaceans", ["Scientists studying the deep ocean have recently discovered several new species of crustaceans near hydrothermal vents. These species survive in extreme temperatures and complete darkness. Unlike most marine organisms, they depend on chemosynthesis rather than sunlight. However, researchers still lack detailed information about their population size, reproductive patterns, and long-term survival."], "Which TWO statements are correct? (选 2 项)", ["The newly found species live in conditions with no sunlight.", "Scientists have a clear understanding of how these species reproduce.", "The organisms rely on chemical processes for energy.", "Researchers have fully determined their long-term survival.", "These species are commonly found throughout all ocean regions."], 0, 2], ["电动滑板车 Electric Scooters", ["Over the last decade, electric scooters have become popular in many cities. They are considered a convenient alternative for short distances. However, critics argue that improper parking and reckless riding often create safety hazards for pedestrians. Many local governments are now setting regulations to maintain public safety."], "Which TWO statements are correct? (选 2 项)", ["Electric scooters are mainly used for long-distance travel.", "Some people believe scooters cause problems for pedestrians.", "Governments are trying to regulate scooter usage.", "Electric scooters have declined in popularity recently.", "All cities have banned electric scooters."], 1, 2], ["撒哈拉南扩 Sahara Expansion", ["The Sahara Desert is expanding southward partly due to climate change and unsustainable farming practices. As rainfall decreases, fertile land gradually turns into desert. Many communities struggle to maintain agriculture, forcing families to migrate to other regions in search of resources."], "Which TWO statements are correct? (选 2 项)", ["Reduced rainfall is one cause of the Sahara's expansion.", "Farming practices have no effect on desertification.", "Some families are relocating because farming is becoming difficult.", "The Sahara is shrinking because of climate change.", "Most communities are improving their agricultural systems."], 0, 2], ["膳食纤维 Dietary Fiber", ["Recent studies show that consuming meals high in fiber improves digestion and helps maintain stable blood sugar levels. However, nutritionists warn that suddenly increasing fiber intake may lead to bloating. They advise introducing high-fiber foods gradually over several weeks."], "Which statements are correct? (选 3 项)", ["Fiber helps regulate blood sugar.", "Increasing fiber suddenly can cause discomfort.", "Nutritionists recommend avoiding fiber altogether.", "Studies show fiber has no effect on digestion.", "Nutritionists encourage gradual changes in diet."], 0, 1, 4], ["野生蜜蜂 Wild Bees", ["Wild bees play a crucial role in pollinating crops. Unfortunately, habitat loss and pesticide exposure have significantly reduced their populations. Some farms have begun creating 'pollinator gardens' to provide safe environments for bees and attract them back to agricultural areas."], "Which TWO statements are correct? (选 2 项)", ["Bee populations are decreasing because of pesticides.", "Wild bees do not contribute to crop pollination.", "Some farms are taking steps to restore bee habitats.", "Habitat loss has no influence on bee survival.", "Pollinator gardens are harmful to bee populations."], 0, 2], ["现代图书馆 Modern Libraries", ["Historically, libraries served as quiet spaces for reading. Today, many libraries offer digital equipment, group study rooms, and community workshops. Although these changes have modernized library services, some visitors still prefer silent reading environments."], "Which statements are correct? (选 3 项)", ["Modern libraries provide more than just books.", "All visitors enjoy the newer, busier library environment.", "Some people still prefer quiet spaces.", "Libraries have stopped offering reading spaces.", "Digital equipment is now part of many libraries."], 0, 2, 4], ["喜马拉雅冰川 Himalayan Glaciers", ["The Himalayan region contains some of the world's fastest-melting glaciers. Rising temperatures are creating large glacial lakes, increasing the risk of sudden floods. Scientists are monitoring these areas closely to predict possible dangers."], "Which statements are correct? (选 3 项)", ["Himalayan glaciers are melting slowly.", "Melting ice contributes to the formation of glacial lakes.", "Scientists are observing these regions carefully.", "Flood risks have decreased in recent years.", "Temperature rise is affecting glacier melt."], 1, 2, 4], ["AI 客服 AI Chatbots", ["Artificial intelligence is transforming customer service worldwide. Many companies now use chatbots to answer simple questions instantly. Although they reduce workload for staff, customers sometimes complain that chatbots cannot understand complex problems well."], "Which TWO statements are correct? (选 2 项)", ["AI chatbots help handle basic customer inquiries.", "Customers think chatbots solve all complex issues perfectly.", "Chatbots reduce employee workload.", "AI is rarely used in customer service.", "Companies avoid using chatbots."], 0, 2], ["屋顶太阳能 Rooftop Solar", ["Renewable energy sources such as solar and wind power have become more affordable over the past decade. As a result, many households are installing rooftop solar panels. However, the initial set-up cost remains high for low-income families."], "Which statements are correct? (选 3 项)", ["Solar and wind energy have become cheaper recently.", "Most low-income families can easily afford solar panels.", "Many homes use rooftop solar systems now.", "Renewable energy has become more expensive.", "Installation cost is still a challenge for some families."], 0, 2, 4], ["智能手机传感器 Smart Phone Sensors", ["Modern smart phones include sensors that track physical activity, such as steps and heart rate. These features motivate users to exercise more regularly. Still, experts warn that sensor data is not always accurate and should be interpreted carefully."], "Which statements are correct? (选 3 项)", ["Smart phones can record users' physical activity.", "Sensor data is always perfectly accurate.", "Activity tracking encourages people to exercise.", "Experts recommend ignoring Smart phone data completely.", "Heart-rate monitoring is one of the features."], 0, 2, 4], ["城市噪音 Urban Noise", ["Urban noise pollution has increased due to heavy traffic and construction. Long-term exposure can lead to stress and sleep disturbances. Many cities are introducing noise-control measures such as sound-blocking walls and quiet zoning areas."], "Which statements are correct? (选 3 项)", ["Noise pollution in cities is rising.", "Short-term exposure is extremely harmful.", "Noise can negatively affect health.", "Cities are taking steps to reduce noise levels.", "Traffic has no connection to noise pollution."], 0, 2, 3], ["在线课程 Online Courses", ["The popularity of online courses has surged in recent years. Students value the flexibility to study at any time. However, some learners struggle with self-discipline, leading to lower completion rates compared to traditional classes."], "Which TWO statements are correct? (选 2 项)", ["Online learning is becoming more popular.", "Students dislike flexible study schedules.", "Some learners have difficulty finishing online courses.", "Online courses require less discipline.", "Online classes have higher completion rates."], 0, 2], ["海藻包装 Seaweed Packaging", ["Researchers developed a biodegradable packaging material made from seaweed. It decomposes much faster than plastic and does not release harmful chemicals. Although still in early testing, it shows potential for reducing plastic waste significantly."], "Which statements are correct? (选 3 项)", ["Seaweed-based packaging breaks down quickly.", "The material releases toxic chemicals when decomposing.", "It may help reduce plastic pollution.", "It is already widely used in supermarkets.", "Researchers are still testing it."], 0, 2, 4], ["可持续航油 Sustainable Aviation Fuel", ["Some airlines are experimenting with sustainable aviation fuel made from plants and waste products. This fuel reduces carbon emissions but is currently more expensive than traditional jet fuel. Experts believe costs will decrease as production technology improves."], "Which TWO statements are correct? (选 2 项)", ["Sustainable fuel emits less carbon.", "It is cheaper than traditional jet fuel.", "Costs may fall with better technology.", "Airlines refuse to try sustainable fuels.", "The fuel is made only from petroleum."], 0, 2], ["政治捐款退税 Political Donations", ["Given the record of our political class, the proposal to give tax rebates for political donations will likely meet a similar fate. Instead of cleaning up political life then, the bill runs the risk of being a godsend for fly-by-night middlemen and fixers, and unscrupulous businessmen. The other objection to the bill is a more traditional one, namely that rather than private donations, the solution is in state funding of parties. This not only ensures that there is some sense of proportion and fairness in the quantum of funding available to different parties, but also that funding does not become a means of determining the political agenda. Private funding, in this argument, is an unacceptable form of political lobbying which promotes the specific demands of donors apart from generally favoring conservative, mainstream parties, squeezing out those representing minority voices. Whatever its merits, the most serious obstacle to this kind of reasoning comes from the precarious nature of public finance in the country. At a time when the Indian state is already hard-pressed to find resources for education, health, and other social security activities, can there be a case for it to burden itself with a new category of expenses? In purely economic terms too, the proposed tax breaks do not augur well for the savings sector; and this when the sagging savings graph in the economy is already a matter of increasing anxiety."], "Which demands according to the writer deserve better attention than the political funds? (选 2 项)", ["To provide better education opportunities to the citizens.", "Serving the health-related requirements of the people.", "Educational donations to institutions.", "Taking care of the safety and security of the citizens.", "The funds for the proper functioning of transport systems."], 1, 3], ["儿童受虐 Child Neglect", ["The crisis begins in the womb with unplanned parenthood. Women with unplanned pregnancies are less likely to seek prenatal care. In the U.S. 80% of teenage pregnancies and 56% of all pregnancies are unplanned. The problems continue after birth where unplanned pregnancies and unstable partnerships often go hand in hand. Since 1950, the number of single-parent families has nearly tripled. More than 25 percent of all births today are to unmarried mothers. As the number of single parent families grows and more women enter the workforce, infants and toddlers are increasingly in the care of people other than their parents. Most disturbingly, recent statistics show that American parents are increasingly neglecting or abusing their children. In only four years from 1987-1991, the number of children in foster care increased by over 50 percent. Babies under the age of one are the fastest growing category of children entering foster care. The crisis affects children under the age of three most severely, the report says. Yet, it is this period from infancy through preschool years that sets the stage for a child's future."], "What can be the possible reasons for the increasing neglect and abuse of children? (选 3 项)", ["The immaturity and overburdening of parents.", "The babies being left in foster care where a stranger looks after them.", "The children being ill mannered and not respecting their parents.", "The parents being busy with meeting the financial aspects of the family and not having enough time for the children."], 0, 1, 3], ["维京扩张 Viking Expansion", ["One probable motive determining the Viking expansion suggests that the inhabitants had outgrown the agricultural potential of their Scandinavian homeland. For a coastal population with progressive sea-faring expertise, it made sense to expand overseas and birth records for that era reflect an unexpected rise in birth rates. Another explanation is the Vikings' ability to exploit a moment of weakness in the surrounding territories, capitalising on internal divisions and the lack of organised naval opposition. Viking ships could travel undetected and strike relatively easily given that many settlements were positioned near navigable rivers. The decline in profitability of former trade routes also played a fundamental role. Trade on the Mediterranean Sea had reduced substantially, thus by opening further trade routes, the Vikings profited from international trade by expanding beyond their established borders."], "According to the writer, what are the possible reasons for Viking expansion beyond their homeland? (选 2 项)", ["A declining Viking population made overseas expansion necessary.", "The neighbouring countries were vulnerable, divided and less developed.", "Viking farming technology was less advanced than their sea-faring technologies.", "There was a high demand for Viking goods and products overseas.", "There were opportunities to develop new trade links abroad."], 0, 4], ["Viking Women Autonomy", ["While popular depictions of the Viking Age frequently overlook the domestic sphere in favor of martial exploits, historical and archaeological evidence suggests that women in Norse society enjoyed a degree of autonomy and respect often denied to their European contemporaries. Within the household, the female head of the family held the keys to the food chests, a symbol of her absolute authority over domestic resources and the farm's daily operations. This managerial role became particularly crucial when male relatives were absent on long seasonal voyages; during these periods, women effectively ran the estates, making critical economic decisions. Beyond the threshold of the home, legal codes from the period indicate that women possessed specific rights regarding property and marriage. Unlike in many neighboring cultures, a Norse woman could own land in her own right, retain control over her dowry, and even initiate divorce proceedings if the marriage proved unsatisfactory. However, this relative freedom had limits; political power remained largely a male preserve, and women were generally excluded from casting votes at the 'Thing,' the local governing assembly. Funerary excavations further underscore the prominence of certain women. The magnificent Oseberg ship burial, containing the remains of two women surrounded by luxurious goods and intricate textiles, challenges the assumption that high-status interment was reserved exclusively for chieftains or warriors. These findings imply that social rank could be determined by lineage or religious influence, not merely by prowess in battle."], "Which of the following statements are correct? (选 2 项)", ["They were legally entitled to end a marriage and maintain control over personal assets.", "Their primary social function was restricted to textile production and child-rearing.", "Archaeological findings indicate that social prestige was accessible to individuals outside the warrior class.", "They held equal voting rights with men during local government assemblies.", "They were forbidden from managing estates during the absence of male relatives."], 0, 2], ["Viking Runestones", ["While popular imagination often relegates the Vikings to the role of illiterate raiders, the surviving corpus of runic inscriptions offers a more nuanced view of a society deeply invested in commemoration, infrastructure, and legal codification. The majority of extant runestones date from the late Viking Age, particularly the eleventh century, and are concentrated heavily in the Lake Malaren region of Sweden. Far from being cryptic magical symbols used solely for esoteric rituals, the runes of the Younger Futhark were a functional script used to convey clear, pragmatic messages to the community. The primary function of these monuments was memorialization; a stone would typically be raised by a family member to honor a deceased relative. The standard formula - 'X raised this stone in memory of Y' - establishes a clear link between the living and the dead. However, the inscriptions frequently served a dual purpose as legal documents. By publicly declaring who raised the stone and their relationship to the deceased, the sponsor was effectively asserting their right to inheritance. In a society where legal disputes were settled in open assemblies, these permanent stone markers acted as durable deeds of title, ensuring that property claims were physically anchored in the landscape. Furthermore, the content of the inscriptions provides vital clues about the religious transformation of Scandinavia. A significant proportion of late Viking Age runestones bear Christian crosses or prayers, and some even commemorate the construction of bridges - an act considered a pious good work in the early Christian church. This suggests that the conversion to Christianity was not merely a top-down political maneuver by kings but was also embraced by the wealthy local landowners who commissioned these stones to demonstrate their new religious affiliation alongside their traditional social standing."], "Which of the following statements are correct? (选 3 项)", ["They functioned as public declarations of inheritance claims.", "They were primarily used to record the details of magical rituals.", "They indicate that the Christian faith was adopted by local elites.", "They were exclusively commissioned by kings to mark territorial boundaries.", "They served as memorials to deceased relatives."], 0, 2, 4], ["Viking Social Structure & Women", ["The social structure of the Viking Age was rigidly hierarchical, fundamentally categorized into three distinct classes: the Jarls, who constituted the aristocracy and land-owning elite; the Karls, comprising the majority of free peasants, craftsmen, and warriors; and the Thralls, enslaved individuals with no legal rights. Yet, within this stratified framework, the status of free Viking women presents a fascinating divergence from the norms prevalent in much of contemporary Europe. While they were excluded from the formal political machinery - specifically, they could not speak at the 'Thing,' the governing assembly, nor could they serve as judges - their influence was far from negligible. Women in Norse society enjoyed a degree of autonomy and legal protection that was relatively progressive for the period. Law codes and sagas indicate that women had the right to own land, inherit property, and importantly, request a divorce if a marriage failed - a liberty largely absent in the Christianized nations to the south. The practical realities of Viking society necessitated this empowerment. With the male population frequently engaged in long-distance expeditions for trade or warfare, the stability of the homestead depended entirely on the women left behind. In the absence of their husbands, women assumed the role of the 'husfru,' managing the farm's finances, directing the labor of thralls, and ensuring the community's survival through harsh winters. This authority was symbolized by the keys to the household's storehouses, which the mistress of the house wore conspicuously at her belt. Archaeological evidence supports this textual picture; rich grave goods found in female burials suggest that certain women commanded immense respect and accumulated significant wealth, further challenging the stereotype of a purely patriarchal warrior society. Thus, while formal political power was male-dominated, the operational management of Viking society often rested in female hands."], "Which of the following statements are correct? (选 2 项)", ["They were legally entitled to terminate an unhappy marriage.", "They acted as the primary decision-makers at the governing assembly.", "They took charge of economic and agricultural management during male absences.", "Their social standing was generally inferior to that of women in Christian Europe.", "They were strictly confined to domestic duties and lacked property rights."], 0, 2], ["Micromobility & Urban Transport", ["The rapid proliferation of dockless electric scooters and shared bicycles, frequently categorized as micromobility, has fundamentally altered the logistics of urban transport in recent years. Advocates champion these devices as an elegant solution to the persistent 'first and last mile' problem, effectively bridging the distance between major public transit stations and a commuter's final destination. By facilitating these short-range connections, micromobility services ostensibly reduce the dependency on private automobiles for brief journeys, offering a dual benefit of alleviated traffic congestion and diminished carbon emissions. However, the sudden ubiquity of these fleets has precipitated significant challenges for city planners. A salient critique involves the phenomenon of 'street clutter,' where devices left haphazardly on pavements obstruct rights-of-way, creating substantial hazards for pedestrians, particularly those with visual impairments or limited mobility. Additionally, the interaction between vulnerable, often unhelmeted riders and high-speed vehicular traffic has led to a spike in trauma incidents, prompting public health concerns. In response, municipal governments are moving away from the initial laissez-faire approach. New regulatory frameworks are being adopted, incorporating geofencing technology to enforce speed limits in crowded areas and mandating the use of designated parking corrals. Thus, while micromobility promises increased efficiency, its integration requires a careful balancing act between innovation and public safety."], "Which of the following statements are correct? (选 2 项)", ["They effectively replace the need for public buses and trains.", "Their disorderly parking creates physical barriers on sidewalks.", "They have led to an increase in injuries among riders.", "They are primarily used for long-distance commuting.", "City governments have refused to regulate their usage."], 1, 2], ["Shift Away From Car-Centric Planning", ["For the better part of the 20th century, the philosophy underpinning urban development was heavily skewed towards the automobile. City engineers and planners focused relentlessly on maximizing traffic flow, often widening roads and sacrificing sidewalks to accommodate the surging number of private vehicles. This car-centric approach reshaped cities into sprawling networks of tarmac, frequently severing neighborhoods and marginalizing those attempting to travel on foot or bicycle. However, in recent years, a profound shift in urban policy has emerged, challenging the long-standing dominance of the car. Municipalities worldwide are now retrofitting streets to prioritize 'active transport,' converting traffic lanes into protected cycle paths and transforming parking lots into green public spaces. The motivations for this reversal are diverse and compelling. Public health authorities are strong advocates, arguin
