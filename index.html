ome more affordable over the past decade. As a result, many households are installing rooftop solar panels. However, the initial set-up cost remains high for low-income families."], "Which statements are correct? (选 3 项)", ["Solar and wind energy have become cheaper recently.", "Most low-income families can easily afford solar panels.", "Many homes use rooftop solar systems now.", "Renewable energy has become more expensive.", "Installation cost is still a challenge for some families."], 0, 2, 4], ["智能手机传感器 Smart Phone Sensors", ["Modern smart phones include sensors that track physical activity, such as steps and heart rate. These features motivate users to exercise more regularly. Still, experts warn that sensor data is not always accurate and should be interpreted carefully."], "Which statements are correct? (选 3 项)", ["Smart phones can record users' physical activity.", "Sensor data is always perfectly accurate.", "Activity tracking encourages people to exercise.", "Experts recommend ignoring Smart phone data completely.", "Heart-rate monitoring is one of the features."], 0, 2, 4], ["城市噪音 Urban Noise", ["Urban noise pollution has increased due to heavy traffic and construction. Long-term exposure can lead to stress and sleep disturbances. Many cities are introducing noise-control measures such as sound-blocking walls and quiet zoning areas."], "Which statements are correct? (选 3 项)", ["Noise pollution in cities is rising.", "Short-term exposure is extremely harmful.", "Noise can negatively affect health.", "Cities are taking steps to reduce noise levels.", "Traffic has no connection to noise pollution."], 0, 2, 3], ["在线课程 Online Courses", ["The popularity of online courses has surged in recent years. Students value the flexibility to study at any time. However, some learners struggle with self-discipline, leading to lower completion rates compared to traditional classes."], "Which TWO statements are correct? (选 2 项)", ["Online learning is becoming more popular.", "Students dislike flexible study schedules.", "Some learners have difficulty finishing online courses.", "Online courses require less discipline.", "Online classes have higher completion rates."], 0, 2], ["海藻包装 Seaweed Packaging", ["Researchers developed a biodegradable packaging material made from seaweed. It decomposes much faster than plastic and does not release harmful chemicals. Although still in early testing, it shows potential for reducing plastic waste significantly."], "Which statements are correct? (选 3 项)", ["Seaweed-based packaging breaks down quickly.", "The material releases toxic chemicals when decomposing.", "It may help reduce plastic pollution.", "It is already widely used in supermarkets.", "Researchers are still testing it."], 0, 2, 4], ["可持续航油 Sustainable Aviation Fuel", ["Some airlines are experimenting with sustainable aviation fuel made from plants and waste products. This fuel reduces carbon emissions but is currently more expensive than traditional jet fuel. Experts believe costs will decrease as production technology improves."], "Which TWO statements are correct? (选 2 项)", ["Sustainable fuel emits less carbon.", "It is cheaper than traditional jet fuel.", "Costs may fall with better technology.", "Airlines refuse to try sustainable fuels.", "The fuel is made only from petroleum."], 0, 2], ["政治捐款退税 Political Donations", ["Given the record of our political class, the proposal to give tax rebates for political donations will likely meet a similar fate. Instead of cleaning up political life then, the bill runs the risk of being a godsend for fly-by-night middlemen and fixers, and unscrupulous businessmen. The other objection to the bill is a more traditional one, namely that rather than private donations, the solution is in state funding of parties. This not only ensures that there is some sense of proportion and fairness in the quantum of funding available to different parties, but also that funding does not become a means of determining the political agenda. Private funding, in this argument, is an unacceptable form of political lobbying which promotes the specific demands of donors apart from generally favoring conservative, mainstream parties, squeezing out those representing minority voices. Whatever its merits, the most serious obstacle to this kind of reasoning comes from the precarious nature of public finance in the country. At a time when the Indian state is already hard-pressed to find resources for education, health, and other social security activities, can there be a case for it to burden itself with a new category of expenses? In purely economic terms too, the proposed tax breaks do not augur well for the savings sector; and this when the sagging savings graph in the economy is already a matter of increasing anxiety."], "Which demands according to the writer deserve better attention than the political funds? (选 2 项)", ["To provide better education opportunities to the citizens.", "Serving the health-related requirements of the people.", "Educational donations to institutions.", "Taking care of the safety and security of the citizens.", "The funds for the proper functioning of transport systems."], 1, 3], ["儿童受虐 Child Neglect", ["The crisis begins in the womb with unplanned parenthood. Women with unplanned pregnancies are less likely to seek prenatal care. In the U.S. 80% of teenage pregnancies and 56% of all pregnancies are unplanned. The problems continue after birth where unplanned pregnancies and unstable partnerships often go hand in hand. Since 1950, the number of single-parent families has nearly tripled. More than 25 percent of all births today are to unmarried mothers. As the number of single parent families grows and more women enter the workforce, infants and toddlers are increasingly in the care of people other than their parents. Most disturbingly, recent statistics show that American parents are increasingly neglecting or abusing their children. In only four years from 1987-1991, the number of children in foster care increased by over 50 percent. Babies under the age of one are the fastest growing category of children entering foster care. The crisis affects children under the age of three most severely, the report says. Yet, it is this period from infancy through preschool years that sets the stage for a child's future."], "What can be the possible reasons for the increasing neglect and abuse of children? (选 3 项)", ["The immaturity and overburdening of parents.", "The babies being left in foster care where a stranger looks after them.", "The children being ill mannered and not respecting their parents.", "The parents being busy with meeting the financial aspects of the family and not having enough time for the children."], 0, 1, 3], ["维京扩张 Viking Expansion", ["One probable motive determining the Viking expansion suggests that the inhabitants had outgrown the agricultural potential of their Scandinavian homeland. For a coastal population with progressive sea-faring expertise, it made sense to expand overseas and birth records for that era reflect an unexpected rise in birth rates. Another explanation is the Vikings' ability to exploit a moment of weakness in the surrounding territories, capitalising on internal divisions and the lack of organised naval opposition. Viking ships could travel undetected and strike relatively easily given that many settlements were positioned near navigable rivers. The decline in profitability of former trade routes also played a fundamental role. Trade on the Mediterranean Sea had reduced substantially, thus by opening further trade routes, the Vikings profited from international trade by expanding beyond their established borders."], "According to the writer, what are the possible reasons for Viking expansion beyond their homeland? (选 2 项)", ["A declining Viking population made overseas expansion necessary.", "The neighbouring countries were vulnerable, divided and less developed.", "Viking farming technology was less advanced than their sea-faring technologies.", "There was a high demand for Viking goods and products overseas.", "There were opportunities to develop new trade links abroad."], 0, 4]]};

function attachRec(btnId){
  const btn=document.getElementById(btnId);
  if(!btn)return;
  let rec=null,chunks=[],stream=null,recording=false;
  btn.onclick=()=>{
    if(!recording){
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert('此环境不支持录音（需 HTTPS）。请用在线链接版录音。');return;}
      navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
        stream=s;const mt=(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm'))?'audio/webm':'';
        rec=mt?new MediaRecorder(s,{mimeType:mt}):new MediaRecorder(s);
        chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
        rec.onstop=()=>{const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const url=URL.createObjectURL(blob);
          const a=document.createElement('audio');a.controls=true;a.src=url;a.style.width='100%';a.style.marginTop='10px';btn.insertAdjacentElement('afterend',a);
          if(stream)stream.getTracks().forEach(t=>t.stop());};
        rec.start();recording=true;btn.textContent='⏹ 停止并回放';btn.classList.add('recording');
      }).catch(e=>alert('麦克风被拒绝或不可用。可用在线链接版录音。'));
    }else{rec.stop();recording=false;btn.textContent='🎤 再录一次';btn.classList.remove('recording');}
  };
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// SWT 一句话总结：关键内容词覆盖率（离线，对照范文）
function gradeSWT(user, model){
  const keys=sstKeys(model); if(!keys.length)return {pct:0,keys:[],hit:[]};
  const u=(user||'').toLowerCase();
  const hit=keys.filter(k=>new RegExp('\\b'+k.replace(/[^a-z0-9]/g,'')+'\\b','i').test(u));
  const pct=keys.length?Math.round(hit.length/keys.length*100):0;
  return {pct,keys,hit};
}

function gatherBackup(){
  const keys=['pte_kv','pte_diff','pte_kl','pte_prog','pte_stage','pte_start','pte_today','pte_streak','pte_mock','pte_wfd','pte_exam','pte_cal','pte_fav','pte_sst','pte_fib','pte_ro','pte_mc','pte_hist','pte_acclog','pte_spk','pte_wrt'];
  const o={}; keys.forEach(k=>{const v=localStorage.getItem(k); if(v!=null)o[k]=v;}); o.__v=1; return o;
}
function applyBackup(o){
  if(!o||!o.__v)return false;
  if(o['pte_kv']!=null){knownV=JSON.parse(o['pte_kv']);save('pte_kv',knownV);}
  if(o['pte_diff']!=null){diffData=JSON.parse(o['pte_diff']);save('pte_diff',diffData);}
  if(o['pte_kl']!=null){knownL=new Set(JSON.parse(o['pte_kl']));save('pte_kl',Array.from(knownL));}
  if(o['pte_prog']!=null){prog=JSON.parse(o['pte_prog']);save('pte_prog',prog);}
  if(o['pte_stage']!=null){stage=JSON.parse(o['pte_stage']);save('pte_stage',stage);}
  if(o['pte_start']!=null){start=JSON.parse(o['pte_start']);save('pte_start',start);}
  if(o['pte_today']!=null){todays=JSON.parse(o['pte_today']);save('pte_today',todays);}
  if(o['pte_streak']!=null){streak=JSON.parse(o['pte_streak']);save('pte_streak',streak);}
  if(o['pte_mock']!=null){mock=JSON.parse(o['pte_mock']);save('pte_mock',mock);}
  if(o['pte_wfd']!=null){wfdAcc=JSON.parse(o['pte_wfd']);save('pte_wfd',wfdAcc);}
  if(o['pte_exam']!=null){exam=JSON.parse(o['pte_exam']);save('pte_exam',exam);}
  if(o['pte_cal']!=null){cal=JSON.parse(o['pte_cal']);save('pte_cal',cal);}
  if(o['pte_fav']!=null){fav=JSON.parse(o['pte_fav']);save('pte_fav',fav);}
  if(o['pte_sst']!=null){sstAcc=JSON.parse(o['pte_sst']);save('pte_sst',sstAcc);}
  if(o['pte_fib']!=null){fibAcc=JSON.parse(o['pte_fib']);save('pte_fib',fibAcc);}
  if(o['pte_ro']!=null){roAcc=JSON.parse(o['pte_ro']);save('pte_ro',roAcc);}
  if(o['pte_mc']!=null){mcAcc=JSON.parse(o['pte_mc']);save('pte_mc',mcAcc);}
  if(o['pte_hist']!=null){hist=JSON.parse(o['pte_hist']);save('pte_hist',hist);}
  if(o['pte_acclog']!=null){accLog=JSON.parse(o['pte_acclog']);save('pte_acclog',accLog);}
  if(o['pte_spk']!=null){spk=JSON.parse(o['pte_spk']);save('pte_spk',spk);}
  if(o['pte_wrt']!=null){wrtData=JSON.parse(o['pte_wrt']);save('pte_wrt',wrtData);}
  return true;
}
function weekNum(){const s=parseDs(start);const t=new Date();const d=Math.floor((t-s)/DAY);return Math.max(1,Math.floor(d/7)+1);}
function touchStreak(){const t=todayStr();if(streak.last===t)return;if(streak.last===addDays(t,-1))streak.count++;else streak.count=1;streak.last=t;save('pte_streak',streak);}
function bump(k){const t=todayStr();if(prog.date!==t){prog={date:t,v:0,l:0};}prog[k]++;save('pte_prog',prog);cal[t]=(cal[t]||0)+1;save('pte_cal',cal);touchStreak();updateTop();}
function updateTop(){
  const bar=$('#topbar'); if(!bar)return;
  const g=DATA.goals[stage]||{v:20,l:10};
  const ok=prog.v>=g.v&&prog.l>=g.l;
  const st=DATA.stages.find(s=>s.id===stage);
  bar.className='topbar'+(ok?' done':'');
  bar.innerHTML='<span>'+st.id+' '+st.name+' · 第'+weekNum()+'周</span>'
    +'<span>词汇 '+Math.min(prog.v,g.v)+'/'+g.v+' · 听说 '+Math.min(prog.l,g.l)+'/'+g.l+'</span>'
    +(streak.count>0?'<span class="fire">🔥连续 '+streak.count+' 天</span>':'')
    +(ok?'<span>🎉达标</span>':'');
}

// 自适应每日任务：基于薄弱项 + 待复习动态生成
function adaptiveTasks(){
  const out=[];
  const rv=countReview();
  if(rv>0) out.push(['复习 '+rv+' 个待巩固词（间隔重复，读写→词汇）','rw','fib']);
  const ww=Object.keys(wfdAcc).filter(k=>wfdAcc[k].n>=2 && wfdAcc[k].c/wfdAcc[k].n<0.8);
  if(ww.length) out.push(['重练 '+ww.length+' 句薄弱 WFD（<80% 正确，听力→WFD）','listen','wfd']);
  const wf=Object.keys(fibAcc).filter(k=>fibAcc[k].n>=2 && fibAcc[k].c/fibAcc[k].n<0.7);
  if(wf.length) out.push(['补 '+(wf.length)+' 段薄弱 FIB 阅读填空（读写→FIB填空）','rw','fibread']);
  const ws=Object.keys(sstAcc).filter(k=>sstAcc[k].n>=2 && sstAcc[k].c/sstAcc[k].n<0.6);
  if(ws.length) out.push(['重听 '+(ws.length)+' 篇薄弱 SST 关键词（听力→SST）','listen','sst']);
  if(hist.length){const last=hist[hist.length-1];const arr=[['听力',last.听力],['口语',last.口语],['阅读',last.阅读],['写作',last.写作]];arr.sort((a,b)=>a[1]-b[1]);const wk=arr[0];if(wk[1]<70)out.push(['主攻最薄弱模块：'+wk[0]+'（'+wk[1]+'分，计划→P3 看能力曲线）','plan','']);}
  if(!out.length) out.push(['保持节奏：RA×3 · RS×5 · WFD×5 · 词汇一轮','speak','ra']);
  return out;
}
// 错题本：聚合平时练习自动收集的薄弱项，通勤时集中攻克
function wrongBookHtml(){
  const wfdWeak=Object.keys(wfdAcc).filter(k=>wfdAcc[k].n>=2 && wfdAcc[k].c/wfdAcc[k].n<0.8);
  const fibWeak=Object.keys(fibAcc).filter(k=>fibAcc[k].n>=2 && fibAcc[k].c/fibAcc[k].n<0.7);
  const sstWeak=Object.keys(sstAcc).filter(k=>sstAcc[k].n>=2 && sstAcc[k].c/sstAcc[k].n<0.6);
  const roWeak=Object.keys(roAcc).filter(k=>roAcc[k].n>=2 && roAcc[k].c/roAcc[k].n<0.6);
  const mcWeak=Object.keys(mcAcc).filter(k=>mcAcc[k].n>=2 && mcAcc[k].c/mcAcc[k].n<0.6);
  const rv=countReview();
  if(!wfdWeak.length && !fibWeak.length && !sstWeak.length && !roWeak.length && !mcWeak.length && !rv) return '';
  let h='<div class="card"><div class="ph">🔴 我的错题本</div>';
  if(wfdWeak.length){
    h+='<div style="font-size:12.5px;color:var(--slate);font-weight:600;margin:4px 0 2px">薄弱 WFD 句（'+wfdWeak.length+'，点🔊听）</div>';
    wfdWeak.slice(0,5).forEach(k=>{const idx=DATA.wfdr.findIndex(s=>s[0]===k);h+='<div class="weak-row" data-spk="'+(idx>=0?idx:'')+'">🔊 '+k+'</div>';});
    if(wfdWeak.length>5)h+='<div class="adpt" data-tab="listen" data-sub="wfd">🔗 还有 '+(wfdWeak.length-5)+' 句，去 WFD 重练</div>';
  }
  if(fibWeak.length)h+='<div class="adpt" data-tab="rw" data-sub="fibread">🔗 薄弱 FIB 阅读填空 '+fibWeak.length+' 段 →</div>';
  if(sstWeak.length)h+='<div class="adpt" data-tab="listen" data-sub="sst">🔗 薄弱 SST 关键词 '+sstWeak.length+' 篇 →</div>';
  if(roWeak.length)h+='<div class="adpt" data-tab="read" data-sub="ro">🔗 薄弱 RO 段落排序 '+roWeak.length+' 段 →</div>';
  if(mcWeak.length)h+='<div class="adpt" data-tab="read" data-sub="mcsa">🔗 薄弱 阅读单选/多选 '+mcWeak.length+' 题 →</div>';
  if(rv)h+='<div class="adpt" data-tab="rw" data-sub="fib">🔗 待复习词 '+rv+' 个 →</div>';
  h+='<div class="hint" style="margin-top:8px">这些从你平时练习自动收集，是提分最快的攻克点。</div></div>';
  return h;
}

    +'</div>'

// 读写（FIB 填空 + 写作模板）
let vq=[], vi=0, rwTab='fib', wIdx=0, fibIdx=0;
function buildVQ(){
  const wn=weekNum(), ws=(wn-1)*WPER, we=wn*WPER;
  // Review-due words go first, interval depends on difficulty (easy 5d / mid 3d / hard 1d)
  const rv=DATA.vocab.map((_,i)=>i).filter(i=>i in knownV&&knownV[i]<reviewCut(i));
  const tw=DATA.vocab.map((_,i)=>i).filter(i=>i>=ws&&i<we&&!(i in knownV));
  const ot=DATA.vocab.map((_,i)=>i).filter(i=>(i<ws||i>=we)&&!(i in knownV));
  const kn=DATA.vocab.map((_,i)=>i).filter(i=>i in knownV&&knownV[i]>=reviewCut(i));
  vq=rv.concat(tw).concat(ot).concat(kn); vi=0;
}
// WE 官方评分维度自评（Pearson 量规，来源：PTE Academic Essay Score Guide / pearsonpte.com）
function weFormScore(w){ if(w>=200&&w<=300)return 2; if((w>=120&&w<200)||(w>300&&w<=380))return 1; return 0; }
function weCompletion(obj){ let sum=0,ms=0; DATA.we_rubric.forEach((t,i)=>{ms+=t[1]; if(obj&&obj[i]!=null)sum+=obj[i];}); return ms?Math.round(sum/ms*100):0; }
function weRubricHtml(idx){
  const saved=wrtData[idx]||{};
  let h='<div class="rub-box"><div class="rub-h">📊 官方评分维度自评 <span class="rub-src">Pearson 量规</span></div>';
  DATA.we_rubric.forEach((t,i)=>{
    const name=t[0],max=t[1],desc=t[2],bands=t[3],isForm=(i===1);
    h+='<div class="rub-trait"><div class="rub-name">'+name+' <span class="rub-scale-tag">0–'+max+'</span></div><div class="rub-desc">'+desc+'</div>';
    if(isForm){ h+='<div class="rub-btns"><span class="rub-auto" id="rubForm">字数达标后自动评</span></div>'; }
    else {
      h+='<div class="rub-btns" data-t="'+i+'">';
      for(let v=0;v<=max;v++){ h+='<button class="rub'+(saved[i]===v?' on':'')+'" data-v="'+v+'">'+v+'</button>'; }
      h+='</div><div class="rub-band" id="rubBand'+i+'">'+(bands&&saved[i]!=null?bands[saved[i]]:'')+'</div>';
    }
    h+='</div>';
  });
  h+='<div class="rub-foot"><b id="rubScore">自评完成度 —</b><div class="hint" style="margin-top:4px">对照 Pearson 官方 7 维量规自评（非机器分）；权威分数以官方模考为准。</div></div></div>';
  return h;
}
function practiceBar(){
  const subs=[['speak','口语'],['listen','听力'],['read','阅读'],['write','写作'],['vocab','词汇']];
  return '<div class="tabs prac" id="pTabs">'+subs.map(s=>'<button data-p="'+s[0]+'" class="'+(pTab===s[0]?'on':'')+'">'+s[1]+'</button>').join('')+'</div>';
}
function wirePracticeBar(){
  const el=document.getElementById('pTabs'); if(!el)return;
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{pTab=b.dataset.p; if(pTab==='vocab')buildVQ(); renderPractice();});
}
function renderPractice(){
  if(pTab==='speak')renderSpeaking();
  else if(pTab==='listen')renderListen();
  else if(pTab==='read')renderReading();
  else if(pTab==='write')renderWriting();
  else renderVocab();
}
function setPSub(sub){
  if(sub==='speak'){sTab='ra';sIdx=0;pTab='speak';}
  else if(sub==='listen'){lTab='wfd';lIdx=0;lPage=0;pTab='listen';}
  else if(sub==='read'){rTab='ro';pTab='read';}
  else if(sub==='write'){rwTab='write';wIdx=0;pTab='write';}
  else if(sub==='vocab'){buildVQ();pTab='vocab';}
}
// 词汇（从原 renderRW 的 fib 分支抽出，作为练习子页）

  const d=DATA.vocab[vq[vi]];
  const ipaHtml=d[2]?('<div class="ipa">'+d[2]+'</div>'):('<div class="ipa muted">音标暂缺 · 点🔊听发音</div>');
  const posHtml=d[3]?('<div class="pos">'+d[3]+'</div>'):'';
  const exHtml=(d[4]?('<div class="ex" id="ex"><div class="en">'+d[4]+'</div><div class="zh">'+(d[5]||d[1])+'</div></div>'):'');
  let html=practiceBar()
    +'<div class="wk">第 '+weekNum()+' 周 · 已认识 '+Object.keys(knownV).length+' / '+DATA.vocab.length+' → '+(countReview()>0?'<span class="review-badge">'+countReview()+'待复习</span>':'<span style="color:var(--green);font-size:11px">全部巩固</span>')+'</div>'
    +'<div class="card rw">'+STAR('vocab',vq[vi])+'<div class="wd"><div class="big-word">'+d[0]+'</div>'+ipaHtml+posHtml+'</div>'
    +'<button class="speak" id="spk">🔊 听发音</button>'
    +'<button class="mic" id="mic">🎤 录自己发音</button>'
    +'<div class="cn" id="cn" style="display:block">'+d[1]+'</div>'


    +'<div class="row"><button class="btn ghost" id="no">不认识</button><button class="btn" id="yes">认识</button></div></div>';
  body.innerHTML=html; wirePracticeBar();

  $('#spk').onclick=()=>speak(DATA.vocab[vq[vi]][0]); attachRec('mic');

  $('#yes').onclick=()=>{
    const idx=vq[vi];
    knownV[idx]=Date.now();save('pte_kv',knownV);bump('v');vi++;renderVocab();
  };
  $('#no').onclick=()=>{delete knownV[vq[vi]];save('pte_kv',knownV);vi++;renderVocab();};
}
// 写作（从原 renderRW 的 write 分支抽出，作为练习子页）
function renderWriting(){
  rwTab='write';
  const wp=DATA.wp[wIdx];
  const isSWT=wp[0].startsWith('SWT');
  let html=practiceBar()
    +'<div class="card wr"><div class="ph">'+(isSWT?'SWT 一句话总结':'WE 写作文')+' · '+(wIdx+1)+'/'+DATA.wp.length+'</div>'
    +'<div class="ex show" style="margin-bottom:10px"><b>'+wp[0]+'</b><div style="margin-top:4px;color:#555">'+wp[1]+'</div></div>'
    +'<textarea class="ta" id="essay" placeholder="'+(isSWT?'用一句话总结（5–75词），套模板：This text argues that...':'写200–300词议论文。引言→主体1→主体2→结论。连接词：Firstly/Furthermore/However/In conclusion')+'" style="min-height:'+(isSWT?'80px':'200px')+'"></textarea>'
    +'<div id="wc" style="font-size:12px;color:var(--muted);margin-top:6px;text-align:right">0 词</div>'
    +(isSWT?'<button class="btn" id="swtChk" style="margin-top:8px">自动核对关键词（对照范文）</button><div id="swtRes"></div>':'<button class="btn" id="weModelBtn" style="margin-top:8px">📖 对照机经范文</button><div id="weModel" style="display:none;margin-top:10px"></div><div id="weRub"></div>')
    +'<div id="tpl" style="font-size:12px;margin-top:4px"></div>'
    +'<div class="row"><button class="btn ghost" id="prevW">上一题</button><button class="btn" id="nextW">下一题</button></div></div>'
    +'<div class="hint">💡 '+(isSWT?'SWT：只能写一句！用 and/which/that 连接。':'WE：模板先行！引言→主体1(论点+例)→主体2(反方)→结论。机器判分重语法拼写。')+'</div>';
  body.innerHTML=html; wirePracticeBar();

function wireRO(item, keyIdx, onGrade){
  let placed=[];
  body.querySelectorAll('.ro-opt').forEach(function(btn){btn.onclick=function(){
    if(btn.disabled)return; const i=+btn.dataset.i; placed.push(i);

    chip.textContent=(placed.length)+'. '+item[1][i]; document.getElementById('roOrder').appendChild(chip);
  };});
  $('#roChk').onclick=function(){
    if(placed.length<item[1].length){alert('请先按顺序点完全部句子');return;}
    let ok=0; placed.forEach(function(v,pos){if(v===pos)ok++;});
    const pct=Math.round(ok/item[1].length*100);
    if(onGrade){onGrade(pct);}else{const key='ro:'+keyIdx; if(!roAcc[key])roAcc[key]={n:0,c:0}; roAcc[key].n++; if(pct>=60)roAcc[key].c++; save('pte_ro',roAcc);}
    accLog.push({ts:Date.now(),type:'RO',pct:pct}); save('pte_acclog',accLog);
    let res=''; placed.forEach(function(v,pos){res+='<div style="font-size:13px;margin:2px 0">'+(v===pos?'✅':'❌')+' '+(pos+1)+'. '+item[1][v]+'</div>';});
    $('#roRes').innerHTML='<div class="ph" style="margin-top:8px">顺序正确 '+ok+'/'+item[1].length+'（'+pct+'%）</div>'+res;
  };
}

function wireMCMA(it, keyIdx, onGrade){
  const picks=new Set();
  const need=it.slice(4).length;
  const updateMcCnt=function(){const el=$('#mcCnt');if(!el)return;const n=picks.size;el.textContent='已选 '+n+' 项 · 本题应选 '+need+' 项';el.style.color=(n>need)?'var(--amber)':'var(--muted)';};
  body.querySelectorAll('.mc-opt').forEach(function(btn){btn.onclick=function(){
    const i=+btn.dataset.i;
    if(picks.has(i)){picks.delete(i);btn.style.background='#fff';btn.style.borderColor='var(--line)';}
    else{picks.add(i);btn.style.background='#EAF4F5';btn.style.borderColor='var(--teal)';}
    updateMcCnt();
  };});
  updateMcCnt();
  $('#mcChk').onclick=function(){
    if(picks.size===0){alert('请至少选择一个选项');return;}

}

      +'<button class="btn" id="hiwChk" style="margin-top:12px">提交并看结果</button>'
      +'<div class="row"><button class="btn ghost" id="prevL">上一篇</button><button class="btn" id="nextL">下一篇</button></div></div>';

  body.innerHTML=html;
  wirePracticeBar();
  body.querySelectorAll('#lTabs button').forEach(b=>b.onclick=()=>{lTab=b.dataset.l;lIdx=0;lPage=0;renderListen();});
  if(lTab==='wfd'){
    const d=DATA.wfdr[lIdx%DATA.wfdr.length];
    $('#spk').onclick=()=>{speak(d[0]);bump('l');};
    $('#chk').onclick=()=>{bump('l');
      const typed=$('#ans').value.trim().toLowerCase();
      const orig=d[0].toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
      const got=typed.replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
      let resHtml='<div class="ph" style="margin-top:10px">核对结果</div><div style="font-size:15px;line-height:1.8">';
      const max=Math.max(orig.length,got.length);let okc=0;
      for(let k=0;k<max;k++){const o=orig[k]||'',g=got[k]||'';if(o===g){resHtml+=' <span class="tok-ok">'+(g||'·')+'</span>';if(o)okc++;}else{resHtml+=' <span class="tok-no">'+(g||'__')+'</span>';}}
      const pct=orig.filter(Boolean).length?(okc/orig.filter(Boolean).length*100|0):0;
      // 记录准确率
      const key=d[0]; if(!wfdAcc[key])wfdAcc[key]={n:0,c:0}; wfdAcc[key].n++; if(pct>=80)wfdAcc[key].c++; save('pte_wfd',wfdAcc);
      accLog.push({ts:Date.now(),type:'WFD',pct:pct}); save('pte_acclog',accLog);
      resHtml+='</div><div class="hint">'+okc+'/'+orig.filter(Boolean).length+' 词正确 ('+pct+'%) · 原文：'+d[0]+'</div>';
      const weak=Object.entries(wfdAcc).filter(([k,v])=>v.n>=2&&v.c/v.n<0.8).map(([k,v])=>(v.c/v.n*100|0)+'% · '+k);
      if(weak.length)resHtml+='<details style="margin-top:8px"><summary style="font-size:12.5px;color:var(--red);cursor:pointer">🔴 我的薄弱句 ('+weak.length+')</summary>'+weak.map(w=>'<div style="font-size:12px;color:#555;padding:4px 0;border-bottom:1px solid var(--line)">'+w+'</div>').join('')+'</details>';
      $('#res').innerHTML=resHtml;$('#cn').style.display='block';$('#res').scrollIntoView({behavior:'smooth',block:'nearest'});
    };
    $('#nextWFD').onclick=()=>{lIdx++;bump('l');renderListen();};
  } else if(lTab==='sst'){
    $('#spk').onclick=()=>{speak(DATA.pass[lIdx][1]);bump('l');};
    const flip=$('#flip'); flip.onclick=()=>{$('#cn').classList.add('show');flip.textContent='已显示中文 · 再点隐藏';};
    $('#cn').onclick=()=>{$('#cn').classList.remove('show');flip.textContent='👆 点英文看中文';};
    $('#prevL').onclick=()=>{lIdx=(lIdx-1+DATA.pass.length)%DATA.pass.length;renderListen();};
    $('#nextL').onclick=()=>{lIdx=(lIdx+1)%DATA.pass.length;bump('l');renderListen();};
    const sc=$('#sstChk'); if(sc)sc.onclick=()=>{
      bump('l');const p=DATA.pass[lIdx];const keys=sstKeys(p[1]);
      const txt=$('#sstAns').value.toLowerCase();
      const hit=keys.filter(k=>new RegExp('\\b'+k.replace(/[^a-z0-9]/g,'')+'\\b','i').test(txt));
      const pct=keys.length?Math.round(hit.length/keys.length*100):0;
      const key='sst:'+lIdx;if(!sstAcc[key])sstAcc[key]={n:0,c:0};sstAcc[key].n++;if(pct>=60)sstAcc[key].c++;save('pte_sst',sstAcc);
      accLog.push({ts:Date.now(),type:'SST',pct:pct}); save('pte_acclog',accLog);
      const kwh=keys.map(k=>'<span class="'+(hit.includes(k)?'tok-ok':'tok-no')+'">'+k+'</span>').join(' ');
      $('#sstRes').innerHTML='<div class="ph" style="margin-top:10px">关键词命中 '+hit.length+'/'+keys.length+'（'+pct+'%）</div><div style="font-size:14px;line-height:1.9;margin-top:4px">'+kwh+'</div>';
    };
  } else if(lTab==='wfdlib'){
    if(lPage>0) $('#prevPage').onclick=()=>{lPage--;renderListen();};
    const maxp=Math.ceil(DATA.wfd_jj.length/LPP);
    if(lPage<maxp-1) $('#nextPage').onclick=()=>{lPage++;bump('l');renderListen();};
  } else if(lTab==='hiw'){
    const hiw=DATA.hiw[lIdx%DATA.hiw.length];
    const correct=hiw[0], pairs=hiw[1];
    let audioText=correct;
    pairs.forEach(p=>{audioText=audioText.replace(new RegExp('\\b'+p[0]+'\\b','gi'),p[1]);});
    $('#spk').onclick=()=>{speak(audioText);bump('l');};
    body.querySelectorAll('.hiw-word').forEach(el=>el.onclick=()=>el.classList.toggle('hiw-on'));
    $('#hiwChk').onclick=()=>{
      const tapped=Array.from(document.querySelectorAll('.hiw-word.hiw-on')).map(e=>e.dataset.w);
      const correctSet=new Set(pairs.map(p=>p[0].toLowerCase()));
      let score=tapped.filter(w=>correctSet.has(w)).length - tapped.filter(w=>!correctSet.has(w)).length;
      score=Math.max(0,score);
      const total=correctSet.size;
      const pct=total?Math.round(score/total*100):100;
      accLog.push({ts:Date.now(),type:'HIW',pct:pct}); save('pte_acclog',accLog);
      body.querySelectorAll('.hiw-word').forEach(el=>{
        const w=el.dataset.w;
        if(correctSet.has(w)){el.style.background=el.classList.contains('hiw-on')?'rgba(14,122,107,.18)':'rgba(183,121,31,.18)';el.style.borderBottomColor=el.classList.contains('hiw-on')?'var(--green)':'var(--amber)';}
        else if(el.classList.contains('hiw-on')){el.style.background='rgba(192,57,43,.18)';el.style.borderBottomColor='var(--red)';}
      });
      $('#hiwRes').innerHTML='<div class="ph" style="margin-top:10px">你的得分 '+score+' / '+total+'（'+pct+'%）</div><div class="hint" style="margin-top:0">绿=点对的错词；橙=漏点的错词；红=误点的正确词。音频实际说的是：'+pairs.map(p=>p[0]+' → '+p[1]).join('，')+'</div>';
    };
    $('#prevL').onclick=()=>{lIdx=(lIdx-1+DATA.hiw.length)%DATA.hiw.length;renderListen();};
    $('#nextL').onclick=()=>{lIdx=(lIdx+1)%DATA.hiw.length;bump('l');renderListen();};
  }
}

// 题型（20 种题型 · 鹿茸优先级分级）
function qTypesHtml(){
  const qf=DATA.qtypes;
  // 按优先级分组
  const core=qf.filter(q=>q[3].startsWith('⭐⭐⭐'));
  const imp=qf.filter(q=>q[3].startsWith('⭐⭐'));
  const kw=qf.filter(q=>q[3].startsWith('⭐'));
  const skip=qf.filter(q=>q[3].startsWith('❌'));
  const cls={'⭐⭐⭐ 核心':'hint','⭐⭐ 重要':'','⭐ 了解':'','❌ 可放弃':''};
  function card(q){
    const icon=q[3].startsWith('⭐⭐⭐')?'🔥':q[3].startsWith('⭐⭐')?'📌':q[3].startsWith('⭐')?'👀':'⏭';

      +'<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px">'
      +'<div><span style="background:'+(q[3].startsWith('⭐⭐⭐')?'#FDEBD0':q[3].startsWith('❌')?'#E5E7EB':'#EAF4F5')+';color:'+(q[3].startsWith('⭐⭐⭐')?'#B7791F':q[3].startsWith('❌')?'#9CA3AF':'var(--teal)')+';font-size:11px;font-weight:600;padding:2px 8px;border-radius:10px;margin-right:6px">'+q[3]+'</span>'
      +'<span style="font-size:11px;color:var(--muted)">'+q[2]+'</span></div>'
      +'<span style="font-size:20px">'+icon+'</span></div>'
      +'<div style="font-size:15px;font-weight:600;color:var(--slate);margin-bottom:4px">'+q[0]+'<span style="font-weight:400;font-size:13px;color:var(--muted)"> · '+q[1]+'</span></div>'
      +'<div style="font-size:13px;color:#555;line-height:1.55;margin-bottom:6px">'+q[4]+'</div>'
      +'<div style="font-size:12.5px;color:var(--teal);background:#F0F7F8;border-radius:8px;padding:8px 10px;line-height:1.5">🐱 鹿茸：'+q[5]+'</div>'
      +'</div>';
  }
  let html='<div class="card"><div class="ph" style="font-size:16px">📋 PTE 全部 20 种题型</div>'
    +'<div class="hint" style="font-size:12.5px;margin-bottom:12px">按鹿茸经验分为四档：🔥核心(占分最高) → 📌重要(有模板/机经) → 👀了解(会就行) → ⏭可放弃(分值低)</div>';
  html+='<details open style="margin-bottom:12px"><summary style="font-size:14px;font-weight:700;color:#B7791F;cursor:pointer;padding:6px 0;list-style:none"><span style="font-size:18px;margin-right:4px">🔥</span> 核心必练（5 个，占分 60%+）<span style="font-size:11px;color:var(--muted);font-weight:400;margin-left:6px">点击展开/收起</span></summary>'+core.map(card).join('')+'</details>';
  html+='<details style="margin-bottom:12px"><summary style="font-size:14px;font-weight:700;color:var(--teal);cursor:pointer;padding:6px 0;list-style:none"><span style="font-size:18px;margin-right:4px">📌</span> 重点掌握（7 个，有模板/机经可套）<span style="font-size:11px;color:var(--muted);font-weight:400;margin-left:6px">点击展开/收起</span></summary>'+imp.map(card).join('')+'</details>';
  html+='<details style="margin-bottom:12px"><summary style="font-size:14px;font-weight:700;color:var(--slate);cursor:pointer;padding:6px 0;list-style:none"><span style="font-size:18px;margin-right:4px">👀</span> 了解即可（3 个，不需要大量练）<span style="font-size:11px;color:var(--muted);font-weight:400;margin-left:6px">点击展开/收起</span></summary>'+kw.map(card).join('')+'</details>';
  html+='<details style="margin-bottom:4px"><summary style="font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;padding:6px 0;list-style:none"><span style="font-size:18px;margin-right:4px">⏭</span> 可以放弃（5 个，分值极低 / 选错倒扣）<span style="font-size:11px;color:var(--muted);font-weight:400;margin-left:6px">点击展开/收起</span></summary>'+skip.map(card).join('')+'</details>';
  html+='<div class="hint" style="margin-top:12px">💡 鹿茸原话："PTE 不是所有题都要练。RS、WFD、DI、RA、FIB 这 5 个练好，剩下的有模板套模板。MC 选择题分低还倒扣，考试遇到直接跳——这时间花在 WFD 上能多拿 5 分。"</div>';
  html+='</div>';
  return html;
}
function renderQTypes(){ body.innerHTML=qTypesHtml(); }


// FIB 阅读填空：从真实机经段落抽词挖空，自动判分
function seeded(seed){let s=(seed%2147483647);if(s<=0)s+=2147483646;return ()=>(s=s*16807%2147483647)/2147483647;}
const FIBSTOP=new Set("the a an and or but of to in on for with is are was were be been being this that these those it its as by from at we you they he she his her their our your my i not no can will would should could may might must do does did has have had also more most very about into over under than then them what when where which who whom whose why how all any each few other some such no nor only own same so too s t just don don now if at by".split(" "));
function fibOf(text, seed){
  const words=text.split(/\s+/);
  let cand=[];
  for(let i=0;i<words.length;i++){const w=words[i].toLowerCase().replace(/[^a-z0-9]/g,'');if(w.length>5 && !FIBSTOP.has(w)) cand.push(i);}
  const rnd=seeded(seed+1);
  for(let i=cand.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=cand[i];cand[i]=cand[j];cand[j]=t;}
  const pick=cand.slice(0,6);
  const blanks={}; pick.forEach(i=>blanks[i]=words[i].replace(/[^A-Za-z0-9]/g,''));
  return {words,blanks};
}

// PTE 官方能力分档（真实数据：Pearson《PTE Academic Score Guide》CEFR 对照）
const PTE_BANDS=[
  {lo:85,hi:90,cefr:'C2',desc:'专家级：几乎能理解听到/读到的所有内容，任何语境自然表达。'},
  {lo:76,hi:84,cefr:'C1',desc:'能轻松参与研究生阶段各类学术活动。'},
  {lo:59,hi:75,cefr:'B2',desc:'满足大学入学要求，能跟上学术教学指导。'},
  {lo:43,hi:58,cefr:'B1',desc:'满足大学基本入学要求，但可能需要学术英语预科。'},
  {lo:30,hi:42,cefr:'A2',desc:'能在熟悉场景进行简单清晰的对话。'},
  {lo:10,hi:29,cefr:'A1',desc:'仅能理解日常基本用语，沟通能力有限。'}
];
function pteBand(score){score=Math.max(10,Math.min(90,score));return PTE_BANDS.find(b=>score>=b.lo&&score<=b.hi)||PTE_BANDS[PTE_BANDS.length-1];}
// 练习 0–100 → PTE 当量估算（非官方启发式，锚定官方档位边界，仅供进度参考）
function pteEquiv(p){
  p=Math.max(0,Math.min(100,p));
  const pts=[[0,10],[55,50],[70,58],[80,65],[92,79],[100,90]];
  if(p>=100)return 90;
  for(let i=0;i<pts.length-1;i++){if(p<=pts[i+1][0]){const[t0,s0]=pts[i],[t1,s1]=pts[i+1];return Math.round(s0+(s1-s0)*(p-t0)/(t1-t0));}}
  return 10;
}
// 能力雷达 + 进步曲线（SVG）
function radarSvg(rec){
  const cx=130,cy=110,R=82,n=4;
  const axes=[['听',rec.听力||0],['说',rec.口语||0],['读',rec.阅读||0],['写',rec.写作||0]];
  const pt=(i,r)=>{const ang=-Math.PI/2 + i*2*Math.PI/n; return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)];};
  let grid='';
  [0.25,0.5,0.75,1].forEach(g=>{ let p=''; for(let i=0;i<n;i++){const x=pt(i,R*g);p+=(i?'L':'M')+x[0].toFixed(1)+' '+x[1].toFixed(1);} grid+='<path d="'+p+'Z" fill="none" stroke="#E2E6EA" stroke-width="1"/>';});
  let labels=''; for(let i=0;i<n;i++){const x=pt(i,R+18);labels+='<text x="'+x[0].toFixed(1)+'" y="'+x[1].toFixed(1)+'" font-size="11" fill="#33495F" text-anchor="middle">'+axes[i][0]+' '+axes[i][1]+'</text>';}
  let poly=''; for(let i=0;i<n;i++){const x=pt(i,R*Math.min(1,axes[i][1]/100));poly+=(i?'L':'M')+x[0].toFixed(1)+' '+x[1].toFixed(1);}
  let tpath=''; for(let i=0;i<n;i++){const x=pt(i,R*Math.min(1,TARGET/100));tpath+=(i?'L':'M')+x[0].toFixed(1)+' '+x[1].toFixed(1);}
  const tgt='<path d="'+tpath+'Z" fill="none" stroke="#C0392B" stroke-width="1" stroke-dasharray="4 3" opacity=".55"/>';
  let dots=''; for(let i=0;i<n;i++){const x=pt(i,R*Math.min(1,axes[i][1]/100));dots+='<circle cx="'+x[0].toFixed(1)+'" cy="'+x[1].toFixed(1)+' " r="3" fill="#2C8C99"/>';}
  return '<svg width="100%" style="max-width:240px" viewBox="0 0 260 220">'+grid+tgt+labels+'<path d="'+poly+'Z" fill="rgba(44,140,153,.25)" stroke="#2C8C99" stroke-width="2"/>'+dots+'<text x="'+cx+'" y="'+(cy-R*Math.min(1,TARGET/100)-4).toFixed(1)+'" font-size="9" fill="#C0392B" text-anchor="middle">目标'+TARGET+'</text></svg>';
}
function lineSvg(h){
  const W=320,H=180,pad=30;
  const n=h.length, maxX=Math.max(n,2);
  const xat=i=>pad+(i)*((W-pad-10)/(maxX-1));
  const yat=v=>H-pad-(v/100)*(H-pad-14);
  const cols={L:'#2C8C99',S:'#B7791F',R:'#5E51A8',W:'#C0392B'};
  const labs={L:'听',S:'说',R:'读',W:'写'};
  let grid=''; for(let g=0;g<=4;g++){const yy=pad+(H-pad-14)*g/4; grid+='<line x1="'+pad+'" y1="'+yy.toFixed(1)+'" x2="'+(W-10)+'" y2="'+yy.toFixed(1)+'" stroke="#EDEFF2"/><text x="2" y="'+(yy+3).toFixed(1)+'" font-size="9" fill="#999">'+((4-g)*25)+'</text>';}
  let lines='';
  ['L','S','R','W'].forEach(k=>{ let p=''; h.forEach((r,i)=>{const x=xat(i),y=yat(r[k]||0);p+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}); lines+='<path d="'+p+'" fill="none" stroke="'+cols[k]+'" stroke-width="2"/>'; });
  let leg=''; ['L','S','R','W'].forEach(k=>{leg+='<span style="display:inline-block;margin-right:10px;font-size:11px;color:'+cols[k]+'">●'+labs[k]+'</span>';});
  return '<svg width="100%" style="max-width:340px" viewBox="0 0 '+W+' '+H+'">'+grid+lines+'</svg><div style="margin-top:4px">'+leg+'</div>';
}

  const sum={},cnt={};

function heatStreaks(){
  let cur=0,max=0,run=0;
  const t=new Date();t.setHours(0,0,0,0);
  const start=new Date(t); start.setDate(t.getDate()-(13-1)*7-t.getDay());
  for(let i=0;i<13*7;i++){const dt=new Date(start);dt.setDate(start.getDate()+i);if(dt>t)break;const ds=dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate();if(cal[ds]){run++;if(run>max)max=run;}else run=0;}
  const c=new Date(t);while(true){const ds=c.getFullYear()+'-'+(c.getMonth()+1)+'-'+c.getDate();if(cal[ds]){cur++;c.setDate(c.getDate()-1);}else break;}
  return {cur,max};
}
function renderHeat(){
  const weeks=13;
  const today=new Date(); today.setHours(0,0,0,0);
  const dow=today.getDay(); // 0=Sun
  const startDay=new Date(today); startDay.setDate(today.getDate()-(weeks-1)*7-dow);
  let cells='';
  for(let c=0;c<weeks;c++){
    for(let d=0;d<7;d++){
      const dt=new Date(startDay); dt.setDate(startDay.getDate()+c*7+d);
      const ds=dt.getFullYear()+'-'+(dt.getMonth()+1)+'-'+dt.getDate();
      if(dt>today){cells+='<div class="heat-cell" style="visibility:hidden"></div>';continue;}
      const n=cal[ds]||0;
      const lv=n===0?0:n<=2?1:n<=5?2:3;
      cells+='<div class="heat-cell'+(lv?' l'+lv:'')+'" title="'+ds+' · '+(n?n+' 次练习':'未练习')+'"></div>';
    }
  }
  const activeDays=Object.keys(cal).length;
  const st=heatStreaks();
  return '<div class="card"><div class="ph">📅 学习热力图 · 最近 '+weeks+' 周</div>'
    +'<div class="heat">'+cells+'</div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:11.5px;color:var(--muted)">'
    +'<span>累计 <b style="color:var(--teal)">'+activeDays+'</b> 天 · 连续 <b style="color:var(--teal)">'+st.cur+'</b> 天 · 最长 <b style="color:var(--teal)">'+st.max+'</b> 天</span>'
    +'<span style="display:flex;align-items:center;gap:4px">少'
    +'<span class="heat-cell"></span><span class="heat-cell l1"></span><span class="heat-cell l2"></span><span class="heat-cell l3"></span>多</span></div></div>';
}

}

function switchTab(t){curTab=t;if(t!=='mock')clearMockTimer();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='today'){renderToday();}else if(t==='practice'){renderPractice();}else if(t==='mock'){renderMock();}else if(t==='plan'){renderPlan();}else if(t==='mine'){renderMine();}}
body.addEventListener('click',e=>{const b=e.target.closest('[data-fav]');if(b){const p=b.dataset.fav.split(':');toggleFav(p[0],+p[1],favText(p[0],+p[1]));switchTab(curTab);}});
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.t));
updateTop();
switchTab('today');
</script>
</body>
</html>
