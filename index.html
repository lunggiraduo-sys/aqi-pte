We frequently encounter news stories about public emergencies where bystanders fail to intervene, often leading to accusations that modern society has become morally bankrupt or indifferent. While it is easy to label these witnesses as uncaring, social psychology offers a more nuanced concept known as the bystander effect. This phenomenon suggests that the presence of others actually inhibits helping behavior through a process called diffusion of responsibility. When a single individual witnesses an accident, they feel a direct burden to act. However, in a group, that sense of obligation is diluted; individuals frequently assume someone else, perhaps someone more qualified, will take charge. Additionally, in ambiguous situations, we look to those around us for guidance. If others appear calm or detached, we often collectively assume there is no real danger, creating a cycle of inaction. Thus, the failure to act is rarely due to a lack of compassion, but rather a complex reaction to the social dynamic of the crowd.", ["The media correctly identifies that urban indifference and a lack of empathy are the primary reasons people fail to assist in public emergencies.", "Inaction in groups is typically caused by the diffusion of responsibility and misinterpreting others' calm behavior as a sign of safety, rather than apathy.", "Social psychologists argue that individuals are unlikely to help in emergencies if they are alone because they fear misinterpreting the situation.", "The bystander effect occurs because people in crowds prefer to wait for authorities to arrive rather than risking their own safety."], 1], ["While we often discuss the serialisation of Victorian novels, another dominant force in nineteenth-century publishing was the circulating library. For much of the century, purchasing a new novel outright was a luxury few could afford, a standard work cost roughly the same as a week's wages for a clerk. Enter the subscription library, most famously Charles Mudie's Select Library. Subscribers paid an annual fee for the right to borrow volumes, which fundamentally altered how books were written and produced. Mudie favoured the three-decker format, where a single novel was split into three separate physical volumes. This wasn't just an aesthetic choice; it was a shrewd commercial strategy. It allowed the library to circulate one novel among three different subscribers simultaneously, tripling the efficiency of their stock. Consequently, authors were often pressured to pad out their plots to fill the requisite three volumes, affecting the pacing and structure of Victorian fiction. It wasn't until the 1890s, when the libraries finally stopped insisting on this format, that the single-volume novel became the industry standard.", ["Circulating libraries reduced the cost of purchasing books, allowing the working class to buy three-volume novels rather than relying on expensive weekly serials.", "The high cost of books led to the rise of subscription libraries, which promoted the three-volume novel to maximize lending capacity, influencing the structure of Victorian fiction.", "Charles Mudie invented the three-decker novel to ensure that authors wrote higher quality literature, though the format eventually declined due to a lack of subscribers.", "Authors preferred the three-volume format because it allowed them to charge libraries triple the price, although this practice ended when single-volume books became popular."], 1], ["The expansion of the railway network in Victorian Britain did more than just speed up travel; it fundamentally altered the nation's reading habits. Before the railway boom, books were generally expensive, heavy commodities intended for the private libraries of the wealthy or the quiet contemplation of the study. However, the railway created a new kind of captive audience: the commuter. Passengers found themselves sitting for hours with little to do, creating a demand for literature that was portable, entertaining, and, crucially, affordable. This led to the emergence of the railway library and the yellow-back, cheaply produced novels sold at station bookstalls, most notably by W.H. Smith. These books were often reprints of popular fiction, bound in straw boards with eye-catching illustrated covers designed to appeal to the traveler. Consequently, this commercial shift moved reading from the private parlor to the public sphere, democratizing literature and establishing the portable paperback as a staple of modern life.", ["The Victorian railway boom created a new demographic of travelers who demanded cheap, portable reading material, leading to the success of station bookstalls and the yellow-back novel, which helped democratize reading.", "W.H. Smith utilized the railway network to distribute surplus leather-bound books, ensuring that wealthy passengers maintained access to high-quality, expensive literature during their travels.", "Although yellow-back novels were introduced at station bookstalls, they were largely ignored by the public in favor of traditional volumes that were better suited for the quiet environment of a train carriage.", "The rise of the railway forced publishers to move away from fiction and focus solely on travel guides and timetables, as commuters had little time to concentrate on complex narratives."], 0], ["Prior to the mid-19th century, literature produced specifically for children was largely utilitarian and deeply moralistic. The primary objective of such texts was rarely to entertain, but rather to instruct young minds in religious piety and proper conduct. However, the Victorian era witnessed a profound transformation in how childhood was perceived, no longer merely a preparatory stage for adulthood, but a distinct phase of life characterized by innocence and wonder. This philosophical shift, coupled with advancements in printing technology, catalyzed what is now known as the Golden Age of children's literature. The watershed moment arguably arrived in 1865 with the publication of Lewis Carroll's Alice's Adventures in Wonderland. Unlike its predecessors, this narrative lacked a clear moral lesson and instead celebrated nonsense, fantasy, and the sheer joy of imagination. Its massive commercial success signaled to publishers that a lucrative market existed for children's entertainment. Consequently, the latter half of the century saw an explosion of fantasy novels and adventure stories, often accompanied by intricate illustrations, solidifying the book as a source of pleasure rather than just a tool for discipline.", ["The 19th century introduced printing advancements that allowed children to write their own stories, moving away from the adult-authored moralistic tales that had previously dominated the market.", "Victorian literature for children shifted from didactic moral instruction to imaginative entertainment, driven by changing views on childhood and the success of fantasy works like Alice's Adventures in Wonderland.", "Despite the popularity of Alice's Adventures in Wonderland, the Golden Age of children's literature was primarily defined by a reinforced focus on religious piety and proper conduct to counter the corrupting influence of fantasy.", "Lewis Carroll's work was significant because it was the first to lower the cost of books for the working class, allowing the genre of children's literature to expand beyond the wealthy elite for the first time."], 1], ["When we survey the reading habits of the 19th century, the enduring fame of great novelists often overshadows a parallel phenomenon: the explosive popularity of natural history. This was not a period where science was locked away in laboratories; rather, it was a time of intense public engagement with the natural world. Activities like fossil hunting and fern collecting were fashionable pastimes for the middle classes, driving a demand for information. Publishers responded to this curiosity by printing accessible scientific volumes that competed commercially with the era's fiction. Crucially, the boundary between the professional scientist and the amateur naturalist was far more porous than it is today. Seminal scientific works were written to be understood by the layperson and were devoured by a public eager to understand their changing world. Thus, the literary marketplace of the period was defined as much by its intellectual curiosity about nature as by its appetite for stories.", ["19th-century publishing was dominated by fiction, as scientific texts were generally too academic for the layperson to understand or enjoy.", "While novels were culturally significant, there was a simultaneous and widespread public demand for accessible scientific literature and natural history.", "The craze for collecting natural specimens in the 19th century eventually caused a decline in the popularity of traditional novels.", "Publishers forced scientists to write for the general public to compete with novelists, despite the scientists' reluctance to engage with amateurs."], 1], ["For a long time, astronomers assumed that the planets in our solar system formed in their current positions and stayed there. This static model, however, struggles to explain a glaring anomaly observed in the wider galaxy: the high prevalence of Super-Earths orbiting close to their stars. These planets, larger than Earth but smaller than Neptune, are common elsewhere but entirely missing from our own system. To account for this, researchers have proposed the Grand Tack hypothesis. It suggests that the early solar system was far more chaotic than previously thought. In this scenario, a young Jupiter migrated inward toward the Sun, disrupting the orbits of early planetary building blocks and effectively clearing the inner solar system of material. This movement would have prevented the formation of Super-Earths. Crucially, the subsequent formation of Saturn created a gravitational resonance that pulled Jupiter back out to its current location. This retreat left behind a depleted band of debris from which the smaller, terrestrial planets, Mercury, Venus, Earth, and Mars, eventually coalesced. Essentially, Jupiter's chaotic journey may be the primary reason our solar system has its unique architecture.", ["The static model of formation remains the most accurate explanation, as the commonality of Super-Earths in other galaxies suggests Jupiter remained stationary.", "The Grand Tack hypothesis explains the absence of Super-Earths in our system by proposing that Jupiter migrated inward to clear material before being pulled back by Saturn.", "Jupiter's migration is believed to have initially created Super-Earths in the inner solar system, which were later destroyed by Saturn's gravitational influence.", "Unlike other systems, our solar system formed without chaotic migration, allowing Earth and Mars to develop from the debris of destroyed gas giants."], 1], ["When we look at the sociology of crime, we often assume that deviance is simply a violation of agreed-upon rules. However, interactionist sociologists introduced a concept known as labeling theory, which shifts the focus from the offender's specific action to society's reaction. The core argument is that no act is inherently deviant; it only becomes so when others apply that label. The theory distinguishes between primary deviance, isolated acts of rule-breaking that act as a mere catalyst, and secondary deviance, which is the result of the individual internalizing the label of criminal placed upon them by authorities. Once a person is stigmatized by the justice system, this label ultimately becomes their master status, overshadowing other identities like parent or employee. Ironically, the theory suggests that formal social control mechanisms, essentially the police and courts, can actually amplify deviance. By excluding these individuals from conventional opportunities, society pushes them toward criminal subcultures, creating a self-fulfilling prophecy where the labeled individual embraces the very behavior the system tried to prevent.", ["Labeling theory argues that the judicial system successfully reduces crime rates by swiftly identifying offenders and preventing them from integrating with criminal subcultures.", "Deviance is not inherent in an act but is constructed by society's reaction, which can stigmatize individuals and paradoxically drive them further into criminal behavior.", "Primary deviance is considered the most dangerous phase of criminal behavior because isolated acts of rule-breaking inevitably lead to a permanent master status.", "Sociologists believe that deviance is defined strictly by the severity of the rule broken, and that social exclusion is a necessary tool for maintaining conventional order."], 1], ["When we look at the complexity of the chemical world, we must ask where the atomic building blocks originated. The prevailing cosmological view is that the Big Bang was responsible for only the very lightest elements, predominantly hydrogen and helium. It was not a factory for the complex chemistry we see today. Instead, the universe had to wait for the formation of stars to act as nuclear forges. Throughout a star's lifespan, the intense pressure and heat in its core fuse simple atoms into heavier ones, synthesizing carbon, nitrogen, and oxygen, the very elements essential for life, continuing this process up until iron is formed. However, the creation of elements heavier than iron, such as gold or uranium, requires energy levels that normal stellar fusion cannot sustain. These materials are only produced during the cataclysmic death of a massive star, known as a supernova. Consequently, the atoms that constitute the earth and our own bodies are recycled material, forged in the hearts of ancient stars and scattered by their explosive deaths.", ["The Big Bang created all the necessary elements for life, but stars and supernovae were primarily responsible for distributing these elements across the universe to form planets.", "Although the Big Bang produced light elements, heavier elements like carbon formed within stars, and the heaviest metals required the extreme conditions of supernovae to be created.", "Stars generate energy by fusing iron into heavier elements like gold and uranium, a process that eventually leads to the star's explosion and the creation of hydrogen.", "The chemical composition of the human body suggests it was formed directly from the Big Bang, as stars are only capable of producing light elements like hydrogen and helium."], 1], ["When we gaze up at the night sky, we are looking at a vast ocean of stars. Statistically speaking, given that there are billions of galaxies containing trillions of stars, the mathematical odds suggest that Earth should not be unique. We should, in theory, be surrounded by active, communicative neighbors. This leads us to the famous Fermi Paradox, named after physicist Enrico Fermi. The core contradiction is simple yet disturbing: if the probability of extraterrestrial life is so high, why haven't we found any evidence of it yet? Where is everybody? Scientists have proposed numerous solutions to this puzzle. Some argue that while simple microbial life might be common, intelligent life is exceedingly rare, perhaps blocked by a Great Filter that prevents civilizations from advancing to the point of interstellar travel. Others suggest that advanced societies inevitably destroy themselves through technology or war before they can reach out. There is also the possibility that they are observing us silently, or that our methods of listening are simply too primitive to pick up their signals. Ultimately, the silence of the universe remains one of our greatest scientific mysteries.", ["Fermi's theory proves that intelligent life exists but chooses to remain silent to avoid contact with primitive civilizations like ours.", "The Fermi Paradox outlines the conflict between the high statistical likelihood of alien life and the total lack of contact, leading to various theories about the rarity or longevity of civilizations.", "Statistics indicate that Earth is likely the only planet capable of supporting life, which explains why we have not received any interstellar signals.", "The primary consensus among scientists is that we cannot detect alien life solely because our current listening technology is flawed and outdated."], 1], ["When we look at the trajectory of the modern automotive industry, the shift towards electrification is undeniable. Manufacturers are pouring billions into battery technology and phasing out internal combustion engines. Yet, a critical hurdle remains that threatens to stall this momentum: the charging ecosystem. While early adopters were willing to tolerate the inconvenience of sparse charging points, the mass market demands reliability and convenience comparable to gas stations. Currently, we face a fragmented landscape with inconsistent plug standards, varying charging speeds, and a lack of infrastructure in rural areas and multi-unit housing. This disconnect has perpetuated range anxiety among consumers. Consequently, the conversation is shifting from simply building better cars to constructing a robust energy grid. Without a unified strategy involving both government policy and private investment to expand and standardize charging networks, the ambitious timelines for banning fossil fuel vehicles may prove unrealistic.", ["The primary focus of the automotive industry is to develop faster electric cars to appeal to early adopters, as government policies have already solved the infrastructure issues in urban areas.", "Despite the push for electrification and investment in vehicle tech, the lack of a standardized and reliable charging infrastructure poses a major barrier to mass market adoption and future targets.", "Range anxiety has been largely eliminated by recent investments in battery technology, allowing manufacturers to phase out internal combustion engines faster than originally anticipated.", "The transition to electric vehicles is failing because consumers in multi-unit housing refuse to buy cars that cannot be charged at gas stations, forcing a return to fossil fuels."], 1], ["For decades, the global economy has largely functioned on a linear model, often described as take-make-waste. We extract raw materials, manufacture goods, and eventually discard them. This system relies on the assumption that cheap, easily accessible materials will always be available and that the environment can endlessly absorb waste. However, we are reaching the physical limits of this approach. The alternative gaining traction is the circular economy. This model moves away from consumption and towards restoration. It involves designing products that are built to last, can be easily repaired, or are fully recyclable, effectively keeping resources within the economy even after a product's life ends. It is a misconception to view this merely as improved waste management. Rather, it represents a systemic shift that decouples economic growth from resource constraints. For businesses, this transition mitigates the risks associated with fluctuating commodity prices and supply chain disruptions, proving that environmental responsibility can align with financial resilience.", ["The circular economy is primarily an advanced recycling strategy designed to manage the excess waste generated by the traditional linear industrial model.", "By shifting from a linear model to a circular one where products are restored and reused, the economy can grow without depending on finite resource extraction.", "While the circular economy benefits the environment, the linear model remains the only way to ensure financial resilience and stable commodity prices.", "The linear economy assumes resources are finite, whereas the circular economy allows for unlimited consumption by mimicking natural biological cycles."], 1], ["One of the most persistent criticisms leveled against situational crime prevention, measures like CCTV cameras or target hardening, is the concept of displacement. The argument is essentially that determined offenders aren't actually stopped; they simply move their activities to a different neighborhood, a different time, or a different method. Critics suggest that while a specific location is secured, the overall volume of crime remains constant. However, empirical research paints a more nuanced picture. While some displacement can occur, it is rarely total. In fact, studies often identify a diffusion of benefits, where the deterrent effect spills over into surrounding areas not strictly covered by the intervention. Offenders, uncertain about the scope of the security, tend to avoid the wider vicinity. Thus, rather than just pushing crime around the map, these interventions often yield a net reduction in criminal activity, refuting the idea that displacement is inevitable or absolute.", ["Situational crime prevention is often criticized for merely displacing crime, but research shows benefits can extend to adjacent areas, leading to an overall reduction.", "The concept of displacement proves that situational measures like CCTV are ineffective because offenders will always find a new location or method.", "While diffusion of benefits occurs, the primary outcome of target hardening is that crime moves to less protected neighborhoods, keeping overall rates static.", "Critics argue that situational prevention fails because offenders are irrational, but studies show that uncertainty about security scope completely stops all local crime."], 0]], "smw": [["Many advocates of renewable energy view biofuels as a critical component in the transition away from fossil fuels. Since these fuels are produced from organic material, they are theoretically carbon-neutral. Yet, there is a significant ethical dilemma regarding land use. If expansive tracts of fertile soil are dedicated solely to growing crops for ethanol or biodiesel, there is less land available for sustenance farming. Consequently, economists predict that this shift will cause a sharp increase in", ["energy reserves", "food prices", "global temperatures", "farming subsidies"], 1], ["The romantic view of Shakespeare depicts a solitary genius working in isolation to craft his masterpieces. However, the commercial demands of the early modern stage often required a faster output than one person could sustain. By analyzing vocabulary frequency and grammatical quirks, scholars have detected stylistic shifts within individual plays that point to multiple authors. For example, in The Two Noble Kinsmen, the verse style changes abruptly between scenes. This implies that for some of his output, Shakespeare was actually", ["writing in collaboration", "ignoring audience preferences", "struggling to find inspiration", "copying from history books"], 0], ["Concrete is the backbone of modern infrastructure, yet it suffers from a fundamental flaw: it cracks under stress. These fissures allow moisture to penetrate and corrode the steel reinforcement, compromising stability. To counter this, researchers have engineered a new type of concrete containing dormant bacteria. When cracks form and water seeps in, the bacteria awaken and generate limestone, sealing the gap. This autonomous repair process means that in the future, our bridges and roads could essentially heal themselves without", ["creating waste", "human intervention", "increasing costs", "government oversight"], 1], ["One of the most striking aspects of Shakespeare's stagecraft is the use of verbal scenery. In the open-air playhouses of the time, there were no painted backdrops to indicate a forest or a castle, and no lighting effects to simulate darkness. Consequently, the atmosphere had to be generated entirely through the dialogue. Characters described the environment in vivid detail, prompting the spectators to visualize the surroundings themselves. Thus, the lack of physical sets meant that the world of the play was built not on the wooden boards, but in the", ["printed text of the script", "imagination of the audience", "costumes of the players", "strict rules of the theater"], 1], ["Educational theorists often distinguish between the mechanics of decoding and the ultimate goal of literacy. Initially, a child's mental energy is consumed by translating visual symbols into sounds. As this process becomes effortless and automatic, their cognitive resources are liberated to focus on higher-level meaning. If a reader must consciously pause to decipher every word, the flow is interrupted and the overall meaning is lost. Therefore, fluent decoding is considered a necessary condition for successful", ["visual design", "reading comprehension", "public speaking", "social interaction"], 1], ["Implementing sustainable infrastructure requires balancing energy production with nature conservation. Unlike traditional thermal plants, which have a relatively small physical footprint, green energy installations often cover vast territories to capture diffuse resources. This extensive land use can encroach on wilderness areas, fragmenting habitats and impeding migratory paths. Consequently, biologists warn that without careful siting, the drive for clean energy could inadvertently harm", ["economic growth", "local wildlife", "grid reliability", "atmospheric stability"], 1], ["Hydroelectric power is widely regarded as a reliable source of renewable energy, offering a consistent output that wind and solar cannot always guarantee. However, the creation of reservoirs for these plants often requires flooding large areas, which can displace communities and destroy wildlife habitats. Furthermore, dams block natural river paths, affecting fish migration. Because of these significant drawbacks, critics emphasize that the benefits of clean energy must be weighed against the potential for", ["increased carbon emissions", "severe ecological damage", "reduced energy reliability", "technological improvement"], 1], ["One of the primary criticisms of renewable energy sources, such as wind and solar, is their variable nature. Since electricity production depends on environmental conditions rather than human control, there are periods of surplus and periods of deficit. When production exceeds demand, that excess power is often wasted unless it can be captured for later use. Therefore, a critical component of a modern, sustainable grid is not just generation infrastructure, but efficient systems for", ["predicting weather", "storing energy", "measuring pollution", "increasing consumption"], 1], ["While the push for plant-based fuels offers a promising avenue for reducing our reliance on traditional oil, the scalability of this solution presents a significant challenge. Dedicating millions of hectares to crops intended for engines rather than people places immense pressure on agricultural resources. Economists observe that as farmers switch their focus to these profitable fuel crops, the reduced availability of grain for human consumption inevitably leads to a sharp increase in", ["oil imports", "food prices", "farming efficiency", "energy consumption"], 1], ["Although the transition to sustainable infrastructure is vital, it often generates friction regarding land use. Large-scale developments, such as bioenergy crops, occupy vast territories, which can fragment sensitive habitats and disrupt wildlife corridors. Planners must therefore balance the urgent need for clean power with the preservation of local biodiversity. Experts warn that focusing solely on emissions might solve one environmental problem while creating", ["a surplus", "another", "efficiency", "the demand"], 1], ["One of the most enduring legacies of Shakespeare is his expansion of the English vocabulary. He is credited with introducing hundreds of words we use today, from addiction to swagger. This linguistic creativity was likely born of necessity. The existing lexicon of the Elizabethan era was often too limited to convey the subtle psychological shifts of his characters. He required a language that was as flexible and complex as the human mind. So, when the standard vocabulary fell short of his needs, he", ["returned to historical sources", "simply coined a new term", "simplified the dramatic action", "abandoned the English language"], 1], ["In the context of ancient Greek tragedy, the Chorus served a function that is quite distinct from modern supporting roles. They were not simply bystanders but operated as a collective voice, reacting to the unfolding drama with chants and dance. While the protagonists on stage were often driven by personal ambition or blindness, the Chorus stood apart to interpret these events for the audience. Essentially, they represented the social norms and ethical values of the", ["wider community", "tragic hero", "private individual", "foreign enemy"], 0], ["There is a growing enthusiasm for biodegradable plastics as a solution to global waste. However, a significant misunderstanding exists regarding how these materials actually function. Most bioplastics require high temperatures found only in industrial composting facilities to break down effectively. When they are discarded in cold seawater or buried in standard landfills without oxygen, the degradation process stalls completely. In these environments, rather than vanishing harmlessly, these eco-friendly substitutes remain intact and pose the same long-term ecological risks as the conventional petroleum-based products they were designed to", ["preserve", "replace", "manufacture", "recycle"], 1], ["Modern stylistic analysis has forced scholars to rethink the romantic notion of the singular playwright. By feeding texts into algorithms that detect the frequency of function words, researchers have identified shifts in style within a single play that point to multiple authors. For instance, parts of Macbeth show the fingerprints of Thomas Middleton. This suggests that for the King's Men company, playwriting was often treated not as a private act, but as a", ["purely theoretical exercise", "shared collaborative enterprise", "form of political protest", "solitary creative struggle"], 1], ["Literary critics have often found themselves at odds when defining Shakespeare's problem plays, works that sit uncomfortably between tragedy and comedy. In plays like Measure for Measure, the tone shifts rapidly from dark psychological drama to farce, leaving the audience disoriented. Unlike the comedies, which typically restore social order through marriage, these plays offer conclusions that feel artificial or forced. The play doesn't resolve the conflict so much as simply stop it. By refusing to provide a neat ending, Shakespeare compels us to acknowledge that in the real world, complex moral issues rarely have", ["dramatic tension", "simple resolutions", "political bias", "audience appeal"], 1], ["As freshwater scarcity becomes a pressing global concern, desalination technology is increasingly viewed as a vital solution for arid coastal regions. By removing salt from seawater, nations can secure a reliable water supply independent of rainfall. However, the process is not without environmental costs. It produces a highly concentrated brine byproduct, which, if released directly back into the ocean, can severely damage local", ["weather patterns", "marine ecosystems", "energy grids", "industrial outputs"], 1], ["In analyzing Elizabethan plays, we often categorize dialogue based on social status: verse for kings and prose for clowns. However, this distinction is far from rigid. Shakespeare, for instance, frequently disrupts this convention to signal psychological shifts. When a noble character switches suddenly from the rhythmic structure of verse to the jagged, unstructured sentences of prose, it is not a demotion in status. Rather, it signifies a fracturing of the mind. The rigid constraints of poetry can no longer hold the raw intensity of their", ["social interactions", "emotional turmoil", "comedic scenes", "historical context"], 1], ["During Shakespeare's career, outbreaks of the plague frequently forced London's theaters to close, sometimes for over a year. With the stage unavailable, Shakespeare could not rely on the box office and instead turned his hand to narrative poetry. Works like Venus and Adonis were composed during these hiatuses, designed for the printing press rather than the stage. This transition fundamentally altered the consumption of his art, shifting it from a communal event to the experience of an", ["acting troupe", "individual reader", "illiterate public", "overseas market"], 1], ["Concrete is susceptible to cracking over time, allowing moisture to reach and corrode the steel reinforcement bars within. To address this vulnerability, material scientists have developed a form of self-healing concrete containing dormant bacteria. Upon contact with infiltrating water, these microorganisms produce limestone, effectively sealing the cracks from the inside. This biological innovation reduces the need for external maintenance and significantly increases the", ["amount of reinforcement", "structure's service life", "architectural complexity", "risk of fracture"], 1], ["A significant challenge facing the renewable energy sector is the issue of intermittency. Unlike traditional power plants that run continuously, wind and solar sources depend entirely on fluctuating weather patterns, often leading to gaps in supply. Consequently, the industry is prioritizing the development of high-capacity storage systems. Experts warn that without efficient batteries to bridge these gaps, the prospect of a completely green power grid will", ["become a reality", "remain out of reach", "increase efficiency", "harm the environment"], 1], ["As the global push for green technology accelerates, particularly within the electric vehicle sector, there is a growing concern regarding the supply chain for essential components. Most modern batteries rely heavily on lithium and cobalt, minerals that are difficult to extract and geographically concentrated. This creates significant vulnerability for manufacturers. To prevent future production bottlenecks, scientists are actively experimenting with sodium and other abundant materials to minimize reliance on these", ["fossil fuels", "scarce resources", "complex systems", "green initiatives"], 1]]};

function ringSvg(pct,color){const r=32,c=2*Math.PI*r;const o=c*(1-Math.min(pct,1));return '<svg viewBox="0 0 80 80" width="75" height="75"><circle cx="40" cy="40" r="'+r+'" fill="none" stroke="#EDEFF2" stroke-width="5"/><circle cx="40" cy="40" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="5" stroke-dasharray="'+c.toFixed(2)+'" stroke-dashoffset="'+o.toFixed(2)+'" stroke-linecap="round" transform="rotate(-90 40 40)"/><text x="40" y="43" text-anchor="middle" font-size="17" font-weight="700" fill="'+color+'">'+(Math.min(pct*100,100)|0)+'%</text></svg>';}

function pickVoice(){const vs=speechSynthesis.getVoices();if(!vs.length)return;const enUS=vs.filter(v=>/^en-US/i.test(v.lang));const pref=['Samantha','Google US English','Enhanced','Daniel','Victoria','Microsoft Aria','Emma','Ava','Allison','Natural','Serena','Arthur','Fred'];let best=null;for(const k of pref){const f=enUS.find(v=>v.name.indexOf(k)>=0);if(f){best=f;break;}}if(!best)best=enUS.find(v=>/premium|enhanced|neural/i.test(v.name))||enUS[0]||vs.find(v=>/^en/i.test(v.lang))||null;voice=best;if(voice)save('pte_voice',voice.voiceURI);}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
let speechReady=false;
function speak(t){if(!('speechSynthesis' in window)){alert('此浏览器不支持朗读，请用 Safari/Chrome');return;}if(!speechReady){const d=new SpeechSynthesisUtterance('');d.volume=0;speechSynthesis.speak(d);speechReady=true;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.92;u.pitch=1;if(voice)u.voice=voice;speechSynthesis.speak(u);}catch(e){}}

let _sr=null;
function srSplit(t){const raw=(t||'').replace(/\s+/g,' ').trim();if(!raw)return [];const parts=raw.match(/[^.!?]+[.!?]*\s*/g)||[raw];return parts.map(s=>s.trim()).filter(s=>s.length);}
function srStop(){if(_sr){try{speechSynthesis.cancel();}catch(e){}try{if(_sr.panel&&_sr.panel.parentNode)_sr.panel.parentNode.removeChild(_sr.panel);}catch(e){}_sr=null;}}
function srStart(text, mountEl){
  srStop();
  const sents=srSplit(text);
  if(!sents.length){speak(text);return;}
  const panel=document.createElement('div');panel.className='sr-panel';
  panel.innerHTML='<div class="sr-ctrl">'
    +'<button class="sr-btn" data-act="prev" title="上一句">⏮</button>'
    +'<button class="sr-btn" data-act="play" title="播放/暂停">⏯</button>'
    +'<button class="sr-btn" data-act="next" title="下一句">⏭</button>'
    +'<button class="sr-btn" data-act="restart" title="重头播放">⟳</button>'
    +'<select class="sr-rate" title="语速"><option value="0.8">0.8x</option><option value="1" selected>1.0x</option><option value="1.2">1.2x</option></select>'
    +'<span class="sr-prog"></span></div><div class="sr-list"></div>';
  (mountEl||document.body).appendChild(panel);
  const list=panel.querySelector('.sr-list');
  list.innerHTML=sents.map((s,i)=>'<div class="sr-sent" data-i="'+i+'">'+s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</div>').join('');
  const rateSel=panel.querySelector('.sr-rate');
  const playBtn=panel.querySelector('[data-act="play"]');
  const prog=panel.querySelector('.sr-prog');
  prog.textContent='0 / '+sents.length;
  let cur=-1, playing=false, paused=false;
  function setCur(i){cur=i;list.querySelectorAll('.sr-sent').forEach(el=>el.classList.toggle('sr-cur',+el.dataset.i===i));const el=list.querySelector('.sr-sent[data-i="'+i+'"]');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'});prog.textContent=(i<0?'':(i+1)+' / ')+sents.length;}
  function speakOne(i){cur=i;setCur(i);const r=parseFloat(rateSel.value)||1;const u=new SpeechSynthesisUtterance(sents[i]);u.lang='en-US';u.rate=r;u.pitch=1;if(voice)u.voice=voice;u.onend=()=>{if(!playing)return;if(cur+1<sents.length){speakOne(cur+1);}else{playing=false;paused=false;playBtn.textContent='⏯';setCur(-1);}};u.onerror=()=>{playing=false;playBtn.textContent='⏯';};if(!speechReady){const d=new SpeechSynthesisUtterance('');d.volume=0;speechSynthesis.speak(d);speechReady=true;}speechSynthesis.cancel();speechSynthesis.speak(u);}
  function play(){if(cur<0){playing=true;paused=false;playBtn.textContent='⏸';speakOne(0);}else{playing=true;paused=false;playBtn.textContent='⏸';speechSynthesis.resume();}}
  function pause(){playing=false;paused=true;speechSynthesis.pause();playBtn.textContent='⏯';}
  playBtn.onclick=()=>{if(playing){pause();}else{play();}};
  panel.querySelector('[data-act="prev"]').onclick=()=>{if(sents.length){playing=true;paused=false;playBtn.textContent='⏸';speakOne(Math.max(0,cur<0?0:cur-1));}};
  panel.querySelector('[data-act="next"]').onclick=()=>{if(sents.length){playing=true;paused=false;playBtn.textContent='⏸';speakOne(Math.min(sents.length-1,cur<0?0:cur+1));}};
  panel.querySelector('[data-act="restart"]').onclick=()=>{playing=true;paused=false;playBtn.textContent='⏸';speakOne(0);};
  rateSel.onchange=()=>{save('pte_rate',rateSel.value);if(playing&&!paused&&cur>=0)speakOne(cur);};
  _sr={panel:panel};
}

// 录音（含权限引导 / 兼容性检测 / 失败时替代方案）
function attachRec(btnId){
  const btn=document.getElementById(btnId);
  if(!btn)return;
  let rec=null,chunks=[],stream=null,recording=false,explained=false;
  function secureCtx(){return location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1';}
  // 麦克风不可用时，给出可立即落地的替代练习方案（录音不是唯一路径）
  function recFallback(reason){
    alert('暂时无法使用麦克风录音。\n\n原因：'+reason+'\n\n替代练习方案（同样有效）：\n· 用 🔊 分句朗读，听标准发音后大声跟读\n· 用「听标准发音 / 模板」对比，自我纠正流利度与重音\n· 或先用 iPhone 自带「语音备忘录」录完再回听\n\n若想启用录音：请改用本应用的 HTTPS 在线链接版，并在系统「设置 → 隐私与安全性 → 麦克风」中允许本浏览器。');
  }
  btn.onclick=()=>{
    if(!recording){
      if(!secureCtx()){recFallback('当前打开方式不是安全连接（HTTPS），浏览器禁止访问麦克风。');return;}
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){recFallback('当前浏览器不支持麦克风录音接口。');return;}
      // 首次点击先说明用途与授权流程，降低用户对「要权限」的疑虑
      if(!explained){
        explained=true;
        if(!confirm('即将请求「麦克风」权限。\n\n用途：仅在本机录制你的发音用于自我纠音，不上传、不留存到任何服务器。\n\n· 点「允许」→ 系统会再弹一次授权，选允许即可开始\n· 点「取消」→ 跳过录音，可继续用 🔊 朗读跟读'))return;
      }
      navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{
        stream=s;const mt=(MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported('audio/webm'))?'audio/webm':'';
        rec=mt?new MediaRecorder(s,{mimeType:mt}):new MediaRecorder(s);
        chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
        rec.onstop=()=>{const blob=new Blob(chunks,{type:rec.mimeType||'audio/webm'});const url=URL.createObjectURL(blob);
          const a=document.createElement('audio');a.controls=true;a.src=url;a.style.width='100%';a.style.marginTop='10px';btn.insertAdjacentElement('afterend',a);
          if(stream)stream.getTracks().forEach(t=>t.stop());};
        rec.start();recording=true;btn.textContent='⏹ 停止并回放';btn.classList.add('recording');
      }).catch(e=>{recFallback('你拒绝了麦克风授权，或系统未授予权限。');});
    }else{rec.stop();recording=false;btn.textContent='🎤 再录一次';btn.classList.remove('recording');}
  };
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// SWT 一句话总结：关键内容词覆盖率（离线，对照范文）
function gradeSWT(user, model){
  const keys=sstKeys(model); if(!keys.length)return {pct:0,keys:[],hit:[]};
  const u=(user||'').toLowerCase();
  const hit=keys.filter(k=>new RegExp('\\b'+k.replace(/[^a-z0-9]/g,'')+'\\b','i').test(u));
  const pct=keys.length?Math.round(hit.length/keys.length*100):0;
  return {pct,keys,hit};
}

// 读写（FIB 填空 + 写作模板）
let vq=[], vi=0, rwTab='fib', wIdx=0, fibIdx=0;
function buildVQ(){
  const wn=weekNum(), ws=(wn-1)*WPER, we=wn*WPER;
  // Review-due words go first, interval depends on difficulty (easy 5d / mid 3d / hard 1d)
  const rv=DATA.vocab.map((_,i)=>i).filter(i=>i in knownV&&knownV[i]<reviewCut(i));
  const tw=DATA.vocab.map((_,i)=>i).filter(i=>i>=ws&&i<we&&!(i in knownV));
  const ot=DATA.vocab.map((_,i)=>i).filter(i=>(i<ws||i>=we)&&!(i in knownV));
  const kn=DATA.vocab.map((_,i)=>i).filter(i=>i in knownV&&knownV[i]>=reviewCut(i));
  vq=rv.concat(tw).concat(ot).concat(kn); vi=0;
}
// WE 官方评分维度自评（Pearson 量规，来源：PTE Academic Essay Score Guide / pearsonpte.com）
function weFormScore(w){ if(w>=200&&w<=300)return 2; if((w>=120&&w<200)||(w>300&&w<=380))return 1; return 0; }
function weCompletion(obj){ let sum=0,ms=0; DATA.we_rubric.forEach((t,i)=>{ms+=t[1]; if(obj&&obj[i]!=null)sum+=obj[i];}); return ms?Math.round(sum/ms*100):0; }
function weRubricHtml(idx){

    const name=t[0],max=t[1],desc=t[2],bands=t[3],isForm=(i===1);
    h+='<div class="rub-trait"><div class="rub-name">'+name+' <span class="rub-scale-tag">0–'+max+'</span></div><div class="rub-desc">'+desc+'</div>';

    else {
      h+='<div class="rub-btns" data-t="'+i+'">';
      for(let v=0;v<=max;v++){ h+='<button class="rub'+(saved[i]===v?' on':'')+'" data-v="'+v+'">'+v+'</button>'; }
      h+='</div><div class="rub-band" id="rubBand'+i+'">'+(bands&&saved[i]!=null?bands[saved[i]]:'')+'</div>';
    }
    h+='</div>';
  });
  h+='<div class="rub-foot"><b id="rubScore">自评完成度 —</b><div class="hint" style="margin-top:4px">对照 Pearson 官方 7 维量规自评（非机器分）；权威分数以官方模考为准。</div></div></div>';
  return h;
}
function practiceBar(){

function wireRO(item, keyIdx, onGrade){
  let placed=[];
  body.querySelectorAll('.ro-opt').forEach(function(btn){btn.onclick=function(){
    if(btn.disabled)return; const i=+btn.dataset.i; placed.push(i);
    btn.disabled=true; btn.style.opacity=.4;

    chip.textContent=(placed.length)+'. '+item[1][i]; document.getElementById('roOrder').appendChild(chip);
  };});
  $('#roChk').onclick=function(){
    if(placed.length<item[1].length){alert('请先按顺序点完全部句子');return;}
    let ok=0; placed.forEach(function(v,pos){if(v===pos)ok++;});
    const pct=Math.round(ok/item[1].length*100);

  const cls={'⭐⭐⭐ 核心':'hint','⭐⭐ 重要':'','⭐ 了解':'','❌ 可放弃':''};
  function card(q){
    const icon=q[3].startsWith('⭐⭐⭐')?'🔥':q[3].startsWith('⭐⭐')?'📌':q[3].startsWith('⭐')?'👀':'⏭';

// FIB 阅读填空：从真实机经段落抽词挖空，自动判分
function seeded(seed){let s=(seed%2147483647);if(s<=0)s+=2147483646;return ()=>(s=s*16807%2147483647)/2147483647;}
const FIBSTOP=new Set("the a an and or but of to in on for with is are was were be been being this that these those it its as by from at we you they he she his her their our your my i not no can will would should could may might must do does did has have had also more most very about into over under than then them what when where which who whom whose why how all any each few other some such no nor only own same so too s t just don don now if at by".split(" "));
function fibOf(text, seed){
  const words=text.split(/\s+/);
  let cand=[];
  for(let i=0;i<words.length;i++){const w=words[i].toLowerCase().replace(/[^a-z0-9]/g,'');if(w.length>5 && !FIBSTOP.has(w)) cand.push(i);}
  const rnd=seeded(seed+1);
  for(let i=cand.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=cand[i];cand[i]=cand[j];cand[j]=t;}
  const pick=cand.slice(0,6);
  const blanks={}; pick.forEach(i=>blanks[i]=words[i].replace(/[^A-Za-z0-9]/g,''));
  return {words,blanks};
}

function pteBand(score){score=Math.max(10,Math.min(90,score));return PTE_BANDS.find(b=>score>=b.lo&&score<=b.hi)||PTE_BANDS[PTE_BANDS.length-1];}
// 练习 0–100 → 训练表现参考区间（非官方预测；启发式，锚定官方档位边界，仅供进度参考）
function pteEquiv(p){
  p=Math.max(0,Math.min(100,p));
  const pts=[[0,10],[55,50],[70,58],[80,65],[92,79],[100,90]];
  if(p>=100)return 90;
  for(let i=0;i<pts.length-1;i++){if(p<=pts[i+1][0]){const[t0,s0]=pts[i],[t1,s1]=pts[i+1];return Math.round(s0+(s1-s0)*(p-t0)/(t1-t0));}}
  return 10;
}
// 能力雷达 + 进步曲线（SVG）
function radarSvg(rec){
  const cx=130,cy=110,R=82,n=4;
  const axes=[['听',rec.听力||0],['说',rec.口语||0],['读',rec.阅读||0],['写',rec.写作||0]];
  const pt=(i,r)=>{const ang=-Math.PI/2 + i*2*Math.PI/n; return [cx+r*Math.cos(ang), cy+r*Math.sin(ang)];};
  let grid='';
  [0.25,0.5,0.75,1].forEach(g=>{ let p=''; for(let i=0;i<n;i++){const x=pt(i,R*g);p+=(i?'L':'M')+x[0].toFixed(1)+' '+x[1].toFixed(1);} grid+='<path d="'+p+'Z" fill="none" stroke="#E2E6EA" stroke-width="1"/>';});
  let labels=''; for(let i=0;i<n;i++){const x=pt(i,R+18);labels+='<text x="'+x[0].toFixed(1)+'" y="'+x[1].toFixed(1)+'" font-size="11" fill="#33495F" text-anchor="middle">'+axes[i][0]+' '+axes[i][1]+'</text>';}
  let poly=''; for(let i=0;i<n;i++){const x=pt(i,R*Math.min(1,axes[i][1]/100));poly+=(i?'L':'M')+x[0].toFixed(1)+' '+x[1].toFixed(1);}
  let tpath=''; for(let i=0;i<n;i++){const x=pt(i,R*Math.min(1,TARGET/100));tpath+=(i?'L':'M')+x[0].toFixed(1)+' '+x[1].toFixed(1);}
  const tgt='<path d="'+tpath+'Z" fill="none" stroke="#C0392B" stroke-width="1" stroke-dasharray="4 3" opacity=".55"/>';
  let dots=''; for(let i=0;i<n;i++){const x=pt(i,R*Math.min(1,axes[i][1]/100));dots+='<circle cx="'+x[0].toFixed(1)+'" cy="'+x[1].toFixed(1)+' " r="3" fill="#2C8C99"/>';}
  return '<svg width="100%" style="max-width:240px" viewBox="0 0 260 220">'+grid+tgt+labels+'<path d="'+poly+'Z" fill="rgba(44,140,153,.25)" stroke="#2C8C99" stroke-width="2"/>'+dots+'<text x="'+cx+'" y="'+(cy-R*Math.min(1,TARGET/100)-4).toFixed(1)+'" font-size="9" fill="#C0392B" text-anchor="middle">目标'+TARGET+'</text></svg>';
}
function lineSvg(h){
  const W=320,H=180,pad=30;
  const n=h.length, maxX=Math.max(n,2);
  const xat=i=>pad+(i)*((W-pad-10)/(maxX-1));
  const yat=v=>H-pad-(v/100)*(H-pad-14);
  const cols={L:'#2C8C99',S:'#B7791F',R:'#5E51A8',W:'#C0392B'};
  const labs={L:'听',S:'说',R:'读',W:'写'};
  let grid=''; for(let g=0;g<=4;g++){const yy=pad+(H-pad-14)*g/4; grid+='<line x1="'+pad+'" y1="'+yy.toFixed(1)+'" x2="'+(W-10)+'" y2="'+yy.toFixed(1)+'" stroke="#EDEFF2"/><text x="2" y="'+(yy+3).toFixed(1)+'" font-size="9" fill="#999">'+((4-g)*25)+'</text>';}
  let lines='';
  ['L','S','R','W'].forEach(k=>{ let p=''; h.forEach((r,i)=>{const x=xat(i),y=yat(r[k]||0);p+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}); lines+='<path d="'+p+'" fill="none" stroke="'+cols[k]+'" stroke-width="2"/>'; });
  let leg=''; ['L','S','R','W'].forEach(k=>{leg+='<span style="display:inline-block;margin-right:10px;font-size:11px;color:'+cols[k]+'">●'+labs[k]+'</span>';});
  return '<svg width="100%" style="max-width:340px" viewBox="0 0 '+W+' '+H+'">'+grid+lines+'</svg><div style="margin-top:4px">'+leg+'</div>';
}

const FUNC_WORDS=new Set("a an the and or but of to in on for with is are was were be been being this that these those it its as by from at we you they he she his her their our your my i not no can will would should could may might must do does did has have had also more most very".split(" "));
// WFD 逐词对齐：漏词 / 拼写 / 冠词介词等功能词错
function classifyWFD(typed, orig){
  const o=(orig||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
  const g=(typed||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(Boolean);
  let okc=0, miss=0, spell=0, func=0;
  const mx=Math.max(o.length,g.length);
  for(let k=0;k<mx;k++){const ow=o[k]||'', gw=g[k]||'';
    if(ow===gw){ if(ow)okc++; }
    else if(!gw){ if(ow)miss++; }
    else if(FUNC_WORDS.has(ow)&&FUNC_WORDS.has(gw)){ func++; }
    else { spell++; }
  }
  const pct=o.filter(Boolean).length?(okc/o.filter(Boolean).length*100|0):0;
  return {pct:pct, miss:miss, spell:spell, func:func};
}
function recCause(type, info){
  if(!causes[type])causes[type]={n:0};
  causes[type].n++;
  if(type==='WFD'){ causes[type].miss=(causes[type].miss||0)+info.miss; causes[type].spell=(causes[type].spell||0)+info.spell; causes[type].func=(causes[type].func||0)+info.func; }
  save('pte_causes',causes);
}

  } else if(it.type==='DI'){
    const d=DATA.di_topics[Math.floor(Math.random()*DATA.di_topics.length)]; diag.cur=d;
    q='<div class="ob-q"><div class="ph">'+it.title+' · '+it.tip+'</div><div style="font-size:15px;font-weight:600">'+d[0]+'</div><div style="font-size:13px;color:var(--muted);margin-top:4px">'+d[1]+'</div>'+rateHtml()+'</div>';
  }
  const last=diag.i===total-1;
  ob.innerHTML='<div class="ob-card"><div class="ob-prog">摸底进度 '+(diag.i+1)+' / '+total+'</div>'+q
    +'<button class="ob-btn" id="dNext" style="margin-top:6px">'+(last?'生成我的第一周计划 🎯':'下一题 →')+'</button></div>';
  const spk=document.getElementById('dSpk'); if(spk)spk.onclick=()=>speak(diag.cur);
  document.querySelectorAll('.ob-rate button').forEach(b=>b.onclick=()=>{diag.rating=+b.dataset.v;document.querySelectorAll('.ob-rate button').forEach(x=>x.classList.toggle('on',x===b));});
  document.getElementById('dNext').onclick=()=>{ recordDiag(it); if(last)finishDiag(); else {diag.i++;diag.rating=0;renderDiag();} };
}
function rateHtml(){ return '<div class="ob-rate">'+[1,2,3,4,5].map(v=>'<button data-v="'+v+'">'+v+'</button>').join('')+'</div><div class="hint" style="margin-top:0">1=很吃力，5=很顺</div>'; }
function recordDiag(it){
  if(it.type==='WFD'){ const v=document.getElementById('dAns').value; diag.ans.WFD=classifyWFD(v, diag.cur); }
  else if(it.type==='FIBR'){ const q0=diag.cur; let ok=0; q0.b.forEach((bl,k)=>{const sel=document.getElementById('fib'+k); if(sel&&+sel.value===bl[1])ok++;}); diag.ans.FIBR=Math.round(ok/q0.b.length*100); }
  else if(it.type==='MCSA'){ const m=diag.cur; const sel=document.querySelector('input[name=mc]:checked'); diag.ans.MCSA=(sel&&+sel.value===m[4])?100:0; }
  else if(it.type==='SST'){ const p=diag.cur; const keys=sstKeys(p[1]); const txt=document.getElementById('dAns').value.toLowerCase(); const hit=keys.filter(k=>new RegExp('\\b'+k.replace(/[^a-z0-9]/g,'')+'\\b','i').test(txt)); diag.ans.SST=keys.length?Math.round(hit.length/keys.length*100):0; }
  else if(it.type==='RA'||it.type==='RS'||it.type==='DI'){ diag.ans[it.type]=diag.rating||3; }
}
function genWeek1(weak){
  const core=['WFD','RS','RA','DI','FIB'];
  const tip={'WFD':'WFD 占听力分最高，每天先练','RS':'RS 是口语分骨架，每天复述','RA':'RA 决定发音分，每天朗读','DI':'DI 模板化提分快，每天描述','FIB':'FIB 阅读填空拉分，每天练'};
  const days=[];
  for(let d=1; d<=7; d++){
    const rot=core[(d-1)%core.length];
    const tasks=[ tip[weak]+'（你的薄弱项·重点）' ];
    if(rot!==weak) tasks.push(tip[rot]+'（核心轮换）');
    tasks.push('词汇 15 个（读写→词汇）');
    tasks.push(d%2===0?'SST 精听 1 篇（听力→SST）':'FIB 阅读填空 5 题（读写→FIB填空）');
    tasks.push('今日总时长控制在 25–30 分钟');
    days.push({date:addDays(todayStr(),d-1), tasks:tasks.map(t=>({t:t,done:false}))});
  }
  return {gen:Date.now(), weak:weak, days:days};
}
function finishDiag(){
  const a=diag.ans, scores=[];
  if(a.WFD)scores.push(['WFD',a.WFD.pct]);
  if(a.FIBR)scores.push(['FIB',a.FIBR.pct]);
  if(a.MCSA)scores.push(['MCSA',a.MCSA.pct]);
  if(a.SST)scores.push(['SST',a.SST.pct]);
  if(a.RA)scores.push(['RA',a.RA*20]);
  if(a.RS)scores.push(['RS',a.RS*20]);
  if(a.DI)scores.push(['DI',a.DI*20]);
  scores.sort((x,y)=>x[1]-y[1]);
  const weak=scores.length?scores[0][0]:'WFD';
  onplan=genWeek1(weak); save('pte_onplan',onplan);
  onboarded=1; save('pte_onboarded',1);
  const ob=document.getElementById('onboard');
  ob.innerHTML='<div class="ob-card"><div class="ob-logo">🎯</div><div class="ob-t">你的第一周计划已生成</div>'
    +'<div class="ob-s">摸底显示最薄弱的环节是 <b>'+weak+'</b>。已为你排好 7 天训练路径，每天约 25–30 分钟。</div>'
    +'<div class="ob-plan">'+onplan.days.map((dd,i)=>'<div class="day"><div class="dn">第 '+(i+1)+' 天 · '+dd.date+'</div>'+dd.tasks.map(t=>'<div class="dt">· '+t.t+'</div>').join('')+'</div>').join('')+'</div>'
    +'<button class="ob-btn" id="obGo">开始执行 →</button></div>';
  const g=document.getElementById('obGo'); if(g)g.onclick=()=>{ob.className=''; switchTab('today');};
}

// 今日页：展示摸底生成的第一周计划（今日重点）
function onplanCard(){
  if(!onplan||!onplan.days||!onplan.days.length) return '';
  const t=todayStr();
  let idx=onplan.days.findIndex(d=>d.date===t); if(idx<0)idx=0;
  const day=onplan.days[idx];
  let h='<div class="card"><span class="onboard-badge">📅 摸底生成 · 第一周计划</span>'
    +'<div class="ph">今日重点（第 '+(idx+1)+' 天）</div>';
  h+=day.tasks.map((tk,i)=>'<div style="display:flex;align-items:flex-start;gap:6px;padding:5px 0;font-size:13.5px;color:var(--slate)"><input type="checkbox" data-odi="'+i+'" '+(tk.done?'checked':'')+' style="margin-top:3px">'+tk.t+'</div>').join('');
  h+='<div class="hint" style="margin-top:6px">完整 7 天计划见「我的 → 我的第一周计划」。最薄弱项：'+onplan.weak+'。</div></div>';
  return h;
}
