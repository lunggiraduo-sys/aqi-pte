friend who did something special and think of them as their 'creative friend' who could help them solve any problem. This type of creativity training is called perspective shifting, in which the kids look at a problem through the eyes of someone else.", "The Second Plague Pandemic of the mid 14th century, also known as the Black Death, killed 30 to 60% of the European population and profoundly changed the course of European history.", "Increasing concentrations of greenhouse gases in the atmosphere from human activity traps heat within the climate system, warming air, the land surface, the oceans, and melting polar ice. Oceans do by far the most work, absorbing more than 90% of the excess human generated heat accumulated in the Earth's climate system, moderating atmospheric temperature rises.", "Climate change, deforestation, pollution, and overexploitation of natural resources are some of the major threats facing the natural environment. Addressing these challenges requires a comprehensive understanding of the complex interactions between humans and the natural environment, as well as a commitment to sustainable development and responsible environmental stewardship.", "3D printing is advancing rapidly, and the range of materials that can be used has expanded considerably. While the technology was previously limited to fast curing plastics, it has now been made suitable for slow curing plastics as well.", "The original cotton plants in Mexico look mostly the same but have wild bushes with flowers that change from light yellow to violet. Yet, when genes from genetically modified cotton are added, it really changes these native plants. It affects how they work and how they interact with insects.", "Schools host parent teacher conferences four times a year and it is important for families to attend. This is your chance to meet with teachers and ask questions about your child's progress. It can be helpful to write down questions ahead of time.", "Agricultural problems due to climate change of normal weather, water depletion and the collapse of soil have become big problems in all parts of the world. Many are now focusing on ethics and family farming as a way to combat these issues.", "Warm ocean currents make the climate warm and wet. Cool ocean currents make the climate colder and dry. The direction of prevailing winds from the sea bring moist air to the coastal areas and dry weather to inland areas. As a result, the climate of the areas near sea is moderate. Mountains receive more rainfall than low lying areas because the temperature on top of mountains is lower than the temperature at sea level.", "When buying a house, for example, it's best to let our unconscious mull over the many variables. But when we're picking stocks and shares, intuition often leads us astray. The trick is to determine when to lean on which part of the brain. And to do this, we need to think harder and smarter about how we think.", "In the past, naming English as a separate subject seemed relatively easy. The textbook selected and graded items of language which were put into content and then practiced intensively. New items were carefully controlled so that students could cope quite easily. Now English is used as a medium of instruction.", "Australians do speak English. However, for some tourists and travelers, it can be difficult to understand the slang. Also, the links between Australian and American English were seen to be very tenuous. At least some colloquialisms in Australian English do not exist in other types of English.", "Along with customary classes on subjects such as finance, accounting, and marketing, today's MBA students are enrolling on courses for environmental policy and stewardship. Indeed, more than half of business schools require a course in environmental sustainability or corporate social responsibility, according to a survey of 91 US business schools, published in October 2005.", "Children need to discover their own strengths and weaknesses in order to find fulfillment as adults in both work and play. Watching television does not lead to these discoveries; it only limits children's involvement in those real-life activities that might offer their abilities a genuine testing ground. And young children's need for fantasy is gratified far better by their own make-believe activities than by the adult-made fantasies they are offered on television.", "A key finding in this study was the extent to which property managers expressed frustration at the amount of property owners who are financially unable, or just unwilling, to pay for repairs and ongoing maintenance of their rental properties. Interior and exterior painting, re-carpeting, fixing leaks and replacing ovens were all examples of maintenance that property managers said they had trouble talking landlords into doing.", "The advent of information technology has led to the development of novel processes, products, and distribution mechanisms. Examples of new products are the Internet, computers, and digital television. New processes include automated inventory control, Internet banking, and teller machines; new distribution systems consist of cable and satellite TV.", "Currently, 450 million people experience water scarcity, while people in affluent nations tend to squander water resources. In developed countries, it has become customary to simply turn on the tap and access fresh water whenever we desire. To maintain good health and hygiene, each person requires about 80 liters of water daily. Americans consume about 500 liters on average per day.", "Australia possesses one of the most significant mining sectors globally. It plays a crucial role in exporting minerals such as iron, coal, gold, ore, and copper. The country is self-reliant in all minerals except for petroleum. Since the initial discovery of coal in 1798, mineral production has consistently increased, with a doubling output in 1992.", "When you become a part of a college, you will discover that they offer much more than just housing. Regardless of your residence, your university will serve as a foundation during your time there and a community of friends even after you graduate.", "Your body is nearly 66% water. And so it is really important that you consume enough fluid to stay hydrated and healthy. If you don't get enough fluid you may feel tired, get headaches, and not perform at your best.", "The elephant is the largest living land mammal. During evolution, its skeleton has greatly altered from the usual mammal design for two main reasons. One is to cope with the great weight of huge grinding cheek teeth and elongated tusk teeth, making the skull particularly massive. The other is to support the enormous bulk of such a huge body.", "Hundreds of millions of Americans eat fast food every day without giving it too much thought, unaware of the subtle and not so subtle ramifications of their purchases. They just grab their tray off the counter, find a table, take a seat, unwrap the paper, and dig in. The whole experience is transitory and soon forgotten.", "Cheerful sunny yellow is an attention getter. While it is considered an optimistic color, people lose their tempers more often in yellow rooms, and babies will cry more. It is the most difficult color for the eye to take in, so it can be overpowering if overused. Yellow enhances concentration, hence it is used for legal pads. It also speeds metabolism.", "Teaching is indeed a challenging profession, yet it continues to attract and retain individuals year after year, many of whom remain in the field for five, ten, or even more years. This enduring commitment can be attributed to a combination of intrinsic motivations and the rewarding aspects of the profession.", "The whole purpose of making notes is to aid your learning. It is important to go back over them within a day of making them to make sure they make sense and make them legible for future revisions. Also, going back over them should highlight the key questions of areas in which you want to do further reading.", "In classes, your teachers will talk about topics that you are studying. The information that they provide will be important to know when you take tests. You must be able to take good written notes from what your teacher says.", "There is no single method of learning that guarantees success. How we learn that depends on many different factors.", "The bill calls for the establishment of the National Landslide Hazards Reduction Program within one year of becoming law. The program serves numerous functions, including to identify and understand landslide hazards and risks, reduce losses from landslides, protect communities at risk of landslides hazards, and improve communication and emergency preparedness.", "An innovative new product or service can give a firm a head start over its rivals, which can be difficult for a new entrant to overcome. If the new technology is also patented, then other firms cannot simply copy its design. It is legally protected.", "A community's urban forest is an extension of its pride and community spirit. Trees enhance community economic stability by attracting businesses and tourists as people tend to linger and shop longer along tree-lined streets. Apartments and offices in wooded areas rent more quickly and businesses leasing office spaces in developments with trees reported higher productivity and fewer absences.", "The networks of roots that plants use to absorb water and nutrients can encompass a space larger than the part of the plant visible above ground. The nature of these roots systems can help plants adapt to challenging environments such as deserts. For instance, mesquite trees can develop tap roots capable of digging more than 50 yards deep to reach water.", "The advancements in renewable energy technology over the past decade have been transformative. Solar power, once expensive and niche, has become increasingly cost-effective, leading to widespread adoption in both residential and commercial sectors. Similarly, wind energy has seen significant growth, with larger and more efficient turbine designs harnessing coastal and inland winds.", "The global demand for natural gas has risen sharply because it produces less carbon compared to coal and other fossil fuels. In Singapore, government support has helped increase natural gas use by nine times over the past few decades. Also, in some areas, more people are choosing natural gas because they are moving away from nuclear power.", "Globalization has transformed the world economy, facilitating the flow of goods, services, and capital across borders. It has led to increased competition and efficiency, as businesses seek to expand their markets and reduce costs. However, globalization has also contributed to economic inequality, as some countries and individuals have benefited more than others.", "Globalization refers to a set of changes rather than a single change. Many of these changes are social, cultural and political rather than purely economic, and one of the main drivers in addition to the global marketplace is the communication revolution.", "The Internet has changed the way we live, work, and communicate. In the past, people had to go to libraries to find information. Now, with just a few clicks, we can access millions of books, articles, and videos online. This convenience has made learning much easier and faster."], "di_topics": [["柱状图：各国人口增长 2000–2020", "The bar chart shows population growth in four countries from 2000 to 2020. Overall, India experienced the most significant increase, followed by China. The United States and Japan showed relatively modest growth. In conclusion, developing nations saw higher population growth compared to developed countries."], ["线图：全球温度变化 1900–2020", "The line graph illustrates changes in global average temperature over the period from 1900 to 2020. Overall, there was a gradual increase in the first half, followed by a sharp rise after 1950. The most dramatic increase occurred between 1980 and 2020. In conclusion, global temperatures have risen significantly in recent decades."], ["饼图：大学生消费结构", "The pie chart shows the breakdown of university student expenditure. The largest proportion is spent on accommodation, accounting for forty percent. Food and transport represent twenty-five and fifteen percent respectively. Entertainment and study materials make up the remainder. In conclusion, housing is the biggest expense for students."], ["流程图：论文发表流程", "The flow chart describes the process of publishing an academic paper. First, the researcher conducts experiments and writes a draft. Next, the paper is submitted to a journal for peer review. If accepted with revisions, the author makes changes and resubmits. Finally, the paper is published online and in print."], ["表格：四个城市生活成本对比", "The table compares the cost of living in four major cities. London has the highest overall cost, followed by New York and Sydney. Beijing has the lowest cost among the four. Housing represents the largest expense category in all cities. In conclusion, living in Western cities is generally more expensive than in Asian cities."], ["柱状图：社交媒体用户数 2020", "The bar chart displays the number of social media users across major platforms in 2020. Facebook leads with over two billion active users, followed by YouTube and Instagram. Twitter and LinkedIn have significantly smaller user bases. In conclusion, Meta platforms dominate the social media landscape."], ["线图：学生学习时间与成绩关系", "The line graph shows the relationship between study hours and exam scores. Overall, there is a clear positive correlation. Scores increase steadily from one to four hours of daily study, after which the improvement levels off. In conclusion, studying approximately four hours per day appears to be optimal for most students."], ["饼图：全球能源消耗来源", "The pie chart illustrates the sources of global energy consumption. Fossil fuels including oil, coal and natural gas account for over eighty percent. Renewable energy such as solar and wind represents approximately fifteen percent. Nuclear energy makes up the remaining portion. In conclusion, the world still heavily depends on non-renewable energy sources."], ["柱状图：五国碳排放量 2000 与 2020", "The bar chart compares carbon dioxide emissions of five countries in 2000 and 2020. Overall, China and the United States recorded the highest emissions, with China showing the largest increase. India also rose significantly, while the United Kingdom and Germany saw modest declines. In conclusion, developing economies drove the growth in global emissions over the two decades."], ["线图：全球智能手机用户 2015–2023", "The line graph illustrates the growth in global smartphone users from 2015 to 2023. There was a steady rise throughout the period, with the sharpest increase between 2018 and 2021. By 2023, the number had more than doubled compared to 2015. In conclusion, smartphone adoption has become nearly universal in many regions."], ["饼图：家庭能源消费结构", "The pie chart shows how an average household consumes energy. Heating and cooling account for the largest share at forty percent, followed by water heating at twenty percent. Lighting, appliances and other uses make up the remainder. In conclusion, climate control dominates residential energy demand."], ["表格：三所大学国际生年学费对比", "The table compares annual tuition fees for international students at three universities. University A charges the most at forty thousand dollars, while University B and C are lower at thirty-two and twenty-eight thousand respectively. In conclusion, University C offers the most affordable option for international students."], ["流程图：城市污水处理流程", "The flow chart outlines the municipal wastewater treatment process. First, sewage enters a screening stage to remove large debris. It then moves through primary and secondary treatment tanks where solids settle and bacteria break down organic matter. Finally, the cleaned water is discharged or reused. In conclusion, the process relies on physical and biological stages."], ["柱状图：青少年每日屏幕时间（男女对比）", "The bar chart compares average daily screen time between teenage boys and girls. Boys spend slightly more time on games and video, while girls lead in social media use. Overall both groups exceed four hours per day. In conclusion, screen time is high across genders and warrants monitoring."], ["线图：全球地表平均气温距平 1900–2020", "The line graph shows the global mean temperature anomaly from 1900 to 2020. The anomaly stayed near zero until mid-century, then rose gradually and accelerated after 1980. The highest values appear in the last two decades. In conclusion, the data clearly indicates ongoing global warming."], ["饼图：全球淡水资源分布", "The pie chart illustrates the distribution of the world's freshwater. Glaciers and ice caps hold the overwhelming majority at about sixty-eight percent, groundwater accounts for thirty percent, and surface water such as lakes and rivers makes up only two percent. In conclusion, most freshwater is locked in ice or underground."], ["柱状图：五国碳排放量 2000 与 2020", "The bar chart shows the carbon dioxide emissions of five countries in the years 2000 and 2020. Overall, emissions rose sharply in developing nations while they declined slightly in developed ones. China saw the largest increase, growing from 4 billion tonnes in 2000 to 11 billion in 2020, and India more than doubled to 2.8 billion. In contrast, the United States and Germany each fell by roughly 15 percent over the same period. In conclusion, the chart highlights a clear shift in global emissions toward emerging economies."], ["折线图：某城市月度平均气温 2019", "The line graph illustrates the average monthly temperature of a city throughout 2019. Overall, temperatures followed a clear seasonal pattern, peaking in summer and dipping in winter. The lowest point was around 2 degrees Celsius in January, while the highest reached 31 degrees in July. There was a steady rise from March to July and a gradual decline thereafter. In conclusion, the graph shows a predictable annual temperature cycle with one distinct peak."], ["饼图：家庭日常开支占比 2022", "The pie chart shows how an average household spent its income in 2022. Overall, housing was the single largest expense, accounting for 35 percent of the total budget. Food and transport made up 20 percent and 15 percent respectively, while healthcare and education each took 10 percent. The remaining 10 percent covered leisure and miscellaneous items. In conclusion, the chart indicates that shelter and basic necessities dominated household spending."], ["表格：三所大学学费与就业率对比", "The table compares tuition fees and graduate employment rates across three universities. Overall, higher fees did not necessarily correspond to better employment outcomes. University A charged 30,000 dollars but had an 88 percent employment rate, whereas University B charged only 18,000 with a slightly higher rate of 91 percent. University C sat in the middle with 25,000 dollars in fees and an 84 percent employment rate. In conclusion, the data suggests that cost is not a reliable predictor of graduate job prospects."], ["流程图：塑料回收处理过程", "The flow chart describes the process of recycling plastic waste from collection to reuse. Overall, the procedure involves four main stages that transform used plastic into new products. First, collected plastic is sorted by type and colour, then it is washed and shredded into small flakes. Next, the flakes are melted and moulded into pellets, which manufacturers use to make new items. In conclusion, the chart outlines a straightforward linear process that recovers material for repeated use."], ["地图：城镇土地利用变化 1990 与 2020", "The map shows the land use of a small town in 1990 compared with 2020. Overall, the area became far more built-up, with green space converted into residential and commercial zones. In 1990, a large central park and farmland dominated the western half, but by 2020 most of that land held housing blocks and a shopping centre. The river and main road stayed largely unchanged. In conclusion, the map reveals significant urban expansion at the expense of natural land."], ["双柱状图：男女每周运动时长对比", "The bar chart compares the average weekly exercise time of men and women across four age groups. Overall, men exercised slightly more than women in younger groups, but the gap narrowed with age. In the 18 to 25 group, men averaged 6 hours per week against 4.5 for women, while both fell to around 2 hours for those over 60. The 36 to 50 group showed the smallest difference at just half an hour. In conclusion, the chart indicates a general decline in activity with age for both genders."], ["折线图：两种手机电池续航测试", "The line graph illustrates the battery life of two smartphone models during continuous video playback. Overall, Model B outperformed Model A, lasting roughly 30 percent longer. Model A dropped to zero after about 11 hours, while Model B continued for nearly 15 hours. Both showed a steady, near-linear decline in charge over time. In conclusion, the graph demonstrates a clear advantage for Model B in endurance."], ["表格：四季游客数量与平均消费", "The table compares tourist arrivals and average spending across the four seasons. Overall, summer attracted the most visitors but not the highest spending per person. Spring and summer each drew about 2 million tourists, while autumn and winter saw 1.2 and 0.8 million respectively. Average spending peaked in winter at 950 dollars, likely due to holiday travel. In conclusion, the data shows a mismatch between visitor volume and per-visitor expenditure."], ["饼图加柱状图：能源结构及发电量", "The mixed chart shows a country's energy mix as a pie alongside a bar of total generation by source. Overall, fossil fuels still dominated, but renewables contributed a notable share. The pie indicates coal at 45 percent, natural gas at 25 percent, and renewables at 30 percent, while the bars show renewables grew from 50 to 120 terawatt-hours over a decade. Nuclear remained below 5 percent throughout. In conclusion, the visuals suggest a gradual but incomplete shift toward cleaner energy."], ["流程图：咖啡从种植到杯中", "The flow chart describes the journey of coffee from farm to cup. Overall, the process includes five sequential steps linking producers and consumers. First, cherries are harvested and pulped, then the beans are dried and roasted to develop flavour. After grinding, the coffee is brewed and finally served to the customer. In conclusion, the diagram presents a clean supply chain from cultivation through to consumption."], ["地图：校园设施分布", "The map shows the layout of a university campus and the location of its main facilities. Overall, teaching buildings cluster in the north while recreational areas sit in the south. The library stands at the central crossroads, flanked by two lecture halls to the east and west. A sports complex and dormitories occupy the southern edge near the river. In conclusion, the map reveals a well-organised campus divided by function."], ["柱状图：六种交通方式通勤占比", "The bar chart shows the share of commuters using six different modes of transport. Overall, private cars were the most common choice, followed by public transit. Cars accounted for 38 percent of trips, buses and trains together reached 34 percent, and cycling made up 12 percent. Walking and motorbikes each contributed less than 10 percent. In conclusion, the chart indicates a continued reliance on motorised transport for daily commuting."], ["折线图：全球互联网用户增长 2005 至 2020", "The line graph illustrates the growth in global internet users between 2005 and 2020. Overall, the number rose dramatically, more than tripling over the fifteen-year span. In 2005 there were about 1 billion users, climbing steadily to over 4 billion by 2020. The steepest gains occurred after 2010 as mobile access expanded. In conclusion, the trend reflects the rapid worldwide spread of internet connectivity."], ["表格：五种职业平均薪资与满意度", "The table compares average salary and job satisfaction scores for five occupations. Overall, higher pay did not guarantee greater satisfaction. Software engineers earned the most at 110,000 dollars with a satisfaction score of 7.2, while teachers earned 45,000 with a higher score of 7.8. Nurses and chefs reported the lowest satisfaction despite mid-range pay. In conclusion, the data hints that non-financial factors strongly influence workplace happiness."], ["饼图：垃圾回收分类占比", "The pie chart shows the composition of recycled waste in a city's collection program. Overall, paper and cardboard formed the largest category by weight. They accounted for 40 percent, followed by glass at 22 percent and plastics at 18 percent. Metals and organic waste made up the remaining 20 percent combined. In conclusion, the chart shows that paper products dominate the local recycling stream."]], "di_svgs": ["<svg viewBox=\"0 0 400 220\" width=\"100%\" style=\"display:block\"><rect width=\"400\" height=\"220\" fill=\"#FAFBFC\" rx=\"6\"/><text x=\"200\" y=\"18\" text-anchor=\"middle\" font-size=\"12\" fill=\"#33495F\" font-weight=\"600\">Population Growth by Country (2000–2020)</text><line x1=\"50\" y1=\"180\" x2=\"370\" y2=\"180\" stroke=\"#DDE3E6\"/><line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"180\" stroke=\"#DDE3E6\"/><text x=\"40\" y=\"35\" text-anchor=\"end\" font-size=\"9\" fill=\"#6B7780\">20%</text><text x=\"40\" y=\"72\" text-anchor=\"end\" font-size=\"9\" fill=\"#6B7780\">15%</text><text x=\"40\" y=\"109\" text-anchor=\"end\" font-size=\"9\" fill=\"#6B7780\">10%</text><text x=\"40\" y=\"146\" text-anchor=\"end\" font-size=\"9\" fill=\"#6B7780\">5%</text><text x=\"40\" y=\"183\" text-anchor=\"end\" font-size=\"9\" fill=\"#6B7780\">0</text><rect x=\"62\" y=\"120\" width=\"20\" height=\"60\" fill=\"#33495F\" rx=\"2\"/><rect x=\"86\" y=\"82\" width=\"20\" height=\"98\" fill=\"#2C8C99\" rx=\"2\"/><rect x=\"142\" y=\"135\" width=\"20\" height=\"45\" fill=\"#33495F\" rx=\"2\"/><rect x=\"166\" y=\"112\" width=\"20\" height=\"68\" fill=\"#2C8C99\" rx=\"2\"/><rect x=\"222\" y=\ 2\" font-size=\"9\" fill=\"#6B7780\">Girls</text></svg>", "<svg viewBox=\"0 0 400 220\" width=\"100%\" style=\"display:block\"><rect width=\"400\" height=\"220\" fill=\"#FAFBFC\" rx=\"6\"/><text x=\"200\" y=\"18\" text-anchor=\"middle\" font-size=\"12\" fill=\"#33495F\" font-weight=\"600\">Global Temp Anomaly (°C)</text><line x1=\"50\" y1=\"180\" x2=\"370\" y2=\"180\" stroke=\"#DDE3E6\"/><line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"180\" stroke=\"#DDE3E6\"/><polyline points=\"50,150 94,148 138,146 182,142 226,135 270,118 314,95 358,70\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"50\" cy=\"150\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"94\" cy=\"148\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"138\" cy=\"146\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"182\" cy=\"142\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"226\" cy=\"135\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"270\" cy=\"118\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"314\" cy=\"95\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"358\" cy=\"70\" r=\"3\" fill=\"#C0392B\"/><text x=\"50\" y=\"196\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6B7780\">1900</text><text x=\"182\" y=\"196\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6B7780\">1950</text><text x=\"314\" y=\"196\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6B7780\">2000</text><text x=\"358\" y=\"196\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6B7780\">2020</text></svg>", "<svg viewBox=\"0 0 400 220\" width=\"100%\" style=\"display:block\"><rect width=\"400\" height=\"220\" fill=\"#FAFBFC\" rx=\"6\"/><text x=\"200\" y=\"18\" text-anchor=\"middle\" font-size=\"12\" fill=\"#33495F\" font-weight=\"600\">World Freshwater Distribution</text><path d=\"M130 110 L130 50 A60 60 0 1 1 74 150 Z\" fill=\"#33495F\"/><path d=\"M130 110 L74 150 A60 60 0 0 1 158 124 Z\" fill=\"#2C8C99\"/><path d=\"M130 110 L158 124 A60 60 0 0 1 130 50 Z\" fill=\"#B7791F\"/><text x=\"155\" y=\"80\" font-size=\"9\" fill=\"#fff\" font-weight=\"600\">Ice 68%</text><text x=\"95\" y=\"155\" font-size=\"8\" fill=\"#fff\">Ground 30%</text><text x=\"150\" y=\"118\" font-size=\"8\" fill=\"#fff\">Surface 2%</text><rect x=\"262\" y=\"55\" width=\"10\" height=\"10\" fill=\"#33495F\" rx=\"2\"/><text x=\"277\" y=\"64\" font-size=\"10\" fill=\"#6B7780\">Ice caps 68%</text><rect x=\"262\" y=\"75\" width=\"10\" height=\"10\" fill=\"#2C8C99\" rx=\"2\"/><text x=\"277\" y=\"84\" font-size=\"10\" fill=\"#6B7780\">Groundwater 30%</text><rect x=\"262\" y=\"95\" width=\"10\" height=\"10\" fill=\"#B7791F\" rx=\"2\"/><text x=\"277\" y=\"104\" font-size=\"10\" fill=\"#6B7780\">Surface 2%</text></svg>"], "wp": [["SWT: 主要照顾者 Primary Carers", "Slightly less than one in five carers (19%) were primary carers (475,000 people). That is, they were the main carer of a person who was limited in carrying out the core everyday activities of mobility, communication or self-care. Both primary carers and the larger group of other carers (close to 2 million) contribute to the wellbeing of older people and people with disabilities. However, because they care for people who otherwise would have difficulty carrying out basic everyday activities, there is particular interest in primary carers: in the contribution they make, their wellbeing, labour force experiences, motivations and the support they receive in caring. Primary carers were more likely than other carers to be assisting someone who lived in the same household (81% compared with 76%). As with caring as a whole, the likelihood of being a primary carer increased with age to peak at age 55-64 years, where one in twenty people were primary carers. However, rather than then declining, the likelihood of being a primary carer remained at around this level among the older age groups. Consequently, primary carers had a somewhat older age profile than other carers. The median age of primary carers was 52 years, compared with 47 years for other carers. Primary carers were more likely than other carers to be female (71% compared with 50%) and less likely to be in the labour force (39% compared with 60%). Women not in the labour force were by far the largest single group among primary carers (44%). In contrast, men employed full-time were the largest single group among other carers (25%). Consistent with their lower labour force participation, primary carers had lower personal incomes than other carers (a median gross income of $237 per week compared with $327 per week) and were more likely to have a government pension or allowance as their main source of income (55% compared with 35%).", "Both primary carers and the larger group of other carers contribute to the wellbeing of older people and people with disabilities, so there is a particular interest in the contributions they make, their well-being, labor force experiences, motivations and the support they receive in caring, and they were more likely than other carers to be female or assisting someone who lived in the same household and less likely to be in the labor force."], ["SWT: 非洲黑土地 African Dark Earths", "A farming technique practiced for centuries by villagers in West Africa, which converts nutrient-poor rainforest soil into fertile farmland, could be the answer to mitigating climate change and revolutionizing farming across Africa. A global study by researchers has for the first-time identified and analyzed rich fertile soils found in Liberia and Ghana. They discovered that the ancient West African method of adding charcoal and kitchen waste to highly weathered, nutrient poor tropical soils can transform the land into enduringly fertile, carbon-rich black soils which the researchers dub 'African Dark Earths'. Similar soils created by Amazonian people in pre-Columbian eras have recently been discovered in South America, but the techniques people used to create these soils are unknown. Moreover, the activities which led to the creation of these anthropogenic soils were largely disrupted after the European conquest. Encouragingly researchers in the West Africa study were able to live within communities as they created their fertile soils. This enabled them to learn the techniques used by the women from the indigenous communities who disposed of ash, bones and other organic waste to create the African Dark Earths.", "A farming technique practiced for centuries by villagers in West Africa, which converts nutrient-poor rainforest soil into fertile farmland, could be the answer to mitigating climate change and revolutionizing farming across Africa, and after researchers had found and named rich fertile soils found in Africa 'the African Dark Earths', they tried to learn the unknown techniques used by the indigenous communities to create the African Dark Earths."], ["SWT: 珊瑚礁 Coral Reefs", "Coral reefs, often referred to as the 'rainforests of the sea,' are among the most diverse and valuable ecosystems on Earth. They support over 25% of marine species despite covering less than 1% of the ocean floor. These vibrant underwater structures are formed by colonies of tiny animals called coral polyps, which build calcium carbonate skeletons that accumulate over centuries. Beyond their ecological importance, coral reefs provide coastal protection from storms, support fisheries, and contribute significantly to tourism and the global economy. However, these ecosystems are under severe threat due to human activities. Climate change, particularly ocean warming and acidification, has led to widespread coral bleaching, where corals expel the algae that give them color and nutrients. Pollution, overfishing, and destructive practices such as dynamite fishing further exacerbate their decline. Conservationists and scientists worldwide are developing strategies to protect and restore coral reefs, including marine protected areas, coral gardening, and breeding heat-resistant coral species. Despite these efforts, recovery is slow, and time is of the essence. The survival of coral reefs depends not only on localized conservation actions but also on global commitments to reduce carbon emissions and mitigate climate change. Public awareness and international cooperation are crucial to preserving these ecosystems for future generations.", "Coral reefs are among the most diverse and valuable ecosystems on earth, as they provide coastal protection, support fisheries, and contribute significantly to tourism and the global economy; however, these are under severe threat due to human activities like ocean warming, acidification, pollution, overfishing and other destructive activities; hence, conservationists and scientists are developing strategies to protect and restore coral reefs; in addition, public awareness and international cooperation are crucial."], ["SWT: 导航能力 London Taxi Drivers", "It has been known for some time that working in a complex environment can sharpen certain mental abilities. One of the most well-known examples is that of London taxi drivers, who have to memorize the layout of a vast city and consequently show an enlarged hippocampus, an area of the brain involved in navigation and spatial memory. A more recent study has attempted to ascertain which factors are generally important in the development of navigational skills. Subjects were asked to complete a task embedded in a computer game which involved memorising a map and then steering a boat using this mental picture. A number of factors were significant, but one of the most interesting outcomes was that there were differences between those who lived in a rural environment and their town dwelling counterparts. Country dwellers showed significantly better navigational skills, presumably because town dwellers just come to rely on street names and numbers and so these skills are less activated. Moreover, it appears that the type of city can also make a difference. Subjects from cities with a more organic, less predictable topography performed better than those from the kind of grid-based cities that are common in North America, such as Chicago. There may be a useful maxim for urban planners here, that there can be such a thing as too much simplicity when it comes to city design.", "People working in a complex environments tend to develop strong navigational abilities, as shown by studies on London taxi drivers with enlarged hippocampus and recent research demonstrating that rural residents and individuals from organically designed city outperformed town dwellers and those from grid-based cities in navigation tasks, likely because reliance on street names and predictable layouts reduces active spatial processing, suggesting that overly simple urban design may negatively affect the development of navigation-related cognitive skills."], ["SWT: 远程办公 Remote Work", "Remote work, once a niche arrangement, became mainstream following the disruptions of the early 2020s, and many companies initially expected a full return to office-based work once conditions normalized. Instead, a significant proportion of employees have continued working remotely or in hybrid arrangements, citing improved work-life balance and reduced commuting time as primary reasons. Employers remain divided on the long-term implications: some argue that in-person collaboration drives innovation and company culture, while others have found that remote arrangements reduce office overhead costs and expand their talent pool beyond a single geographic location. Recent studies suggest that hybrid arrangements, rather than fully remote or fully in-office models, may offer the strongest balance between employee satisfaction and organizational performance.", "Remote work, which became mainstream after early-2020s disruptions, has persisted despite many employers initially expecting a full return to offices, and while opinions remain divided on its effect on collaboration versus cost savings, recent research suggests hybrid arrangements may best balance employee satisfaction with organizational performance."], ["SWT: 海洋酸化 Ocean Acidification", "The ocean absorbs about a quarter of the carbon dioxide (CO2) released into the atmosphere every year. As oceans absorb more CO2, the pH levels decrease, leading to acidification of the seawater. This change in ocean chemistry negatively affects marine life, particularly coral reefs, which rely on calcium carbonate to build their skeletons. When the water's acidity increases, corals struggle to survive because calcium carbonate becomes less available, leading to weakened coral structures and slowed growth. Over time, these weakened corals are more prone to bleaching, reducing their ability to support abundant marine biodiversity. Furthermore, the long-term impact on coral reefs could disrupt entire marine ecosystems and lead to a loss of species that rely on them for habitat and food.", "As the ocean absorbs more carbon dioxide, its decrease in pH leads to ocean acidification, which reduces coral survival by making calcium carbonate less available, weakening reefs, and disrupting marine ecosystems."], ["SWT: 微塑料与鱼类 Microplastics", "Fish are being killed, and prevented from reaching maturity, by the litter of plastic particles finding their way into the world's oceans, new research has proved. Some young fish have been found to prefer tiny particles of plastic to their natural food sources, effectively starving them before they can reproduce. The growing problem of microplastics - tiny particles of polymer-type materials from modern industry - has been thought for several years to be a peril for fish, but the study published on Thursday is the first to prove the damage in trials. Microplastics are near-indestructible in natural environments. They enter the oceans through litter, when waste such as plastic bags, packaging and other convenience materials are discarded. Vast amounts of these end up in the sea, through inadequate waste disposal systems and sewage outfall. Another growing source is microbeads, tiny particles of hard plastics that are used in cosmetics, for instance as an abrasive in modern skin cleaners. These easily enter waterways as they are washed off as they are used, flushed down drains and forgotten, but can last for decades in our oceans. The impact of these materials has been hard to measure, despite being a growing source of concern. Small particles of plastics have been found in seabirds, fish and whales, which swallow the materials but cannot digest them, leading to a build-up in their digestive tracts. For the first time, scientists have demonstrated that fish exposed to such materials during their development show stunted growth and increased mortality rates, as well as changed behavior that could endanger their survival.", "The fish exposed to plastic materials during their development show stunted growth and increased mortality rates, as well as changed behavior that could endanger their survival, and litter of plastic particles in oceans is damaging and growing problem, because animals cannot digest them, and particles including long-lasting microbeads are near indestructible in natural environments, which stems from inadequate waste disposal systems and sewage outfall, while these materials has been hard to measure."], ["SWT: 公司付钱让员工多睡 Employees Paid to Sleep", "A company in the USA is paying its employees to sleep more. Staff at the insurance company Aetna will get $300 a year added to their salary if they get at least seven hours of sleep a night. That works out to just over an extra dollar for each night the employee sleeps over seven hours. The idea behind this scheme is employee performance. Human resources officials say employees will work better if they have slept well. They add that a workforce that is more awake and alert will mean the company will perform better. Staff can either record their sleep automatically using a wrist monitor that connects to Aetna's computers, or manually record how long they have slept every night. There are a number of studies that warn that not sleeping enough can affect our ability to do our job. The American Academy of Sleep Medicine said that the average worker in the USA loses 11.3 working days of productivity a year because of not getting enough sleep. This costs companies about $2,280 for one worker. It estimates that the US economy loses $63.2 billion a year because workers do not sleep more than seven hours a night. A 2015 study in Europe by the Rand Corporation found that staff who slept less than seven hours per night were far less productive than workers who had eight or more hours of sleep. The staff at Aetna also receive extra cash if they do exercise.", "American employees are paid $300 a year to sleep more than seven hours per night and they can record their sleep manually or through an automatic wrist monitor, as sleeping affects daytime performance by influencing employees' alertness, which diminish productivity and leads to financial loss accumulated to $63.2 billion a year, and similar policies adopted to encourage people taking exercise."], ["SWT: 老龄化世界 Aging World", "We live in an aging world. While this has been recognized for some time in developed countries, it is only recently that this phenomenon has been fully acknowledged. Global communication is \"shrinking\" the world, and global aging is \"maturing\" it. The increasing presence of older persons in the world is making people of all ages more aware that we live in a diverse and multigenerational society. It is no longer possible to ignore aging, regardless of whether one views it positively or negatively. Demographers note that if current trends in aging continue as predicted, a demographic revolution, wherein the proportions of the young and the old will undergo a historic crossover, will be felt in just three generations. This portrait of change in the world's population parallels the magnitude of the industrial revolution traditionally considered the most significant social and economic breakthrough in the history of humankind since the Neolithic period. It marked the beginning of a sustained movement towards modern economic growth in much the same way that globalization is today marking an unprecedented and sustained movement toward a \"global culture\". The demographic revolution, it is envisaged, will be at least as powerful. While the future effects are not known, a likely scenario is one where both the challenges as well as the opportunities will emerge from a vessel into which exploration and research, dialogue and debate are poured. Challenges arise as social and economic structures try to adjust to the simultaneous phenomenon of diminishing young cohorts with rising older ones, and opportunities present themselves in the sheer number of older individuals and the vast resources societies stand to gain from their contribution. This aging of the population permeates all social, economic and cultural spheres. Revolutionary change calls for new, revolutionary thinking, which can position policy formulation and implementation on a sounder footing. In our aging world, new thinking requires that we view aging as a lifelong and older persons.", "The phenomenon of aging world is a demographic revolution, wherein it is a diverse and multi-generation society, and proportions of the old will surpass the young, and it is as important as the Industrial Revolution and globalization, and it is a challenge as well as an opportunity and will have a profound influence on all social, economic and cultural spheres."], ["SWT: 字母表起源 The Alphabet", "Their trade networks made the Phoenicians rich but also enabled cultural exchange and transfer between East and West in an unprecedented way: the most significant was the spread of the alphabetic script which was adopted all over the Mediterranean. The Phoenician alphabet is a writing system consisting of only 22 signs representing exactly one sound (phoneme) each. The term \"alphabet\" derives from the names of the first two signs in the sequence, aleph (\"cattle\") and beit(\"house\"): these names also reflect the letters' shapes, each derived from the picture of an object whose name starts with the relevant sound. The alphabetic script is simple enough to learn quickly, without the years of dedicated training required to master writing systems such as cuneiform or Egyptian hieroglyphs. Specialised schooling was unnecessary, and literacy was therefore disengaged from the institutional context of palaces and temples where the traditional scripts continued to be used. The alphabet suited the needs of long-distance merchants who needed to be able to record their business affairs on the go and who, for reasons of confidentiality and money, often preferred to write themselves rather than employ a specialist scribe. As the script could easily be used to record any language, it was, in the course of the first millennium BC, adapted for Aramaic, Hebrew, Greek, Phrygian, Lydian, Etruscan and Latin, to name but a few.", "Their trade networks made the Phoenicians rich, but enabled cultural exchange, and the most significant one was the spread of a writing system called alphabetic script adopted in Mediterranean or other countries, which is simple enough to learn quickly without years of training and schooling, and it also could easily be used to record any language, which met the merchant's needs."], ["WE: 科技让生活更好还是更糟？", "立场：科技总体利大于弊。引言：背景+观点。主体1：科技提高医疗/教育/通讯 → 举例。主体2：承认负面影响(隐私/屏幕时间) → 但可通过监管缓解。结论：重申科技带来进步，需负责任使用。", "Modern technology plays a very important role in our daily lives. Some people think it has made life easier and more comfortable, while others believe it has caused many new problems. In this essay, I will discuss both sides and give my opinion. On the one hand, technology makes our lives more convenient in many ways. For example, people can communicate quickly through the internet or smartphones. Students can study online and find information easily. In addition, modern machines and computers help workers finish their jobs faster and with less effort. Technology also makes transportation and healthcare more effective than before. On the other hand, technology can create several problems. Many people spend too much time on their phones or computers, which can lead to health problems and less physical activity. It can also reduce face-to-face communication between people. Moreover, the use of technology increases cybercrime and makes people too dependent on devices. In conclusion, modern technology has both positive and negative sides. I believe it is very useful if we use it correctly. People should enjoy the benefits of technology but also control how much they depend on it.\n\n— 范文来源：engnovate 公开机经池（用户范文，约 200 词，原文照录）"], ["WE: 政府应投资公共交通还是道路？", "立场：优先公共交通。引言：交通拥堵是城市痛点。主体1：公共交通减少拥堵+碳排放 → 举例地铁系统。主体2：道路投资短期有效但长期加剧拥堵。结论：可持续城市需要公交优先。", "Some people argue that governments should prioritize investment in public transportation instead of constructing new roads. I completely agree with this opinion because public transport systems reduce traffic congestion, protect the environment, and support sustainable urban development. One major reason is that efficient public transportation significantly decreases traffic problems. When reliable buses, subways, and trains are available, people are more likely to leave their private cars at home. This leads to fewer vehicles on the roads, shorter travel times, and less stress for commuters. For instance, cities such as Tokyo and London have advanced public transport networks that help millions of people travel daily without relying on personal cars. Another important advantage is the environmental benefit. Building more roads often encourages greater car usage, which increases air pollution and greenhouse gas emissions. In contrast, public transportation, especially electric trains and buses, produces far fewer emissions per passenger. By investing in eco-friendly transport systems, governments can improve air quality and reduce the negative effects of climate change, creating healthier living conditions for citizens. In conclusion, I firmly believe that governments should invest more in public transportation rather than building new roads. Such investment reduces congestion, protects the environment, and creates a fairer and more sustainable society.\n\n— 范文来源：engnovate 公开机经池（用户范文 Band 8，约 240 词，原文照录）"], ["WE: 团队合作 vs 独立工作", "立场：两者各有优势，因任务而异。主体1：复杂项目需团队→举例科研。主体2：创意/高度专注任务适合独立→举例写作/编程。结论：最佳工作方式取决于任务性质。", "Whether activities engaged in a group or those done independently, educate people more on life skills, is a moot point. I am of the opinion that collective tasks certainly are superior in imparting life skills. To begin with, working together with others gives us hands on experience and knowledge of getting along with a variety of people and the supreme art of accommodating. This critical skill cannot be gained by doing things all by ourselves, no matter how efficient we are. Besides, we get a better understanding of people and their attitudes which would aid in future group roles we might have to undertake. Furthermore, communication skills and trust in mankind is acquired in the course of performing projects in the company of others. This faith in the goodness of people and the art of communicating effectively with team members, is paramount in achieving success in any walk of life. People who accomplish tasks independently loose this vital opportunity of interaction and talking with a cross section of other workers. Nevertheless, advocates of the view that work done alone teaches greater number of life skills, argue that it is more challenging to complete a task in this manner vis-a-vis in a group, thus teaching more skills for life. Additionally, they may contend that independent undertakings test a person's grit, capabilities and much more, bringing out the best in them while training them for life. To conclude, I believe that working in a group imparts greater number of skills for one's life as opposed to indulging in jobs alone since people learn to interact and communicate effectively with varying personalities apart from building faith in mankind.\n\n— 范文来源：successutras 公开机经池（范文，约 270 词，原文照录）"], ["WE: 应不应该禁止塑料袋", "立场：应该。引言：塑料污染是环境危机。主体1：禁塑令的环境收益 → 海洋生物保护。主体2：替代方案可行性 → 可降解材料。结论：虽短期有不适应，长远看禁塑是正确方向。", "In most countries, the use of plastic bags is becoming commonplace among consumers, which leads to the accumulation of garbage and soil and water contamination. Therefore, many people believe that the government should impose a ban on plastic carry bags. Personally, I strongly agree with this statement due the harmful effect of plastic bags on marine animals and economic development. The first rationale for my approval of such a ban is since these bags are made from materials designed to be durable, they take hundreds of years to decompose. During the decomposition process, they will break down into tiny toxic particles that can contaminate waterways and oceans, eventually entering into food chains where sea creatures accidentally ingest them. In addition, many marine animals will confuse plastic carry bags for food and consume them without realizing the harm. As a result, the plastic debris can clog their stomach and block their digestive processes. Another key reason why I support this statement is the presence of plastic can pose several challenges that hinder tourism development in some areas, especially famous tourist destinations. Due to the excessive accumulation of plastic waste along the coastlines, it can lead to the unpleasant odor disrupting tourists' experiences and there are also many types of plastic waste clog up gutters and drains causing the water and sewage to overflow and become the breeding grounds of germs, which can damage tourists' health when they are exposed to contaminated water resources or and toxic substances released from plastic waste such as allergies. Consequently, it will lead to a significant decline in tourist arrivals. In conclusion, due to the adverse effects on the marine environment and the economic growth, I strongly support that the government should implement some policies to address this issue comprehensively.\n\n— 范文来源：engnovate 公开机经池（用户范文 Band 6.5，约 300 词，原文照录）"], ["SWT: National Oceanography Center", "The National Oceanography Center (NOC) is engaged in research into the potential risks and benefits of exploiting deep-sea mineral resources, some of which are essential for low-carbon technology, as well as using ocean robots to estimate the environmental impact of these potential deep-sea mining activities. Late last year the NOC led an expedition on the RRS James Cook that found enough of the scarce element Tellurium present in the crust of a submerged volcano that, if it were all to be used in the production of solar PV panels, could provide 2/3rds of the UK's annual electricity supply. Recently, the NOC also led an international study demonstrating deep-sea nodule mining will cause long-lasting damage to deep-sea life, lasting at least for decades. These nodules are potato-sized rocks containing high levels of metals, including copper, manganese and nickel. They grow very slowly on the sea-bed, over millions of years. Although no commercial operations exist to extract these resources, many are planned. Professor Edward Hill, Executive Director at the NOC commented, \"By 2050 there will be nine billion people on earth and attention is increasingly turning to the ocean, particularly the deep ocean, for food, clean supplies of energy and strategic minerals. The NOC is undertaking research related to many aspects and perspectives involved in exploiting ocean resources. This research is aimed at informing with sound scientific evidence the decisions that will need to be taken in the future, as people increasingly turn to the oceans to address some of society's greatest challenges.\"", "The National Oceanography Center is engaged in research into the potential risks and benefits of exploiting deep-sea mineral resources, and late last year the NOC led an expedition and found enough of the scarce element Tellurium which could provide UK's annual electricity supply, and NOC also found out that deep-sea nodule mining will cause long-lasting damage to deep-sea life."], ["SWT: Bank Overdraft", "Banks provide short-term finance to companies in the form of an overdraft on a current account. The advantage of an overdraft is its flexibility. When the cash needs of the company increase with seasonal factors, the company can continue to write cheques and watch the overdraft increase. When the goods and services are sold and cash begins to flow in, the company should be able to watch the overdraft decrease again. The most obvious example of a business which operates in this pattern is farming. The farmer uses the overdraft to finance the acquisition of seed for arable farming, or feed through the winter for stock farming and to cover the period when the crops or animals are growing and maturing. The overdraft is reduced when the crops or the animals are sold. The main disadvantage of an overdraft is that it is repayable on demand. The farmer whose crop fails because of bad weather knows the problem of being unable to repay the overdraft. Having overdraft financing increases the worries of those who manage the company. The other disadvantage is that the interest payable on overdrafts is variable. When interest rates increase, the cost of the overdraft increases. Furthermore, for small companies there are often complaints that the rate of interest charged is high compared with that available to larger companies. The banks answer that the rates charged reflect relative risk and it is their experience that small companies are more risky.", "Although the advantage that banks provide short-term finance to companies in the form of an overdraft on a current account is its flexibility, the main disadvantage of an overdraft is that it is repayable on demand as well as the interest payable on overdrafts is variable."], ["SWT: Office Environment", "The notion that office space has a role in promoting or inhibiting performance is backed up by solid research. A recent study conducted by Harvard University and Massachusetts General Hospital showed that improvements to the physical surroundings of workers impacted on productivity not just because the working environment was more attractive, but because the changes made employees feel cared for. A Swedish research paper revealed a strong link between the type of office an employee worked in and their overall job satisfaction and health. Various findings have emerged as a result of studies such as this. Pot plants and greenery can apparently have a real impact on psychological well-being. Those who work in a private room tend to be in better health than workers based in open-plan offices. Sufficient light can reduce sickness among workers and increase productivity, and an attractive office can make workers feel more cared for and therefore more loyal to their company. Most of these points make good rational sense. But some companies aren't content simply to increase the health, productivity and contentment of their employees. Pioneers such as Google, Walt Disney and Dyson have tried to create offices that will do everything from promoting collaboration between workers to stimulating their creative juices. \"Environment, both physical and cultural, can make or break creativity.\" says Kursty Groves, author of I Wish I Worked There! A look inside the most creative spaces in business. Stimulating spaces expose the mind to a variety of stimuli - planned or random - In order to encourage people to think differently. Reflective spaces promote the filtering of information into the brain slowing it to make connections. An environment which encourages a team to build trust and to play freely is an essential ingredient for innovation.", "Although the notion that office space has a role in promoting or inhibiting performance is backed up by solid research, some companies aren't content simply to increase the health, productivity and contentment of their employees since pioneer companies have tried to create offices that will do everything from promoting collaboration between workers to stimulating their creative juices."], ["SWT: Museology", "What is museology? A simple definition might be that it is the study of museums, their history and underlying philosophy, the various ways in which they have, in the course of time, been established and developed, their avowed or unspoken aims and policies, their educative or political or social role. More broadly conceived, such a study might also embrace the bewildering variety of audiences - visitors, scholars, art lovers, children - at whom the efforts of museum staff are supposedly directed, as well as related topics such as the legal duties and responsibilities placed upon (or incurred by) museums, perhaps even some thought as to their future. Seen in this light, museology might appear at first sight a subject so specialized as to concern only museum professionals, who by virtue of their occupation are more or less obliged to take an interest in it. In reality, since museums are almost, if not quite as old as civilization itself, and since the plethora of present-day museums embraces virtually every field of human endeavor - not just art, or craft, or science, but entertainment, agriculture, rural life, childhood, fisheries, antiquities, automobiles: the list is endless - it is a field of enquiry so broad as to be a matter of concern to almost everybody.", "Museology, a study of museums, their history and underlying philosophy, not lonely embraces the bewildering variety of audiences and different topics but also specialises as to concern museum professionals, and it is a field of enquiry so broad as to be a matter of concern to almost everybody since it embraces every field of human endeavor."], ["SWT: Sleep Time", "If it seems like you're not getting enough sleep, you're not alone. People have evolved to sleep much less than chimps, baboons or any other primates studied so far, a new study finds. Charles Nunn and David Samson are evolutionary anthropologists. They study how humans have evolved to behave the way we do. Nunn works at Duke University in Durham, N.C. Samson works at the University of Toronto Mississauga in Canada. In their new study, the two compared sleep patterns in 30 different species of primates, including humans. Most species slept between nine and 15 hours daily. Humans averaged just seven hours of shut-eye. Based on lifestyle and biological factors, however, people should get 9.55 hours, Nunn and Samson calculate. Most other primates in the study typically sleep as much as the scientists predicted they should. Nunn and Samson shared their findings online February 14 in the American Journal of Physical Anthropology. The researchers argue that two long-standing features of human life may play into our short sleep times. The first stems from when humans' ancestors descended from the trees to sleep on the ground. At that point, people probably had to spend more time awake to guard against predators. The second may reflect the intense pressure humans face to learn and teach new skills and to make social connections. That has left less time for sleep. As sleep declined, rapid-eye movement - or REM - sleep took on an outsize role in humans, Nunn and Samson propose. REM sleep is when we dream. And it has been linked to learning and memory. \"It's pretty surprising that non-REM sleep time is so low in humans,\" Nunn says. \"But something had to give as we slept less.\"", "People have evolved to sleep much less than other primates because human's ancestors descended from the trees to sleep on the ground, and that the intense pressure humans face to learn and teach new skills and to make social connections, so rapid-eye movement sleep took on an outsize role in humans and it has been linked to learning and memory."], ["SWT: Two Ways of Learning Language", "Over the years, language teachers have alternated between favoring teaching approaches that focus primarily on language use and those that focus on language forms or analysis. The alternation has been due to a fundamental disagreement concerning whether one learns to communicate in a second language by communicating in that language (such as in an immersion experience) or whether one learns to communicate in a second language by learning the lexicogrammar - the words and grammatical structures - of the target language. In other words, the argument has been about two different means of achieving the same end. As with any enduring controversy, the matter is not easily resolved. For one thing, there is evidence to support both points of view. It is not uncommon to find learners who, for whatever reason, find themselves in a new country or a new region of their own country, who need to learn a new language, and who do so without the benefit of formal instruction. If they are postpubescent, they may well retain an accent of some kind, but they can pick up enough language to satisfy their communicative needs. In fact, some are natural acquirers who become highly proficient in this manner. In contrast, there are learners whose entire exposure to the new language comes in the form of classroom instruction in lexicogrammar. Yet they too achieve a measure of communicative proficiency, and certain of these learners become highly proficient as well. What we can infer from this is that humans are amazingly versatile learners and that some people have a natural aptitude for acquiring languages and will succeed no matter what the circumstances.", "Language teachers alter between two teaching approaches: primarily focusing on language use or forms, which cannot be solved easily because both approaches can be supported by evidence, no matter people pick up languages for communicative needs or sit in a classroom setting, and in conclusion, humans are versatile learners and some people have a natural aptitude of acquiring languages and succeed under different circumstances."], ["SWT: Technology Prediction", "As far as prediction is concerned, remember that the chairman of IBM predicted in the fifties that the world would need a maximum of around half a dozen computers, that the British Department for Education seemed to think in the eighties that we would all need to be able to code in BASIC and that in the nineties Microsoft failed to foresee the rapid growth of the Internet. Who could have predicted that one major effect of the automobile would be to bankrupt small shops across the nation? Could the early developers of the telephone have foreseen its development as a medium for person-to-person communication, rather than as a form of the broadcasting medium? We all, including the 'experts', seem to be peculiarly inept at predicting the likely development of our technologies, even as far as the next year. We can, of course, try to extrapolate from the experience of previous technologies, as I do below by comparing the technology of the Internet with the development of other information and communication technologies and by examining the earlier development of radio and print.", "The effect of information and communication technologies are unpredictable since foreseeing the rapid growth of the Internet and automobile is problematic, but we can try to extrapolate and compare the previous experience to examine the earlier development of radio and print."], ["SWT: Beauty Pageants", "Since Australians Jennifer Hawkins and Lauryn Eagle were crowned Miss Universe and Miss Teen International respectively, there has been a dramatic increase in interest in beauty pageants in this country. These wins have also sparked a debate as to whether beauty pageants are just harmless reminders of old-fashioned values or a throwback to the days when women were respected for how good they looked. Opponents argue that beauty pageants, whether its Miss Universe or Miss Teen International, are demeaning to women and out of sync with the times. They say they are nothing more than symbols of decline. In the past few decades Australia has taken more than a few faltering steps toward treating women with dignity and respect. Young women are being brought up knowing that they can do anything, as shown by inspiring role models in medicine such as 2003 Australian of the Year Professor Fiona Stanley. In the 1960s and 70s, one of the first acts of the feminist movement was to picket beauty pageants on the premise that the industry promoted the view that it was acceptable to judge women on their appearance. Today many young Australian women are still profoundly uncomfortable with their body image, feeling under all kinds of pressures because they are judged by how they look. Almost all of the pageant victors are wafer thin, reinforcing the message that thin equals beautiful. This ignores the fact that men and women come in all sizes and shapes. In a country where up to 60% of young women are on a diet at any one time and 70% of school girls say they want to lose weight, despite the fact that most have a normal BMI, such messages are profoundly hazardous to the mental health of young Australians.", "Despite being considered as a harmless reminder of old-fashioned values, opponents argue that beauty pageants judge women by their appearance and promote ultra-thin body image, which drive many young Australian women to embark on a diet to align with the current beauty standard."], ["WE: Unpaid Internships", "立场：应推行带薪实习，更公平。引言：无薪实习近年引发激烈争论，支持与反对双方对立。主体1：支持方认为无薪实习为学生提供实践经验、可转移技能与人脉网络，但部分学生无力承担无薪工作。主体2：企业获得稳定免费劳动力、低成本招聘，但剥削渴望经验的年轻人，引发伦理担忧与改革呼声。结论：实习应带薪以保障公平，政府院校应合作增加带薪机会、促进社会公平。", "The contentious issue of unpaid internships has sparked considerable debate in recent years. Proponents argue that they offer invaluable opportunities for students, while detractors contend that they represent a form of exploitation. This essay will critically examine both perspectives before presenting a nuanced stance.\n\nProponents of unpaid internships posit that they provide students with a plethora of benefits. Primarily, they offer a platform for students to apply theoretical knowledge in a practical setting, thereby enhancing their understanding of the subject matter. Furthermore, internships facilitate the development of transferable skills, such as communication, teamwork, and problem-solving, which are highly valued in the job market. Additionally, internships enable students to build a professional network, which can be instrumental in securing future employment. However, critics argue that not all students can afford to work for free, as many rely on income to support their studies and living expenses.\n\nConversely, companies stand to gain significantly from unpaid interns. They benefit from a steady stream of free labor, which can be particularly advantageous in sectors with tight budgets. Moreover, internships serve as a cost-effective recruitment strategy, as they allow companies to identify and groom potential employees. Nevertheless, the practice of exploiting young people eager to gain experience but in a vulnerable position cannot be overlooked. This raises ethical concerns and has led to calls for regulation and reform.\n\nIn conclusion, while unpaid internships offer certain advantages, the exploitation of young people cannot be ignored. Therefore, I believe that internships should be paid, as this would ensure fairness and provide students with the financial support they need. Moreover, governments and educational institutions should collaborate to create more paid internship opportunities, thereby bridging the gap between theory and practice while promoting social equity.\n\n— 范文来源：englishaidol.com"], ["WE: Television News Balance", "立场：电视新闻应兼顾好与坏的消息。引言：电视新闻充斥冲突灾难，应平衡报道。主体1：持续负面新闻损害观众心理健康，需用正面故事缓解焦虑与绝望。主体2：好坏结合更真实反映世界，正能量故事激励公众行动改善社会。结论：平衡报道造就更有信息量、更有希望与同理心的观众。", "Television news often inundates us with stories of conflict, disaster, and upheaval. Wars, famines, accidents, and crimes dominate the airwaves, prompting a debate about whether television news should strike a balance between good and bad news. I believe that television news should encompass both good and bad news for the following compelling reasons.\n\nFirst of all, an incessant stream of negative news can significantly impact our emotional well-being. Being constantly bombarded with reports on conflicts, natural disasters and tragedies can instil anxiety and despair among viewers. So it is vital to offset this with uplifting stories that offer hope and kindle positive emotions. Such stories, like successful rescue missions, scientific breakthroughs and people's success stories, provide a much-needed respite from the constant deluge of grim news.\n\nAdditionally, presenting a mix of good and bad news offers a more accurate representation of our world. While it is essential to acknowledge the challenges and adversities in society, it is equally crucial to recognize the positive developments and acts of kindness that occur daily. Neglecting these uplifting stories distorts our perception of reality. For example, news reports about communities rallying during crises or individuals making significant contributions to society serve as powerful motivators for others to. These narratives inspire action and drive individuals to become actively engaged in efforts to improve their communities and the world at large.\n\nIn conclusion, the inclusion of both good and bad news in television broadcasts is essential for our emotional well-being, and for accurately representing our reality and motivating people to contribute positively to society. Striking this balance results in a more informed, hopeful, and empowered viewership, ultimately contributing to a better and more compassionate world.\n\n— 范文来源：blog.e2language.com"], ["WE: Practical Skills vs Academic Knowledge", "立场：实践能力比学术知识更重要。引言：实践与学术之争，作者倾向实践技能。主体1：实践技能可直接应用于真实场景、提升就业力（如工程师编码实战）。主体2：快速变化世界中实践助人适应，职场更重经验与认证胜过传统学历。结论：应用知识的能力最关键，应优先培养实践技能。", "In today's world, the debate between the importance of practical skills and academic knowledge has gained significant attention. While some may argue that academic achievements are crucial for success, I believe that practical skills hold more weight in our modern society. Firstly, practical skills are often directly applicable to real-world situations, making individuals more employable. For instance, in fields such as technology and healthcare, employers prioritise hands-on experience and the ability to navigate challenges in a practical setting. For example, a software engineer who can code and troubleshoot effectively is often more valuable than one who has a degree but lacks practical coding experience. In my own experience, I've found that internships and hands-on projects have been instrumental in developing my capabilities and securing job opportunities. Secondly, in a fast-paced world that is constantly changing, having practical skills allows individuals to adapt quickly to new circumstances. Skills such as critical thinking, problem-solving, and effective communication are essential in navigating daily challenges, whether in personal or professional life. For example, during a school project, my ability to collaborate and communicate with my team proved to be far more important than merely relying on theoretical knowledge. Moreover, the shift towards vocational training and apprenticeships highlights the growing recognition of practical skills. Many industries are now valuing experience over formal education, indicating a trend where individuals with practical training and certifications can often outpace those with traditional degrees in certain job markets. While academic knowledge certainly has its place, particularly in developing a strong foundation for advanced study, I argue that the ability to apply that knowledge in practical situations is paramount. Therefore, I believe that in today's world, prioritising practical skills is not just important but essential for success, adaptability, and overall effectiveness in a rapidly changing environment.\n\n— 范文来源：leapscholar.com"], ["WE: Older Professionals as Teachers", "立场：年长专业人士转做教师总体有益。引言：教师短缺，鼓励转行是较激进的举措。主体1（担忧）：教学耗费精力、原岗位面对成人者或不懂年轻人心理。主体2（益处）：年长者社会经验更丰富，能衔接学校与职场、帮助学生认识学习意义、增进师生理解。结论：只要真正投入并做好准备，此举对教育积极。", "When there is a shortage of schoolteachers, the government's response is usually to encourage more graduates to enter the teaching profession. Targeting older people who have spent their working life in a different profession is a more radical attempt to deal with the problem. Some people might doubt whether it would work well. Teaching in a school can be a demanding activity requiring high levels of energy and so some people might find it difficult if previously they worked in a quiet office. Moreover, if their previous profession involved working mainly with adults, they may have little understanding of young people. However, on the whole I feel that schemes like this are positive and more likely to be beneficial than otherwise. An older person who has worked in another profession will probably have a greater experience of life outside school than someone who has gone into teaching straight from university. One of the criticisms sometimes made of education systems is that they do not make enough connections with the working life that pupils will enter. Older people will be better able to make these links and may help pupils to see the point of studying. It is true there may be a lack of understanding between teachers and pupils in some cases, but perhaps an initiative like this could be part of the solution to the wider problem. It might increase understanding on both sides through communication in the classroom. In general, I feel that an initiative like this is likely to be positive for education as long as the professional people in question are truly committed to it and prepared for the new demands that this career move will bring\n\n— 范文来源：leapscholar.com"], ["WE: Throw-away Society", "结构：分析成因并提出对策。引言：人类进入抛弃型社会，环境被垃圾填满。主体1（成因）：塑料包装、一次性用品、有毒电子垃圾占填埋场并污染河流水源。主体2（对策）：开发可再生资源、超市禁塑、政府立法控污、公众提升环保意识。结论：社会发展须与资源保护、回收再生相平衡。", "Nowadays, it has become crucial to provide our society with the convenience of basic needs. The place for the environment in modern world is getting reduced day by day. Though, many people argue that in today's life, environment is consumed by our throw-away society and filled with rubbish. The following essay will elaborate causes and solutions. To begin with, in our modern society people mostly consume food and drink with plastic packaging. As a consequence, nonrenewable resources are consumed at an unbelievable speed. People are becoming more selfish that throw-away all used things of daily life to the environment and making the environment ugly. Toxic rubbish like used batteries and electronic components are not only taking a lot of space of the landfill but also become hidden hazard to our environment. People dump their garbage to the rivers and streams and it becomes hard to find clean water to drink. Last but not the least, the above-mentioned issues could be fixed. One way to tackle with the current dilemma is to keep up creating new resources which are renewable to the environment. Another way is to remove plastic bags and plastic bottle of drinks from the supermarket and it is the very first step for saving the space of our landfills. Governments should take necessary actions to control environment pollution. General public need to be aware about the importance of protecting environment. According to the arguments aforementioned, one can conclude that a good society should always balance its development with the preservation of natural resources and recyclin
