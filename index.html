t digest them, leading to a build-up in their digestive tracts. For the first time, scientists have demonstrated that fish exposed to such materials during their development show stunted growth and increased mortality rates, as well as changed behavior that could endanger their survival.", "The fish exposed to plastic materials during their development show stunted growth and increased mortality rates, as well as changed behavior that could endanger their survival, and litter of plastic particles in oceans is damaging and growing problem, because animals cannot digest them, and particles including long-lasting microbeads are near indestructible in natural environments, which stems from inadequate waste disposal systems and sewage outfall, while these materials has been hard to measure."], ["SWT: 公司付钱让员工多睡 Employees Paid to Sleep", "A company in the USA is paying its employees to sleep more. Staff at the insurance company Aetna will get $300 a year added to their salary if they get at least seven hours of sleep a night. That works out to just over an extra dollar for each night the employee sleeps over seven hours. The idea behind this scheme is employee performance. Human resources officials say employees will work better if they have slept well. They add that a workforce that is more awake and alert will mean the company will perform better. Staff can either record their sleep automatically using a wrist monitor that connects to Aetna's computers, or manually record how long they have slept every night. There are a number of studies that warn that not sleeping enough can affect our ability to do our job. The American Academy of Sleep Medicine said that the average worker in the USA loses 11.3 working days of productivity a year because of not getting enough sleep. This costs companies about $2,280 for one worker. It estimates that the US economy loses $63.2 billion a year because workers do not sleep more than seven hours a night. A 2015 study in Europe by the Rand Corporation found that staff who slept less than seven hours per night were far less productive than workers who had eight or more hours of sleep. The staff at Aetna also receive extra cash if they do exercise.", "American employees are paid $300 a year to sleep more than seven hours per night and they can record their sleep manually or through an automatic wrist monitor, as sleeping affects daytime performance by influencing employees' alertness, which diminish productivity and leads to financial loss accumulated to $63.2 billion a year, and similar policies adopted to encourage people taking exercise."], ["SWT: 老龄化世界 Aging World", "We live in an aging world. While this has been recognized for some time in developed countries, it is only recently that this phenomenon has been fully acknowledged. Global communication is \"shrinking\" the world, and global aging is \"maturing\" it. The increasing presence of older persons in the world is making people of all ages more aware that we live in a diverse and multigenerational society. It is no longer possible to ignore aging, regardless of whether one views it positively or negatively. Demographers note that if current trends in aging continue as predicted, a demographic revolution, wherein the proportions of the young and the old will undergo a historic crossover, will be felt in just three generations. This portrait of change in the world's population parallels the magnitude of the industrial revolution traditionally considered the most significant social and economic breakthrough in the history of humankind since the Neolithic period. It marked the beginning of a sustained movement towards modern economic growth in much the same way that globalization is today marking an unprecedented and sustained movement toward a \"global culture\". The demographic revolution, it is envisaged, will be at least as powerful. While the future effects are not known, a likely scenario is one where both the challenges as well as the opportunities will emerge from a vessel into which exploration and research, dialogue and debate are poured. Challenges arise as social and economic structures try to adjust to the simultaneous phenomenon of diminishing young cohorts with rising older ones, and opportunities present themselves in the sheer number of older individuals and the vast resources societies stand to gain from their contribution. This aging of the population permeates all social, economic and cultural spheres. Revolutionary change calls for new, revolutionary thinking, which can position policy formulation and implementation on a sounder footing. In our aging world, new thinking requires that we view aging as a lifelong and older persons.", "The phenomenon of aging world is a demographic revolution, wherein it is a diverse and multi-generation society, and proportions of the old will surpass the young, and it is as important as the Industrial Revolution and globalization, and it is a challenge as well as an opportunity and will have a profound influence on all social, economic and cultural spheres."], ["SWT: 字母表起源 The Alphabet", "Their trade networks made the Phoenicians rich but also enabled cultural exchange and transfer between East and West in an unprecedented way: the most significant was the spread of the alphabetic script which was adopted all over the Mediterranean. The Phoenician alphabet is a writing system consisting of only 22 signs representing exactly one sound (phoneme) each. The term \"alphabet\" derives from the names of the first two signs in the sequence, aleph (\"cattle\") and beit(\"house\"): these names also reflect the letters' shapes, each derived from the picture of an object whose name starts with the relevant sound. The alphabetic script is simple enough to learn quickly, without the years of dedicated training required to master writing systems such as cuneiform or Egyptian hieroglyphs. Specialised schooling was unnecessary, and literacy was therefore disengaged from the institutional context of palaces and temples where the traditional scripts continued to be used. The alphabet suited the needs of long-distance merchants who needed to be able to record their business affairs on the go and who, for reasons of confidentiality and money, often preferred to write themselves rather than employ a specialist scribe. As the script could easily be used to record any language, it was, in the course of the first millennium BC, adapted for Aramaic, Hebrew, Greek, Phrygian, Lydian, Etruscan and Latin, to name but a few.", "Their trade networks made the Phoenicians rich, but enabled cultural exchange, and the most significant one was the spread of a writing system called alphabetic script adopted in Mediterranean or other countries, which is simple enough to learn quickly without years of training and schooling, and it also could easily be used to record any language, which met the merchant's needs."], ["WE: 科技让生活更好还是更糟？", "立场：科技总体利大于弊。引言：背景+观点。主体1：科技提高医疗/教育/通讯 → 举例。主体2：承认负面影响(隐私/屏幕时间) → 但可通过监管缓解。结论：重申科技带来进步，需负责任使用。", "Modern technology plays a very important role in our daily lives. Some people think it has made life easier and more comfortable, while others believe it has caused many new problems. In this essay, I will discuss both sides and give my opinion. On the one hand, technology makes our lives more convenient in many ways. For example, people can communicate quickly through the internet or smartphones. Students can study online and find information easily. In addition, modern machines and computers help workers finish their jobs faster and with less effort. Technology also makes transportation and healthcare more effective than before. On the other hand, technology can create several problems. Many people spend too much time on their phones or computers, which can lead to health problems and less physical activity. It can also reduce face-to-face communication between people. Moreover, the use of technology increases cybercrime and makes people too dependent on devices. In conclusion, modern technology has both positive and negative sides. I believe it is very useful if we use it correctly. People should enjoy the benefits of technology but also control how much they depend on it.\n\n— 范文来源：engnovate 公开机经池（用户范文，约 200 词，原文照录）"], ["WE: 政府应投资公共交通还是道路？", "立场：优先公共交通。引言：交通拥堵是城市痛点。主体1：公共交通减少拥堵+碳排放 → 举例地铁系统。主体2：道路投资短期有效但长期加剧拥堵。结论：可持续城市需要公交优先。", "Some people argue that governments should prioritize investment in public transportation instead of constructing new roads. I completely agree with this opinion because public transport systems reduce traffic congestion, protect the environment, and support sustainable urban development. One major reason is that efficient public transportation significantly decreases traffic problems. When reliable buses, subways, and trains are available, people are more likely to leave their private cars at home. This leads to fewer vehicles on the roads, shorter travel times, and less stress for commuters. For instance, cities such as Tokyo and London have advanced public transport networks that help millions of people travel daily without relying on personal cars. Another important advantage is the environmental benefit. Building more roads often encourages greater car usage, which increases air pollution and greenhouse gas emissions. In contrast, public transportation, especially electric trains and buses, produces far fewer emissions per passenger. By investing in eco-friendly transport systems, governments can improve air quality and reduce the negative effects of climate change, creating healthier living conditions for citizens. In conclusion, I firmly believe that governments should invest more in public transportation rather than building new roads. Such investment reduces congestion, protects the environment, and creates a fairer and more sustainable society.\n\n— 范文来源：engnovate 公开机经池（用户范文 Band 8，约 240 词，原文照录）"], ["WE: 团队合作 vs 独立工作", "立场：两者各有优势，因任务而异。主体1：复杂项目需团队→举例科研。主体2：创意/高度专注任务适合独立→举例写作/编程。结论：最佳工作方式取决于任务性质。", "Whether activities engaged in a group or those done independently, educate people more on life skills, is a moot point. I am of the opinion that collective tasks certainly are superior in imparting life skills. To begin with, working together with others gives us hands on experience and knowledge of getting along with a variety of people and the supreme art of accommodating. This critical skill cannot be gained by doing things all by ourselves, no matter how efficient we are. Besides, we get a better understanding of people and their attitudes which would aid in future group roles we might have to undertake. Furthermore, communication skills and trust in mankind is acquired in the course of performing projects in the company of others. This faith in the goodness of people and the art of communicating effectively with team members, is paramount in achieving success in any walk of life. People who accomplish tasks independently loose this vital opportunity of interaction and talking with a cross section of other workers. Nevertheless, advocates of the view that work done alone teaches greater number of life skills, argue that it is more challenging to complete a task in this manner vis-a-vis in a group, thus teaching more skills for life. Additionally, they may contend that independent undertakings test a person's grit, capabilities and much more, bringing out the best in them while training them for life. To conclude, I believe that working in a group imparts greater number of skills for one's life as opposed to indulging in jobs alone since people learn to interact and communicate effectively with varying personalities apart from building faith in mankind.\n\n— 范文来源：successutras 公开机经池（范文，约 270 词，原文照录）"], ["WE: 应不应该禁止塑料袋", "立场：应该。引言：塑料污染是环境危机。主体1：禁塑令的环境收益 → 海洋生物保护。主体2：替代方案可行性 → 可降解材料。结论：虽短期有不适应，长远看禁塑是正确方向。", "In most countries, the use of plastic bags is becoming commonplace among consumers, which leads to the accumulation of garbage and soil and water contamination. Therefore, many people believe that the government should impose a ban on plastic carry bags. Personally, I strongly agree with this statement due the harmful effect of plastic bags on marine animals and economic development. The first rationale for my approval of such a ban is since these bags are made from materials designed to be durable, they take hundreds of years to decompose. During the decomposition process, they will break down into tiny toxic particles that can contaminate waterways and oceans, eventually entering into food chains where sea creatures accidentally ingest them. In addition, many marine animals will confuse plastic carry bags for food and consume them without realizing the harm. As a result, the plastic debris can clog their stomach and block their digestive processes. Another key reason why I support this statement is the presence of plastic can pose several challenges that hinder tourism development in some areas, especially famous tourist destinations. Due to the excessive accumulation of plastic waste along the coastlines, it can lead to the unpleasant odor disrupting tourists' experiences and there are also many types of plastic waste clog up gutters and drains causing the water and sewage to overflow and become the breeding grounds of germs, which can damage tourists' health when they are exposed to contaminated water resources or and toxic substances released from plastic waste such as allergies. Consequently, it will lead to a significant decline in tourist arrivals. In conclusion, due to the adverse effects on the marine environment and the economic growth, I strongly support that the government should implement some policies to address this issue comprehensively.\n\n— 范文来源：engnovate 公开机经池（用户范文 Band 6.5，约 300 词，原文照录）"]], "rl": [["Supermarket Retail Layout 超市布局心理学", "Have you ever wondered why the milk is always at the very back of the supermarket? It's certainly not an accident. Today, I want to discuss the psychology of retail layout and how store design is used to influence customer behavior. First, consider the entrance area, often known in the industry as the 'decompression zone.' When shoppers first enter a store, they need a few seconds to adjust to the new lighting and environment. Because of this, smart retailers never place their most important products or advertisements right at the front door, as customers are likely to walk right past them without noticing. Another key tactic involves the placement of 'staple' items—essentials like bread, eggs, and dairy. By positioning these at the furthest point from the entrance, the store forces you to walk past rows of other tempting goods to get what you need. This maximizes your exposure to products you didn't originally plan to buy. So, the next time you're shopping, remember that the floor plan isn't random; it is a strategic map designed to guide your journey and maximize sales.", "The speaker discussed the psychology of supermarket layout and how stores influence what we buy. She explained the 'decompression zone' at the entrance, where shoppers need time to adjust, so key products are not placed there. She also described how staple items like milk and bread are put at the back of the store, forcing customers to walk past other goods. In conclusion, the floor plan is strategic, not random."], ["Diversity in STEM 科研团队多样性", "When we discuss increasing diversity in STEM fields—science, technology, engineering, and math—the conversation often centers on fairness or social equality. While those are certainly vital goals, there is also a compelling economic argument that frequently gets overlooked. Put simply, diverse teams tend to produce better science and more profitable innovations. Research consistently shows that when a group of engineers or scientists all share the same background, they tend to approach problems in similar ways, a phenomenon often referred to as 'groupthink.' In contrast, mixed teams bring a variety of perspectives that challenge comfortable assumptions. For instance, a recent study of global companies found that those with the most gender-diverse executive teams were significantly more likely to outperform their competitors financially. It is not just about profits, though; it is also about product quality. If a development team lacks diversity, they might unintentionally overlook design flaws—such as voice recognition software that struggles with female voices. Therefore, encouraging more women and underrepresented groups to enter STEM isn't just a box-ticking exercise.", "The lecture argued that diversity in STEM matters for economic and scientific reasons, not only fairness. The speaker said diverse teams avoid 'groupthink' and produce better innovations. A study showed gender-diverse leadership teams performed better financially. The lecture concluded that encouraging underrepresented groups in STEM improves both products and profits."], ["British Press 英国新闻自由", "The British press came into existence in the 18th century, a time of great change and progress. Since then, it has played a pivotal role in shaping public opinion and discourse. Freedom of speech, a cornerstone of democratic societies, has been encouraged by British policy from the very beginning. This freedom allowed people to discuss anything and everything in public places, such as coffee houses or on the streets. These public spaces became hubs of intellectual exchange, where newspapers were read and issues of the day were debated. Topics ranged from politics and government policies to military matters, reflecting the diverse interests of the public. This open dialogue is a testament to the freedom enjoyed by the public. But the story doesn't end there. The British press has evolved with time, embracing new technologies and adapting to changing societal norms. Today, it continues to inform, educate, and provoke thought, reaching millions of readers through print and digital platforms. Moreover, the British press plays a crucial role in holding power to account. It scrutinizes government actions, champions the rights of the marginalized, and shines a light on issues that matter. In conclusion, the British press, with its rich history and commitment to freedom of speech, is more than just a news source. It's a symbol of public freedom, a watchdog of democracy, and an integral part of British society.", "The lecture traced the history of the British press from the 18th century to today. It explained how freedom of speech allowed public debate in places like coffee houses, and how the press shaped public opinion. The speaker emphasized that the press holds power to account and acts as a watchdog of democracy. In conclusion, the British press is a symbol of public freedom."], ["Literature 文学的社会影响", "Let's unfold the realm of 'Literature' and its profound impact on society. Literature is not just an escape, it's a mirror that reflects our realities, a lens that sharpens our worldview. Literature fosters empathy. When we dive into the narratives of characters from diverse backgrounds, we live a multitude of lives. This vicarious experience enriches our understanding of others, bridging gaps across cultures and experiences. Furthermore, literature is a catalyst for social change. It has the power to challenge norms, to question policies, and to push boundaries. The works of authors like Harriet Beecher Stowe and George Orwell have spurred movements and reformed societies. As we engage with literature, let us recognize its role in shaping the contours of society. In the pages of books, we find the seeds of the future, sown with words that can move nations.", "The speaker described literature as a mirror of reality and a way to build empathy by letting us experience other people's lives. Literature also drives social change by challenging norms and policies, as shown by authors like Stowe and Orwell. The lecture concluded that books contain the seeds of future change."], ["Climate Change Solutions 气候解决方案", "For too long, discussions about climate change have been about sacrifice. I am here to tell you that climate solutions actually make a better city and a better quality of life for everyone. This is only the first of five lessons we have learned on our journey to become an emission-free city. And I think these lessons can be applied almost anywhere. So I'd like to share them. So lesson number one, confronting climate change is about creating better cities and better quality of life for everyone, including those kids in the kindergarten, that don't have to share their days with noisy excavators. The second lesson is about being ambitious. In 2015, the city council set a target of reducing greenhouse gas emissions by 95 percent by 2030 without purchasing any carbon offsets. So aiming for real reductions. Commitment to this goal changed our mindset. If we were going to reach this target, every department had to get active, figure out measures and find out how to implement them. So second lesson, be ambitious.", "The lecture argued that climate solutions improve city life rather than require sacrifice. The speaker shared lessons from an emission-free city. The first lesson is that fighting climate change creates a better quality of life for everyone. The second is to be ambitious, citing a city that aimed to cut emissions by 95 percent by 2030 through real reductions."], ["Body-Confidence Education 身体自信教育", "If you actually want to make a difference, you have to do something. And we've learned there are three key ways: The first is we have to educate for body confidence. We have to help our teenagers develop strategies to overcome image-related pressures and build their self-esteem. Now the good news is that there are many programs out there available to do this. The bad news is that most of them don't work. I was shocked to learn that many well-meaning programs are inadvertently actually making the situation worse. So we need to make damn sure that the programs that our kids are receiving are not only having a positive impact, but having a lasting impact as well. And the research shows that the best programs address six key areas: The first is the influence of family, friends and relationships.", "The speaker said we must educate teenagers for body confidence to build self-esteem against image pressures. The lecture noted that many existing programs fail or even make things worse. The best programs address six key areas, starting with the influence of family, friends and relationships."], ["Sleep and Health 睡眠与健康", "The lecture focuses on the importance of sleep for human health and productivity. During sleep, the body repairs tissues, consolidates memories, and regulates hormones. Lack of sleep has been linked to reduced concentration, weakened immune function, and an increased risk of chronic diseases such as diabetes and heart conditions. Experts recommend that adults aim for seven to nine hours of sleep each night to maintain optimal physical and mental health.", "The lecture explained that sleep is essential for health and productivity. During sleep the body repairs tissues, consolidates memories, and regulates hormones. Lack of sleep weakens the immune system and raises the risk of chronic diseases. The speaker recommended seven to nine hours of sleep per night for adults."], ["Citizenship and American History 公民身份与美国史", "This class is about the post-emancipation African American experience. It is about American history. And I hope that point is frankly very obvious, but one never quite understands or can anticipate all of these things. It is about American history fundamentally. At its core, the course is about citizenship, the most important keyword for the entire class. The course is about citizenship, how one becomes a citizen, what one does to preserve that citizenship. At its core then, the class asks the question: what does it mean to be American? Now I will ask this question explicitly a few times in the class, but it implicitly is woven through so much of what I'm going to be talking about. What does it mean to be American?", "The lecture introduced a course on the post-emancipation African American experience, which is fundamentally about American history. The speaker said the core theme is citizenship—how one becomes and preserves it. The class repeatedly asks what it means to be American."]], "asq": [["What do we call a doctor who performs operations?", "Surgeon"], ["What is H2O commonly known as?", "Water"], ["How many legs does a spider have?", "Eight"], ["What is the capital of France?", "Paris"], ["What is the capital of Japan?", "Tokyo"], ["What is the capital of Australia?", "Canberra"], ["What is the capital of Italy?", "Rome"], ["What is the capital of Germany?", "Berlin"], ["What is the capital of Canada?", "Ottawa"], ["What is the capital of the United States?", "Washington"], ["What is the capital of England?", "London"], ["What do we call a person who studies stars?", "Astronomer"], ["What do we call a person who studies the past?", "Historian"], ["What do we call a person who designs buildings?", "Architect"], ["What do we call a person who treats sick animals?", "Veterinarian"], ["What do we call a person who makes bread?", "Baker"], ["What do we call a person who cuts hair?", "Barber"], ["What do we call a person who flies a plane?", "Pilot"], ["What do we call a person who teaches students?", "Teacher"], ["What do we call a person who writes books?", "Author"], ["What is the freezing point of water in Celsius?", "Zero"], ["What is the boiling point of water in Celsius?", "One hundred"], ["How many days are there in a leap year?", "Three hundred sixty-six"], ["How many months are there in a year?", "Twelve"], ["How many colors are there in a rainbow?", "Seven"], ["How many players are there on a soccer team?", "Eleven"], ["How many continents are there?", "Seven"], ["How many oceans are there?", "Five"], ["What is the largest planet in our solar system?", "Jupiter"], ["What is the closest star to Earth?", "The Sun"], ["What gas do plants absorb from the air?", "Carbon dioxide"], ["What do we call the study of the earth?", "Geography"], ["What do we call the study of living things?", "Biology"], ["What do we call the study of the mind?", "Psychology"], ["What do we call the study of the body?", "Anatomy"], ["What instrument measures temperature?", "Thermometer"], ["What instrument measures time?", "Clock"], ["What instrument is used to look at stars?", "Telescope"], ["What is the opposite of 'hot'?", "Cold"], ["What is the opposite of 'happy'?", "Sad"], ["What is the opposite of 'up'?", "Down"], ["What do we call a baby dog?", "Puppy"], ["What do we call a baby cat?", "Kitten"], ["What do we call a baby cow?", "Calf"], ["What do we call a male chicken?", "Rooster"], ["What is the main language spoken in Brazil?", "Portuguese"], ["What is the longest river in the world?", "The Nile"], ["What is the tallest mountain in the world?", "Mount Everest"], ["What is the largest ocean?", "The Pacific"], ["Which planet is known as the red planet?", "Mars"], ["What do we call a person who travels to space?", "Astronaut"], ["What is the chemical symbol for water?", "H2O"], ["What is the chemical symbol for gold?", "Au"], ["What is the chemical symbol for oxygen?", "O"], ["How many wheels does a bicycle have?", "Two"], ["Which season comes after summer?", "Autumn"], ["Which season comes after winter?", "Spring"], ["What do we call the study of weather?", "Meteorology"], ["What is the hardest natural substance?", "Diamond"], ["How many bones are there in the adult human body?", "Two hundred six"], ["What do we call a person who studies rocks?", "Geologist"], ["What is the smallest planet in our solar system?", "Mercury"], ["What do we call the place where books are kept?", "Library"], ["What do we call a person who makes maps?", "Cartographer"], ["What is the fastest land animal?", "Cheetah"], ["What is the largest land animal?", "Elephant"], ["What do we call a doctor who can sell prescribed medicines?", "Pharmacist"], ["What do we call a document that protects people's creative works?", "Patent"], ["What is a list of events placed in time order called?", "Chronology"], ["In a factory that releases poisonous gas, what is the most important safety measure: good ventilation or appropriate footwear?", "Ventilation"], ["If a contemporary artist's painting of an ancient battle is used by historians, is it an original source or a secondary source?", "Secondary source"], ["How do butterflies fly?", "Flutter"], ["What do we call the seasonal flying of birds from cold to warmer areas?", "Migration"], ["How many days are there in a fortnight?", "Fourteen"], ["How many sides are there in a bilateral agreement?", "Two"], ["How many years are there in a decade?", "Ten"], ["How many years are there in a millennium?", "One thousand"], ["Roughly how many years does it take to finish undergraduate study?", "Three or four years"], ["What is three quarters expressed as a percentage?", "Seventy-five percent"], ["What do we call people who study ancient bones, rocks and plants?", "Archaeologist"], ["How would you describe an economy that is largely based on farming?", "Agricultural"], ["If a button has come off a shirt, what would you most likely use to put it back on?", "Needle and thread"], ["If a coat has a stain on it, where would you take it?", "Dry cleaner's"], ["If something such as fabric or medicine is artificially made, what do we call it?", "Synthetic"], ["If telescopes are used to locate distant objects, what instrument is used to magnify very small objects?", "Microscope"], ["If there are eight black balls and one white ball, which color are you most likely to pick?", "Black"], ["If you don't feel like eating, what do we say you don't have?", "Appetite"], ["In business and advertising, what does PR stand for?", "Public relations"], ["In most universities, students are assessed in two ways: orally and through what?", "Written assignments"], ["In the animal kingdom, is the purpose of camouflage to attract a mate, to find food, or to hide?", "To hide"], ["In which century was the automobile manufactured on a large scale?", "Twentieth century"], ["In which subject would you learn about gravity?", "Physics"], ["Name a country located in North America.", "The United States"], ["Name a country located in the Southern Hemisphere.", "Australia"], ["The large island just off the coast of mainland Europe is home to which country?", "The United Kingdom"], ["What do we call paying at the counter after shopping?", "Checkout"], ["If a pipeline is leaking, who do you call to fix it?", "Plumber"], ["What can transfer quickly from one computer to another?", "A virus"], ["In a democratic government, who chooses the leaders?", "The people"], ["What do you get when you buy something from a shop?", "A receipt"], ["What are the dead remains of plants and animals called?", "Fossils"], ["What instrument helps you see things that are far away?", "Binoculars"], ["Who do you consult if you have a fear of crowds?", "A psychologist"], ["What is the main means of transport in developed countries?", "Public transport"], ["Where do you take clothes to be washed?", "A laundry"], ["Which month comes between September and November?", "October"], ["What organ do cardiologists specialize in?", "The heart"], ["Which is the less severe punishment: imprisonment or community service?", "Community service"], ["If a figure is hexagonal, how many sides does it have?", "Six"], ["What key mineral makes sea water different from fresh water?", "Salt"], ["What is the worship of idols called?", "Idolatry"], ["What do you call handwriting that cannot be read?", "Illegible"], ["What do you call a sound that cannot be heard?", "Inaudible"], ["What is a series of events that happen in your mind while you are sleeping?", "A dream"], ["What is a person who belongs to an organization called?", "A member"], ["What is it called when two or more people are speaking to each other?", "A conversation"], ["What is a violent conflict between two or more countries called?", "A war"], ["What do you call the number of people living in a specific area?", "Population"], ["What do you call a person who cannot hear?", "Deaf"], ["What is the payment of a student's education by an organization called?", "A scholarship"], ["What is a piece of paper with official information written on it called?", "A document"], ["What organ controls your speech, feelings, body movement and thoughts?", "The brain"], ["What piece of equipment shows you what direction you are traveling?", "A compass"], ["What is the day that someone is born called?", "A birthday"], ["What plan shows how much money is available and how it will be spent?", "A budget"], ["What is a system of government in which the people elect their leaders called?", "Democracy"], ["What is a long depression in the surface of the land that usually contains a river called?", "A valley"], ["Circumference, radius and diameter are features of which geometrical shape?", "A circle"], ["What do people wear if they cannot see very well?", "Spectacles"], ["In which branch of science does the periodic table belong?", "Chemistry"], ["What special document do most people carry during international travel?", "A passport"], ["If you forget the way, what would you buy to find your destination?", "A map"], ["What does a king or queen wear on their head at official ceremonies?", "A crown"], ["What are winter, spring, summer and autumn?", "Seasons"], ["What is the sweet food produced by bees?", "Honey"], ["What do we call the organs in our chest that we use to breathe?", "Lungs"], ["Which month comes after April?", "May"], ["What is confused and unintelligible language called?", "Jargon"], ["What is a place where dead bodies are kept called?", "A mortuary"], ["What do we call a person whose business is to find out criminals?", "A detective"], ["What is a government run by a dictator called?", "Autocracy"], ["What do we call a great lover of books?", "A bibliophile"], ["What is a place where fish are kept called?", "An aquarium"], ["What do we call a person who tests eyesight and sells spectacles?", "An optician"], ["What is the science of animal life called?", "Zoology"], ["What do we call a person who kills animals and sells their flesh?", "A butcher"], ["What is a disease that spreads by contact called?", "A contagious disease"], ["What do we call an animal that lives both on land and in water?", "An amphibian"], ["What is a building for keeping and feeding horses called?", "A stable"], ["What is the art and science dealing with language called?", "Grammar"], ["What is a mass of ice floating in the sea called?", "An iceberg"], ["What do you call your uncle's son?", "A cousin"], ["What do we call a person who is hurt in a criminal case?", "A victim"], ["What object do we use to open a window or a door?", "A handle"], ["What do you call a person who does a job without being paid?", "A volunteer"], ["What is the process of breaking down plastic and glass and using it again called?", "Recycling"], ["What do you call a person who is registered for an election?", "A candidate"], ["What is a reward paid to an employee at the end of the year called?", "A year-end bonus"], ["What are the animals that have fins called?", "Fish"], ["What do you call the case used to carry documents?", "A briefcase"], ["What protects birds from the cold?", "Feathers"], ["What is glass made from?", "Sand"], ["What do we use to get to the third floor when the elevator is broken?", "Stairs"]], "hiw": [["Effective learning in higher education relies heavily on the continuous feedback loop between instructors and students. While statistical grades provide a quick snapshot of performance, they often fail to demonstrate specific areas for improvement or detailed guidance. Constructive commentary allows students to clearly identify their weaknesses and adjust their study techniques accordingly. However, for this process to be truly successful, students must be willing to actively interact with the criticism rather than simply looking at the final score. Unfortunately, many learners view assessment purely as a scholastic hurdle to overcome, ignoring the valuable insights that could significantly enhance their future academic careers.", [["statistical", "numerical"], ["demonstrate", "communicate"], ["techniques", "strategies"], ["interact", "engage"], ["scholastic", "bureaucratic"], ["careers", "endeavors"]]], ["Effective learning in higher education relies heavily on the quality of feedback students receive on their assignments. It is not efficient to simply grade a paper and move on; instructors must provide instructive comments that highlight specific strengths and weaknesses. This outgoing dialogue allows students to understand where their reading may be flawed or where their arguments lack accurate evidence. Without this crucial guidance, learners often struggle to prove their academic performance significantly over time. Consequently, many universities are now prioritizing specialized training for staff to ensure they can deliver assessments that truly foster intellectual worth rather than merely measuring a student's current ability.", [["efficient", "sufficient"], ["instructive", "constructive"], ["outgoing", "ongoing"], ["reading", "reasoning"], ["accurate", "adequate"], ["prove", "improve"], ["worth", "growth"]]], ["Many students discover that the most memorable aspect of their university journey actually happens outside the lecture hall. Running student organizations provides a useful opportunity to broaden one's horizons beyond the standard curriculum. It is not merely about pursuing a fun hobby; it is fundamentally about building a robust support network. When you collaborate on complex projects with people from distinct backgrounds, you cultivate accountability and resilience. These soft skills are increasingly sought after in the modern job market, often weighing heavily in recruitment decisions. Moreover, the bonds formed during these activities frequently turn into lifelong professional relationships, proving that social interaction is key to future prosperity.", [["memorable", "beneficial"], ["Running", "Joining"], ["useful", "unique"], ["distinct", "diverse"], ["accountability", "adaptability"], ["interaction", "integration"]]], ["Rituals play a fundamental role in maintaining social order within traditional communities and modern societies alike. Anthropologists observe that these ceremonies often mark significant transactions in an individual's life, effectively guarding them from one status to another, such as during marriage or coming-of-age events. Through these structured preferences, shared values are reinforced, and group stability is significantly strengthened. Symbols used during these rituals carry precise meanings that are understood immediately by members of the culture but may seem absurd to outsiders. By analyzing these symbolic actions, researchers can gain valuable insight into the underlying beliefs that govern a society's daily behavior.", [["transactions", "transitions"], ["guarding", "guiding"], ["preferences", "performances"], ["stability", "solidarity"], ["precise", "profound"], ["absurd", "obscure"]]], ["For decades, final examinations served as the definitive method for evaluating student performance in higher education institutions. This conventional approach relied heavily on memory retention and the ability to focus under significant time pressure. However, many modern universities are increasingly shifting towards continuous assessment models to better reflect real-world demands. These methods allow for a more historic evaluation of a student's development throughout the entire academic year. By interpreting diverse tasks like research essays, oral presentations and group projects, educators can accurately monitor a wider range of skills, including critical analysis and communication. This transition acknowledges that true academic success implies far more than just passing a single high-stakes test.", [["definitive", "dominant"], ["focus", "function"], ["historic", "holistic"], ["interpreting", "incorporating"], ["monitor", "measure"], ["communication", "collaboration"], ["implies", "involves"]]], ["The rising temperatures have largely impacted the ice caps, causing them to disappear at an unprecedented rate.", [["largely", "greatly"], ["disappear", "melt"]]], ["We're going to have a short written assessment which will happen every fortnight. You will all be broken up into small groups, so feel free to ask any questions as I go along. And we'll also ask you to assimilate. So if you'd all like to open your books to page one.", [["broken", "taken"], ["assimilate", "participate"]]], ["The soldiers had been entrenched in their positions for several weeks, but there was little, if any, fighting, except for the dozen rounds they ritually exchanged each day. The weather was extremely pleasant. The rain was heavy with the scent of wild flowers and nature seemed to be following its course, quite unmindful of the soldiers hiding inside rocks and camouflaged by mountain shrubbery.", [["each", "every"], ["rain", "air"], ["inside", "behind"]]]], "we_rubric": [["内容 Content", 3, "是否切题、覆盖题目全部要点，并用细节/例子/解释支撑", ["3 充分回应题目所有要点，有具体细节与例子", "2 回应题目但漏掉一个次要要点", "1 漏掉一个主要要点或多于一个次要要点", "0 未恰当回应题目（整篇记 0）"]], ["形式 Form", 2, "字数 200–300 得满分；少于 120 或 多于 380 整篇记 0（全大写/无标点/纯要点亦 0）", null], ["发展·结构·连贯 DSC", 2, "逻辑结构、段落衔接、引言-主体-结论是否清晰", ["2 结构清晰、衔接顺畅，有引言/主体/结论", "1 结构偶有松弛，部分段落衔接弱", "0 缺乏连贯，多为罗列或松散片段"]], ["语法 Grammar", 2, "复杂句控制与错误频率", ["2 复杂句控制稳定，错误极罕见", "1 语法控制较好，无不致误解的错误", "0 多为简单句且有多处基础错误"]], ["通用语言范围 GLR", 2, "语言是否精准表达思想、句式与词汇复杂度", ["2 语言丰富精准，无表达受限", "1 语言足够清晰表达观点", "0 多为基础语言、欠精准"]], ["词汇范围 Vocabulary", 2, "学术词汇广度、同义与习语运用", ["2 词汇广博，含习语与地道表达", "1 词汇范围尚可，偶有不准确", "0 多为基础词汇，不足以应对话题"]], ["拼写 Spelling", 2, "拼写一致性（英/美任一体系，须统一）", ["2 拼写全对", "1 一处拼写错误", "0 多于一处拼写错误"]]], "ro": [["白藜芦醇 Resveratrol", ["Resveratrol, an antioxidant and red wine compound that protects the liver from fat accumulation caused by excessive drinking, is also present in dark chocolate and cocoa, according to a recent study.", "The study \"shows that the levels of resveratrol found in cocoa and chocolate products form yet another important link between the antioxidants found in cocoa and dark chocolate to other foods.\"", "Resveratrol gained widespread attention in the early 1990s when it was identified in relatively high amounts in red wine, which is associated with the French Paradox.", "Despite eating a diet equally high in saturated fat as typical American diet, the French were shown to have about one-third the level of cardiovascular disease.", "Continued research indicates that moderate consumption of red wine, along with fruits, vegetables, nuts and lower amounts of red meat, may contribute to this lower risk of heart disease."]], ["购物疗法 Shopping Therapy", ["Is shopping good for health or is it a disease we must call deadly?", "According to an article in an American journal, shopping as a therapy has been successfully tried on women suffering from depression.", "After shopping, the pulse-rate and blood pressure of women become normal, as it boosts their ego and creates adrenaline essential for feel-good sensations.", "The study was based on the survey of women of prosperous families in the USA and cannot be applied to Indian women.", "Nothing was said about women who feel depressed after spending their money.", "Researchers in the USA believe that after a woman is depressed for want of activity, she should be sent out to buy thing which will tune her and make her feel normal."]], ["现代人与自然 Modern Man & Nature", ["People who are at cross purposes with nature are cynical about mankind and ill at ease with themselves.", "Modern man must re-establish an unbroken link with mother nature and with life.", "He must learn again to invoke the energy of growing things and to recognize, as did the ancients in India, centuries ago, that one must take from the earth and the atmosphere only so much as one puts back into them.", "Some of the basic principles that need to be adhered to, in this regard are: the genetic viability on the earth shall not be compromised; the population levels of all life forms must be at least sufficient for their survival.", "All areas of the earth shall be conserved with the special protection offered to unique areas, various ecosystems and habitats of rare as well as endangered species."]], ["人工智能与博弈 AI & Games", ["Researchers in the field of artificial intelligence have long been intrigued by games, and not just as a way of avoiding work.", "Games provide an ideal setting to explore important elements of the design of cleverer machines, such as pattern recognition, learning and planning.", "Ever since the stunning victory of Deep Blue, a program running on an IBM supercomputer, over Gary Kasparov, then world chess champion, in 1997, it has been clear that computers would dominate that particular game.", "Today, though, they are pressing the attack on every front."]], ["联合国峰会 UN Summits", ["Conferences have played a key role in guiding the work of the UN since its inception.", "These conferences have turned into a high-profile level in need to resolve security issues and make progress in every aspect of human development.", "The Summits involve Heads of states and governments and other high-profile world leaders from intergovernmental and non-governmental organizations.", "UN Conference venues are designated United Nations territory and governed by the rules and regulations of the international body."]], ["物联网 Internet of Things", ["Decades ago, we connected computers and got today's powerful Internet.", "However, it has only been over the last few years that we have started to connect everyday objects using machine-to-machine (M2M) technologies to create the Internet of Things.", "But what does this really mean to you, your company, and your country?", "What are the possibilities it offers, and the threats it poses?"]], ["管理者的激励 Manager Motivation", ["Motivation is something that everyone needs. However, this is easier said than done.", "Motivation is a complicated internal situation that people have. It cannot be observed directly, but it can affect their behavior.", "The job of a manager in a workplace is to get things done through employees.", "To do this, the manager should be able to motivate employees."]], ["科技与社会 Science & Technology", ["It is a truism to say that in 21st century society science and technology are important.", "Human existence in the developed world is entirely dependent on some fairly recent developments in science and technology.", "Whether this is good or bad is, of course, up for argument,", "But the fact that science underlies our lives, our health, our work, our communications, our entertainment and our transport is undeniable."]], ["校园科技升级 School Tech Upgrade", ["Schools in our district will start the new year with updated technology in classrooms.", "Over the summer, tablets and interactive whiteboards were installed across multiple schools.", "Teachers have received training on how to integrate these tools into their lessons.", "The updates are part of a larger effort to enhance digital literacy among students.", "Parents and educators alike are hopeful that these improvements will make learning more engaging and effective."]]], "mcsa": [["贝类园圃 Clam Gardens", ["For decades, anthropologists characterized the indigenous peoples of the Pacific Northwest primarily as hunter-gatherers who passively harvested the region's natural bounty. However, recent archaeological investigations along the coastline have revealed extensive stone terrace structures known as 'clam gardens' constructed in the intertidal zone. These rock walls were built at the low-tide line to trap sediment and flatten the slope of the beach. By expanding the habitat suitable for butter clams and littleneck clams, these structures significantly increased shellfish productivity. Furthermore, the act of tending these gardens—tilling the sediment to aerate it and removing predators—ensured sustainable yields over generations. These findings challenge the traditional binary classification of agriculturalists versus foragers, suggesting that marine management was as sophisticated as terrestrial farming. The existence of such systems indicates that the coastal ecosystem was not merely exploited opportunistically but was actively engineered to ensure long-term food security."], "What is the author's primary argument regarding the discovery of clam gardens?", ["It proves that indigenous populations relied more heavily on seafood than on land-based hunting.", "It demonstrates that indigenous peoples practiced a form of environmental engineering rather than simple foraging.", "It suggests that archaeological methods have historically failed to identify coastal structures.", "It explains why the Pacific Northwest was able to support higher population densities than other regions."], 1], [" pristine 谜团 Pristine Myth", ["For generations, a prevailing historical narrative suggested that the North American continent was a primeval wilderness, lightly trodden by indigenous inhabitants who lived in harmony with an untouched environment. This perception, however, largely stems from the specific timing of European observation. Early sixteenth-century explorers often reported densely settled regions and extensive agricultural clearance. Yet, when colonization intensified over a century later, settlers encountered vast, unbroken forests. This discrepancy is largely attributed to a silent biological invasion that preceded the settlers: Old World pathogens. These diseases swept through native populations with devastating speed, often arriving well in advance of direct European contact. As communities collapsed, the open fields and managed landscapes they had maintained for centuries were abandoned. The dense woodlands that later observers described were, in fact, rapidly regenerating secondary forests masking the footprint of complex societies. Therefore, the landscape perceived as a wild frontier was not an enduring state of nature, but rather a 'widowed land' recovering from sudden anthropogenic withdrawal."], "According to the passage, why did later European settlers encounter vast forests instead of the populated landscapes reported by earlier explorers?", ["Indigenous populations had deliberately reforested their agricultural lands to avoid detection.", "Earlier explorers had exaggerated the extent of indigenous settlement and agriculture.", "The reduction in human activity due to disease allowed previously cleared land to regrow.", "European settlers arrived in different regions than those visited by the initial sixteenth-century explorers."], 2], ["氧化亚氮 Nitrous Oxide", ["While carbon dioxide dominates global warming discussions, nitrous oxide—a byproduct primarily of agricultural activities—poses a unique and formidable challenge. Often overlooked, this gas is roughly 300 times more effective at trapping heat than carbon dioxide. Its primary source is not a centralized industrial chimney that can be capped or filtered, but rather the vast expanses of fertilized farmland worldwide. When nitrogen fertilizers are applied to boost crop yields, soil bacteria convert the excess nitrogen into nitrous oxide, which then seeps into the air. This diffuse nature makes emission control extremely difficult compared to point-source pollution. Moreover, the gas persists in the atmosphere for over a century, meaning today's emissions will influence the climate for generations to come. Researchers suggest that without significant changes in global farming practices and fertilizer efficiency, climate targets will remain out of reach, regardless of the progress made in the renewable energy sector."], "What point does the author make about nitrous oxide emissions?", ["They are easier to monitor than carbon dioxide because they come from specific industrial sites.", "They constitute a significant climate hurdle because they stem from widespread farming and are long-lasting.", "They have recently surpassed carbon dioxide as the leading contributor to the greenhouse effect.", "They can be swiftly neutralized if synthetic nitrogen fertilizers are banned immediately."], 1], ["亚马逊黑土 Terra Preta", ["For centuries, archaeologists operated under the assumption that the Amazon basin was an inhospitable environment for large-scale civilization. The prevailing theory suggested that the region's acidic, nutrient-poor soils were incapable of supporting the intensive agriculture required to feed populous settlements. Consequently, the rainforest was viewed as a pristine, sparsely inhabited wilderness where only small, nomadic tribes could survive. However, recent findings have fundamentally challenged this perspective. Researchers have identified vast expanses of terra preta, or 'dark earth'—a highly fertile, anthropogenic soil found throughout the basin. Unlike the surrounding natural soils, terra preta is rich in charcoal, pottery shards, and organic matter, indicating deliberate engineering by indigenous populations over thousands of years. The existence of these modified soil tracts suggests that pre-Columbian Amazonia was not a virgin wilderness, but a managed landscape capable of sustaining millions of people in complex, sedentary societies. This revelation forces a reconsideration of the historical demography of South America and the sophistication of its early inhabitants' environmental stewardship."], "What is the main significance of the discovery of terra preta described in the passage?", ["It confirms that the natural soil of the Amazon was actually rich in nutrients.", "It disproves the idea that the Amazon could not support large, settled populations.", "It indicates that indigenous tribes preferred nomadic lifestyles to avoid soil depletion.", "It shows that European settlers introduced advanced soil management techniques."], 1], ["野牛与草原 Bison & Plains", ["For millennia, the American bison acted as the primary architect of the Great Plains, shaping the grassland ecosystem through specific grazing behaviors that modern livestock management struggles to replicate. Unlike cattle, which tend to linger near water sources and graze specific areas intensively, bison are highly mobile. They traverse vast distances, grazing an area briefly before moving on, a pattern that prevents the depletion of vegetation and allows for rapid recovery. This distinct behavior creates a heterogeneous landscape often described as a shifting mosaic, characterized by patches of short, grazed grass interspersed with taller, undisturbed vegetation. This structural variety is vital for the survival of the prairie ecosystem, particularly for grassland birds that require specific grass heights for nesting and foraging. Additionally, the bison's unique habit of wallowing—rolling in the dirt to remove molting fur and deter insects—creates compacted depressions. These depressions fill with rainwater to form ephemeral wetlands, supporting amphibians and providing drinking water for other wildlife. Thus, the decimation of bison herds in the 19th century fundamentally simplified the ecological complexity of the North American prairies."], "According to the text, what is a significant ecological consequence of the bison's migratory grazing habits?", ["The creation of a varied landscape structure that supports diverse bird populations", "The formation of compacted soil depressions that collect rainwater for amphibians", "The elimination of tall vegetation to ensure a uniformly grazed environment", "The concentration of grazing activity near water sources to protect open grasslands"], 0], ["默读与理解 Subvocalization", ["Subvocalization, often described as the internal speech made when reading words silently, allows the reader to imagine the sound of the word as it is processed. This natural mechanism helps the mind access meanings, thereby facilitating understanding and information recall. For decades, speed-reading advocates have categorized subvocalization as a detrimental habit, arguing that it creates a bottleneck by limiting reading speed to the pace of speaking—roughly 150 to 200 words per minute. Consequently, many training programs focus on techniques to suppress this inner voice to boost velocity. However, contemporary psycholinguistic research challenges the view that subvocalization should be completely eliminated. Studies indicate that while suppressing inner speech may indeed increase the raw number of words scanned per minute, it frequently leads to a significant drop in the grasp of the material, particularly when dealing with complex or nuanced arguments. The inner voice functions as a critical component of the phonological loop, holding data in working memory long enough for the brain to integrate concepts. Thus, rather than viewing subvocalization as a flaw to be eradicated, it is better understood as a regulatory tool. Proficient readers unconsciously adjust their reliance on this internal narration, minimizing it for simple texts while fully engaging it to navigate dense content."], "Which of the following best summarizes the author's perspective on subvocalization?", ["It is an inefficient habit that must be overcome to master rapid reading.", "It serves a valuable function in processing difficult texts and should not be entirely discarded.", "It causes the brain to overload by retaining too much information in working memory.", "It is essential for all types of reading, regardless of the simplicity of the content."], 1], ["查科峡谷 Chaco Canyon", ["The Chaco Canyon civilization in the American Southwest is celebrated for its complex social structure and monumental great houses. For years, the prevailing theory attributed the sudden abandonment of these settlements in the 12th century primarily to a severe, decades-long drought. However, recent bioarchaeological and geological studies have begun to paint a more nuanced picture involving human agency. Analysis of ancient packrat middens—rodent nests that preserve plant materials over millennia—demonstrates that the canyon was once surrounded by dense pinyon and juniper woodlands. Over centuries, the Chacoans harvested this timber extensively for construction and firewood. The removal of this critical ground cover likely triggered a cycle of soil erosion and arroyo cutting, which lowered the water table and decimated the maize crops upon which the society depended. Thus, while climate variability was undeniably a factor, the society's collapse was likely compounded by their unsustainable exploitation of the local environment, challenging the view that pre-colonial populations always lived in perfect equilibrium with their surroundings."], "Which of the following best summarizes the writer's argument regarding the decline of the Chaco Canyon civilization?", ["It was primarily caused by a failure to transport timber from distant mountain ranges.", "It was driven significantly by environmental degradation resulting from their own resource use.", "It occurred solely because of a catastrophic natural drought that struck the region.", "It resulted from the destruction of their maize crops by invasive rodent populations."], 1], ["阅读战争 Reading Wars", ["For decades, a fierce pedagogical debate known as the 'reading wars' has divided educators and policymakers regarding the most effective method for teaching children to read. On one side, proponents of phonics argue that explicit instruction in the relationships between letters and sounds is the essential building block of literacy. They maintain that before children can comprehend text, they must first be able to decode words systematically. Conversely, advocates of the whole-language approach emphasize the importance of immersion in meaningful texts, suggesting that reading is a natural process acquired through exposure, much like spoken language. Recent cognitive research has increasingly tipped the scales in favor of structured phonics instruction for early learners, demonstrating that specific neural pathways must be rewired to connect visual symbols with spoken language centers. While exposure to rich literature remains vital for vocabulary and motivation, the evidence suggests it cannot replace the foundational skills of decoding. Consequently, many educational systems are now pivoting away from pure whole-language methodologies toward structured literacy programs, although the practical implementation of these changes in classrooms remains uneven and often contentious."], "According to the passage, what has recent research indicated about learning to read?", ["Reading is an innate biological process that develops naturally through exposure to books.", "Systematic instruction in decoding is necessary to establish connections in the brain.", "The whole-language approach is superior because it prioritizes vocabulary and motivation.", "The debate over reading methods has been fully resolved with the universal adoption of phonics."], 1], ["新英格兰森林 New England Forests", ["When English settlers described the dense, impenetrable woodlands of New England in the early seventeenth century, they believed they were observing a primordial wilderness that had existed unchanged for millennia. However, modern environmental historians suggest that what these settlers encountered was not an ancient, untouched ecosystem, but rather a landscape in the midst of a dramatic ecological rebound. Prior to European contact, large Indigenous populations had cleared extensive tracts of land for maize agriculture and village sites. Tragically, the introduction of Old World pathogens in the sixteenth century resulted in a catastrophic demographic collapse among Native American communities. As populations dwindled, vast areas of cultivated land were abandoned. Consequently, the forests rapidly reclaimed these open fields through the process of secondary succession. Thus, the 'virgin' forest described in colonial chronicles was, in reality, a relatively young, dense overgrowth masking the footprint of a once-thriving agricultural society."], "What is the central argument regarding the New England forests described in the text?", ["They were ancient ecosystems that had remained biologically stable for thousands of years before European arrival.", "They were actively maintained by Indigenous populations using fire to prevent overgrowth.", "They were largely the product of recent regeneration after agricultural lands were left untended due to population decline.", "They appeared impenetrable primarily because English settlers lacked the skills to navigate the terrain effectively."], 2], ["有声书局限 Audiobook Limits", ["The debate concerning the legitimacy of audiobooks often centers on whether listening yields the same intellectual benefits as visual reading. Research indicates that for proficient readers, the cognitive processes used to construct meaning—such as inferring motives and visualizing scenes—are largely identical across both formats. The brain networks responsible for language comprehension are activated similarly, suggesting that the core experience of consuming a narrative is preserved regardless of the medium. Nevertheless, a critical structural difference exists regarding the control of attention. Visual reading inherently accommodates regression, allowing the reader's eyes to flit back to previous lines to clarify ambiguity or reinforce complex concepts before moving forward. In contrast, audio playback imposes a linear, continuous momentum that discourages pausing or rewinding for minor clarifications. While this unyielding pace rarely hinders the enjoyment of fiction, it can be detrimental when engaging with dense, informational texts where the ability to self-regulate speed and review specific details is essential for deep analysis."], "According to the passage, what is a significant limitation of the audiobook format?", ["It fails to stimulate the brain networks required for visualizing narrative scenes.", "It restricts the audience's ability to easily revisit and review earlier sections of the text.", "It is generally considered by researchers to be an invalid form of literacy.", "It reduces the emotional impact of the story compared to visual reading."], 1], ["图式理论 Schema Theory", ["Reading is frequently misconceived as a passive mechanism wherein a reader simply receives and records information transmitted by a writer. However, contemporary research in educational psychology depicts reading as an intensely active and constructive endeavor. Central to this understanding is the theory of 'schema'—the complex, organized clusters of knowledge stored in an individual's long-term memory. According to this view, comprehension is not merely about extracting meaning from printed symbols but rather about bringing meaning to them. A reader's capacity to interpret a text is fundamentally constrained by their pre-existing knowledge base. To illustrate, a technically grammatically correct passage analyzing the nuances of a cricket match might be entirely opaque to a reader unfamiliar with the sport's rules, despite their fluency in the language. Therefore, a deficit in reading comprehension is often not a failure of linguistic processing or vocabulary, but a lack of the specific background knowledge required to fill in the gaps left by the author. This insight has led educators to emphasize the accumulation of broad cultural literacy as a prerequisite for advanced reading proficiency, moving beyond simple phonics and decoding strategies."], "According to the text, why might a fluent reader struggle to understand a specific passage?", ["They lack the necessary decoding skills to recognize the vocabulary used.", "They are treating the reading process as an active rather than a passive task.", "They do not possess the relevant background concepts to interpret the subject matter.", "They are focusing too heavily on the grammatical structure of the sentences."], 2], ["碳捕集 CCS", ["Carbon capture and storage (CCS) has increasingly been positioned as a critical tool in the global effort to limit atmospheric warming. The process entails separating carbon dioxide from emissions streams at major industrial facilities, such as coal-fired power stations and cement plants. Following capture, the gas is compressed and injected deep into geological formations, such as saline aquifers, intended to sequester it indefinitely. While the theoretical benefits of CCS are clear, its practical application remains a subject of intense debate. Advocates emphasize that CCS provides a necessary pathway to decarbonize heavy industries that cannot easily switch to renewable electricity. Without such technology, they argue, achieving net-zero targets is virtually impossible. Conversely, skeptics highlight the significant energy penalty incurred during the capture phase, which paradoxically requires burning more fuel to generate the same amount of net power. Additionally, the integrity of geological storage poses a long-term risk; even minor leakages over centuries could undermine the climate benefits. Consequently, CCS occupies a complex position: it is viewed by many as an indispensable bridge technology, yet it is burdened by economic and environmental uncertainties that hinder its widespread adoption."], "According to the passage, which factor contributes to the controversy surrounding carbon capture and storage?", ["The technology completely eliminates the need for renewable energy sources.", "It involves operational trade-offs between energy efficiency and emission reduction.", "There are no suitable geological formations available for storing the gas.", "The process is currently restricted to small-scale residential applications."], 1], ["黑碳 Black Carbon", ["Black carbon, a primary component of soot, has emerged as a significant driver of global climate change, ranking second only to carbon dioxide in its warming influence. Unlike well-known greenhouse gases that can persist in the atmosphere for centuries, black carbon is a short-lived climate pollutant with a lifespan of merely days to weeks. Originating from the incomplete combustion of fossil fuels and biomass, these fine particles absorb solar energy and warm the atmosphere directly. Their impact is particularly severe in polar regions; when black carbon settles on snow and ice, it darkens the surface, reducing its ability to reflect sunlight—a phenomenon known as the albedo effect. This absorption of heat accelerates melting, exposing darker land or water beneath, which further intensifies warming. Consequently, researchers suggest that targeting black carbon emissions presents a unique opportunity for near-term climate relief. Since these particles are removed from the atmosphere relatively quickly by rain and gravity, cutting emissions could result in immediate cooling benefits, slowing the rate of Arctic ice loss more swiftly than carbon dioxide reductions alone."], "According to the passage, what is a key advantage of reducing black carbon emissions compared to reducing carbon dioxide?", ["It permanently eliminates the need to address fossil fuel consumption.", "It could produce faster climate cooling results due to the pollutant's short lifespan.", "It prevents the albedo effect from occurring in non-polar regions.", "It addresses a pollutant that stays in the atmosphere for hundreds of years."], 1], ["永冻土反馈 Permafrost Loop", ["Permafrost, the permanently frozen ground covering vast stretches of the Northern Hemisphere, serves as one of the Earth's largest terrestrial carbon sinks. For thousands of years, this frozen soil has locked away the remains of ancient plants and animals, effectively halting the decomposition process. However, as global temperatures rise, this permafrost is beginning to thaw at an unprecedented rate. When the ice melts, the organic matter within the soil becomes accessible to microbes, which break it down and release the by-products into the atmosphere. Depending on oxygen availability, this process emits either carbon dioxide or methane. The release of methane is particularly concerning because it is significantly more efficient at trapping heat than carbon dioxide over shorter timeframes. This creates a dangerous feedback loop: as the planet warms, more permafrost thaws, releasing more greenhouse gases, which in turn causes further warming. Consequently, what was once a stable storage system for carbon is threatening to become a major contributor to global climate instability."], "What is the main conclusion drawn by the writer regarding permafrost?", ["It acts as a permanent barrier that prevents microbes from accessing organic matter regardless of temperature.", "The release of gases from thawing soil creates a cycle that further accelerates global warming.", "Carbon dioxide is the primary concern because it traps heat more efficiently than methane.", "Recent studies show that permafrost is expanding due to shifts in the Earth's climate stability."], 1], ["巨型动物灭绝 Megafauna", ["For decades, paleontologists have debated the sudden disappearance of North America's megafauna—giant creatures such as mammoths, mastodons, and saber-toothed cats—at the end of the Pleistocene epoch. The 'overkill hypothesis,' first popularized in the 1960s, posits that the arrival of humans across the Bering Land Bridge directly precipitated these extinctions through aggressive hunting practices. Proponents argue that the timing of human arrival coincides too perfectly with the collapse of megafaunal populations to be coincidental. However, recent radiocarbon dating and climatic reconstructions suggest a more nuanced reality. Evidence indicates that significant climate fluctuations, leading to habitat loss and vegetation changes, were already stressing these populations prior to human entry. Consequently, many researchers now advocate for a synergistic model, suggesting that while human predation may have delivered the final blow to weakened populations, it was likely the rapid environmental restructuring that made these species vulnerable in the first place."], "Which view regarding the extinction of North American megafauna does the writer support?", ["The extinction was caused exclusively by the sophisticated hunting methods of early humans.", "Climate change theories have been largely dismissed in favor of the overkill hypothesis.", "A combination of ecological changes and human activity likely led to the species' demise.", "Megafaunal populations had already vanished before humans migrated across the Bering Land Bridge."], 2], ["默读革命 Silent Reading", ["For much of human history, reading was fundamentally a social and auditory act. In classical antiquity, written texts were generally viewed as scripts for performance, intended to be declaimed to an audience or muttered aloud to oneself. The concept of reading silently, processing information directly from eye to brain without the mediation of the voice, was widely regarded as an anomaly. St. Augustine, in his Confessions, famously expressed astonishment upon witnessing Ambrose, the Bishop of Milan, reading without moving his lips—a behavior so unusual in the fourth century that it warranted specific documentation. The gradual transition to silent reading, which became more prevalent during the Middle Ages with the introduction of word separation in manuscripts, revolutionized the intellectual landscape. It transformed reading from a communal performance into a private, interior experience. This shift fostered a new form of individual autonomy, allowing readers to traverse texts at their own pace and engage in critical introspection without the constraints of a gathering. Consequently, the written word became a vehicle for private reflection, fundamentally altering the relationship between the reader and the text."], "According to the passage, what was a significant consequence of the historical shift towards silent reading?", ["It reduced the speed at which readers could process written information.", "It changed reading from a public activity into an independent, reflective practice.", "It led to a decrease in the production of manuscripts intended for performance.", "It caused religious authorities to ban the practice of reading aloud in groups."], 1]], "mcma": [["深海甲壳类 Deep-Ocean Crustaceans", ["Scientists studying the deep ocean have recently discovered several new species of crustaceans near hydrothermal vents. These species survive in extreme temperatures and complete darkness. Unlike most marine organisms, they depend on chemosynthesis rather than sunlight. However, researchers still lack detailed information about their population size, reproductive patterns, and long-term survival."], "Which TWO statements are correct? (选 2 项)", ["The newly found species live in conditions with no sunlight.", "Scientists have a clear understanding of how these species reproduce.", "The organisms rely on chemical processes for energy.", "Researchers have fully determined their long-term survival.", "These species are commonly found throughout all ocean regions."], 0, 2], ["电动滑板车 Electric Scooters", ["Over the last decade, electric scooters have become popular in many cities. They are considered a convenient alternative for short distances. However, critics argue that improper parking and reckless riding often create safety hazards for pedestrians. Many local governments are now setting regulations to maintain public safety."], "Which TWO statements are correct? (选 2 项)", ["Electric scooters are mainly used for long-distance travel.", "Some people believe scooters cause problems for pedestrians.", "Governments are trying to regulate scooter usage.", "Electric scooters have declined in popularity recently.", "All cities have banned electric scooters."], 1, 2], ["撒哈拉南扩 Sahara Expansion", ["The Sahara Desert is expanding southward partly due to climate change and unsustainable farming practices. As rainfall decreases, fertile land gradually turns into desert. Many communities struggle to maintain agriculture, forcing families to migrate to other regions in search of resources."], "Which TWO statements are correct? (选 2 项)", ["Reduced rainfall is one cause of the Sahara's expansion.", "Farming practices have no effect on desertification.", "Some families are relocating because farming is becoming difficult.", "The Sahara is shrinking because of climate change.", "Most communities are improving their agricultural systems."], 0, 2], ["膳食纤维 Dietary Fiber", ["Recent studies show that consuming meals high in fiber improves digestion and helps maintain stable blood sugar levels. However, nutritionists warn that suddenly increasing fiber intake may lead to bloating. They advise introducing high-fiber foods gradually over several weeks."], "Which statements are correct? (选 3 项)", ["Fiber helps regulate blood sugar.", "Increasing fiber suddenly can cause discomfort.", "Nutritionists recommend avoiding fiber altogether.", "Studies show fiber has no effect on digestion.", "Nutritionists encourage gradual changes in diet."], 0, 1, 4], ["野生蜜蜂 Wild Bees", ["Wild bees play a crucial role in pollinating crops. Unfortunately, habitat loss and pesticide exposure have significantly reduced their populations. Some farms have begun creating 'pollinator gardens' to provide safe environments for bees and attract them back to agricultural areas."], "Which TWO statements are correct? (选 2 项)", ["Bee populations are decreasing because of pesticides.", "Wild bees do not contribute to crop pollination.", "Some farms are taking steps to restore bee habitats.", "Habitat loss has no influence on bee survival.", "Pollinator gardens are harmful to bee populations."], 0, 2], ["现代图书馆 Modern Libraries", ["Historically, libraries served as quiet spaces for reading. Today, many libraries offer digital equipment, group study rooms, and community workshops. Although these changes have modernized library services, some visitors still prefer silent reading environments."], "Which statements are correct? (选 3 项)", ["Modern libraries provide more than just books.", "All visitors enjoy the newer, busier library environment.", "Some people still prefer quiet spaces.", "Libraries have stopped offering reading spaces.", "Digital equipment is now part of many libraries."], 0, 2, 4], ["喜马拉雅冰川 Himalayan Glaciers", ["The Himalayan region contains some of the world's fastest-melting glaciers. Rising temperatures are creating large glacial lakes, increasing the risk of sudden floods. Scientists are monitoring these areas closely to predict possible dangers."], "Which statements are correct? (选 3 项)", ["Himalayan glaciers are melting slowly.", "Melting ice contributes to the formation of glacial lakes.", "Scientists are observing these regions carefully.", "Flood risks have decreased in recent years.", "Temperature rise is affecting glacier melt."], 1, 2, 4], ["AI 客服 AI Chatbots", ["Artificial intelligence is transforming customer service worldwide. Many companies now use chatbots to answer simple questions instantly. Although they reduce workload for staff, customers sometimes complain that chatbots cannot understand complex problems well."], "Which TWO statements are correct? (选 2 项)", ["AI chatbots help handle basic customer inquiries.", "Customers think chatbots solve all complex issues perfectly.", "Chatbots reduce employee workload.", "AI is rarely used in customer service.", "Companies avoid using chatbots."], 0, 2], ["屋顶太阳能 Rooftop Solar", ["Renewable energy sources such as solar and wind power have bec
