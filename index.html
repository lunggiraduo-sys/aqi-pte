<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>阿奇PTE</title>
<style>
  :root{--slate:#33495F;--teal:#2C8C99;--bg:#F4F6F7;--card:#FFFFFF;--line:#DDE3E6;--muted:#6B7780;--amber:#B7791F;--red:#C0392B;--green:#0E7A6B;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overscroll-behavior:none;overflow-x:hidden;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#222;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden;position:relative;}
  /* iPhone tuning：清掉 iOS 原生控件外观 + 屏蔽 UI 长按弹出菜单（机经正文仍可选中复制） */
  button,.btn,.speak,.mic,.mini,.tabs button,.diff-btn,.reset,nav button,select{-webkit-appearance:none;appearance:none;}
  nav,nav button,.btn,.speak,.mic,.tabs button,.adpt,.tlink,.stages .st,.diff-btn,.mini,.reset{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
  input,textarea,select{font-size:16px;}
  .app{max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(51,73,95,.08);}
  @media(min-width:600px){.body{padding:22px 22px 30px;} .card{padding:22px;} header{padding:max(18px,var(--safe-top)) 22px 0;} .big-word{font-size:30px;} .ex.show{font-size:15px;}}
  header{background:var(--slate);color:#fff;padding:max(14px,var(--safe-top)) 16px 0;position:sticky;top:0;z-index:5;}
  header h1{margin:0;font-size:17px;font-weight:600;}
  header p{margin:2px 0 0;font-size:12px;opacity:.8;}
  .topbar{margin:10px -16px 0;background:var(--teal);color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:7px;letter-spacing:.3px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}
  .topbar.done{background:var(--green);}
  .topbar .fire{color:#FFE08A;}
  .body{flex:1;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:14px;}
  .card.sp{border-left:3px solid var(--amber);}
  .card.li{border-left:3px solid var(--teal);}
  .card.rw{border-left:3px solid #5E51A8;}
  .card.wr{border-left:3px solid var(--red);}
  .card:last-child{margin-bottom:10px;}
  .ph{font-size:15px;font-weight:700;color:var(--slate);margin-bottom:10px;}
  .wd{cursor:pointer;text-align:center;}
  .big-word{font-size:26px;font-weight:600;color:var(--slate);line-height:1.4;word-break:break-word;}
  .ipa{margin-top:8px;font-size:16px;color:var(--teal);text-align:center;font-family:"Charis SIL","Doulos SIL",Georgia,serif;letter-spacing:.3px;}
  .ipa.muted{font-size:13px;color:var(--muted);font-family:inherit;}
  .pos{margin-top:6px;font-size:12px;color:var(--amber);text-align:center;font-style:italic;}
  .cn{margin-top:12px;font-size:17px;color:#333;text-align:center;line-height:1.5;display:none;}
  .cn.show{display:block;}
  .ex{margin-top:10px;font-size:13.5px;color:#444;line-height:1.6;background:#F7F9FA;border:1px solid var(--line);border-radius:10px;padding:10px;display:none;}
  .ex.show{display:block;}
  .ex .en{color:var(--slate);} .ex .zh{color:var(--muted);margin-top:3px;}
  .flip-tip{margin-top:14px;text-align:center;font-size:13px;color:var(--teal);}
  .row{display:flex;gap:12px;margin-top:14px;}
  .btn{flex:1;border:none;border-radius:12px;padding:15px 0;font-size:16px;font-weight:600;color:#fff;background:var(--teal);cursor:pointer;touch-action:manipulation;}
  .btn.ghost{background:#fff;color:var(--slate);border:1px solid var(--line);}
  .btn:active{transform:scale(.98);}
  .speak,.mic{width:100%;margin-top:12px;border:none;border-radius:12px;padding:14px 0;font-size:16px;font-weight:600;cursor:pointer;color:#fff;touch-action:manipulation;}
  .speak{background:var(--slate);} .mic{background:#5E51A8;} .mic:active{transform:scale(.98);} .speak:active{transform:scale(.98);}
  .mic.recording{animation:micPulse 1.2s infinite;box-shadow:0 0 0 4px rgba(192,57,43,.35);background:var(--red);}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45);}50%{box-shadow:0 0 0 10px rgba(192,57,43,.1);}}
  ul.tasks{list-style:none;padding:0;margin:0;}
  ul.tasks li{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45;}
  ul.tasks li:last-child{border-bottom:none;}
  ul.tasks input{margin-top:3px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--teal);}
  ul.tasks input:checked+span{text-decoration:line-through;color:var(--muted);opacity:.65;}
  ul.tasks a{color:var(--teal);font-weight:600;}
  .stat{display:flex;justify-content:space-around;text-align:center;}
  .stat div span{display:block;font-size:22px;font-weight:700;color:var(--teal);}
  .stat div small{color:var(--muted);font-size:12px;}
  .done{text-align:center;padding:36px 10px;color:var(--muted);}
  .stages{display:flex;gap:8px;margin-bottom:14px;}
  .stages .st{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;background:#fff;cursor:pointer;}
  .stages .st.on{border-color:var(--teal);background:#EAF4F5;}
  .stages .st b{display:block;font-size:13px;color:var(--slate);}
  .stages .st small{font-size:10.5px;color:var(--muted);}
  .stinfo{font-size:13.5px;line-height:1.7;color:#333;}
  .stinfo .goal{color:var(--teal);font-weight:600;}
  .stinfo ol{margin:8px 0 0;padding-left:20px;}
  .stinfo li{margin-bottom:5px;}
  details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;}
  details summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--slate);}
  details .t{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;font-size:13px;line-height:1.6;color:#333;white-space:pre-wrap;}
  .mock input{width:54px;padding:6px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin:0 3px;}
  .mock button{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px;}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .tabs button{flex:1;min-width:64px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:8px 4px;font-size:13px;cursor:pointer;}
  .tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600;}
  .tabs.prac{background:#EEF1F5;border-radius:12px;padding:5px;margin-bottom:10px;}
  .tabs.prac button{min-width:0;padding:7px 2px;font-size:12.5px;}
  .real a{display:block;color:var(--slate);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .real a b{color:var(--teal);} .real a small{display:block;color:var(--muted);font-size:12px;margin-top:2px;}
  nav{display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:max(var(--safe-bot),8px);}
  nav button{flex:1;border:none;background:none;padding:0;min-height:50px;display:flex;flex-direction:column;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;border-top:2px solid transparent;touch-action:manipulation;}
  nav button.on{color:var(--teal);border-top-color:var(--teal);font-weight:600;background:rgba(44,140,153,.08);}
  nav button:active{opacity:.6;background:rgba(44,140,153,.06);}
  .reset{margin-top:6px;width:100%;background:#fff;color:var(--red);border:1px solid #E2B4AE;border-radius:10px;padding:11px;font-size:14px;cursor:pointer;}
  .badge{display:inline-block;background:#EAF4F5;color:var(--teal);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:2px;}
  .wk{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px;}
  .chk{font-size:14px;color:var(--green);text-align:center;margin-top:10px;}
  .tok-ok{color:var(--green);font-weight:600;} .tok-no{color:var(--red);text-decoration:line-through;opacity:.7;}
  .ta{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:inherit;resize:vertical;min-height:60px;touch-action:manipulation;}
  .exam{background:linear-gradient(135deg,#EAF4F5,#F3F1F8);border:1px solid #D7E3E5;border-radius:12px;padding:12px 14px;margin-bottom:12px;}
  .exam.hot{background:linear-gradient(135deg,#FBEDEA,#F3F1F8);border-color:#EBC9C2;}
  .ex-d{display:block;font-size:15px;font-weight:600;color:var(--slate);}
  .ex-d b{color:var(--teal);font-size:18px;}
  .ex-sub{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45;}
  .ex-row{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .ex-row input[type=date]{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px;font-family:inherit;}
  .mini{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .tip{background:#FFF8EC;border:1px solid #F0E0BF;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;color:#7a5a1e;margin-bottom:12px;}
  .tip b{color:#B7791F;}
  .tpb{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;margin-right:4px;vertical-align:middle;}
  .tpb.sp{background:#FDEBD0;color:#B7791F;} .tpb.li{background:#EAF4F5;color:var(--teal);} .tpb.rw{background:#F3F1F8;color:#5E51A8;} .tpb.wr{background:#FBEDEA;color:var(--red);}
  .ring-wrap{display:flex;justify-content:center;gap:24px;margin-bottom:12px;}
  .ring{text-align:center;}
  .ring svg{display:block;margin:0 auto;}
  .ring .ring-label{font-size:11px;color:var(--muted);margin-top:4px;}
  .review-badge{display:inline-block;background:#FBEDEA;color:var(--red);font-size:11px;font-weight:600;padding:2px 10px;border-radius:10px;margin-left:6px;}
  .tlink{cursor:pointer;color:var(--teal);border-bottom:1px dashed var(--teal);transition:opacity .15s;}
  .tlink:active{opacity:.6;}
  .heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;justify-content:center;margin:8px 0;}
  .heat-cell{width:12px;height:12px;border-radius:3px;background:#EDEFF2;}
  .heat-cell.l1{background:#BFE0E4;} .heat-cell.l2{background:#6FBFC6;} .heat-cell.l3{background:#2C8C99;}
  .diff-row{display:flex;gap:8px;margin-top:10px;}
  .diff-btn{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 0;font-size:13px;cursor:pointer;background:#fff;text-align:center;transition:all .15s;}
  .diff-btn:active{opacity:.6;}
  .diff-btn.easy:active,.diff-btn.easy:hover{background:#E8F5E9;border-color:var(--green);color:var(--green);}
  .diff-btn.mid:active,.diff-btn.mid:hover{background:#FFF8EC;border-color:var(--amber);color:var(--amber);}
  .diff-btn.hard:active,.diff-btn.hard:hover{background:#FBEDEA;border-color:var(--red);color:var(--red);}
  .mock-head{display:flex;justify-content:space-between;align-items:center;background:var(--slate);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:14px;}
  .mock-prog{font-size:13px;font-weight:600;}
  .cd{font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:#FFE08A;}
  .cd.hot{color:#FF8A80;animation:micPulse 1s infinite;}
  .cd.untimed{font-size:12px;font-weight:600;color:#CFE9ED;}
  .mock-total{font-size:12px;opacity:.85;}
  .mock-pick{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .mock-self{display:flex;align-items:center;gap:10px;margin:14px 0 4px;padding:10px 12px;background:#FAFBFC;border:1px solid var(--line);border-radius:10px;}
  .mock-self .lab{font-size:12px;color:var(--muted);white-space:nowrap;}
  .sr-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
  .sr-btn.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .sr-btn:active{transform:scale(.92);}
  .mock-self .desc{font-size:12px;color:var(--teal);min-width:36px;font-weight:600;}
  .weak-box{margin-top:12px;background:#FBEDEA;border:1px solid #F3C9C1;border-radius:10px;padding:12px;}
  .weak-box b{color:var(--red);}
  .star{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;color:var(--muted);transition:all .15s;}
  .star.on{background:#FFF4D6;border-color:var(--amber);color:var(--amber);}
  .star:active{transform:scale(.9);}
  .card{position:relative;}
  .kw{background:#FFF3CD;color:#8a6d1a;font-weight:600;border-radius:3px;padding:0 2px;}
  .kwlist{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.8;}
  .kwchip{display:inline-block;background:#FFF3CD;color:#8a6d1a;border:1px solid #F0E0BF;border-radius:10px;padding:1px 8px;margin:2px 4px 2px 0;font-size:11px;font-weight:600;}
  .shadow{background:var(--amber)!important;color:#fff!important;border-color:var(--amber)!important;}
  .adpt{cursor:pointer;color:var(--teal);padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5;transition:opacity .15s;}
  .weak-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--slate);cursor:pointer;line-height:1.4;}
  .weak-row:active{opacity:.6;}
  .adpt:active{opacity:.6;}
  .adpt::before{content:'🔗 ';}
  .fav-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;}
  .fav-item .txt{font-size:13px;line-height:1.55;color:var(--slate);flex:1}
  .fav-item .tag{font-size:11px;color:#fff;background:var(--teal);border-radius:6px;padding:2px 7px;margin-right:6px;white-space:nowrap}
  .fav-item .acts{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .pbar{height:7px;background:#EDEFF2;border-radius:5px;overflow:hidden;margin:2px 0 6px;}
  .pfill{height:100%;background:linear-gradient(90deg,var(--teal),#3FA7B4);border-radius:5px;transition:width .35s ease;}
  .ph-sub{font-size:12px;color:var(--muted);margin:0 0 10px;font-weight:500;}
  footer{text-align:center;font-size:11px;color:var(--muted);padding:10px;}
  .hiw-word{cursor:pointer;border-bottom:1px solid transparent;border-radius:3px;transition:background .15s, border-color .15s;padding:0 1px;}
  .hiw-word.hiw-on{background:rgba(44,140,153,.20);border-bottom:1px solid var(--teal);}
  .diff-btn.on{background:#EAF4F5;border-color:var(--teal);color:var(--teal);font-weight:700;}
  .ratebox{background:#F7F9FA;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;}
  .rate-tip{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .rate-row{display:flex;align-items:center;gap:8px;margin:5px 0;}
  .rate-lab{width:46px;font-size:12px;color:var(--slate);flex-shrink:0;}
  .rate-best{font-size:12px;color:var(--teal);margin-top:4px;min-height:14px;}
  .overall-box{text-align:center;background:linear-gradient(0deg,#F7F9FA,#fff);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;}
  .ob-num{font-size:40px;font-weight:700;line-height:1;color:var(--slate);}
  .ob-lab{font-size:12px;color:var(--muted);margin-top:4px;}
  .ob-msg{font-size:13px;font-weight:600;margin-top:6px;}
  .ob-msg2{font-size:13px;color:var(--slate);margin-top:6px;font-weight:600;}
  .wordcards{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .wordcard{background:#fff;color:var(--slate);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;transition:.12s;line-height:1.4;}
  .wordcard:hover{border-color:var(--teal);background:#EAF4F5;}
  .wordcard.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .rub-box{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FBFCFD;}
  .rub-h{font-weight:700;color:var(--slate);font-size:14px;margin-bottom:8px;}
  .rub-src{font-size:11px;font-weight:600;color:#fff;background:var(--teal);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle;}
  .rub-trait{padding:7px 0;border-top:1px dashed var(--line);}
  .rub-trait:first-of-type{border-top:none;}
  .rub-name{font-size:13px;font-weight:700;color:var(--slate);}
  .rub-scale-tag{font-size:11px;font-weight:600;color:var(--muted);margin-left:4px;}
  .rub-desc{font-size:11.5px;color:var(--muted);margin:2px 0 5px;}
  .rub-btns{display:flex;flex-wrap:wrap;gap:6px;}
  .rub{background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--slate);min-width:34px;text-align:center;}
  .rub:hover{border-color:var(--teal);}
  .rub.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .rub-auto{font-size:12px;font-weight:600;color:var(--green);}
  .rub-band{font-size:11.5px;color:#55606B;margin-top:3px;min-height:14px;}
  .rub-foot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--slate);}
</style>
</head>
<body>
<div class="app">
<header>
  <h1>阿奇PTE</h1>
  <p>计划驱动 · 录音纠音 · 离线可用</p>
</header>
<div class="body" id="body"></div>
<nav id="nav">
  <button data-t="today" class="on">今日</button>
  <button data-t="practice">练习</button>
  <button data-t="mock">模考</button>
  <button data-t="plan">计划</button>
  <button data-t="mine">我的</button>
</nav>

], ["Physics is a key subject for understanding the world and the universe", "", 1], ["Undergraduates have a wide range of cultural modules to choose from", "", 1], ["Too much information may be avoided by a good research design", "", 1], ["Implementation figures are expected to improve over the next few years", "", 1], ["The university's garden is open to the public in the summer", "", 1], ["The school's academic tradition ensures excellence", "", 0], ["When parents talk to children the tense is simplified", "", 1], ["Leaving valuable possessions unattended in public places is risky", "", 1], ["This book can be borrowed for up to 1 week", "", 1], ["Purity is one feature that makes gold expensive", "", 0], ["I thought it was through the small meeting room", "", 1], ["The new technician dropped the microscope in the biology lab", "", 1]], "rs_sen": ["The wheelchair lift has been upgraded this month.", "Doing this research makes me think of the purpose of science.", "The office said Dr. Smith will arrive later today.", "The recent study has thrown out the validity of the argument.", "To receive the reimbursement, you must keep the original receipts.", "The theoretical proposal was challenging to grasp.", "Please finish all the reading chapters before the field trip.", "If she doesn't speak the language, she's not going to sit around and wait for a translator.", "Being a student representative on the union really cuts into my study time.", "Being a vegan means not consuming any animal products.", "The United States has developed a coffee culture in recent years.", "Meeting with tutors could be arranged for students who need additional help.", "The cafeteria closes soon but the snack machine is accessible throughout the night.", "The visiting professor is going to give a lecture on geology.", "Conferences are always scheduled on the third Wednesday of the month.", "Student loans are now available for international students.", "He told me it was the most important assignment of all.", "The hypothesis needs to be tested in a more rigorous way.", "Today, we will be discussing the role of the government in preventing injustice.", "Animals grow larger and stronger to help them hunt better.", "All sources of materials must be included in your bibliography.", "There are a range of housing options near the university.", "Our school of Arts and Technology accepts applications at all points throughout the year.", "Students are competing for every place in the computer courses.", "Higher fees make students think more critically about what universities can offer.", "The student service center is located on the main campus behind the library.", "The generic biology technology lab is located at the North Wing of the library.", "We want to attract the very best students regardless of their financial circumstances.", "Expertise in particular areas distinguish you from other graduates in a job interview.", "Arteries carry oxygenated blood from the heart to other parts of the body.", "We need to read the first five chapters to prepare for next week's tutorial.", "In my free time, I would like to read current affairs and newspapers.", "Our capacity to respond to national needs will determine our ability to flourish.", "Biographical information should be removed prior to the publication of results.", "The arts magazine is looking for a new assistant editor.", "We offer a broad range of undergraduate and postgraduate courses.", "The technician left the new microscope in the biology lab.", "Most of the assignments should be submitted on the same day.", "Anyone who has a problem with their accommodation should speak to the welfare officer.", "The university policy on plagiarism can be viewed on the website.", "Among various heating and cooling systems, central heating proves to be superior.", "Meteorology involves a comprehensive analysis of the Earth's atmospheric conditions.", "Before reaching final conclusions, it's imperative to verify underlying assumptions.", "In the analysis of statistical data, considering gender is fundamentally important.", "The university will provide accommodation for all international students during their first year.", "Technological advancements have radically transformed the way we communicate and conduct business globally.", "The results of the longitudinal study were highly consistent with previous findings in the field of psychology.", "Artificial intelligence and machine learning are redefining the future of the global workforce across all sectors."], "stages": [{"id": "P0", "name": "摸底", "dur": "第 1 周", "goal": "报名+模考摸底，找到起点", "tasks": ["去 Pearson 官网报名定死考试日期（≤3 个月）", "做 1 套官方 Scored Practice 模考", "记录四项分（听/说/读/写），看离 58 差多远", "每天基础词 15 个 + 泛听 15min 预热"]}, {"id": "P1", "name": "核心突破", "dur": "第 2–5 周", "goal": "吃透 5 大核心题型 + 模板烂熟", "tasks": ["RA 大声朗读：每天 3 段，练流利度（点「练习」→口语→RA）", "RS 复述句子：每天 20 句，抓意群主干（点「练习」→口语→RS）", "DI 描述图表：模板滚瓜烂熟，每天 3 题（点「练习」→口语→DI）", "WFD 听写：每天 15 句机经，错词逐个纠正（点「练习」→听力→WFD 听写）", "FIB 词汇填空：每天 8 题，积累搭配（点「练习」→词汇）", "写作模板：SWT 一句话总结 + WE 模板背熟（点「练习」→写作）", "SST 精听：每天 1 篇，抓主题+3要点（点「练习」→听力→SST）"]}, {"id": "P2", "name": "全科刷题", "dur": "第 6–8 周", "goal": "全题型覆盖 + 弱项专项突破", "tasks": ["保持核心 5 题型日练量（RA/RS/DI/WFD/FIB）", "补齐次要题型：RL/RO/FIB-L/HIW（点「计划」→题型 看优先级）", "每周计时写 2 篇 WE + 3 篇 SWT（点「练习」→写作）", "WFD 句库通勤浏览，考前全部过 2 遍（点「练习」→听力→WFD 句库）", "MC 选择题可放弃——分值低还倒扣（详见「计划」→题型 页 ⏭ 可放弃）"]}, {"id": "P3", "name": "模考冲刺", "dur": "第 9–12 周", "goal": "全真模考 + 查漏补缺 + 机考适应", "tasks": ["每周 1 套官方 Scored Practice 模考（myPTE）", "按模考报告弱项专训（低于 50 的题型重点补）", "考前 2 周集中刷 WFD/RS 机经（点「练习」→听力/口语）", "练机考节奏：2 小时连考不慌，考前 1 天停练休息", "考试当天：带护照→提前 30min 到场→深呼吸→相信自己"]}], "daily": {"P0": ["做 1 套官方模考（myPTE Scored Practice）", "词汇 15 个（点「练习」→词汇）", "泛听 SST 1 篇（点「练习」→听力→SST）"], "P1": ["RA 朗读 3 段（点「练习」→口语→RA）", "RS 复述 20 句（点「练习」→口语→RS）", "DI 描述 3 题（点「练习」→口语→DI）", "WFD 听写 15 句（点「练习」→听力→WFD 听写）", "FIB 词汇 8 题（点「练习」→词汇）", "写作模板练 1 题（点「练习」→写作）"], "P2": ["RA/RS/DI 各 3 题（点「练习」→口语）", "WFD 听写 15 句（点「练习」→听力→WFD 听写）", "SST 精听 1 篇（点「练习」→听力→SST）", "FIB 词汇 5 题（点「练习」→词汇）", "写作 WE/SWT 各 1 题（点「练习」→写作）"], "P3": ["全真模考 1 套（myPTE Scored Practice）", "弱项专训（按模考报告 <50 的题型）", "WFD 机经句库通勤刷 1 遍（点「练习」→听力→WFD 句库）"]}, "goals": {"P0": {"v": 10, "l": 3}, "P1": {"v": 15, "l": 15}, "P2": {"v": 12, "l": 18}, "P3": {"v": 8, "l": 20}}, "tmpl": [["Read Aloud (RA) 大声朗读", "策略：流利度 40%+发音 40%+内容 20%。不要卡顿，读错也硬读下去。每天 3–5 段学术段落。练法：点「练习」→口语→RA。"], ["Repeat Sentence (RS) 复述句子", "策略：听时理解意群→立刻复述。宁可说短也别卡。占口语 25%+听力 20%。练法：每天 20 句机经，「练习」→口语→RS。"], ["Describe Image (DI) 描述图表", "开头：The [graph/chart] shows [主题]. Overall, [趋势]. First[最大]; Second[对比]; In conclusion[总结]. 流利度 50% > 内容。练法：「练习」→口语→DI。"], ["Write from Dictation (WFD) 听写", "每词拼对才得分。边听边键入实词，用语法猜漏词。占听力 25%+写作 20%，PTE 权重最高。练法：「练习」→听力→WFD 听写。"], ["Fill in Blanks (FIB-RW) 填空", "词汇量+语法语感。下拉选最合适的词。同时贡献阅读+写作分。练法：「练习」→阅读→FIB 填空。"], ["Retell Lecture (RL) 复述讲座", "笔记抓：主题+3要点+结论。模板：The lecture mainly discussed... It covered three points: first[A]; second[B]; finally[C]. In summary[结论]."], ["Summarize Written Text (SWT) 一句话总结", "只能写一句(5–75词)！用 and/which/that 连成一句。模板：This text argues that [A], [B] and [C], suggesting that [结论]. 练法：「练习」→写作。"], ["Write Essay (WE) 写作文", "结构：引言(背景+立场)→主体1(论点+例)→主体2(反方)→结论。连接词：Firstly/Furthermore/However/In conclusion。200–300词。练法：「练习」→写作。"], ["Summarize Spoken Text (SST) 听力总结", "听 60–90 秒讲座→写 50–70 词总结。听时记关键词：主题+3要点。模板：The lecture mainly discussed... First... Second... Finally... 练法：「练习」→听力→SST。"]], "pass": [["Climate Change 气候变化", "Climate change is one of the most pressing issues facing the world today. Rising global temperatures are causing ice caps to melt and sea levels to rise. Scientists agree that human activities, particularly the burning of fossil fuels, are the primary cause. Governments have signed agreements to reduce carbon emissions, but progress has been slow. The lecture emphasized that immediate action is needed to prevent catastrophic consequences.", "气候变化是全球最紧迫问题之一。全球温度上升导致冰盖融化和海平面上升。科学家一致认为人类活动尤其是化石燃料燃烧是主因。各国政府已签署减排协议但进展缓慢。讲座强调需立即行动防止灾难性后果。"], ["Industrial Revolution 工业革命", "The Industrial Revolution began in Britain in the late 18th century. Key inventions included the steam engine, the spinning jenny, and the power loom. This period saw the rise of factories, urbanization, and significant economic growth. However, it also led to poor working conditions and environmental pollution. The lecture noted that while it brought material progress, it created social problems that took decades to address.", "工业革命始于18世纪末的英国。关键发明包括蒸汽机、纺纱机和动力织机。这一时期见证了工厂兴起、城市化和显著经济增长。但也导致了恶劣工作条件和环境污染。讲座指出虽带来物质进步，也造成了需数十年解决的社会问题。"], ["DNA and Genetics DNA与遗传学", "DNA is the molecule that carries genetic information in all living organisms. The structure of DNA was discovered by Watson and Crick in 1953, revolutionizing biology. DNA consists of two strands forming a double helix, with four nucleotide bases. Modern genetic research has led to breakthroughs in medicine, including gene therapy and personalized treatments. Understanding DNA has fundamentally changed our approach to disease prevention.", "DNA是携带所有生物遗传信息的分子。沃森和克里克于1953年发现DNA结构，彻底变革生物学。DNA由两条链形成双螺旋，含四种核苷酸碱基。现代基因研究推动了基因疗法和个性化治疗等医学突破。理解DNA从根本上改变了疾病预防方式。"], ["Marketing Strategies 营销策略", "Effective marketing requires understanding consumer behavior and market trends. Companies use strategies including social media marketing, content marketing, and influencer partnerships. The lecture discussed how digital transformation has changed traditional marketing. Data analytics now plays a crucial role in identifying customer preferences and predicting purchasing patterns. Successful modern marketing requires creativity combined with data-driven decision making.", "有效营销需要理解消费者行为和市场趋势。公司使用社交媒体营销、内容营销和网红合作等策略。讲座讨论了数字化转型如何改变传统营销方式。数据分析在识别客户偏好和预测购买模式中起关键作用。现代成功营销需要创意与数据驱动决策结合。"], ["Australian Education 澳大利亚教育", "Australia has one of the most comprehensive education systems in the world, divided into primary, secondary, and tertiary levels. International students make up a significant portion of university enrollments, particularly from China and India. The government heavily regulates education providers to maintain quality standards. Australia's education export industry contributes billions of dollars to the national economy each year, making it one of the country's largest service exports.", "澳大利亚拥有全球最完善的教育体系之一，分小学、中学和高等教育。国际学生在大学入学中占重要比例，尤其来自中国和印度。政府严格监管教育机构以维持质量标准。澳大利亚教育出口产业每年为国家经济贡献数十亿澳元，是最大服务出口之一。"], ["Social Media Impact 社交媒体影响", "Social media has fundamentally changed how people communicate and consume information. Platforms like Facebook and Instagram have billions of users worldwide. While social media enables instant global communication, it has raised concerns about privacy, mental health, and the spread of misinformation. Research shows excessive social media use can lead to anxiety and depression, particularly among young people. When used responsibly, it can be a powerful tool for education and business.", "社交媒体从根本上改变了人们交流和消费信息的方式。Facebook和Instagram等平台拥有数十亿用户。社交媒体虽实现即时全球交流，也引发了隐私、心理健康和错误信息传播的担忧。研究表明过度使用会导致焦虑和抑郁。负责任使用时，可以是教育和商业的有力工具。"], ["Human Memory 人类记忆", "Human memory is a complex cognitive process involving encoding, storing, and retrieving information. Psychologists distinguish between short-term memory and long-term memory. The lecture explained that sleep plays a critical role in memory consolidation. Factors such as stress, age, and nutrition can significantly affect memory performance. Research has shown that regular mental exercise and a healthy lifestyle can help maintain cognitive function as people age.", "人类记忆是复杂认知过程，涉及编码、存储和提取信息。心理学家区分短期记忆和长期记忆。讲座解释了睡眠在记忆巩固中的关键作用。压力、年龄和营养等因素可显著影响记忆表现。研究表明，定期脑力锻炼和健康生活方式有助于随年龄增长维持认知功能。"], ["Renewable Energy 可再生能源", "Renewable energy sources including solar, wind, and hydroelectric power are increasingly important in reducing carbon emissions. Solar energy has seen dramatic cost reductions over the past decade, making it competitive with fossil fuels. Countries like Germany, China, and Denmark are leading the transition to renewable energy. Challenges remain, including energy storage and grid integration. A combination of renewable technologies and improved energy efficiency is essential for a sustainable future.", "可再生能源包括太阳能、风能和水力发电，在碳减排中越来越重要。太阳能在过去十年成本大幅下降，已可与化石燃料竞争。德国、中国和丹麦等国正引领可再生能源转型。挑战仍存，包括储能和电网整合。可再生能源技术和能源效率提升的组合对可持续未来至关重要。"], ["Separation of Powers 三权分立", "So what is the separation of powers? As discussed in a prior video, the US Constitution establishes the framework for the United States government. Article one establishes the legislative branch, the US House of Representatives and the US Senate. Article two establishes the office of the presidency, the executive branch of government. Article three establishes the judicial branch, the United States Supreme Court. The legislative branch creates law. Bills turn into statutes. Then they can delegate this statutory authority to regulatory agencies to create regulations in furtherance of those laws. The executive branch is charged with carrying out or executing those laws, that is, enforcing them against the public. The president carries out the laws that Congress makes, and then the judiciary checks those laws or reviews those laws for violations of constitutionality. Congress cannot pass a law that is unconstitutional, and the executive cannot take action enforcing a law that violates an individual's constitutional rights. The judiciary simply interprets the laws and adds to the law through their interpretations. That is, they form the common law.", "什么是三权分立？正如之前视频所讲，美国宪法确立了美国政府的框架。第一条设立立法分支——美国众议院与参议院；第二条设立总统职位，即政府的行政分支；第三条设立司法分支——美国最高法院。立法分支制定法律，法案成为成文法，并可将其法定权力下放给监管机构以制定相关规章。行政分支负责执行这些法律，即向公众强制实施。总统执行国会制定的法律，而司法分支则审查这些法律是否违宪。国会不能通过一个违宪的法律，行政分支也不能采取侵犯个人宪法权利的执法行动。司法分支只是解释法律，并通过司法解释补充法律，即形成普通法。"], ["Emotional Stability 情绪稳定性", "Far more than we are inclined to accept, and sometimes even realize, we are creatures of mood. Our sense of our value as human beings is prone to extraordinary fluctuation. At times we know how to tolerate ourselves. The future seems benevolent. We can forgive ourselves for the errors of the past. And then at other points the mood dips, and we lament most of what we have ever done. We see ourselves as natural targets for contempt. We feel undeserving, guilty, weak, and headed for retribution. But it can be very hard to grasp what causes our moods to shift. A day that started with energy and hope can by lunchtime end up mired in self-hatred. A sure sense that we have finally turned the corner can be replaced at speed by an alternative certainty that we are a cosmic error. We cannot ever prevent our moods from changing. But what is open to us all is to learn how to manage the change more effectively, so that our downturns can be slightly more gentle, our sadness more containable, and our inconstancy less shameful.", "我们比自己愿意承认、甚至比意识到的更受情绪支配。作为人的自我价值感极易剧烈波动。有时我们知道如何包容自己，未来显得仁慈，也能原谅过去的错误。但另一些时候情绪会跌入谷底，我们哀叹自己做过的大部分事情，视自己为理应被蔑视的对象，感到不配、内疚、软弱，仿佛在走向惩罚与灾难。然而我们很难弄清情绪为何转变。一个以活力与希望开始的日子，到了午饭时间可能已深陷自我憎恨。刚刚确信自己终于走出低谷，转瞬又可能被'自己是个宇宙错误'的念头取代。我们似乎永远无法阻止情绪变化。但我们所有人都能学会更有效地管理这种变化，让低落稍显温和，让悲伤更可控，让善变少一些羞耻。"], ["Age and DNA 年龄与DNA", "How old is your four-legged best friend? Common wisdom says that a dog ages seven years for every human year. But Tina Wang, a graduate student at the University of California, San Diego, wanted a more accurate assessment. Her quest started five years ago, when she rescued a dog from a shelter. Wang worked in Trey Ideker's lab, where they study changing patterns of DNA methylation in humans. Small chemical entities called methyl groups attach to stretches of DNA, which affects what sequences are active. As we age, some stretches of DNA get more methylated, and others less. The pattern is so consistent over the course of most people's lives that it can be used as an aging clock. The same process happens in dogs, and published reports existed from other labs about methylation patterns in dogs changing over time.", "你四条腿的好朋友多大了？常识说狗每长大一岁相当于人的七岁。但加州大学圣地亚哥分校的研究生 Tina Wang 想要一个更精确的评估。她的探索始于五年前，当时她从收容所救了一只狗。Wang 在 Trey Ideker 的实验室工作，他们研究人类 DNA 甲基化模式的变化。称为甲基的小化学物质附着在 DNA 片段上，影响哪些序列是活跃的。随着年龄增长，部分 DNA 片段甲基化增多，另一些减少。这一模式在大多数人一生中极其稳定，可用作'衰老时钟'。同样的过程也发生在狗身上，其他实验室已有关于狗的甲基化模式随时间变化的报告。"], ["Written and Spoken Language 书面与口头语言", "Professor, recently you wrote a letter to a leading national newspaper complaining about falling standards in both written and spoken language among students, even graduates, saying that you deplore the way English is being debased by change and dumbing down. Yes, I said that standards are falling, and that very few graduates these days can write a comprehensible essay; their grammar and syntax is all over the place. I do have certain regrets over the way some words have now become unusable in their full meaning because they have been sloppily misused by those who should know better, such as journalists. So, because they use 'enormity' to mean something very big instead of something very wicked, I can no longer use the word in its correct sense without being misunderstood. But, of course, language changes, and meanings shift, and it is as useless to complain about that as it is to moan about the weather. The point I was making was that, at the earliest possible level, children should be made familiar with the basics of grammar and syntax, how to put sentences together, and so on.", "教授，您最近给一家主流全国性报纸写信，抱怨学生乃至毕业生在书面与口头英语上的标准下降，说您痛心英语因变化和'降智'而被贬损。是的，我说标准在下降，如今极少有毕业生能写出通顺的文章，他们的语法和句法一团糟。我对一些词因被本应更懂的人（如记者）草率误用，导致其完整含义无法再用而感到遗憾。例如他们用'enormity'表示'非常大'而非'极邪恶'，让我再也无法在正确意义上使用该词而不被误解。但语言本就在变，词义在移，抱怨此事无异于抱怨天气。我想强调的要点是：应在最早阶段就让孩子熟悉语法和句法的基础，学会如何组句等等。"], ["Vitamin D 维生素D", "To understand what Vitamin D does, we need to understand the central concept. The function of Vitamin D is to maintain blood calcium. You probably think the function of Vitamin D is to maintain strong bones and teeth. But it does that by accident. Its real function is to maintain your blood calcium level in a very narrow range. And the reason for that is, if your blood calcium level falls below about nine milligrams per one hundred milliliters, then you are in big trouble, and die rather quickly. That is because blood calcium is important for muscle contraction and nerve transmission. If you don't have enough of it, you can't contract muscles normally, and there can't be normal nerve impulses. This results in a disease called tetany, where you have uncontrolled convulsions followed by rapid death. Calcium is also important for enzymic activities and blood clotting.", "要理解维生素 D 的作用，我们需要理解核心概念。维生素 D 的功能是维持血钙。你大概以为它的作用是强健骨骼和牙齿，但那只是顺带的结果。它真正的功能是将血钙水平维持在一个很窄的范围内。原因在于，如果血钙低于约每 100 毫升 9 毫克，你就会大难临头并很快死亡。这是因为血钙对肌肉收缩和神经传导至关重要。若不足，肌肉便无法正常收缩，也无法产生正常的神经冲动，从而导致一种叫'手足抽搐'的疾病，表现为不受控制的痉挛并迅速死亡。钙对酶活动和血液凝固也很重要。"], ["Emotions 情绪与战或逃反应", "What is the fight or flight response? To really understand it, it helps to think about the role of emotions in our lives. Many of us would prefer to focus on our logical thinking nature and ignore our sometimes troublesome emotions. But emotions do have a purpose. Our most basic emotions, like fear, anger, or disgust, are actually vital messengers. They evolved as signals to help us meet our basic needs for self-preservation and safety. It would be really dangerous to be indecisive about a threat to our survival. So the brain runs on information from our senses through the most primitive, reactive parts of our brains. These areas control instinctive responses and don't do too much thinking. This most primitive part of our brain communicates with the rest of our brain and our body to create signals we can't easily ignore: powerful emotions and symptoms. The fight or flight response is a physiological response triggered when we feel strong emotions such as fear. Fear is the normal emotion to feel in response to a dangerous threat. The fight or flight response evolved to enable us to react with appropriate actions, to run away or to fight, or sometimes even to freeze.", "什么是'战或逃'反应？要真正理解它，不妨想想情绪在我们生活中的角色。我们许多人更愿意专注理性思考，而忽视有时麻烦的情绪。但情绪确有目的。我们最基本的情绪，如恐惧、愤怒或厌恶，其实是重要的信使。它们作为信号进化而来，帮助我们满足自我保护与安全的基本需求。面对生存威胁而犹豫不决会非常危险。因此大脑通过最原始、最具反应性的部分处理感官信息。这些区域控制本能反应，不太做思考。大脑最原始的部分与脑的其余部分和身体的其余部分沟通，制造我们难以忽略的信号：强烈的情绪与症状。'战或逃'是一种生理反应，当我们感受到恐惧等强烈情绪时被触发。面对危险威胁，恐惧是正常情绪。'战或逃'反应进化而来，使我们能做出恰当行动——逃跑、战斗，有时甚至冻结。"], ["Globalization 全球化", "Globalization, what is globalization? I think it takes on a few different definitions. In one sense of the word, globalization means proliferation of transactions across countries. So one way of thinking about globalization is to describe increased international communications, more trade happening between countries, and more companies that have offices in multiple countries, which we call multinationals. So the source of growth in travel and communication and corporate trade across borders. This way of thinking about globalization is a continuation of thinking that has been around for a long time, such as when the Europeans went to the Orient to find spices, which was also an example of global trade and communication. Another way to think of globalization is as an economic system. It is a system in which countries become integrated in a way that never had been before. In this system, we see a global split in the process between consuming and producing goods. Some countries produce goods, some consume goods, and these countries depend on each other in a kind of organic solidarity rather than having an economic system just inside your country.", "全球化，什么是全球化？我想它有几个不同的定义。从一种意义上说，全球化意味着跨国交易的激增。因此一种理解方式是：国际交流增多、国家间贸易增加，以及越来越多在多国设有办事处的公司，即跨国公司。这是跨境旅行、交流与公司贸易增长的来源。这种对全球化的理解由来已久，例如欧洲人前往东方寻找香料，也是全球贸易与交流的例子。另一种理解是把全球化看作一种经济体系。在这一体系中，国家以前所未有的方式相互融合。我们看到生产与消费过程出现全球分工：一些国家生产商品，一些国家消费商品，彼此以某种有机团结相互依存，而非仅在一国之内运行经济体系。"]], "fibrw": [{"p": "Many scientists believe that climate change is largely caused by human activities. These activities release greenhouse gases, which _____ heat in the atmosphere. As temperatures rise, weather patterns become more _____.", ___ the policy before making a final decision.", "b": [[["review", "reviewed", "reviewing", "reviewable"], 0]]}], "real": [["myPTE 官方模考 · 机经", "https://www.pearsonpte.com/", "培生 Pearson 官方，付费 Scored Practice 模考最准，免费样题可摸底"], ["猩际 PTE · 高频预测", "https://www.apeuni.com/", "国内最大 PTE 备考平台，WFD/SST/RS 高频机经命中率极高"], ["萤火虫 PTE · 澳洲机经", "https://fireflyau.com/", "澳洲本土 PTE 机经平台，澳洲考场命中率突出"], ["黑科技 PTE · 小程序机经", "微信小程序搜「PTE黑科技」", "小程态端机经更新快，社区活跃，免费模考"]], "qtypes": [["Read Aloud (RA)", "大声朗读", "口语+阅读", "⭐⭐⭐ 核心", "屏幕显示一段文字(约60词)，大声朗读。同时贡献口语和阅读分。", "流利度 > 准确度。不要卡顿，读错也硬读下去。每天 3–5 题。"], ["Repeat Sentence (RS)", "复述句子", "口语+听力", "⭐⭐⭐ 核心", "听一句英文(3–9秒)，立刻复述出来。占口语 25%、听力 20%。", "PTE 最重要题型。听时抓意群主干，宁可说短也别卡。每天 10–20 句。"], ["Describe Image (DI)", "描述图表", "口语", "⭐⭐⭐ 核心", "看一张图表(柱图/线图/饼图/流程图等)，25秒准备后口述 40 秒。", "模板滚瓜烂熟：The graph shows... Overall... First... Second... 先整体后细节，流利度权重 > 内容。"], ["Write from Dictation (WFD)", "听写句子", "听力+写作", "⭐⭐⭐ 核心", "听一句英文，准确写出每个词。占听力 25%、写作 20%。", "PTE 权重最高的题！每词拼对才得分。机经命中 170–200 篇，每天必练 10 句。"], ["Fill in Blanks (FIB-RW)", "填空(读写)", "阅读+写作", "⭐⭐⭐ 核心", "一段文字中有挖空的词(4选1下拉)，选最合适的词填进去。同时贡献阅读和写作。", "词汇量 + 语法语感。每天做 5–8 题积累。写作分也靠这个。"], ["Re-tell Lecture (RL)", "复述讲座", "口语+听力", "⭐⭐ 重要", "听一段学术讲座(60–90秒)，10秒准备后复述 40 秒。", "记笔记：主题 + 3要点 + 结论。模板：The lecture discussed... It covered three points... 不要贪多。"], ["Summarize Written Text (SWT)", "一句话总结", "写作+阅读", "⭐⭐ 重要", "读一篇短文(最多300词)，用一句话总结(5–75词)。", "只能写一句！用 and/which/that 连成一句。套模板：This text argues that... 多加连接词。"], ["Write Essay (WE)", "写作文", "写作", "⭐⭐ 重要", "针对一个话题写 200–300 词议论文。20分钟限时。", "模板先行：引言+主体1+主体2+结论。连接词灌满：Firstly/Furthermore/However/In conclusion。机器判分重语法拼写。"], ["Summarize Spoken Text (SST)", "听力总结", "听力+写作", "⭐⭐ 重要", "听一段讲座(60–90秒)，写 50–70 词总结。", "听时记关键词：主题+3要点。模板：The lecture mainly discussed... First... Second... Finally... 机经命中率高。"], ["Fill in Blanks (FIB-L)", "填空(听力)", "听力+写作", "⭐⭐ 重要", "听一段音频，在屏幕显示的段落中填出缺失的词。", "边听边看屏幕文字，听到目标词立刻打出。拼写必须准确，实词权重 > 虚词。"], ["Re-order Paragraphs (RO)", "段落排序", "阅读", "⭐⭐ 重要", "将打乱顺序的 4–5 句话拖拽恢复正确段落顺序。", "找逻辑线索：代词指代(they→某名词)、时间先后、因果关系。对一对得 1 分。"], ["Fill in Blanks (FIB-R)", "填空(阅读)", "阅读", "⭐⭐ 重要", "一段文字中有挖空的词(4选1)，选合适的词。只贡献阅读分。", "词汇 + 搭配。和 FIB-RW 类似但只影响阅读。每天 5 题。"], ["Highlight Incorrect Words (HIW)", "挑错词", "听力+阅读", "⭐ 了解", "看一段文字同时听音频，找出文字中与音频不一致的词并点击。", "眼盯文字、耳听音频，发现不同立刻点。多做 → 手速快。"], ["Select Missing Word (SMW)", "补全单词", "听力", "⭐ 了解", "听一段音频，最后一句被哔声替代，从选项中选择最合适的词。", "听懂上下文逻辑选词。不需要大量训练。"], ["Highlight Correct Summary (HCS)", "选正确摘要", "听力+阅读", "⭐ 了解", "听一段音频，从 3–5 个摘要中选出与音频内容最一致的。", "排除法：先排除明显不对的，在剩的中选最全面的。"], ["Answer Short Question (ASQ)", "简短问答", "口语+听力", "❌ 可放弃", "听一个常识问题(如 What is the capital of...)，用 1–3 词回答。", "分值极低，每题 < 1 分。不值得专门练。考前翻高频分类词(动物/工具/学科)即可。"], ["MC Multiple Answer (MCMA)", "多选(阅读)", "阅读", "❌ 可放弃", "读一篇短文，从 5–7 个选项中选 2–3 个正确答案。", "选错倒扣分！分值低、容错差。没时间直接跳。"], ["MC Single Answer (MCSA)", "单选(阅读)", "阅读", "❌ 可放弃", "读一篇短文，从 4 个选项中选 1 个正确答案。", "每题约 1 分。每题用时 60–90 秒不如给 RA/FIB。"], ["MC Multiple Answer (听力)", "多选(听力)", "听力", "❌ 可放弃", "听一段音频，从选项中选多个正确答案。选错倒扣。", "同阅读多选，分值低、容错差。没时间直接跳。"], ["MC Single Answer (听力)", "单选(听力)", "听力", "❌ 可放弃", "听一段音频，从选项中选 1 个正确答案。", "每题约 1 分。不值的花时间。"]], "wfd_jj": [["The lecture will cover a wide range of topics.", "讲座将涵盖广泛的话题。"], ["Students must submit their assignments by the end of the week.", "学生必须在周末前提交作业。"], ["The library is closed on Sundays and public holidays.", "图书馆在周日和公共假日关闭。"], ["All students are required to attend the orientation session.", "所有学生都必须参加迎新会。"], ["The results of the experiment were published in a scientific journal.", "实验结果发表在一本科学期刊上。"], ["There will be a guest speaker giving a talk on climate change.", "将有一位客座讲者做气候变化讲座。"], ["The university offers a wide range of undergraduate and postgraduate courses.", "大学提供广泛的本科和研究生课程。"], ["You must submit your application before the deadline.", "你必须在截止日期前提交申请。"], ["The research project is funded by the national science foundation.", "该研究项目由国家科学基金会资助。"], ["The campus tour will begin at the main entrance at ten o'clock.", "校园参观将于十点从正门开始。"], ["Participants are requested to fill in the consent form before the study.", "参与者需在研究前填写同意书。"], ["The economic report highlighted several key areas for improvement.", "经济报告突出了几个关键改进领域。"], ["International students can apply for a scholarship at the beginning of the semester.", "国际学生可在学期初申请奖学金。"], ["The professor emphasized the importance of critical thinking in academic writing.", "教授强调了批判性思维在学术写作中的重要性。"], ["There is a significant correlation between diet and cognitive performance.", "饮食与认知表现之间存在显著相关性。"], ["The conference will take place in the main auditorium next Monday.", "会议将于下周一在主礼堂举行。"], ["Most of the data used in this research was collected through online surveys.", "本研究中使用的数据大部分通过在线调查收集。"], ["The tutorial session has been moved to a different room.", "辅导课已改到另一个教室。"], ["Please ensure all equipment is returned to the laboratory after use.", "请确保所有设备使用后归还实验室。"], ["The deadline for essay submission has been extended by one week.", "论文提交截止日期延长了一周。"], ["The course syllabus is available on the university website.", "课程大纲可在大学网站上获取。"], ["Students are encouraged to participate in extracurricular activities.", "鼓励学生参加课外活动。"], ["The findings of this study have important practical implications.", "这项研究的发现有重要的实践意义。"], ["The lecture theatre can accommodate up to three hundred students.", "阶梯教室最多可容纳三百名学生。"], ["All reference materials must be cited according to the APA format.", "所有参考资料须按 APA 格式引用。"], ["The examination will be held in the sports hall next Wednesday.", "考试将于下周三在体育馆举行。"], ["The tutor gave detailed feedback on the first draft of the essay.", "导师对论文初稿给出了详细反馈。"], ["A balanced diet and regular exercise are essential for good health.", "均衡饮食和定期锻炼对健康至关重要。"], ["The historical building was renovated with funding from the local council.", "这座历史建筑用地方议会拨款进行了翻修。"], ["Please turn off your mobile phones during the lecture.", "讲座期间请关闭手机。"]], "ra_sen": ["Our information office on campus provided resource and support to help you make the right choices about childcare whether you're a student, staff, or member of the local community. The office provides information about the five centres closest to our campuses, relevant government agency, and other daycare centre in the surrounding areas.", "Our survivors have told me many times that hate starts small and it grows when your neighbours, workmates and friends ignore it and do nothing. Hate triumphs when intolerance and prejudice become ingrained across an entire society, from the pages of newspapers to the halls of government, from schoolrooms to boardrooms.", "Neither golden eagles nor bald eagles are endangered species. The US bald eagle population has more than quadrupled since 2009, from around 72,000 to 317,000 birds. But the US golden eagle population is still relatively small around 30,000 birds and at risk of declining.", "Conservation scientists have long tried to map how much of the planet remains undegraded by human activity. Previous estimates using satellite imagery or raw demographic data found anywhere from 20 to 40 percent of the globe was free from obvious human incursions, such as roads, light pollution or the gaping scars of deforestation. But an intact forest can hide an emptied-out ecosystem.", "In the creative condition, the students were told to think of a friend who did something special and think of them as their 'creative friend' who could help them solve any problem. This type of creativity training is called perspective shifting, in which the kids look at a problem through the eyes of someone else.", "The Second Plague Pandemic of the mid 14th century, also known as the Black Death, killed 30 to 60% of the European population and profoundly changed the course of European history.", "Increasing concentrations of greenhouse gases in the atmosphere from human activity traps heat within the climate system, warming air, the land surface, the oceans, and melting polar ice. Oceans do by far the most work, absorbing more than 90% of the excess human generated heat accumulated in the Earth's climate system, moderating atmospheric temperature rises.", "Climate change, deforestation, pollution, and overexploitation of natural resources are some of the major threats facing the natural environment. Addressing these challenges requires a comprehensive understanding of the complex interactions between humans and the natural environment, as well as a commitment to sustainable development and responsible environmental stewardship.", "3D printing is advancing rapidly, and the range of materials that can be used has expanded considerably. While the technology was previously limited to fast curing plastics, it has now been made suitable for slow curing plastics as well.", "The original cotton plants in Mexico look mostly the same but have wild bushes with flowers that change from light yellow to violet. Yet, when genes from genetically modified cotton are added, it really changes these native plants. It affects how they work and how they interact with insects.", "Schools host parent teacher conferences four times a year and it is important for families to attend. This is your chance to meet with teachers and ask questions about your child's progress. It can be helpful to write down questions ahead of time.", "Agricultural problems due to climate change of normal weather, water depletion and the collapse of soil have become big problems in all parts of the world. Many are now focusing on ethics and family farming as a way to combat these issues.", "Warm ocean currents make the climate warm and wet. Cool ocean currents make the climate colder and dry. The direction of prevailing winds from the sea bring moist air to the coastal areas and dry weather to inland areas. As a result, the climate of the areas near sea is moderate. Mountains receive more rainfall than low lying areas because the temperature on top of mountains is lower than the temperature at sea level.", "When buying a house, for example, it's best to let our unconscious mull over the many variables. But when we're picking stocks and shares, intuition often leads us astray. The trick is to determine when to lean on which part of the brain. And to do this, we need to think harder and smarter about how we think.", "In the past, naming English as a separate subject seemed relatively easy. The textbook selected and graded items of language which were put into content and then practiced intensively. New items were carefully controlled so that students could cope quite easily. Now English is used as a medium of instruction.", "Australians do speak English. However, for some tourists and travelers, it can be difficult to understand the slang. Also, the links between Australian and American English were seen to be very tenuous. At least some colloquialisms in Australian English do not exist in other types of English.", "Along with customary classes on subjects such as finance, accounting, and marketing, today's MBA students are enrolling on courses for environmental policy and stewardship. Indeed, more than half of business schools require a course in environmental sustainability or corporate social responsibility, according to a survey of 91 US business schools, published in October 2005.", "Children need to discover their own strengths and weaknesses in order to find fulfillment as adults in both work and play. Watching television does not lead to these discoveries; it only limits children's involvement in those real-life activities that might offer their abilities a genuine testing ground. And young children's need for fantasy is gratified far better by their own make-believe activities than by the adult-made fantasies they are offered on television.", "A key finding in this study was the extent to which property managers expressed frustration at the amount of property owners who are financially unable, or just unwilling, to pay for repairs and ongoing maintenance of their rental properties. Interior and exterior painting, re-carpeting, fixing leaks and replacing ovens were all examples of maintenance that property managers said they had trouble talking landlords into doing.", "The advent of information technology has led to the development of novel processes, products, and distribution mechanisms. Examples of new products are the Internet, computers, and digital television. New processes include automated inventory control, Internet banking, and teller machines; new distribution systems consist of cable and satellite TV.", "Currently, 450 million people experience water scarcity, while people in affluent nations tend to squander water resources. In developed countries, it has become customary to simply turn on the tap and access fresh water whenever we desire. To maintain good health and hygiene, each person requires about 80 liters of water daily. Americans consume about 500 liters on average per day.", "Australia possesses one of the most significant mining sectors globally. It plays a crucial role in exporting minerals such as iron, coal, gold, ore, and copper. The country is self-reliant in all minerals except for petroleum. Since the initial discovery of coal in 1798, mineral production has consistently increased, with a doubling output in 1992.", "When you become a part of a college, you will discover that they offer much more than just housing. Regardless of your residence, your university will serve as a foundation during your time there and a community of friends even after you graduate.", "Your body is nearly 66% water. And so it is really important that you consume enough fluid to stay hydrated and healthy. If you don't get enough fluid you may feel tired, get headaches, and not perform at your best.", "The elephant is the largest living land mammal. During evolution, its skeleton has greatly altered from the usual mammal design for two main reasons. One is to cope with the great weight of huge grinding cheek teeth and elongated tusk teeth, making the skull particularly massive. The other is to support the enormous bulk of such a huge body.", "Hundreds of millions of Americans eat fast food every day without giving it too much thought, unaware of the subtle and not so subtle ramifications of their purchases. They just grab their tray off the counter, find a table, take a seat, unwrap the paper, and dig in. The whole experience is transitory and soon forgotten.", "Cheerful sunny yellow is an attention getter. While it is considered an optimistic color, people lose their tempers more often in yellow rooms, and babies will cry more. It is the most difficult color for the eye to take in, so it can be overpowering if overused. Yellow enhances concentration, hence it is used for legal pads. It also speeds metabolism.", "Teaching is indeed a challenging profession, yet it continues to attract and retain individuals year after year, many of whom remain in the field for five, ten, or even more years. This enduring commitment can be attributed to a combination of intrinsic motivations and the rewarding aspects of the profession.", "The whole purpose of making notes is to aid your learning. It is important to go back over them within a day of making them to make sure they make sense and make them legible for future revisions. Also, going back over them should highlight the key questions of areas in which you want to do further reading.", "In classes, your teachers will talk about topics that you are studying. The information that they provide will be important to know when you take tests. You must be able to take good written notes from what your teacher says.", "There is no single method of learning that guarantees success. How we learn that depends on many different factors.", "The bill calls for the establishment of the National Landslide Hazards Reduction Program within one year of becoming law. The program serves numerous functions, including to identify and understand landslide hazards and risks, reduce losses from landslides, protect communities at risk of landslides hazards, and improve communication and emergency preparedness.", "An innovative new product or service can give a firm a head start over its rivals, which can be difficult for a new entrant to overcome. If the new technology is also patented, then other firms cannot simply copy its design. It is legally protected.", "A community's urban forest is an extension of its pride and community spirit. Trees enhance community economic stability by attracting businesses and tourists as people tend to linger and shop longer along tree-lined streets. Apartments and offices in wooded areas rent more quickly and businesses leasing office spaces in developments with trees reported higher productivity and fewer absences.", "The networks of roots that plants use to absorb water and nutrients can encompass a space larger than the part of the plant visible above ground. The nature of these roots systems can help plants adapt to challenging environments such as deserts. For instance, mesquite trees can develop tap roots capable of digging more than 50 yards deep to reach water.", "The advancements in renewable energy technology over the past decade have been transformative. Solar power, once expensive and niche, has become increasingly cost-effective, leading to widespread adoption in both residential and commercial sectors. Similarly, wind energy has seen significant growth, with larger and more efficient turbine designs harnessing coastal and inland winds.", "The global demand for natural gas has risen sharply because it produces less carbon compared to coal and other fossil fuels. In Singapore, government support has helped increase natural gas use by nine times over the past few decades. Also, in some areas, more people are choosing natural gas because they are moving away from nuclear power.", "Globalization has transformed the world economy, facilitating the flow of goods, services, and capital across borders. It has led to increased competition and efficiency, as businesses seek to expand their markets and reduce costs. However, globalization has also contributed to economic inequality, as some countries and individuals have benefited more than others.", "Globalization refers to a set of changes rather than a single change. Many of these changes are social, cultural and political rather than purely economic, and one of the main drivers in addition to the global marketplace is the communication revolution.", "The Internet has changed the way we live, work, and communicate. In the past, people had to go to libraries to find information. Now, with just a few clicks, we can access millions of books, articles, and videos online. This convenience has made learning much easier and faster."], "di_topics": [["柱状图：各国人口增长 2000–2020", "The bar chart shows population growth in four countries from 2000 to 2020. Overall, India experienced the most significant increase, followed by China. The United States and Japan showed relatively modest growth. In conclusion, developing nations saw higher population growth compared to developed countries."], ["线图：全球温度变化 1900–2020", "The line graph illustrates changes in global average temperature over the period from 1900 to 2020. Overall, there was a gradual increase in the first half, followed by a sharp rise after 1950. The most dramatic increase occurred between 1980 and 2020. In conclusion, global temperatures have risen significantly in recent decades."], ["饼图：大学生消费结构", "The pie chart shows the breakdown of university student expenditure. The largest proportion is spent on accommodation, accounting for forty percent. Food and transport represent twenty-five and fifteen percent respectively. Entertainment and study materials make up the remainder. In conclusion, housing is the biggest expense for students."], ["流程图：论文发表流程", "The flow chart describes the process of publishing an academic paper. First, the researcher conducts experiments and writes a draft. Next, the paper is submitted to a journal for peer review. If accepted with revisions, the author makes changes and resubmits. Finally, the paper is published online and in print."], ["表格：四个城市生活成本对比", "The table compares the cost of living in four major cities. London has the highest overall cost, followed by New York and Sydney. Beijing has the lowest cost among the four. Housing represents the largest expense category in all cities. In conclusion, living in Western cities is generally more expensive than in Asian cities."], ["柱状图：社交媒体用户数 2020", "The bar chart displays the number of social media users across major platforms in 2020. Facebook leads with over two billion active users, followed by YouTube and Instagram. Twitter and LinkedIn have significantly smaller user bases. In conclusion, Meta platforms dominate the social media landscape."], ["线图：学生学习时间与成绩关系", "The line graph shows the relationship between study hours and exam scores. Overall, there is a clear positive correlation. Scores increase steadily from one to four hours of daily study, after which the improvement levels off. In conclusion, studying approximately four hours per day appears to be optimal for most students."], ["饼图：全球能源消耗来源", "The pie chart illustrates the sources of global energy consumption. Fossil fuels including oil, coal and natural gas account for over eighty percent. Renewable energy such as solar and wind represents approximately fifteen percent. Nuclear energy makes up the remaining portion. In conclusion, the world still heavily depends on non-renewable energy sources."], ["柱状图：五国碳排放量 2000 与 2020", "The bar chart compares carbon dioxide emissions of five countries in 2000 and 2020. Overall, China and the United States recorded the highest emissions, with China showing the largest increase. India also rose significantly, while the United Kingdom and Germany saw modest declines. In conclusion, developing economies drove the growth in global emissions over the two decades."], ["线图：全球智能手机用户 2015–2023", "The line graph illustrates the growth in global smartphone users from 2015 to 2023. There was a steady rise throughout the period, with the sharpest increase between 2018 and 2021. By 2023, the number had more than doubled compared to 2015. In conclusion, smartphone adoption has become nearly universal in many regions."], ["饼图：家庭能源消费结构", "The pie chart shows how an average household consumes energy. Heating and cooling account for the largest share at forty percent, followed by water heating at twenty percent. Lighting, appliances and other uses make up the remainder. In conclusion, climate control dominates residential energy demand."], ["表格：三所大学国际生年学费对比", "The table compares annual tuition fees for international students at three universities. University A charges the most at forty thousand dollars, while University B and C are lower at thirty-two and twenty-eight thousand respectively. In conclusion, University C offers the most affordable option for international students."], ["流程图：城市污水处理流程", "The flow chart outlines the municipal wastewater treatment process. First, sewage enters a screening stage to remove large debris. It then moves through primary and secondary treatment tanks where solids settle and bacteria break down organic matter. Finally, the cleaned water is discharged or reused. In conclusion, the process relies on physical and biological stages."], ["柱状图：青少年每日屏幕时间（男女对比）", "The bar chart compares average daily screen time between teenage boys and girls. Boys spend slightly more time on games and video, while girls lead in social media use. Overall both groups exceed four hours per day. In conclusion, screen time is high across genders and warrants monitoring."], ["线图：全球地表平均气温距平 1900–2020", "The line graph shows the global mean temperature anomaly from 1900 to 2020. The anomaly stayed near zero until mid-century, then rose gradually and accelerated after 1980. The highest values appear in the last two decades. In conclusion, the data clearly indicates ongoing global warming."], ["饼图：全球淡水资源分布", "The pie chart illustrates the distribution of the world's freshwater. Glaciers and ice caps hold the overwhelming majority at about sixty-eight percent, groundwater accounts for thirty percent, and surface water such as lakes and rivers makes up only two percent. In conclusion, most freshwater is locked in ice or underground."]], "di_svgs": ["<svg viewBox=\"0 0 400 220\" width=\"100%\" style=\"display:block\"><rect width=\"400\" height=\"220\" fill=\"#FAFBFC\" rx=\"6\"/><text x=\"200\" y=\"18\" text-anchor=\"middle\" font-size=\"12\" fill=\"#33495F\" font-weight=\"600\">Population Growth by Country (2000–2020)</text><line x1=\"50\" y1=\"180\" x2=\"370\" y2=\"180\" stroke=\"#DDE3E6\"/><line x1=\"50\" y1=\"30\" x2=\"50\" y2=\"180\" stroke=\"#DDE3E6\"/><text x=\"40\" y=\"35\" text-anchor=\"end\" font-size=\"9\" fill=\"#6B7780\">20%</text><text x=\"40\" y=\"72\" text-anchor=\"end\" font-size=\"9\" fill=\"#6B7780\">15%</text><text x=\"40\" y=\"109\" text-anchor=\"end\" font-size=\"9\" fill=\"#6B7780\">10%</text><text x=\"40\" y=\"146\" text-anchor=\"end\" font-size=\"9\" fill=\"#6B7780\">5%</text><text x=\"40\" y=\"183\" text-anchor=\"end\" font-size=\"9\" fill=\"#6B7780\">0</text><rect x=\"62\" y=\"120\" width=\"20\" height=\"60\" fill=\"#33495F\" rx=\"2\"/><rect x=\"86\" y=\"82\" width=\"20\" height=\"98\" fill=\"#2C8C99\" rx=\"2\"/><rect x=\"142\" y=\"135\" width=\"20\" height=\"45\" fill=\"#33495F\" rx=\"2\"/><rect x=\"166\" y=\"112\" width=\"20\" height=\"68\" fill=\"#2C8C99\" rx=\"2\"/><rect x=\"222\" y=\"157\" width=\"20\" height=\"23\" fill=\"#33495F\" rx=\"2\"/><rect x=\"246\" y=\"150\" width=\"20\" height=\"30\" fill=\"#2C8C99\" rx=\"2\"/><rect x=\"302\" y=\"170\" width=\"20\" height=\"10\" fill=\"#33495F\" rx=\"2\"/><rect x=\"326\" y=\"175\" width=\"20\" height=\"5\" fill=\"#2C8C99\" rx=\"2\"/><text x=\"84\" y=\"198\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6B7780\">India</text><text x=\"154\" y=\"198\" text-anchor=\"middle\" font-size=\"10\" fill=\"#6B7 nts=\"50,150 94,148 138,146 182,142 226,135 270,118 314,95 358,70\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle cx=\"50\" cy=\"150\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"94\" cy=\"148\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"138\" cy=\"146\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"182\" cy=\"142\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"226\" cy=\"135\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"270\" cy=\"118\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"314\" cy=\"95\" r=\"3\" fill=\"#C0392B\"/><circle cx=\"358\" cy=\"70\" r=\"3\" fill=\"#C0392B\"/><text x=\"50\" y=\"196\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6B7780\">1900</text><text x=\"182\" y=\"196\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6B7780\">1950</text><text x=\"314\" y=\"196\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6B7780\">2000</text><text x=\"358\" y=\"196\" text-anchor=\"middle\" font-size=\"9\" fill=\"#6B7780\">2020</text></svg>", "<svg viewBox=\"0 0 400 220\" width=\"100%\" style=\"display:block\"><rect width=\"400\" height=\"220\" fill=\"#FAFBFC\" rx=\"6\"/><text x=\"200\" y=\"18\" text-anchor=\"middle\" font-size=\"12\" fill=\"#33495F\" font-weight=\"600\">World Freshwater Distribution</text><path d=\"M130 110 L130 50 A60 60 0 1 1 74 150 Z\" fill=\"#33495F\"/><path d=\"M130 110 L74 150 A60 60 0 0 1 158 124 Z\" fill=\"#2C8C99\"/><path d=\"M130 110 L158 124 A60 60 0 0 1 130 50 Z\" fill=\"#B7791F\"/><text x=\"155\" y=\"80\" font-size=\"9\" fill=\"#fff\" font-weight=\"600\">Ice 68%</text><text x=\"95\" y=\"155\" font-size=\"8\" fill=\"#fff\">Ground 30%</text><text x=\"150\" y=\"118\" font-size=\"8\" fill=\"#fff\">Surface 2%</text><rect x=\"262\" y=\"55\" width=\"10\" height=\"10\" fill=\"#33495F\" rx=\"2\"/><text x=\"277\" y=\"64\" font-size=\"10\" fill=\"#6B7780\">Ice caps 68%</text><rect x=\"262\" y=\"75\" width=\"10\" height=\"10\" fill=\"#2C8C99\" rx=\"2\"/><text x=\"277\" y=\"84\" font-size=\"10\" fill=\"#6B7780\">Groundwater 30%</text><rect x=\"262\" y=\"95\" width=\"10\" height=\"10\" fill=\"#B7791F\" rx=\"2\"/><text x=\"277\" y=\"104\" font-size=\"10\" fill=\"#6B7780\">Surface 2%</text></svg>"], "wp": [["SWT: 主要照顾者 Primary Carers", "Slightly less than one in five carers (19%) were primary carers (475,000 people). That is, they were the main carer of a person who was limited in carrying out the core everyday activities of mobility, communication or self-care. Both primary carers and the larger group of other carers (close to 2 million) contribute to the wellbeing of older people and people with disabilities. However, because they care for people who otherwise would have difficulty carrying out basic everyday activities, there is particular interest in primary carers: in the contribution they make, their wellbeing, labour force experiences, motivations and the support they receive in caring. Primary carers were more likely than other carers to be assisting someone who lived in the same household (81% compared with 76%). As with caring as a whole, the likelihood of being a primary carer increased with age to peak at age 55-64 years, where one in twenty people were primary carers. However, rather than then declining, the likelihood of being a primary carer remained at around this level among the older age groups. Consequently, primary carers had a somewhat older age profile than other carers. The median age of primary carers was 52 years, compared with 47 years for other carers. Primary carers were more likely than other carers to be female (71% compared with 50%) and less likely to be in the labour force (39% compared with 60%). Women not in the labour force were by far the largest single group among primary carers (44%). In contrast, men employed full-time were the largest single group among other carers (25%). Consistent with their lower labour force participation, primary carers had lower personal incomes than other carers (a median gross income of $237 per week compared with $327 per week) and were more likely to have a government pension or allowance as their main source of income (55% compared with 35%).", "Both primary carers and the larger group of other carers contribute to the wellbeing of older people and people with disabilities, so there is a particular interest in the contributions they make, their well-being, labor force experiences, motivations and the support they receive in caring, and they were more likely than other carers to be female or assisting someone who lived in the same household and less likely to be in the labor force."], ["SWT: 非洲黑土地 African Dark Earths", "A farming technique practiced for centuries by villagers in West Africa, which converts nutrient-poor rainforest soil into fertile farmland, could be the answer to mitigating climate change and revolutionizing farming across Africa. A global study by researchers has for the first-time identified and analyzed rich fertile soils found in Liberia and Ghana. They discovered that the ancient West African method of adding charcoal and kitchen waste to highly weathered, nutrient poor tropical soils can transform the land into enduringly fertile, carbon-rich black soils which the researchers dub 'African Dark Earths'. Similar soils created by Amazonian people in pre-Columbian eras have recently been discovered in South America, but the techniques people used to create these soils are unknown. Moreover, the activities which led to the creation of these anthropogenic soils were largely disrupted after the European conquest. Encouragingly researchers in the West Africa study were able to live within communities as they created their fertile soils. This enabled them to learn the techniques used by the women from the indigenous communities who disposed of ash, bones and other organic waste to create the African Dark Earths.", "A farming technique practiced for centuries by villagers in West Africa, which converts nutrient-poor rainforest soil into fertile farmland, could be the answer to mitigating climate change and revolutionizing farming across Africa, and after researchers had found and named rich fertile soils found in Africa 'the African Dark Earths', they tried to learn the unknown techniques used by the indigenous communities to create the African Dark Earths."], ["SWT: 珊瑚礁 Coral Reefs", "Coral reefs, often referred to as the 'rainforests of the sea,' are among the most diverse and valuable ecosystems on Earth. They support over 25% of marine species despite covering less than 1% of the ocean floor. These vibrant underwater structures are formed by colonies of tiny animals called coral polyps, which build calcium carbonate skeletons that accumulate over centuries. Beyond their ecological importance, coral reefs provide coastal protection from storms, support fisheries, and contribute significantly to tourism and the global economy. However, these ecosystems are under severe threat due to human activities. Climate change, particularly ocean warming and acidification, has led to widespread coral bleaching, where corals expel the algae that give them color and nutrients. Pollution, overfishing, and destructive practices such as dynamite fishing further exacerbate their decline. Conservationists and scientists worldwide are developing strategies to protect and restore coral reefs, including marine protected areas, coral gardening, and breeding heat-resistant coral species. Despite these efforts, recovery is slow, and time is of the essence. The survival of coral reefs depends not only on localized conservation actions but also on global commitments to reduce carbon emissions and mitigate climate change. Public awareness and international cooperation are crucial to preserving these ecosystems for future generations.", "Coral reefs are among the most diverse and valuable ecosystems on earth, as they provide coastal protection, support fisheries, and contribute significantly to tourism and the global economy; however, these are under severe threat due to human activities like ocean warming, acidification, pollution, overfishing and other destructive activities; hence, conservationists and scientists are developing strategies to protect and restore coral reefs; in addition, public awareness and international cooperation are crucial."], ["SWT: 导航能力 London Taxi Drivers", "It has been known for some time that working in a complex environment can sharpen certain mental abilities. One of the most well-known examples is that of London taxi drivers, who have to memorize the layout of a vast city and consequently show an enlarged hippocampus, an area of the brain involved in navigation and spatial memory. A more recent study has attempted to ascertain which factors are generally important in the development of navigational skills. Subjects were asked to complete a task embedded in a computer game which involved memorising a map and then steering a boat using this mental picture. A number of factors were significant, but one of the most interesting outcomes was that there were differences between those who lived in a rural environment and their town dwelling counterparts. Country dwellers showed significantly better navigational skills, presumably because town dwellers just come to rely on street names and numbers and so these skills are less activated. Moreover, it appears that the type of city can also make a difference. Subjects from cities with a more organic, less predictable topography performed better than those from the kind of grid-based cities that are common in North America, such as Chicago. There may be a useful maxim for urban planners here, that there can be such a thing as too much simplicity when it comes to city design.", "People working in a complex environments tend to develop strong navigational abilities, as shown by studies on London taxi drivers with enlarged hippocampus and recent research demonstrating that rural residents and individuals from organically designed city outperformed town dwellers and those from grid-based cities in navigation tasks, likely because reliance on street names and predictable layouts reduces active spatial processing, suggesting that overly simple urban design may negatively affect the development of navigation-related cognitive skills."], ["SWT: 远程办公 Remote Work", "Remote work, once a niche arrangement, became mainstream following the disruptions of the early 2020s, and many companies initially expected a full return to office-based work once conditions normalized. Instead, a significant proportion of employees have continued working remotely or in hybrid arrangements, citing improved work-life balance and reduced commuting time as primary reasons. Employers remain divided on the long-term implications: some argue that in-person collaboration drives innovation and company culture, while others have found that remote arrangements reduce office overhead costs and expand their talent pool beyond a single geographic location. Recent studies suggest that hybrid arrangements, rather than fully remote or fully in-office models, may offer the strongest balance between employee satisfaction and organizational performance.", "Remote work, which became mainstream after early-2020s disruptions, has persisted despite many employers initially expecting a full return to offices, and while opinions remain divided on its effect on collaboration versus cost savings, recent research suggests hybrid arrangements may best balance employee satisfaction with organizational performance."], ["SWT: 海洋酸化 Ocean Acidification", "The ocean absorbs about a quarter of the carbon dioxide (CO2) released into the atmosphere every year. As oceans absorb more CO2, the pH levels decrease, leading to acidification of the seawater. This change in ocean chemistry negatively affects marine life, particularly coral reefs, which rely on calcium carbonate to build their skeletons. When the water's acidity increases, corals struggle to survive because calcium carbonate becomes less available, leading to weakened coral structures and slowed growth. Over time, these weakened corals are more prone to bleaching, reducing their ability to support abundant marine biodiversity. Furthermore, the long-term impact on coral reefs could disrupt entire marine ecosystems and lead to a loss of species that rely on them for habitat and food.", "As the ocean absorbs more carbon dioxide, its decrease in pH leads to ocean acidification, which reduces coral survival by making calcium carbonate less available, weakening reefs, and disrupting marine ecosystems."], ["SWT: 微塑料与鱼类 Microplastics", "Fish are being killed, and prevented from reaching maturity, by the litter of plastic particles finding their way into the world's oceans, new research has proved. Some young fish have been found to prefer tiny particles of plastic to their natural food sources, effectively starving them before they can reproduce. The growing problem of microplastics - tiny particles of polymer-type materials from modern industry - has been thought for several years to be a peril for fish, but the study published on Thursday is the first to prove the damage in trials. Microplastics are near-indestructible in natural environments. They enter the oceans through litter, when waste such as plastic bags, packaging and other convenience materials are discarded. Vast amounts of these end up in the sea, through inadequate waste disposal systems and sewage outfall. Another growing source is microbeads, tiny particles of hard plastics that are used in cosmetics, for instance as an abrasive in modern skin cleaners. These easily enter waterways as they are washed off as they are used, flushed down drains and forgotten, but can last for decades in our oceans. The impact of these materials has been hard to measure, despite being a growing source of concern. Small particles of plastics have been found in seabirds, fish and whales, which swallow the materials but canno
