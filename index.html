<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="阿奇PTE">
<meta name="theme-color" content="#33495F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>阿奇PTE</title>
<style>
  :root{--slate:#33495F;--teal:#2C8C99;--bg:#F4F6F7;--card:#FFFFFF;--line:#DDE3E6;--muted:#6B7780;--amber:#B7791F;--red:#C0392B;--green:#0E7A6B;--safe-top:env(safe-area-inset-top,0px);--safe-bot:env(safe-area-inset-bottom,0px);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{overscroll-behavior:none;overflow-x:hidden;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:#222;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overflow-x:hidden;position:relative;}
  /* iPhone tuning：清掉 iOS 原生控件外观 + 屏蔽 UI 长按弹出菜单（机经正文仍可选中复制） */
  button,.btn,.speak,.mic,.mini,.tabs button,.diff-btn,.reset,nav button,select{-webkit-appearance:none;appearance:none;}
  nav,nav button,.btn,.speak,.mic,.tabs button,.adpt,.tlink,.stages .st,.diff-btn,.mini,.reset{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
  input,textarea,select{font-size:16px;}
  .app{max-width:720px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;box-shadow:0 0 60px rgba(51,73,95,.08);}
  @media(min-width:600px){.body{padding:22px 22px 30px;} .card{padding:22px;} header{padding:max(18px,var(--safe-top)) 22px 0;} .big-word{font-size:30px;} .ex.show{font-size:15px;}}
  header{background:var(--slate);color:#fff;padding:max(14px,var(--safe-top)) 16px 0;position:sticky;top:0;z-index:5;}
  header h1{margin:0;font-size:17px;font-weight:600;}
  header p{margin:2px 0 0;font-size:12px;opacity:.8;}
  .topbar{margin:10px -16px 0;background:var(--teal);color:#fff;font-size:12.5px;font-weight:600;text-align:center;padding:7px;letter-spacing:.3px;display:flex;justify-content:center;gap:14px;flex-wrap:wrap;}
  .topbar.done{background:var(--green);}
  .topbar .fire{color:#FFE08A;}
  .body{flex:1;padding:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 1px 3px rgba(0,0,0,.04);margin-bottom:14px;}
  .card.sp{border-left:3px solid var(--amber);}
  .card.li{border-left:3px solid var(--teal);}
  .card.rw{border-left:3px solid #5E51A8;}
  .card.wr{border-left:3px solid var(--red);}
  .card:last-child{margin-bottom:10px;}
  .ph{font-size:15px;font-weight:700;color:var(--slate);margin-bottom:10px;}
  .wd{cursor:pointer;text-align:center;}
  .big-word{font-size:26px;font-weight:600;color:var(--slate);line-height:1.4;word-break:break-word;}
  .ipa{margin-top:8px;font-size:16px;color:var(--teal);text-align:center;font-family:"Charis SIL","Doulos SIL",Georgia,serif;letter-spacing:.3px;}
  .ipa.muted{font-size:13px;color:var(--muted);font-family:inherit;}
  .pos{margin-top:6px;font-size:12px;color:var(--amber);text-align:center;font-style:italic;}
  .cn{margin-top:12px;font-size:17px;color:#333;text-align:center;line-height:1.5;display:none;}
  .cn.show{display:block;}
  .ex{margin-top:10px;font-size:13.5px;color:#444;line-height:1.6;background:#F7F9FA;border:1px solid var(--line);border-radius:10px;padding:10px;display:none;}
  .ex.show{display:block;}
  .ex .en{color:var(--slate);} .ex .zh{color:var(--muted);margin-top:3px;}
  .flip-tip{margin-top:14px;text-align:center;font-size:13px;color:var(--teal);}
  .row{display:flex;gap:12px;margin-top:14px;}
  .btn{flex:1;border:none;border-radius:12px;padding:15px 0;font-size:16px;font-weight:600;color:#fff;background:var(--teal);cursor:pointer;touch-action:manipulation;}
  .btn.ghost{background:#fff;color:var(--slate);border:1px solid var(--line);}
  .btn:active{transform:scale(.98);}
  .speak,.mic{width:100%;margin-top:12px;border:none;border-radius:12px;padding:14px 0;font-size:16px;font-weight:600;cursor:pointer;color:#fff;touch-action:manipulation;}
  .speak{background:var(--slate);} .mic{background:#5E51A8;} .mic:active{transform:scale(.98);} .speak:active{transform:scale(.98);}
  .mic.recording{animation:micPulse 1.2s infinite;box-shadow:0 0 0 4px rgba(192,57,43,.35);background:var(--red);}
  @keyframes micPulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,.45);}50%{box-shadow:0 0 0 10px rgba(192,57,43,.1);}}
  ul.tasks{list-style:none;padding:0;margin:0;}
  ul.tasks li{display:flex;align-items:flex-start;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45;}
  ul.tasks li:last-child{border-bottom:none;}
  ul.tasks input{margin-top:3px;width:18px;height:18px;flex:0 0 auto;accent-color:var(--teal);}
  ul.tasks input:checked+span{text-decoration:line-through;color:var(--muted);opacity:.65;}
  ul.tasks a{color:var(--teal);font-weight:600;}
  .stat{display:flex;justify-content:space-around;text-align:center;}
  .stat div span{display:block;font-size:22px;font-weight:700;color:var(--teal);}
  .stat div small{color:var(--muted);font-size:12px;}
  .done{text-align:center;padding:36px 10px;color:var(--muted);}
  .stages{display:flex;gap:8px;margin-bottom:14px;}
  .stages .st{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 4px;text-align:center;background:#fff;cursor:pointer;}
  .stages .st.on{border-color:var(--teal);background:#EAF4F5;}
  .stages .st b{display:block;font-size:13px;color:var(--slate);}
  .stages .st small{font-size:10.5px;color:var(--muted);}
  .stinfo{font-size:13.5px;line-height:1.7;color:#333;}
  .stinfo .goal{color:var(--teal);font-weight:600;}
  .stinfo ol{margin:8px 0 0;padding-left:20px;}
  .stinfo li{margin-bottom:5px;}
  details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;}
  details summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--slate);}
  details .t{border:1px solid var(--line);border-radius:10px;padding:10px;margin-top:8px;font-size:13px;line-height:1.6;color:#333;white-space:pre-wrap;}
  .mock input{width:54px;padding:6px;border:1px solid var(--line);border-radius:8px;font-size:14px;margin:0 3px;}
  .mock button{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;}
  .hint{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:8px;}
  .tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;justify-content:center;}
  .tabs button{flex:1;min-width:54px;border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:20px;padding:8px 4px;font-size:13px;cursor:pointer;}
  .tabs button.on{background:var(--teal);color:#fff;border-color:var(--teal);font-weight:600;}
  .tabs.prac{background:#EEF1F5;border-radius:12px;padding:5px;margin-bottom:10px;}
  .tabs.prac button{min-width:0;padding:7px 2px;font-size:12.5px;}
  .real a{display:block;color:var(--slate);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;}
  .real a b{color:var(--teal);} .real a small{display:block;color:var(--muted);font-size:12px;margin-top:2px;}
  nav{display:flex;border-top:1px solid var(--line);background:#fff;padding-bottom:max(var(--safe-bot),8px);}
  nav button{flex:1;border:none;background:none;padding:0;min-height:50px;display:flex;flex-direction:column;justify-content:center;font-size:13px;color:var(--muted);cursor:pointer;border-top:2px solid transparent;touch-action:manipulation;}
  nav button.on{color:var(--teal);border-top-color:var(--teal);font-weight:600;background:rgba(44,140,153,.08);}
  nav button:active{opacity:.6;background:rgba(44,140,153,.06);}
  .reset{margin-top:6px;width:100%;background:#fff;color:var(--red);border:1px solid #E2B4AE;border-radius:10px;padding:11px;font-size:14px;cursor:pointer;}
  .badge{display:inline-block;background:#EAF4F5;color:var(--teal);font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:20px;margin-bottom:2px;}
  .wk{font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px;}
  .chk{font-size:14px;color:var(--green);text-align:center;margin-top:10px;}
  .tok-ok{color:var(--green);font-weight:600;} .tok-no{color:var(--red);text-decoration:line-through;opacity:.7;}
  .ta{width:100%;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;font-family:inherit;resize:vertical;min-height:60px;touch-action:manipulation;}
  .exam{background:linear-gradient(135deg,#EAF4F5,#F3F1F8);border:1px solid #D7E3E5;border-radius:12px;padding:12px 14px;margin-bottom:12px;}
  .exam.hot{background:linear-gradient(135deg,#FBEDEA,#F3F1F8);border-color:#EBC9C2;}
  .ex-d{display:block;font-size:15px;font-weight:600;color:var(--slate);}
  .ex-d b{color:var(--teal);font-size:18px;}
  .ex-sub{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45;}
  .ex-row{display:flex;gap:8px;align-items:center;margin-top:8px;}
  .ex-row input[type=date]{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:16px;font-family:inherit;}
  .mini{background:var(--teal);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;}
  .tip{background:#FFF8EC;border:1px solid #F0E0BF;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;color:#7a5a1e;margin-bottom:12px;}
  .tip b{color:#B7791F;}
  .tpb{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;margin-right:4px;vertical-align:middle;}
  .tpb.sp{background:#FDEBD0;color:#B7791F;} .tpb.li{background:#EAF4F5;color:var(--teal);} .tpb.rw{background:#F3F1F8;color:#5E51A8;} .tpb.wr{background:#FBEDEA;color:var(--red);}
  .ring-wrap{display:flex;justify-content:center;gap:24px;margin-bottom:12px;}
  .ring{text-align:center;}
  .ring svg{display:block;margin:0 auto;}
  .ring .ring-label{font-size:11px;color:var(--muted);margin-top:4px;}
  .review-badge{display:inline-block;background:#FBEDEA;color:var(--red);font-size:11px;font-weight:600;padding:2px 10px;border-radius:10px;margin-left:6px;}
  .tlink{cursor:pointer;color:var(--teal);border-bottom:1px dashed var(--teal);transition:opacity .15s;}
  .tlink:active{opacity:.6;}
  .heat{display:grid;grid-template-rows:repeat(7,12px);grid-auto-flow:column;grid-auto-columns:12px;gap:3px;justify-content:center;margin:8px 0;}
  .heat-cell{width:12px;height:12px;border-radius:3px;background:#EDEFF2;}
  .heat-cell.l1{background:#BFE0E4;} .heat-cell.l2{background:#6FBFC6;} .heat-cell.l3{background:#2C8C99;}
  .diff-row{display:flex;gap:8px;margin-top:10px;}
  .diff-btn{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 0;font-size:13px;cursor:pointer;background:#fff;text-align:center;transition:all .15s;}
  .diff-btn:active{opacity:.6;}
  .diff-btn.easy:active,.diff-btn.easy:hover{background:#E8F5E9;border-color:var(--green);color:var(--green);}
  .diff-btn.mid:active,.diff-btn.mid:hover{background:#FFF8EC;border-color:var(--amber);color:var(--amber);}
  .diff-btn.hard:active,.diff-btn.hard:hover{background:#FBEDEA;border-color:var(--red);color:var(--red);}
  .mock-head{display:flex;justify-content:space-between;align-items:center;background:var(--slate);color:#fff;border-radius:12px;padding:10px 14px;margin-bottom:14px;}
  .mock-prog{font-size:13px;font-weight:600;}
  .cd{font-variant-numeric:tabular-nums;font-size:16px;font-weight:700;color:#FFE08A;}
  .cd.hot{color:#FF8A80;animation:micPulse 1s infinite;}
  .cd.untimed{font-size:12px;font-weight:600;color:#CFE9ED;}
  .mock-total{font-size:12px;opacity:.85;}
  .mock-pick{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .mock-self{display:flex;align-items:center;gap:10px;margin:14px 0 4px;padding:10px 12px;background:#FAFBFC;border:1px solid var(--line);border-radius:10px;}
  .mock-self .lab{font-size:12px;color:var(--muted);white-space:nowrap;}
  .sr-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:14px;font-weight:700;color:var(--muted);cursor:pointer;transition:all .15s;}
  .sr-btn.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .sr-btn:active{transform:scale(.92);}
  .mock-self .desc{font-size:12px;color:var(--teal);min-width:36px;font-weight:600;}
  .weak-box{margin-top:12px;background:#FBEDEA;border:1px solid #F3C9C1;border-radius:10px;padding:12px;}
  .weak-box b{color:var(--red);}
  .star{position:absolute;top:10px;right:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:15px;cursor:pointer;color:var(--muted);transition:all .15s;}
  .star.on{background:#FFF4D6;border-color:var(--amber);color:var(--amber);}
  .star:active{transform:scale(.9);}
  .card{position:relative;}
  .kw{background:#FFF3CD;color:#8a6d1a;font-weight:600;border-radius:3px;padding:0 2px;}
  .kwlist{margin-top:8px;font-size:11.5px;color:var(--muted);line-height:1.8;}
  .kwchip{display:inline-block;background:#FFF3CD;color:#8a6d1a;border:1px solid #F0E0BF;border-radius:10px;padding:1px 8px;margin:2px 4px 2px 0;font-size:11px;font-weight:600;}
  .shadow{background:var(--amber)!important;color:#fff!important;border-color:var(--amber)!important;}
  .adpt{cursor:pointer;color:var(--teal);padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.5;transition:opacity .15s;}
  .weak-row{display:flex;align-items:center;gap:6px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--slate);cursor:pointer;line-height:1.4;}
  .weak-row:active{opacity:.6;}
  .adpt:active{opacity:.6;}
  .adpt::before{content:'🔗 ';}
  .fav-item{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;}
  .fav-item .txt{font-size:13px;line-height:1.55;color:var(--slate);flex:1}
  .fav-item .tag{font-size:11px;color:#fff;background:var(--teal);border-radius:6px;padding:2px 7px;margin-right:6px;white-space:nowrap}
  .fav-item .acts{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .btn[disabled]{opacity:.45;pointer-events:none;}
  .pbar{height:7px;background:#EDEFF2;border-radius:5px;overflow:hidden;margin:2px 0 6px;}
  .pfill{height:100%;background:linear-gradient(90deg,var(--teal),#3FA7B4);border-radius:5px;transition:width .35s ease;}
  .ph-sub{font-size:12px;color:var(--muted);margin:0 0 10px;font-weight:500;}
  footer{text-align:center;font-size:11px;color:var(--muted);padding:10px;}
  .hiw-word{cursor:pointer;border-bottom:1px solid transparent;border-radius:3px;transition:background .15s, border-color .15s;padding:0 1px;}
  .hiw-word.hiw-on{background:rgba(44,140,153,.20);border-bottom:1px solid var(--teal);}
  .diff-btn.on{background:#EAF4F5;border-color:var(--teal);color:var(--teal);font-weight:700;}
  .ratebox{background:#F7F9FA;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:10px;}
  .rate-tip{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .rate-row{display:flex;align-items:center;gap:8px;margin:5px 0;}
  .rate-lab{width:46px;font-size:12px;color:var(--slate);flex-shrink:0;}
  .rate-best{font-size:12px;color:var(--teal);margin-top:4px;min-height:14px;}
  .overall-box{text-align:center;background:linear-gradient(0deg,#F7F9FA,#fff);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px;}
  .ob-num{font-size:40px;font-weight:700;line-height:1;color:var(--slate);}
  .ob-lab{font-size:12px;color:var(--muted);margin-top:4px;}
  .ob-msg{font-size:13px;font-weight:600;margin-top:6px;}
  .ob-msg2{font-size:13px;color:var(--slate);margin-top:6px;font-weight:600;}
  .wordcards{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;}
  .wordcard{background:#fff;color:var(--slate);border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:13px;cursor:pointer;transition:.12s;line-height:1.4;}
  .wordcard:hover{border-color:var(--teal);background:#EAF4F5;}
  .wordcard.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .rub-box{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FBFCFD;}
  .rub-h{font-weight:700;color:var(--slate);font-size:14px;margin-bottom:8px;}
  .rub-src{font-size:11px;font-weight:600;color:#fff;background:var(--teal);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:middle;}
  .rub-trait{padding:7px 0;border-top:1px dashed var(--line);}
  .rub-trait:first-of-type{border-top:none;}
  .rub-name{font-size:13px;font-weight:700;color:var(--slate);}
  .rub-scale-tag{font-size:11px;font-weight:600;color:var(--muted);margin-left:4px;}
  .rub-desc{font-size:11.5px;color:var(--muted);margin:2px 0 5px;}
  .rub-btns{display:flex;flex-wrap:wrap;gap:6px;}
  .rub{background:#fff;border:1px solid var(--line);border-radius:7px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--slate);min-width:34px;text-align:center;}
  .rub:hover{border-color:var(--teal);}
  .rub.on{background:var(--teal);color:#fff;border-color:var(--teal);}
  .rub-auto{font-size:12px;font-weight:600;color:var(--green);}
  .rub-band{font-size:11.5px;color:#55606B;margin-top:3px;min-height:14px;}
  .rub-foot{margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--slate);}
  /* 句子级分句朗读面板 */
  .sr-panel{margin-top:12px;border:1px solid var(--line);border-radius:12px;background:#FBFCFD;padding:10px;animation:fadeIn .15s ease;}
  .sr-ctrl{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  .sr-btn{flex:0 0 auto;width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:16px;cursor:pointer;color:var(--slate);touch-action:manipulation;}
  .sr-btn:active{background:#EAF4F5;}
  .sr-rate{flex:0 0 auto;border:1px solid var(--line);border-radius:8px;padding:7px 6px;font-size:13px;background:#fff;color:var(--slate);}
  .sr-prog{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;}
  .sr-list{margin-top:8px;max-height:210px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .sr-sent{font-size:13.5px;line-height:1.6;padding:7px 9px;border-radius:8px;color:#33414E;overflow-wrap:anywhere;word-break:break-word;}
  .sr-sent.sr-cur{background:var(--teal);color:#fff;font-weight:600;}
  /* iPhone 排版加固：长英文/URL 不撑破视口 */
  .ex,.cn,.tip,.exam,.ph,.card,.mock,.stat,.stinfo,.tlink,.real,.weak-box,.overall-box{overflow-wrap:anywhere;word-break:break-word;}
  /* 处方卡：把记录变成提分决策 */
  .rx-card{background:linear-gradient(135deg,#EAF4F5,#F4F8F8);border:1px solid #C9DDE0;border-radius:14px;padding:14px 14px 10px;margin-bottom:12px;}
  .rx-h{font-size:14px;font-weight:700;color:var(--teal);margin-bottom:8px;letter-spacing:.5px;}
  .rx-row{display:flex;gap:8px;padding:5px 0;font-size:13.5px;line-height:1.5;}
  .rx-k{flex:0 0 64px;color:var(--muted);font-weight:600;}
  .rx-v{flex:1;color:var(--slate);}
  .rx-v b{color:var(--red);}
  /* onboarding 蒙层 */

", "FIB 词汇 5 题（点「练习」→词汇）", "写作 WE/SWT 各 1 题（点「练习」→写作）"], "P3": ["全真模考 1 套（myPTE Scored Practice）", "弱项专训（按模考报告 <50 的题型）", "WFD 机经句库通勤刷 1 遍（点「练习」→听力→WFD 句库）"]}, "goals": {"P0": {"v": 10, "l": 3}, "P1": {"v": 15, "l": 15}, "P2": {"v": 12, "l": 18}, "P3": {"v": 8, "l": 20}}, "tmpl": [["Read Aloud (RA) 大声朗读", "策略：流利度 40%+发音 40%+内容 20%。不要卡顿，读错也硬读下去。每天 3–5 段学术段落。练法：点「练习」→口语→RA。"], ["Repeat Sentence (RS) 复述句子", "策略：听时理解意群→立刻复述。宁可说短也别卡。占口语 25%+听力 20%。练法：每天 20 句机经，「练习」→口语→RS。"], ["Describe Image (DI) 描述图表", "开头：The [graph/chart] shows [主题]. Overall, [趋势]. First[最大]; Second[对比]; In conclusion[总结]. 流利度 50% > 内容。练法：「练习」→口语→DI。"], ["Write from Dictation (WFD) 听写", "每词拼对才得分。边听边键入实词，用语法猜漏词。占听力 25%+写作 20%，PTE 权重最高。练法：「练习」→听力→WFD 听写。"], ["Fill in Blanks (FIB-RW) 填空", "词汇量+语法语感。下拉选最合适的词。同时贡献阅读+写作分。练法：「练习」→阅读→FIB 填空。"], ["Retell Lecture (RL) 复述讲座", "笔记抓：主题+3要点+结论。模板：The lecture mainly discussed... It covered three points: first[A]; second[B]; finally[C]. In summary[结论]."], ["Summarize Written Text (SWT) 一句话总结", "只能写一句(5–75词)！用 and/which/that 连成一句。模板：This text argues that [A], [B] and [C], suggesting that [结论]. 练法：「练习」→写作。"], ["Write Essay (WE) 写作文", "结构：引言(背景+立场)→主体1(论点+例)→主体2(反方)→结论。连接词：Firstly/Furthermore/However/In conclusion。200–300词。练法：「练习」→写作。"], ["Summarize Spoken Text (SST) 听力总结", "听 60–90 秒讲座→写 50–70 词总结。听时记关键词：主题+3要点。模板：The lecture mainly discussed... First... Second... Finally... 练法：「练习」→听力→SST。"]], "pass": [["Climate Change 气候变化", "Climate change is one of the most pressing issues facing the world today. Rising global temperatures are causing ice caps to melt and sea levels to rise. Scientists agree that human activities, particularly the burning of fossil fuels, are the primary cause. Governments have signed agreements to reduce carbon emissions, but progress has been slow. The lecture emphasized that immediate action is needed to prevent catastrophic consequences.", "气候变化是全球最紧迫问题之一。全球温度上升导致冰盖融化和海平面上升。科学家一致认为人类活动尤其是化石燃料燃烧是主因。各国政府已签署减排协议但进展缓慢。讲座强调需立即行动防止灾难性后果。"], ["Industrial Revolution 工业革命", "The Industrial Revolution began in Britain in the late 18th century. Key inventions included the steam engine, the spinning jenny, and the power loom. This period saw the rise of factories, urbanization, and significant economic growth. However, it also led to poor working conditions and environmental pollution. The lecture noted that while it brought material progress, it created social problems that took decades to address.", "工业革命始于18世纪末的英国。关键发明包括蒸汽机、纺纱机和动力织机。这一时期见证了工厂兴起、城市化和显著经济增长。但也导致了恶劣工作条件和环境污染。讲座指出虽带来物质进步，也造成了需数十年解决的社会问题。"], ["DNA and Genetics DNA与遗传学", "DNA is the molecule that carries genetic information in all living organisms. The structure of DNA was discovered by Watson and Crick in 1953, revolutionizing biology. DNA consists of two strands forming a double helix, with four nucleotide bases. Modern genetic research has led to breakthroughs in medicine, including gene therapy and personalized treatments. Understanding DNA has fundamentally changed our approach to disease prevention.", "DNA是携带所有生物遗传信息的分子。沃森和克里克于1953年发现DNA结构，彻底变革生物学。DNA由两条链形成双螺旋，含四种核苷酸碱基。现代基因研究推动了基因疗法和个性化治疗等医学突破。理解DNA从根本上改变了疾病预防方式。"], ["Marketing Strategies 营销策略", "Effective marketing requires understanding consumer behavior and market trends. Companies use strategies including social media marketing, content marketing, and influencer partnerships. The lecture discussed how digital transformation has changed traditional marketing. Data analytics now plays a crucial role in identifying customer preferences and predicting purchasing patterns. Successful modern marketing requires creativity combined with data-driven decision making.", "有效营销需要理解消费者行为和市场趋势。公司使用社交媒体营销、内容营销和网红合作等策略。讲座讨论了数字化转型如何改变传统营销方式。数据分析在识别客户偏好和预测购买模式中起关键作用。现代成功营销需要创意与数据驱动决策结合。"], ["Australian Education 澳大利亚教育", "Australia has one of the most comprehensive education systems in the world, divided into primary, secondary, and tertiary levels. International students make up a significant portion of university enrollments, particularly from China and India. The government heavily regulates education providers to maintain quality standards. Australia's education export industry contributes billions of dollars to the national economy each year, making it one of the country's largest service exports.", "澳大利亚拥有全球最完善的教育体系之一，分小学、中学和高等教育。国际学生在大学入学中占重要比例，尤其来自中国和印度。政府严格监管教育机构以维持质量标准。澳大利亚教育出口产业每年为国家经济贡献数十亿澳元，是最大服务出口之一。"], ["Social Media Impact 社交媒体影响", "Social media has fundamentally changed how people communicate and consume information. Platforms like Facebook and Instagram have billions of users worldwide. While social media enables instant global communication, it has raised concerns about privacy, mental health, and the spread of misinformation. Research shows excessive social media use can lead to anxiety and depression, particularly among young people. When used responsibly, it can be a powerful tool for education and business.", "社交媒体从根本上改变了人们交流和消费信息的方式。Facebook和Instagram等平台拥有数十亿用户。社交媒体虽实现即时全球交流，也引发了隐私、心理健康和错误信息传播的担忧。研究表明过度使用会导致焦虑和抑郁。负责任使用时，可以是教育和商业的有力工具。"], ["Human Memory 人类记忆", "Human memory is a complex cognitive process involving encoding, storing, and retrieving information. Psychologists distinguish between short-term memory and long-term memory. The lecture explained that sleep plays a critical role in memory consolidation. Factors such as stress, age, and nutrition can significantly affect memory performance. Research has shown that regular mental exercise and a healthy lifestyle can help maintain cognitive function as people age.", "人类记忆是复杂认知过程，涉及编码、存储和提取信息。心理学家区分短期记忆和长期记忆。讲座解释了睡眠在记忆巩固中的关键作用。压力、年龄和营养等因素可显著影响记忆表现。研究表明，定期脑力锻炼和健康生活方式有助于随年龄增长维持认知功能。"], ["Renewable Energy 可再生能源", "Renewable energy sources including solar, wind, and hydroelectric power are increasingly important in reducing carbon emissions. Solar energy has seen dramatic cost reductions over the past decade, making it competitive with fossil fuels. Countries like Germany, China, and Denmark are leading the transition to renewable energy. Challenges remain, including energy storage and grid integration. A combination of renewable technologies and improved energy efficiency is essential for a sustainable future.", "可再生能源包括太阳能、风能和水力发电，在碳减排中越来越重要。太阳能在过去十年成本大幅下降，已可与化石燃料竞争。德国、中国和丹麦等国正引领可再生能源转型。挑战仍存，包括储能和电网整合。可再生能源技术和能源效率提升的组合对可持续未来至关重要。"], ["Separation of Powers 三权分立", "So what is the separation of powers? As discussed in a prior video, the US Constitution establishes the framework for the United States government. Article one establishes the legislative branch, the US House of Representatives and the US Senate. Article two establishes the office of the presidency, the executive branch of government. Article three establishes the judicial branch, the United States Supreme Court. The legislative branch creates law. Bills turn into statutes. Then they can delegate this statutory authority to regulatory agencies to create regulations in furtherance of those laws. The executive branch is charged with carrying out or executing those laws, that is, enforcing them against the public. The president carries out the laws that Congress makes, and then the judiciary checks those laws or reviews those laws for violations of constitutionality. Congress cannot pass a law that is unconstitutional, and the executive cannot take action enforcing a law that violates an individual's constitutional rights. The judiciary simply interprets the laws and adds to the law through their interpretations. That is, they form the common law.", "什么是三权分立？正如之前视频所讲，美国宪法确立了美国政府的框架。第一条设立立法分支——美国众议院与参议院；第二条设立总统职位，即政府的行政分支；第三条设立司法分支——美国最高法院。立法分支制定法律，法案成为成文法，并可将其法定权力下放给监管机构以制定相关规章。行政分支负责执行这些法律，即向公众强制实施。总统执行国会制定的法律，而司法分支则审查这些法律是否违宪。国会不能通过一个违宪的法律，行政分支也不能采取侵犯个人宪法权利的执法行动。司法分支只是解释法律，并通过司法解释补充法律，即形成普通法。"], ["Emotional Stability 情绪稳定性", "Far more than we are inclined to accept, and sometimes even realize, we are creatures of mood. Our sense of our value as human beings is prone to extraordinary fluctuation. At times we know how to tolerate ourselves. The future seems benevolent. We can forgive ourselves for the errors of the past. And then at other points the mood dips, and we lament most of what we have ever done. We see ourselves as natural targets for contempt. We feel undeserving, guilty, weak, and headed for retribution. But it can be very hard to grasp what causes our moods to shift. A day that started with energy and hope can by lunchtime end up mired in self-hatred. A sure sense that we have finally turned the corner can be replaced at speed by an alternative certainty that we are a cosmic error. We cannot ever prevent our moods from changing. But what is open to us all is to learn how to manage the change more effectively, so that our downturns can be slightly more gentle, our sadness more containable, and our inconstancy less shameful.", "我们比自己愿意承认、甚至比意识到的更受情绪支配。作为人的自我价值感极易剧烈波动。有时我们知道如何包容自己，未来显得仁慈，也能原谅过去的错误。但另一些时候情绪会跌入谷底，我们哀叹自己做过的大部分事情，视自己为理应被蔑视的对象，感到不配、内疚、软弱，仿佛在走向惩罚与灾难。然而我们很难弄清情绪为何转变。一个以活力与希望开始的日子，到了午饭时间可能已深陷自我憎恨。刚刚确信自己终于走出低谷，转瞬又可能被'自己是个宇宙错误'的念头取代。我们似乎永远无法阻止情绪变化。但我们所有人都能学会更有效地管理这种变化，让低落稍显温和，让悲伤更可控，让善变少一些羞耻。"], ["Age and DNA 年龄与DNA", "How old is your four-legged best friend? Common wisdom says that a dog ages seven years for every human year. But Tina Wang, a graduate student at the University of California, San Diego, wanted a more accurate assessment. Her quest started five years ago, when she rescued a dog from a shelter. Wang worked in Trey Ideker's lab, where they study changing patterns of DNA methylation in humans. Small chemical entities called methyl groups attach to stretches of DNA, which affects what sequences are active. As we age, some stretches of DNA get more methylated, and others less. The pattern is so consistent over the course of most people's lives that it can be used as an aging clock. The same process happens in dogs, and published reports existed from other labs about methylation patterns in dogs changing over time.", "你四条腿的好朋友多大了？常识说狗每长大一岁相当于人的七岁。但加州大学圣地亚哥分校的研究生 Tina Wang 想要一个更精确的评估。她的探索始于五年前，当时她从收容所救了一只狗。Wang 在 Trey Ideker 的实验室工作，他们研究人类 DNA 甲基化模式的变化。称为甲基的小化学物质附着在 DNA 片段上，影响哪些序列是活跃的。随着年龄增长，部分 DNA 片段甲基化增多，另一些减少。这一模式在大多数人一生中极其稳定，可用作'衰老时钟'。同样的过程也发生在狗身上，其他实验室已有关于狗的甲基化模式随时间变化的报告。"], ["Written and Spoken Language 书面与口头语言", "Professor, recently you wrote a letter to a leading national newspaper complaining about falling standards in both written and spoken language among students, even graduates, saying that you deplore the way English is being debased by change and dumbing down. Yes, I said that standards are falling, and that very few graduates these days can write a comprehensible essay; their grammar and syntax is all over the place. I do have certain regrets over the way some words have now become unusable in their full meaning because they have been sloppily misused by those who should know better, such as journalists. So, because they use 'enormity' to mean something very big instead of something very wicked, I can no longer use the word in its correct sense without being misunderstood. But, of course, language changes, and meanings shift, and it is as useless to complain about that as it is to moan about the weather. The point I was making was that, at the earliest possible level, children should be made familiar with the basics of grammar and syntax, how to put sentences together, and so on.", "教授，您最近给一家主流全国性报纸写信，抱怨学生乃至毕业生在书面与口头英语上的标准下降，说您痛心英语因变化和'降智'而被贬损。是的，我说标准在下降，如今极少有毕业生能写出通顺的文章，他们的语法和句法一团糟。我对一些词因被本应更懂的人（如记者）草率误用，导致其完整含义无法再用而感到遗憾。例如他们用'enormity'表示'非常大'而非'极邪恶'，让我再也无法在正确意义上使用该词而不被误解。但语言本就在变，词义在移，抱怨此事无异于抱怨天气。我想强调的要点是：应在最早阶段就让孩子熟悉语法和句法的基础，学会如何组句等等。"], ["Vitamin D 维生素D", "To understand what Vitamin D does, we need to understand the central concept. The function of Vitamin D is to maintain blood calcium. You probably think the function of Vitamin D is to maintain strong bones and teeth. But it does that by accident. Its real function is to maintain your blood calcium level in a very narrow range. And the reason for that is, if your blood calcium level falls below about nine milligrams per one hundred milliliters, then you are in big trouble, and die rather quickly. That is because blood calcium is important for muscle contraction and nerve transmission. If you don't have enough of it, you can't contract muscles normally, and there can't be normal nerve impulses. This results in a disease called tetany, where you have uncontrolled convulsions followed by rapid death. Calcium is also important for enzymic activities and blood clotting.", "要理解维生素 D 的作用，我们需要理解核心概念。维生素 D 的功能是维持血钙。你大概以为它的作用是强健骨骼和牙齿，但那只是顺带的结果。它真正的功能是将血钙水平维持在一个很窄的范围内。原因在于，如果血钙低于约每 100 毫升 9 毫克，你就会大难临头并很快死亡。这是因为血钙对肌肉收缩和神经传导至关重要。若不足，肌肉便无法正常收缩，也无法产生正常的神经冲动，从而导致一种叫'手足抽搐'的疾病，表现为不受控制的痉挛并迅速死亡。钙对酶活动和血液凝固也很重要。"], ["Emotions 情绪与战或逃反应", "What is the fight or flight response? To really understand it, it helps to think about the role of emotions in our lives. Many of us would prefer to focus on our logical thinking nature and ignore our sometimes troublesome emotions. But emotions do have a purpose. Our most basic emotions, like fear, anger, or disgust, are actually vital messengers. They evolved as signals to help us meet our basic needs for self-preservation and safety. It would be really dangerous to be indecisive about a threat to our survival. So the brain runs on information from our senses through the most primitive, reactive parts of our brains. These areas control instinctive responses and don't do too much thinking. This most primitive part of our brain communicates with the rest of our brain and our body to create signals we can't easily ignore: powerful emotions and symptoms. The fight or flight response is a physiological response triggered when we feel strong emotions such as fear. Fear is the normal emotion to feel in response to a dangerous threat. The fight or flight response evolved to enable us to react with appropriate actions, to run away or to fight, or sometimes even to freeze.", "什么是'战或逃'反应？要真正理解它，不妨想想情绪在我们生活中的角色。我们许多人更愿意专注理性思考，而忽视有时麻烦的情绪。但情绪确有目的。我们最基本的情绪，如恐惧、愤怒或厌恶，其实是重要的信使。它们作为信号进化而来，帮助我们满足自我保护与安全的基本需求。面对生存威胁而犹豫不决会非常危险。因此大脑通过最原始、最具反应性的部分处理感官信息。这些区域控制本能反应，不太做思考。大脑最原始的部分与脑的其余部分和身体的其余部分沟通，制造我们难以忽略的信号：强烈的情绪与症状。'战或逃'是一种生理反应，当我们感受到恐惧等强烈情绪时被触发。面对危险威胁，恐惧是正常情绪。'战或逃'反应进化而来，使我们能做出恰当行动——逃跑、战斗，有时甚至冻结。"], ["Globalization 全球化", "Globalization, what is globalization? I think it takes on a few different definitions. In one sense of the word, globalization means proliferation of transactions across countries. So one way of thinking about globalization is to describe increased international communications, more trade happening between countries, and more companies that have offices in multiple countries, which we call multinationals. So the source of growth in travel and communication and corporate trade across borders. This way of thinking about globalization is a continuation of thinking that has been around for a long time, such as when the Europeans went to the Orient to find spices, which was also an example of global trade and communication. Another way to think of globalization is as an economic system. It is a system in which countries become integrated in a way that never had been before. In this system, we see a global split in the process between consuming and producing goods. Some countries produce goods, some consume goods, and these countries depend on each other in a kind of organic solidarity rather than having an economic system just inside your country.", "全球化，什么是全球化？我想它有几个不同的定义。从一种意义上说，全球化意味着跨国交易的激增。因此一种理解方式是：国际交流增多、国家间贸易增加，以及越来越多在多国设有办事处的公司，即跨国公司。这是跨境旅行、交流与公司贸易增长的来源。这种对全球化的理解由来已久，例如欧洲人前往东方寻找香料，也是全球贸易与交流的例子。另一种理解是把全球化看作一种经济体系。在这一体系中，国家以前所未有的方式相互融合。我们看到生产与消费过程出现全球分工：一些国家生产商品，一些国家消费商品，彼此以某种有机团结相互依存，而非仅在一国之内运行经济体系。"], ["Segmented Sleep 分段睡眠（双相睡眠）", "We tend to assume that a solid eight-hour block of sleep is the natural human norm, but historical evidence suggests this is actually a fairly recent development. In the pre-industrial era, before artificial lighting became widespread, the standard sleeping pattern was quite different. It was what historians call \"biphasic\" or segmented sleep. In this model, people would typically go to bed around sundown and sleep for about four hours—a period referred to in texts of the time as \"first sleep.\" They would then wake up in the middle of the night for an hour or so. During this interval, they were surprisingly active: they might pray, reflect on their dreams, tend to the fire, or simply chat. Eventually, they would return to bed for a \"second sleep\" until dawn. The shift to our modern, consolidated sleep pattern really began with the arrival of street lamps and indoor gas lighting. As we extended our exposure to light into the evening, bedtimes were pushed later, and that wakeful break disappeared. Consequently, we started compressing our rest into one continuous session. This implies that waking up at night, which we often label as a disorder today, might actually be a remnant of our natural biological rhythm.", "我们通常认为连续睡足八小时是人类的天然常态，但历史证据表明这其实是一个相当晚近的现象。在前工业时代、人工照明尚未普及时，标准的睡眠模式大不相同。历史学家称之为“双相睡眠”或分段睡眠。在这种模式下，人们通常会在黄昏后入睡，睡大约四个小时——这一时期在当时文献中被称为“第一觉”。然后他们会在半夜醒来一小时左右。在这段时间里，他们出奇地活跃：可能祈祷、回味梦境、照看炉火，或只是闲聊。最后，他们会回到床上睡“第二觉”直到天亮。我们现代这种整段连续的睡眠模式，真正开始于街灯和室内煤气灯的出现。随着夜晚暴露在光下的时间延长，就寝时间被推后，那段清醒的间隙消失了。因此，我们开始把休息压缩成连续的一段。这意味着，今天常被我们贴上“紊乱”标签的夜间醒来，实际上可能是我们天然生物节律的遗留。"], ["Background Music & Consumer Behavior 零售背景音乐与消费行为", "When we consider what drives consumer behavior, we often focus on visual cues like bright packaging or strategic product placement. But there is a less obvious tool that retailers use to influence our wallets: background music. Audio marketing is a powerful psychological lever that can alter how long we stay in a shop and, ultimately, how much we spend. The tempo of the music is a primary variable. Studies have consistently shown that slow, downtempo music causes customers to move through the store at a slower pace. This increased \"dwell time\" means they are likely to see more products and make more unplanned purchases. On the other hand, fast-tempo music tends to make people walk faster, which is great for moving crowds through a space but often results in lower sales figures. Beyond just speed, the genre of music sets a specific mood that dictates spending habits. For example, playing classical music in a wine shop often leads customers to purchase more expensive bottles compared to when pop music is playing. The sophisticated association of the music subconsciously primes the customer to value quality over price. So, the next time you find yourself lingering in a store, take a moment to listen to what's playing.", "当我们思考是什么驱动消费行为时，往往只关注明亮的包装或策略性的商品摆放等视觉线索。但零售商用来影响我们钱包的一个不那么显眼的工具是：背景音乐。音频营销是一种强大的心理杠杆，它能改变我们在商店里停留的时长，并最终影响我们花多少钱。音乐的节奏是主要变量。研究一致表明，缓慢、低频的音乐会让顾客以更慢的步调在店里走动。这种增加的“停留时间”意味着他们更可能看到更多商品，做出更多计划外的购买。另一方面，快节奏的音乐往往让人走得更快，这利于在空间中疏导人流，却常导致销售额下降。除了速度，音乐的类型营造出特定氛围，左右消费习惯。例如，在葡萄酒商店播放古典音乐，常常比播放流行音乐时让顾客购买更贵的酒。音乐所隐含的“高级感”会在潜意识里引导顾客重质而非重价。所以，下次你发现自己逗留在某家店里时，不妨留意一下正在播放什么。"], ["Bird Migration & Magnetoreception 鸟类迁徙与磁感应", "Every year, billions of birds undertake massive migrations, flying thousands of miles across oceans and continents to reach their breeding grounds. For a long time, scientists, myself included, were puzzled by exactly how these birds navigate with such pinpoint accuracy, often without any visual landmarks. We call this ability magnetoreception, which is essentially the power to detect the Earth's magnetic fields. Unlike humans, who rely on a physical compass or GPS, recent studies suggest that birds might actually \"see\" these magnetic fields. The leading theory focuses on a specific protein called cryptochrome, found in the retinas of birds' eyes. When sunlight hits this protein, it triggers a quantum chemical reaction that likely creates a visual overlay—almost like a heads-up display in a fighter jet—allowing the bird to distinguish north from south through variations in light and color. This discovery is fascinating because it implies that migration isn't just a simple instinctual pull, but a complex, sensory-based navigation system. While we are still investigating precisely how the signals are processed from the eye to the brain, this internal biological compass explains how even young birds, who have never migrated before, can find their way to a specific location on the other side of the planet without a guide.", "每年，数十亿只鸟进行大规模迁徙，飞越海洋和大陆数千英里抵达繁殖地。很长一段时间里，包括我在内的科学家都对它们如何能做到如此精准的导航感到困惑，而且常常没有任何视觉地标。我们把这种能力称为磁感应，本质上是感知地球磁场的能力。与人类依赖实体指南针或GPS不同，近期研究表明鸟类或许真的能“看见”这些磁场。主流理论聚焦于一种名为隐花色素（cryptochrome）的蛋白，它存在于鸟类眼睛的视网膜中。当阳光照射这种蛋白时，会引发量子化学反应，很可能形成一层视觉叠加——几乎像战斗机里的平视显示器——让鸟通过光与色彩的变化区分南北。这一发现令人着迷，因为它意味着迁徙不只是一种简单的本能驱动，而是一个基于感官的复杂导航系统。尽管我们仍在研究信号如何从眼睛传到大脑，但这种内在的生物指南针解释了为何从未迁徙过的幼鸟也能在没有向导的情况下，找到地球另一端某个具体地点。"], ["Bat Echolocation 蝙蝠回声定位", "Today, I'd like to turn our attention to one of the most remarkable feats of biological engineering found in the animal kingdom, specifically the sophisticated mechanism of echolocation found in bats. We often assume bats are just flying blindly in the dark, but they are actually utilizing a biological sonar that rivals our best human technology. By emitting high-frequency sound waves that bounce off objects and return as echoes, bats can construct a precise three-dimensional audio map of their environment. This allows them to navigate dense forests and, more importantly, track tiny, fast-moving insects with incredible accuracy. However, the story doesn't end with the bat's ability to hunt. What's truly fascinating to biologists is the evolutionary arms race this has triggered between bats and their prey, particularly moths. As bats became better at using sound to hunt, moths began to fight back. Research indicates that several moth species have evolved ears specifically tuned to the ultrasonic frequencies bats use. When they detect a predator, they don't just fly away; they perform erratic, spiraling maneuvers to break the lock. Even more astoundingly, some tiger moths can emit their own ultrasonic clicks to actively jam the bat's sonar, essentially confusing the predator just moments before an attack. This ongoing battle demonstrates that animal adaptations are rarely static; they are dynamic responses to the constant pressure of survival.", "今天我想把注意力转向动物王国中一种了不起的生物工程壮举，特别是蝙蝠身上的回声定位机制。我们常以为蝙蝠只是在黑暗中盲目飞行，但实际上它们使用的是一种足以媲美人类最佳技术的生物声呐。通过发出高频声波、让声波撞击物体后以回声返回，蝙蝠能构建出精确的三维声音地图。这让它们得以在茂密森林中导航，更重要的是，能以惊人精度追踪微小而快速的昆虫。然而，故事并未止于蝙蝠的捕猎能力。真正令生物学家着迷的，是它由此引发的蝙蝠与猎物（尤其是飞蛾）之间的进化军备竞赛。随着蝙蝠更善于用声音捕猎，飞蛾也开始反击。研究表明，若干种飞蛾进化出了专门调谐到蝙蝠所用超声波频率的耳朵。当它们察觉捕食者时，不只是飞走，还会做出不规则的螺旋机动来摆脱锁定。更惊人的是，一些虎蛾能发出自己的超声波“咔嗒”声，主动干扰蝙蝠的声呐，在攻击前瞬间迷惑捕食者。这场持续的博弈表明，动物的适应很少是静止的，而是对生存持续压力的动态回应。"], ["Cephalopod Camouflage 头足类动物的伪装", "Today, I want to draw your attention to one of the most remarkable feats of biological engineering found in the ocean: dynamic camouflage. Specifically, we are looking at cephalopods, a group that includes octopuses, squid, and cuttlefish. Unlike chameleons, which are often cited as the masters of disguise, cephalopods can change the color and texture of their skin in mere milliseconds. This rapid transformation is made possible by specialized cells called chromatophores, which are essentially tiny, elastic sacs of pigment controlled by muscles. By expanding or contracting these sacs, the animal can instantly alter its pattern to blend seamlessly into the background. However, there is a fascinating paradox here that has puzzled biologists for decades. Despite their incredible ability to match the colors of their surroundings, behavioral studies suggest that most cephalopods are actually colorblind. They possess only one type of visual pigment, meaning they likely see the world in shades of gray. So, how do they match complex, colorful environments so perfectly without actually seeing color? Recent research indicates that their skin might contain light-sensitive proteins, allowing the skin itself to sense the surrounding light conditions independently of the eyes. While we don't have all the answers yet, this suggests a form of decentralized vision, enabling them to hide from predators or signal to mates with extraordinary precision.", "今天我想请大家注意海洋中一项最非凡的生物工程壮举：动态伪装。具体来说，我们看的是头足类动物，包括章鱼、鱿鱼和乌贼。与常被称为伪装大师的变色龙不同，头足类能在几毫秒内改变皮肤的颜色和质地。这种快速变换得益于一种名为色素细胞（chromatophores）的特化细胞，本质上是由肌肉控制的、装满色素的微小弹性囊。通过扩张或收缩这些囊，动物能瞬间改变花纹，无缝融入背景。然而，有一个困扰生物学家数十年的迷人悖论。尽管它们有匹配周遭色彩的惊人能力，行为研究表明大多数头足类其实是色盲。它们只有一种视觉色素，意味着它们很可能以灰度看世界。那么，它们如何在根本看不见颜色的情况下，完美匹配复杂而多彩的环境？近期研究指出，它们的皮肤可能含有感光蛋白，使皮肤本身能独立于眼睛感知周围光线条件。虽然我们尚未得到全部答案，但这暗示了一种去中心化的视觉，使它们能以非凡精度躲避捕食者或向配偶发出信号。"], ["The Wood Wide Web 森林的“木质万维网”（菌丝网络）", "When we look at a forest, we typically see a collection of individual trees, and for decades, scientists assumed these trees were solitary competitors, battling each other for limited resources like sunlight, water, and soil nutrients. However, a growing body of research has completely overturned this view, revealing that forests are actually interconnected, cooperative communities. This connection happens through what we call the \"Wood Wide Web,\" a vast underground network of mycorrhizal fungi that link the root systems of different trees together. It's a symbiotic relationship: the trees provide the fungi with sugars produced from photosynthesis, and in return, the fungi scavenge the soil for nutrients like nitrogen and phosphorus to give back to the trees. But it goes beyond just trading food. We have found that trees use this fungal internet to communicate. For example, if a tree is being attacked by beetles, it can send chemical warning signals through the network to its neighbors, allowing them to raise their own chemical defenses preemptively. Furthermore, older, established trees—often referred to as \"mother trees\"—can actually transfer excess carbon and nutrients to younger seedlings struggling in the shade, ensuring the survival of the next generation. So, the forest is not just a battlefield; it is a sophisticated, supportive system.", "当我们看一片森林，通常看到的是一棵棵独立的树；数十年来，科学家也假定这些树是孤独的竞争者，为阳光、水分和土壤养分等有限资源相互搏斗。然而，越来越多的研究彻底推翻了这一看法，揭示森林其实是相互连接、彼此合作的社群。这种连接通过我们称为“木质万维网”（Wood Wide Web）的机制实现——那是菌根真菌构成的庞大地下网络，把不同树木的根系连接在一起。这是一种共生关系：树木向真菌提供光合作用产生的糖分，作为回报，真菌从土壤中搜寻氮、磷等养分回馈给树。但这不只是交换食物。我们发现树木利用这张真菌互联网来沟通。例如，一棵树遭到甲虫攻击时，可以通过网络向邻居发送化学警告信号，让它们提前增强自身的化学防御。此外，年长而稳固的树——常被称为“母树”——能真的把多余的碳和养分转移给在阴影中挣扎的幼小树苗，确保下一代存活。所以，森林不只是战场，更是一个复杂而互助的体系。"], ["The Decoy Effect 诱饵效应", "When we walk into a store or look at a pricing menu online, we like to think we're making rational decisions based on absolute value. However, marketing psychologists understand that our perception of value is actually highly malleable, and one of the most effective strategies they use to manipulate this is known as the decoy effect. Essentially, this phenomenon occurs when a third option—the decoy—is introduced specifically to influence your choice between two other items. To illustrate, imagine you are at a cinema buying popcorn. You see a small bag for three dollars and a large bucket for seven. Many consumers might find seven dollars too expensive and settle for the small one. But if the retailer adds a medium size for six dollars and fifty cents, the dynamic shifts completely. The medium option is the decoy; it offers less value than the large but costs nearly the same. Suddenly, the large bucket looks like a fantastic deal because, for just fifty cents more, you get significantly more product. The retailer doesn't actually expect to sell many medium buckets. Its sole purpose is to frame the most expensive option as the smart, economical choice. This demonstrates that our preferences are not fixed; they are context-dependent, often shifted by options we don't even intend to purchase.", "当我们走进商店或在网上看价目表时，总以为自己是基于绝对价值做出理性决定。但营销心理学家清楚，我们对价值的感知其实极具可塑性，而他们用来操控它的一个最有效策略就是“诱饵效应”。本质上，当引入第三个选项——诱饵——专门用来影响你在另外两者之间的选择时，这种现象就发生了。举例来说，想象你在电影院买爆米花。你看到小袋3美元、大桶7美元。许多消费者可能觉得7美元太贵，于是选小的。但如果商家加一个中杯，售价6.5美元，局面就彻底改变。中杯就是诱饵：它比大桶价值更低，价格却几乎一样。突然间，大桶显得超值，因为只多花50美分就能得到明显更多的产品。商家其实并不指望卖出多少中杯，它的唯一目的就是把最贵的选项包装成明智、划算的选择。这说明我们的偏好并非固定，而是依赖情境，常常被我们根本无意购买的选择所左右。"], ["Soft Skills in Employment 职场中的软技能", "So, when we talk about the future of employment, there is a significant shift happening in recruitment strategies across major industries. Historically, if you wanted a top-tier job, your technical qualifications—your degree, your coding ability, or your certifications—were the primary deciding factors. However, the landscape is changing rapidly. Today, hiring managers are increasingly prioritizing what we often dismiss as \"soft skills\", such as emotional intelligence, adaptability, and effective communication. Why is this happening? Well, primarily because technical skills have a shrinking shelf life. In a world driven by rapid technological evolution, the specific software or machinery you master today might be obsolete in five years. Consequently, employers prefer candidates who demonstrate the mental flexibility to learn new systems rather than those who just know the current ones. Furthermore, with the rise of automation and artificial intelligence, routine technical tasks are being offloaded to machines. Algorithms can analyze data faster than any human, but they cannot navigate complex office politics, negotiate with a difficult client, or lead a team through a crisis. Therefore, while technical proficiency might get your foot in the door, it is arguably your human-centric skills—your ability to collaborate and empathize—that will actually sustain your career long-term.", "谈到就业的未来，各大行业的招聘策略正发生显著转变。历史上，若想谋得顶级职位，你的技术资格——学历、编程能力或各类证书——是主要的决定因素。然而，格局正在快速变化。如今，招聘经理越来越看重我们常忽视的“软技能”，如情商、适应力和有效沟通。为何如此？主要因为技术技能的“保质期”在缩短。在快速技术演进驱动的世界里，你今天掌握的具体软件或机器，五年后可能就过时了。因此，雇主更偏好能展现学习新系统之思维灵活性的候选人，而非只会当下技术的人。此外，随着自动化和人工智能兴起，常规技术任务正被转交给机器。算法分析数据的速度超过任何人类，但它们无法应对复杂的办公室政治、与难缠的客户谈判，或在危机中领导团队。因此，尽管技术熟练能让你踏入门槛，但真正支撑你长远职业发展的，可以说正是你以人为本的技能——协作与共情的能力。"], ["Brain Glymphatic System 脑部类淋巴系统（睡眠清理）", "For centuries, scientists and philosophers have puzzled over a fundamental question: why do we sleep? It seems counterintuitive from an evolutionary standpoint—you are unconscious, vulnerable to predators, and you are not gathering food. For a long time, the prevailing theory was simply that sleep was a way to conserve energy or perhaps consolidate memories. While those are true, they don't fully explain the absolute necessity of spending a third of our lives in this state. However, recent research has uncovered a crucial physiological function that might be the primary reason we need to sleep. It turns out that the brain has a unique housekeeping mechanism, often referred to as the glymphatic system. When you are awake, your brain cells are busy processing information and generating metabolic waste products—essentially biological trash. Now, here is the fascinating part: during sleep, studies suggest that brain cells actually shrink in size, increasing the space between them by up to sixty percent. This creates channels that allow cerebrospinal fluid to flow through the tissue and flush out these toxic waste products, including proteins linked to neurodegenerative diseases. So, if you skip a night's sleep, you aren't just tired; you are failing to clean your brain. This buildup of toxins could explain the mental fog we feel after sleep deprivation and highlights why quality sleep is so vital for long-term neurological health.", "几个世纪以来，科学家和哲学家一直困惑于一个根本问题：我们为何要睡觉？从进化角度看这似乎有悖常理——你失去意识、易受捕食者攻击，也无法觅食。很长一段时间里，主流理论只是说睡眠是为了保存能量或巩固记忆。这些固然没错，却无法完全解释我们为何必须把人生的三分之一花在这种状态上。然而，近期研究揭示了一项关键的生理功能，它或许正是我们需要睡眠的首要原因。原来，大脑有一种独特的“家政”机制，常被称为类淋巴系统（glymphatic system）。清醒时，脑细胞忙于处理信息并产生代谢废物——本质上是生物垃圾。有趣之处在这里：研究表明，睡眠期间脑细胞实际上会缩小，细胞间隙最多扩大60%。这形成了通道，让脑脊液流过组织，冲走这些有毒废物，包括与神经退行性疾病相关的蛋白。所以，如果你熬夜不睡，不只是疲惫，更是没能在清理大脑。毒素的堆积可以解释睡眠剥夺后的头脑昏沉，也凸显了优质睡眠对长期神经健康的重要性。"], ["Larks, Owls & Social Jetlag 早起鸟、夜猫子与“社交时差”", "We often hear the old proverb that \"the early bird catches the worm,\" which essentially implies that waking up early is a virtue while staying up late is, well, a sign of laziness or poor discipline. However, chronobiologists—those are scientists who study our internal body clocks—are increasingly pushing back against this moral judgment. They argue that being a so-called \"lark\" or an \"owl\" isn't simply a lifestyle choice you can just switch off; it is largely determined by your genetics. Now, while about half the population falls somewhere in the middle, substantial minorities are biologically hardwired to be active either early in the morning or late at night. The real issue we face is that our modern society is almost exclusively designed for the early risers. Schools and corporate jobs typically start between 8 and 9 a.m., a schedule that aligns perfectly with larks but forces night owls to wake up when their bodies are practically still in a state of deep sleep. This mismatch results in a phenomenon researchers call \"social jetlag.\" Essentially, night owls living on an early bird schedule suffer from symptoms similar to travel jetlag every single day. Consequently, they are at higher risk for health issues like cardiovascular disease and depression, not because their sleep is inherently worse, but because they are constantly fighting their own biology to fit into a rigid social structure.", "我们常听到一句老话：“早起的鸟儿有虫吃”，它本质上暗示早起是美德，而熬夜则是懒惰或缺乏自律的表现。然而，研究人体内部生物钟的科学家——时间生物学家——正越来越多地反驳这种道德评判。他们指出，做“百灵鸟”还是“夜猫子”并非一种说改就改的生活方式选择，而主要由基因决定。虽然约一半人处于中间地带，但有相当比例的少数群体在生理上被设定为清晨或深夜活跃。我们面临的真正问题是，现代社会几乎完全是为早起者设计的。学校和公司通常早上8到9点开始，这种作息与百灵鸟完美契合，却迫使夜猫子在身体几乎仍处深度睡眠时醒来。这种错位导致研究者所称的“社交时差”。本质上，按早起作息生活的夜猫子，每天都遭受类似旅行时差的症状。因此，他们患心血管疾病和抑郁等健康问题的风险更高，并非因为其睡眠本身更差，而是因为他们为了适应僵化的社会结构，在不断对抗自己的生理本能。"], ["Wave Power 波浪发电", "Sea creatures are inspiring the latest devices that harness wave power. This one called the Oyster sits on the ocean floor and opens and closes as waves pass over it. Cables attach it to generators on the shore. Since November 2009, it's been powering 9,000 homes in the Orkney Islands. Another device looks like a snake. The anaconda is made from a rubber tube filled with water that floats just below the surface. When a swell hits the front of it, the tube is squeezed. A bulge ripples down its length and powers a turbine in its tail. Prototypes are currently being tested, but the full-scale version will be 200 meters long. This system also looks like a snake but this one is made of steel. It floats near the surface where waves make its joints move. This drives hydraulic systems that power electrical generators, like the anaconda, it's still being tested. Results will prove if these devices are up to the job of supplying viable sources of green energy.", "海洋生物正在启发人们发明利用波浪能的最新装置。这台名叫“牡蛎”（Oyster）的设备坐落在海床上，随波浪经过而开合。电缆将它连接到岸上的发电机。自2009年11月起，它已为奥克尼群岛的9000户家庭供电。另一种装置看起来像一条蛇。“水蟒”（Anaconda）由装满水的橡胶管制成，漂浮在水面之下。当涌浪击中它的前端，管子被挤压，一个鼓包沿管身波动，驱动尾部的涡轮机。目前原型正在测试中，但全尺寸版本将长达200米。这套系统也像蛇，但由钢制成。它漂浮在靠近水面的地方，波浪使其关节活动，驱动液压系统为发电机供电；和水蟒一样，它也仍在测试中。结果将证明这些装置能否胜任，提供可行的绿色能源。"], ["AfroBubbleGum 非洲艺术（AfroBubbleGum）", "So, my mother's a paediatrician, and when I was young, she'd tell the craziest stories that combined science with her overactive imagination. One of the stories she told was that if you eat a lot of salt, all of the blood rushes up your legs, through your body, and shoots out the top of your head, killing you instantly. She called it \"high blood pressure\". This was my first experience with science fiction, and I loved it. So when I started to write my own science fiction and fantasy, I was surprised that it was considered un-African. So naturally, I asked, what is African? And this is what I know so far: Africa is important. Africa is the future. It is, though. And Africa is a serious place where only serious things happen. So, when I present my work somewhere, someone will always ask, \"What's so important about it? How does it deal with real African issues like war, poverty, devastation or AIDS?\" And it doesn't. My work is about Nairobi pop bands that want to go to space or about seven-foot-tall robots that fall in love. It's nothing incredibly important. It's just fun, fierce and frivolous, as frivolous as bubble gum — \"AfroBubbleGum\".", "我母亲是儿科医生，我小时候她常讲些最离奇的故事，把科学与她过度活跃的想象力结合在一起。其中一个故事是：如果你吃太多盐，血液就会冲上你的双腿、穿过身体，从头顶喷射而出，让你当场毙命。她称之为“高血压”。这是我第一次接触科幻，而我爱上了它。所以，当我开始写自己的科幻和奇幻作品时，很惊讶它们竟被认为“不够非洲”。于是我自然地发问：什么才是非洲的？而我目前所知道的是：非洲很重要。非洲是未来。它确实是。非洲也是一个严肃的地方，只有严肃的事情才会发生。所以，当我在某处展示自己的作品时，总会有人问：“这有什么重要的？它如何反映战争、贫困、毁灭或艾滋病等真实的非洲问题？”而它并没有。我的作品是关于想去太空的内罗毕流行乐队，或是坠入爱河的七英尺高机器人。它并非什么极其重要的事，只是有趣、热烈而又轻浮，像泡泡糖一样轻浮——“AfroBubbleGum”（非洲泡泡糖）。"]], "fibrw": [{"p": "Many scientists believe that climate change is largely caused by human activities. These activities release greenhouse gases, which _____ heat in the atmosphere. As temperatures rise, weather patterns become more _____.", "b": [[["trap", "trapping", "trapped", "traps"], 0], [["unpredictable", "unpredictablely", "predict", "prediction"], 0]]}, {"p": "The concept of online learning has become increasingly popular, particularly _____ the pandemic. It offers flexibility and allows students to study at their own _____.", "b": [[["during", "between", "under", "beside"], 0], [["pace", "space", "peace", "period"], 0]]}, {"p": "The success of any business depends largely _____ its ability to adapt to market changes. Companies that fail to innovate often struggle to maintain their _____.", "b": [[["on", "for", "to", "by"], 0], [["competitiveness", "competitive", "compete", "competed"], 0]]}, {"p": "The museum was established to _____ the region's cultural heritage. It contains artifacts that date back _____.", "b": [[["preserve", "preserving", "preserved", "preserves"], 0], [["centuries", "century", "centering", "centered"], 0]]}, {"p": "Doctors recommend regular exercise because it helps reduce the risk of chronic diseases and improves overall _____. Many people also report feeling more energetic _____ exercising regularly.", "b": [[["health", "healthy", "healthful", "healthiness"], 0], [["after", "before", "unless", "despite"], 0]]}, {"p": "A balanced diet must inclu e _____ and supports overall physical _____.", "b": [[["strength", "strong", "strongly", "strengthen"], 0], [["health", "healthy", "healthful", "healthier"], 0]]}, {"p": "Many students find it difficult to manage their time effectively. One way to improve productivity is to create a schedule and stick _____ it consistently.", "b": [[["to", "with", "for", "by"], 0]]}, {"p": "The new policy was introduced to _____ sustainable development and reduce environmental _____.", "b": [[["promote", "promotion", "promoted", "promoting"], 0], [["impact", "impacts", "impacting", "impacted"], 0]]}, {"p": "The success of the project depends _____ the team's ability to communicate clearly and work _____.", "b": [[["on", "in", "at", "for"], 0], [["efficiently", "efficiency", "efficient", "efficientness"], 0]]}, {"p": "The university offers scholarships to students who demonstrate academic _____. This helps encourage higher levels of student _____.", "b": [[["excellence", "excellent", "excellently", "excel"], 0], [["performance", "perform", "performing", "performer"], 0]]}, {"p": "Consumers are becoming more aware of the environmental effects of plastic. As a result, many companies have started to _____ their use of non-recyclable materials.", "b": [[["reduce", "reduction", "reduced", "reducing"], 0]]}, {"p": "Technological advancements have made it easier for people to work remotely. This trend is expected to continue as companies invest _____ digital tools that improve productivity.", "b": [[["in", "on", "for", "at"], 0]]}, {"p": "The government introduced new traffic rules to improve road safety. Drivers are required to follow these rules _____ to prevent accidents.", "b": [[["strictly", "strict", "strictness", "stricter"], 0]]}, {"p": "The company plans to _____ its market globally. This strategy is expected to increase annual _____.", "b": [[["expand", "expanding", "expanded", "expansion"], 0], [["revenue", "revise", "reviewing", "revive"], 0]]}, {"p": "Students are encouraged to participate _____ extracurricular activities to develop leadership _____.", "b": [[["in", "on", "for", "at"], 0], [["skills", "skillful", "skillfully", "skilled"], 0]]}, {"p": "The success of a project depends _____ effective planning and clear _____.", "b": [[["on", "at", "in", "for"], 0], [["communication", "communicate", "communicative", "communicator"], 0]]}, {"p": "Many scientists believe that early childhood experiences strongly _____ brain development.", "b": [[["influence", "influenced", "influencing", "influenceable"], 0]]}, {"p": "Governments around the world are investing in renewable energy to reduce dependence _____ fossil fuels.", "b": [[["on", "at", "of", "by"], 0]]}, {"p": "A balanced diet provides the nutrients required for proper body _____.", "b": [[["function", "functional", "functioning", "functioned"], 0]]}, {"p": "Online courses offer flexibility for students who want to study at their own _____.", "b": [[["pace", "peace", "phase", "place"], 0]]}, {"p": "The organization aims to _____ healthy lifestyles through educational programs.", "b": [[["promote", "promotion", "promoted", "promoting"], 0]]}, {"p": "Regular physical activity is essential _____ maintaining long-term health.", "b": [[["for", "to", "in", "at"], 0]]}, {"p": "The report highlights the importance of reducing air _____.", "b": [[["pollution", "pollute", "polluted", "polluting"], 0]]}, {"p": "Researchers have found a strong connection _____ sleep and mental performance.", "b": [[["between", "among", "across", "within"], 0]]}, {"p": "The school introduced new programs to improve student _____.", "b": [[["engagement", "engage", "engaged", "engaging"], 0]]}, {"p": "Proper training helps employees perform their tasks more _____.", "b": [[["efficiently", "efficient", "efficiency", "efficiencies"], 0]]}, {"p": "The government has taken steps to _____ natural resources.", "b": [[["protect", "protection", "protected", "protecting"], 0]]}, {"p": "Globalization has created opportunities for businesses to grow _____.", "b": [[["internationally", "international", "internal", "internalizing"], 0]]}, {"p": "Many scientists agree that human activities contribute significantly _____ climate change.", "b": [[["to", "for", "with", "by"], 0]]}, {"p": "Strong analytical skills are essential for solving complex _____.", "b": [[["problems", "problem", "problematic", "problem-solving"], 0]]}, {"p": "The university provides financial support to students who demonstrate academic _____.", "b": [[["excellence", "excellent", "excellently", "excel"], 0]]}, {"p": "Many people prefer working from home because it offers greater _____.", "b": [[["flexibility", "flexible", "flexibly", "flexing"], 0]]}, {"p": "The committee decided to _____ the policy before making a final decision.", "b": [[["review", "reviewed", "reviewing", "reviewable"], 0]]}], "real": [["myPTE 官方模考 · 机经", "https://www.pearsonpte.com/", "培生 Pearson 官方，付费 Scored Practice 模考最准，免费样题可摸底"], ["猩际 PTE · 高频预测", "https://www.apeuni.com/", "国内最大 PTE 备考平台，WFD/SST/RS 高频机经命中率极高"], ["萤火虫 PTE · 澳洲机经", "https://fireflyau.com/", "澳洲本土 PTE 机经平台，澳洲考场命中率突出"], ["黑科技 PTE · 小程序机经", "微信小程序搜「PTE黑科技」", "小程态端机经更新快，社区活跃，免费模考"]], "qtypes": [["Read Aloud (RA)", "大声朗读", "口语+阅读", "⭐⭐⭐ 核心", "屏幕显示一段文字(约60词)，大声朗读。同时贡献口语和阅读分。", "流利度 > 准确度。不要卡顿，读错也硬读下去。每天 3–5 题。"], ["Repeat Sentence (RS)", "复述句子", "口语+听力", "⭐⭐⭐ 核心", "听一句英文(3–9秒)，立刻复述出来。占口语 25%、听力 20%。", "PTE 最重要题型。听时抓意群主干，宁可说短也别卡。每天 10–20 句。"], ["Describe Image (DI)", "描述图表", "口语", "⭐⭐⭐ 核心", "看一张图表(柱图/线图/饼图/流程图等)，25秒准备后口述 40 秒。", "模板滚瓜烂熟：The graph shows... Overall... First... Second... 先整体后细节，流利度权重 > 内容。"], ["Write from Dictation (WFD)", "听写句子", "听力+写作", "⭐⭐⭐ 核心", "听一句英文，准确写出每个词。占听力 25%、写作 20%。", "PTE 权重最高的题！每词拼对才得分。机经命中 170–200 篇，每天必练 10 句。"], ["Fill in Blanks (FIB-RW)", "填空(读写)", "阅读+写作", "⭐⭐⭐ 核心", "一段文字中有挖空的词(4选1下拉)，选最合适的词填进去。同时贡献阅读和写作。", "词汇量 + 语法语感。每天做 5–8 题积累。写作分也靠这个。"], ["Re-tell Lecture (RL)", "复述讲座", "口语+听力", "⭐⭐ 重要", "听一段学术讲座(60–90秒)，10秒准备后复述 40 秒。", "记笔记：主题 + 3要点 + 结论。模板：The lecture discussed... It covered three points... 不要贪多。"], ["Summarize Written Text (SWT)", "一句话总结", "写作+阅读", "⭐⭐ 重要", "读一篇短文(最多300词)，用一句话总结(5–75词)。", "只能写一句！用 and/which/that 连成一句。套模板：This text argues that... 多加连接词。"], ["Write Essay (WE)", "写作文", "写作", "⭐⭐ 重要", "针对一个话题写 200–300 词议论文。20分钟限时。", "模板先行：引言+主体1+主体2+结论。连接词灌满：Firstly/Furthermore/However/In conclusion。机器判分重语法拼写。"], ["Summarize Spoken Text (SST)", "听力总结", "听力+写作", "⭐⭐ 重要", "听一段讲座(60–90秒)，写 50–70 词总结。", "听时记关键词：主题+3要点。模板：The lecture mainly discussed... First... Second... Finally... 机经命中率高。"], ["Fill in Blanks (FIB-L)", "填空(听力)", "听力+写作", "⭐⭐ 重要", "听一段音频，在屏幕显示的段落中填出缺失的词。", "边听边看屏幕文字，听到目标词立刻打出。拼写必须准确，实词权重 > 虚词。"], ["Re-order Paragraphs (RO)", "段落排序", "阅读", "⭐⭐ 重要", "将打乱顺序的 4–5 句话拖拽恢复正确段落顺序。", "找逻辑线索：代词指代(they→某名词)、时间先后、因果关系。对一对得 1 分。"], ["Fill in Blanks (FIB-R)", "填空(阅读)", "阅读", "⭐⭐ 重要", "一段文字中有挖空的词(4选1)，选合适的词。只贡献阅读分。", "词汇 + 搭配。和 FIB-RW 类似但只影响阅读。每天 5 题。"], ["Highlight Incorrect Words (HIW)", "挑错词", "听力+阅读", "⭐ 了解", "看一段文字同时听音频，找出文字中与音频不一致的词并点击。", "眼盯文字、耳听音频，发现不同立刻点。多做 → 手速快。"], ["Select Missing Word (SMW)", "补全单词", "听力", "⭐ 了解", "听一段音频，最后一句被哔声替代，从选项中选择最合适的词。", "听懂上下文逻辑选词。不需要大量训练。"], ["Highlight Correct Summary (HCS)", "选正确摘要", "听力+阅读", "⭐ 了解", "听一段音频，从 3–5 个摘要中选出与音频内容最一致的。", "排除法：先排除明显不对的，在剩的中选最全面的。"], ["Answer Short Question (ASQ)", "简短问答", "口语+听力", "❌ 可放弃", "听一个常识问题(如 What is the capital of...)，用 1–3 词回答。", "分值极低，每题 < 1 分。不值得专门练。考前翻高频分类词(动物/工具/学科)即可。"], ["MC Multiple Answer (MCMA)", "多选(阅读)", "阅读", "❌ 可放弃", "读一篇短文，从 5–7 个选项中选 2–3 个正确答案。", "选错倒扣分！分值低、容错差。没时间直接跳。"], ["MC Single Answer (MCSA)", "单选(阅读)", "阅读", "❌ 可放弃", "读一篇短文，从 4 个选项中选 1 个正确答案。", "每题约 1 分。每题用时 60–90 秒不如给 RA/FIB。"], ["MC Multiple Answer (听力)", "多选(听力)", "听力", "❌ 可放弃", "听一段音频，从选项中选多个正确答案。选错倒扣。", "同阅读多选，分值低、容错差。没时间直接跳。"], ["MC Single Answer (听力)", "单选(听力)", "听力", "❌ 可放弃", "听一段音频，从选项中选 1 个正确答案。", "每题约 1 分。不值的花时间。"]], "wfd_jj": [["The lecture will cover a wide range of topics.", "讲座将涵盖广泛的话题。"], ["Students must submit their assignments by the end of the week.", "学生必须在周末前提交作业。"], ["The library is closed on Sundays and public holidays.", "图书馆在周日和公共假日关闭。"], ["All students are required to attend the orientation session.", "所有学生都必须参加迎新会。"], ["The results of the experiment were published in a scientific journal.", "实验结果发表在一本科学期刊上。"], ["There will be a guest speaker giving a talk on climate change.", "将有一位客座讲者做气候变化讲座。"], ["The university offers a wide range of undergraduate and postgraduate courses.", "大学提供广泛的本科和研究生课程。"], ["You must submit your application before the deadline.", "你必须在截止日期前提交申请。"], ["The research project is funded by the national science foundation.", "该研究项目由国家科学基金会资助。"], ["The campus tour will begin at the main entrance at ten o'clock.", "校园参观将于十点从正门开始。"], ["Participants are requested to fill in the consent form before the study.", "参与者需在研究前填写同意书。"], ["The economic report highlighted several key areas for improvement.", "经济报告突出了几个关键改进领域。"], ["International students can apply for a scholarship at the beginning of the semester.", "国际学生可在学期初申请奖学金。"], ["The professor emphasized the importance of critical thinking in academic writing.", "教授强调了批判性思维在学术写作中的重要性。"], ["There is a significant correlation between diet and cognitive performance.", "饮食与认知表现之间存在显著相关性。"], ["The conference will take place in the main auditorium next Monday.", "会议将于下周一在主礼堂举行。"], ["Most of the data used in this research was collected through online surveys.", "本研究中使用的数据大部分通过在线调查收集。"], ["The tutorial session has been moved to a different room.", "辅导课已改到另一个教室。"], ["Please ensure all equipment is returned to the laboratory after use.", "请确保所有设备使用后归还实验室。"], ["The deadline for essay submission has been extended by one week.", "论文提交截止日期延长了一周。"], ["The course syllabus is available on the university website.", "课程大纲可在大学网站上获取。"], ["Students are encouraged to participate in extracurricular activities.", "鼓励学生参加课外活动。"], ["The findings of this study have important practical implications.", "这项研究的发现有重要的实践意义。"], ["The lecture theatre can accommodate up to
